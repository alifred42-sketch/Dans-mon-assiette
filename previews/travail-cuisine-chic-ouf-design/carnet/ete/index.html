",\"tomates\",\"oignons\",\"thym\",\"ail\",\"basilic\",\"chaud\",\"froid\",\"avec œufs\",\"avec poisson\"]},{\"id\":\"r-4c3c676c65\",\"name\":\"🥑 Verrine fraîche apéro avocat crevettes\",\"lines\":[\"200 g de avocat\",\"400 g de crevettes\",\"100 g de fromage blanc\",\"200 g de citron\",\"1 c. à café de paprika\",\"1 c. à soupe d’ciboulette\",\"paprika\",\"ciboulette\",\"\\\"Sauce froide\\\"\",\"1. Préchauffer le four à 190 °C si une cuisson au four est prévue; laver et couper les légumes.\",\"2. Assaisonner le poisson avec le citron, les herbes, le sel et le poivre; répartir les légumes dans un plat et ajouter l’huile.\",\"3. Cuire au four 12 à 18 minutes selon l’épaisseur, ou à la poêle 3 à 5 minutes par face selon le poisson. Les fruits de mer doivent être cuits à cœur.\",\"4. Vérifier la cuisson, arroser du jus de cuisson et servir immédiatement avec l’accompagnement prévu.\",\"Sauce froide\"]},{\"id\":\"r-291b2944c5\",\"name\":\"🧀 Plateau apéro équilibré terrasse\",\"lines\":[\"🥒 bâtonnets de légumes\",\"🍅 tomates cerises\",\"🧀 cubes de fromage\",\"🐟 rillettes de thon maison\",\"🥚 œufs mimosa\"]},{\"id\":\"r-fa4268ac37\",\"name\":\"🥜 quelques noix\",\"lines\":[\"\\\"Rillettes de thon\\\"\",\"Rillettes de thon\"]},{\"id\":\"cco-gaspacho-andalou\",\"name\":\"🍅 Gaspacho andalou frais\",\"lines\":[\"700 g de tomates mûres\",\"1/2 concombre (environ 150 g)\",\"1/2 poivron rouge\",\"1/2 petit oignon rouge\",\"1 petite gousse d’ail\",\"2 c. à soupe d’huile d’olive\",\"1 c. à soupe de vinaigre de vin\",\"100 ml d’eau froide\",\"Sel et poivre\",\"1. Laver les tomates, le concombre et le poivron. Couper en morceaux; éplucher l’oignon et l’ail.\",\"2. Mettre les légumes dans un blender avec l’huile, le vinaigre et l’eau froide.\",\"3. Mixer 1 à 2 minutes jusqu’à obtenir une texture homogène. Ajouter un peu d’eau si le gaspacho est trop épais.\",\"4. Saler, poivrer et goûter; ajuster le vinaigre selon l’acidité des tomates.\",\"5. Réfrigérer au moins 1 heure avant de servir très frais.\",\"Mettre les légumes coupés dans le bol et mixer 30 sec/vitesse 6 puis 30 sec/vitesse 8.\",\"Ajouter huile, vinaigre, eau, sel et poivre. Mixer encore 30 sec/vitesse 8. Réfrigérer au moins 1 h.\"]},{\"id\":\"cco-gaspacho-concombre\",\"name\":\"🥒 Gaspacho concombre-menthe\",\"lines\":[\"2 concombres (environ 700 g)\",\"150 g de yaourt nature\",\"1/2 citron\",\"8 feuilles de menthe\",\"1 petite gousse d’ail\",\"2 c. à soupe d’huile d’olive\",\"100 ml d’eau froide\",\"Sel et poivre\",\"1. Laver les concombres; les éplucher partiellement si la peau est épaisse puis les couper en morceaux.\",\"2. Mettre les concombres, le yaourt, le jus de citron, la menthe, l’ail, l’huile et l’eau dans un blender.\",\"3. Mixer jusqu’à obtenir une texture lisse. Ajouter un peu d’eau si nécessaire.\",\"4. Saler, poivrer et rectifier le citron.\",\"5. Réfrigérer au moins 1 heure et servir bien frais.\",\"Mettre tous les ingrédients dans le bol et mixer 30 sec/vitesse 6 puis 30 sec/vitesse 8.\",\"Goûter et rectifier l’assaisonnement. Réfrigérer au moins 1 h avant de servir.\"]}]}]]}]\ne:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#8FA89B\"}]]\n13:I[27201,[\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/_next/static/chunks/2fj33kogub60x.js\"],\"IconMark\"]\nb:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Pas de panique, on mange quoi ce soir ? 52 semaines de menus, du batchcooking simple et vos listes de courses automatisées.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobi
