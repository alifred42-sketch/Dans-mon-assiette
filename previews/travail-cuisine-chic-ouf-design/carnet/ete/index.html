s, coupez-les régulièrement, pesez les quantités et égouttez les conserves.\",\"2. Préchauffez le four à 180 °C. Placez le poisson et les légumes prévus dans un plat, puis ajoutez citron, huile et assaisonnement.\",\"3. Enfournez 15 à 20 minutes, selon l’épaisseur, jusqu’à ce que le poisson soit opaque et se détache à la fourchette.\",\"4. Préparez l’accompagnement indiqué, rectifiez l’assaisonnement et répartissez en quatre portions.\"]},{\"id\":\"r-19acbc340f\",\"name\":\"🍅 Tomates farcies froides au thon\",\"lines\":[\"⏱️ Préparation : 20 min\",\"🔥 Cuisson : 10 min\",\"👥 Pour 4 personnes\",\"4 grosses tomates\",\"200 g de thon au naturel égoutté\",\"2 œufs\",\"100 g de fromage blanc\",\"1 c. à soupe de ciboulette ciselée\",\"1 c. à café de paprika doux\",\"1/2 citron\",\"Poivre\",\"4 petites tranches de pain complet\",\"30 g de feta (facultatif)\",\"paprika\",\"citron\",\"poivre\",\"✅ 1 tranche complète\",\"Option :\",\"20 g de feta émiettée.\",\"\\\"Mayonnaise légère\\\"\",\"\\\"Œufs durs\\\"\",\"1. Cuire les œufs 9 à 10 minutes dans l’eau bouillante; refroidir, écaler et hacher.\",\"2. Laver les tomates, couper un chapeau et évider délicatement l’intérieur. Retourner sur du papier absorbant 5 minutes.\",\"3. Mélanger le thon égoutté, les œufs, le fromage blanc, la ciboulette, le paprika, le jus de citron et le poivre.\",\"4. Farcir les tomates avec le mélange et parsemer de feta si souhaité.\",\"5. Réfrigérer 20 minutes avant de servir avec le pain complet.\",\"Mayonnaise légère\",\"Œufs durs\"]},{\"id\":\"r-478ccb8641\",\"name\":\"🥒 Gaspacho courgette \u0026 St Môret\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"1 courgettes crues\",\"1 St Môret\",\"1 citron\",\"Menthe fraîche (5 g)\",\"1 gousse d’ail\",\"Poivre moulu (0,5 g)\",\"Basilic frais (5 g)\",\"1 à 2 tartines complètes grillées\",\"poivre\",\"basilic\",\"✅ 1 à 2 tartines complètes grillées\",\"⚪ Déjà présent\",\"⭐⭐⭐⭐ idéal pour les soupes froides.\",\"1. Préparez les ingrédients pour 4 personnes : lavez et épluchez les légumes, coupez-les régulièrement, pesez les quantités et égouttez les conserves.\",\"2. Faites revenir les aromates dans un peu d’huile 3 minutes. Ajoutez les légumes coupés et le bouillon indiqué.\",\"3. Couvrez et laissez frémir 20 minutes, jusqu’à ce que les légumes soient tendres. Mixez finement.\",\"4. Ajoutez les herbes ou la crème prévues, rectifiez sel et poivre, puis servez chaud.\"]},{\"id\":\"r-be651a77eb\",\"name\":\"🍤 Salade crevettes avocat citron\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"400 g de crevettes cuites décortiquées\",\"2 avocats mûrs\",\"300 g de tomates\",\"1 concombre\",\"120 g de salade verte\",\"1 citron\",\"150 g de fromage blanc\",\"1 c. à soupe de ciboulette ciselée\",\"1 c. à café de paprika doux\",\"Sel et poivre\",\"citron\",\"fromage blanc\",\"ciboulette\",\"✅ 1 tranche complet\",\"❌ Pas nécessaire\",\"1. Lavez et séchez la salade, les tomates et le concombre. Coupez les tomates et le concombre en dés; coupez les avocats en deux, retirez le noyau et détaillez la chair en cubes.\",\"2. Dans un bol, mélangez le fromage blanc, le jus du citron, la ciboulette, le paprika, le sel et le poivre.\",\"3. Répartissez la salade dans quatre assiettes. Ajoutez les crevettes, les tomates, le concombre et l’avocat.\",\"4. Nappez de sauce citronnée juste avant de servir et mélangez délicatement pour ne pas écraser l’avocat.\",\"Gaspacho entièrement réalisable\"]},{\"id\":\"r-c450588386\",\"name\":\"🥗 RECETTE 059 — Salade façon niçoise revisitée\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"400 g de thon\",\"200 g de œufs durs\",\"300 g de tomates\",\"300 g de haricots verts\",\"600 g de pommes de terre\",\"200 g de salade\",\"200 g de olives (facultatif)\",\"200 g de œufs\",\"200 g de olives\",\"1 c. à soupe de basilic ciselé\",\"Poivre moulu (0,5 g)\",\"1 c. à café de moutarde\",\"20 g de feta.\",\"➡️ Vinaigrette citronnée légère 🔗\",\"1. Préparez pour 4 personnes : 400 g de thon, 200 g de œufs durs, 300 g de tomates, 300 g de haricots verts, 600 g de pommes de terre, 200 g de salade, 200 g de olives (facultatif), 200 g de œufs, 200 g de olives, 1 c. à soupe de basilic ciselé, Poivre moulu (0,5 g), 1 c. à café de moutarde, 20 g de feta.. Lavez et coupez les légumes; égouttez les conserves. (15 min)\",\"2. Cuisez séparément les œufs, féculents ou protéines qui le nécessitent (0 min), puis égouttez et laissez tiédir; sautez cette étape pour une salade crue.\",\"3. Mélangez 300 g de tomates, 400 g de thon, 200 g de œufs durs, 200 g de œufs dans un saladier. Fouettez 1 c. à café de moutarde, versez sur la salade au dernier moment et mélangez 30 secondes.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments de la fiche et répartissez en 4 portions; servez frais.\",\"✅ Poulet grillé\",\"✅ Œufs durs\",\"✅ Pommes de terre vapeur\",\"✅ Crudités lavées\",\"✅ Sauce ranch légère\",\"✅ Sauce skyr citron\",\"➡️ 🌯 Wraps midi\",\"➡️ 🥗 Salades complètes\",\"➡️ 🐟 Assiettes poisson froid\",\"➡️ Repas express\",\"Poulet grillé\",\"Œufs durs\",\"Pommes de terre vapeur\",\"Crudités lavées\",\"Sauce ranch légère\",\"Sauce skyr citron\",\"🍱 BATCH COOKING — SEMAINE \\\"REPAS BUREAU\\\"\",\"Cuisson vapeur pommes de terre et haricots verts\",\"Cuisson des œufs\"]},{\"id\":\"r-8aa2b04e7d\",\"name\":\"🍢 Plateau apéro repas équilibré\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"2 tomates cerises\",\"100 g de mozzarella\",\"400 g de jambon cru\",\"1 melon\",\"1 œufs mimosa\",\"1 crudités\",\"1 houmous\",\"1 petites tartines complètes\",\"1 à 2 petites tranches complètes.\",\"tomates cerises\",\"mozzarella\",\"jambon cru\",\"melon\",\"œufs mimosa\",\"crudités\",\"houmous\",\"petites tartines complètes\",\"➡️ portion raisonnable mais plaisir conservé.\",\"✅ 1 à 2 petites tranches complètes.\",\"1. Lire la liste d’ingrédients et préparer les quantités; laver, éplucher et couper les légumes en morceaux réguliers.\",\"2. Faire chauffer l’huile dans une poêle ou une cocotte et faire revenir l’oignon 3 minutes.\",\"3. Ajouter la protéine principale et la faire dorer; ajouter les légumes et les aromates puis cuire 6 à 8 minutes en remuant.\",\"4. Ajouter la sauce ou le liquide prévu et poursuivre la cuisson 10 à 20 minutes selon la taille des morceaux, jusqu’à cuisson complète.\",\"5. Goûter, rectifier l’assaisonnement et servir chaud avec l’accompagnement indiqué dans la fiche.\",\"Rillettes de thon\"]},{\"id\":\"r-bb97ddaa79\",\"name\":\"🥗 Bowl méditerranéen\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"riz ou semoule\",\"poulet froid\",\"tomates\",\"concombre\",\"feta\",\"sauce yaourt citron\",\"cumin\",\"paprika\",\"menthe\",\"❌ Non\",\"⚪ Déjà présent\",\"🛒 STOCK SPÉCIAL ÉTÉ À AVOIR\",\"🥚 Œufs\",\"🐟 Thon\",\"🐟 Saumon fumé\",\"🍤 Crevettes\",\"🧀 St Môret\",\"🧀 Feta\",\"🧀 Mozzarella\",\"🍅 Tomates\",\"🥒 Concombre\",\"🍋 Citrons\",\"🌿 Herbes fraîches\",\"🥖 Pain complet au congélateur\",\"1 STOCK SPÉCIAL ÉTÉ À AVOIR\",\"1 Œufs\",\"400 g de Thon\",\"400 g de Saumon fumé\",\"400 g de Crevettes\",\"1 St Môret\",\"100 g de Feta\",\"100 g de Mozzarella\",\"2 Tomates\",\"1 Concombre\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\"]},{\"id\":\"r-d8c306d68e\",\"name\":\"🥗 Salade complète façon soleil\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 10 min\",\"👥 Pour 4 personnes\",\"2 tomates\",\"1 concombre\",\"4 œufs durs\",\"100 g de mozzarella\",\"400 g de thon au naturel égoutté ou de maquereau\",\"1 salade verte\",\"1 c. à soupe d’huile d’olive\",\"1 citron\",\"5 g de basilic frais\",\"Sel et poivre\",\"huile d’olive\",\"citron\",\"basilic\",\"poivre\",\"\\\"Œufs durs\\\"\",\"1. Si les œufs ne sont pas déjà cuits, faites-les cuire 9 à 10 minutes dans l’eau frémissante, refroidissez-les et écalez-les.\",\"2. Lavez la salade, les tomates et le concombre. Coupez les tomates, le concombre, la mozzarella et les œufs en morceaux; égouttez le poisson en conserve.\",\"3. Mélangez l’huile d’olive, le jus du citron, le basilic ciselé, le sel et le poivre dans un petit bol.\",\"4. Répartissez la salade dans quatre assiettes, ajoutez les légumes, les œufs, la mozzarella et le poisson, puis versez l’assaisonnement au moment de servir.\",\"Œufs durs\"]},{\"id\":\"r-a7800f3ee7\",\"name\":\"🍅 Tomates mozzarella basilic\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"4 tomates cœur de bœuf (environ 600 g)\",\"250 g de mozzarella\",\"8 feuilles de basilic\",\"1 c. à soupe d’huile d’olive\",\"1 c. à café de vinaigre balsamique (facultatif)\",\"Poivre et une pincée de fleur de sel\",\"40 g de jambon cru (facultatif)\",\"huile d’olive\",\"poivre\",\"fleur de sel\",\"Option :\",\"Ajouter quelques morceaux de jambon cru.\",\"1. Laver les tomates et les couper en rondelles régulières.\",\"2. Lavez et séchez 4 tomates cœur de bœuf (environ 600 g). Épluchez ceux qui le nécessitent et coupez-les en morceaux réguliers d’environ 1 à 2 cm.\",\"3. Alterner les rondelles de tomate et de mozzarella sur un plat de service.\",\"4. Ajouter le basilic ciselé, l’huile d’olive, le vinaigre facultatif, le poivre et la fleur de sel.\",\"5. Ajoutez les ingrédients restants de la fiche, mélangez délicatement pendant 30 secondes et vérifiez l’assaisonnement.\"]},{\"id\":\"r-c20b449266\",\"name\":\"🥒 Courgettes marinées froides\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"1 courgettes\",\"1 citron\",\"1 gousse d’ail\",\"1 c. à soupe de huile d’olive\",\"Épices ou aromates (2 g)\",\"Basilic frais (5 g)\",\"thym (10 g pour 4 personnes)\",\"paprika\",\"basilic\",\"thym\",\"\\\"Trancher / Hacher\\\"\",\"avec poisson\",\"barbecue\",\"apéro\",\"1. Préparez les ingrédients pour 4 personnes : lavez et épluchez les légumes, coupez-les régulièrement, pesez les quantités et égouttez les conserves.\",\"2. Faites revenir les ingrédients à cuire dans une poêle ou casserole avec l’huile prévue pendant 4 à 6 minutes.\",\"3. Ajoutez les autres ingrédients dans l’ordre de cuisson et poursuivez 10 à 15 minutes à feu moyen-doux, en remuant.\",\"4. Vérifiez la cuisson, ajoutez les herbes ou la sauce prévues, rectifiez l’assaisonnement et servez en quatre portions.\",\"Trancher / Hacher\"]},{\"id\":\"r-925e0ae075\",\"name\":\"🐟 Salade fraîche saumon fumé avocat\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"400 g de saumon fumé\",\"2 avocats\",\"1 concombre\",\"2 tomates\",\"120 g de salade verte\",\"150 g de fromage blanc\",\"1 citron\",\"5 g de ciboulette\",\"Poivre\",\"fromage blanc\",\"citron\",\"ciboulette\",\"1. Lavez et essorez la salade. Coupez le concombre et les tomates en dés; coupez les avocats en deux, retirez les noyaux et détaillez la chair en cubes.\",\"2. Mélangez le fromage blanc avec le jus du citron, la ciboulette ciselée et le poivre.\",\"3. Répartissez la salade dans quatre assiettes, puis ajoutez le saumon fumé coupé en lanières, le concombre, les tomates et l’avocat.\",\"4. Servez la sauce à part ou nappez chaque assiette juste avant de déguster.\"]},{\"id\":\"r-d9dcfc7661\",\"name\":\"🍗 Poulet froid façon salade repas\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 10 min\",\"👥 Pour 4 personnes\",\"400 g de poulet rôti froid ou de blanc de poulet cuit\",\"2 tomates\",\"1 salade verte\",\"200 g de maïs égoutté\",\"4 œufs\",\"150 g de yaourt nature\",\"1 c. à soupe de jus de citron\",\"1 c. à café de moutarde\",\"Sel et poivre\",\"yaourt citronné\",\"1. Si les œufs ne sont pas cuits, faites-les cuire 9 à 10 minutes er l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"➡️ environ 30 minutes\",\"Sauce blanche\",\"Marinade\",\"Découpe légumes\",\"Hacher les légumes\",\"Préparer la marinade\",\"Cuire doucement le poulet\",\"Préparer une garniture prête pour plusieurs jours\"]},{\"id\":\"r-9a0e8072d2\",\"name\":\"🥚 Œufs mimosa version été\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"1 œufs\",\"400 g de thon\",\"100 g de fromage frais\",\"ciboulette\",\"🥑 avocat\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\"]},{\"id\":\"r-9a84e2cfcf\",\"name\":\"🐟 saumon fumé\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"\\\"Œufs durs\\\"\",\"400 g de saumon\",\"300 g de légumes de saison\",\"200 g de féculent adapté\",\"1 c. à soupe d’huile d’olive\",\"Sel et poivre\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Œufs durs\"]},{\"id\":\"r-68f05ec51f\",\"name\":\"🍝 Salade de pâtes méditerranéenne\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"250 g de pâtes\",\"300 g de tomates cerises\",\"125 g de mozzarella\",\"1 c. à soupe d’basilic\",\"400 g de jambon cru\",\"400 g de thon\",\"500 g de poulet froid\",\"200 g de pesto maison\",\"pesto maison\",\"\\\"Pesto\\\"\",\"1. Laver et sécher les légumes. Couper les tomates et les crudités en morceaux réguliers.\",\"2. Si la fiche contient des œufs, les cuire 9 à 10 minutes dans l’eau bouillante puis les refroidir; cuire la protéine indiquée séparément jusqu’à cuisson complète.\",\"3. Répartir la salade et les légumes dans les assiettes, ajouter le féculent cuit et la protéine.\",\"4. Mélanger l’huile, le citron, les herbes, le sel et le poivre; assaisonner juste avant de servir.\",\"Pesto\"]},{\"id\":\"r-a1648b2f0a\",\"name\":\"🐟 Papillote de saumon légumes\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"400 g de saumon\",\"1 courgettes\",\"2 tomates\",\"1 citron\",\"Aneth frais (5 g)\",\"Poivre moulu (0,5 g)\",\"aneth\",\"poivre\",\"\\\"Cuisson vapeur\\\"\",\"1. Préparez les ingrédients pour 4 personnes : lavez et épluchez les légumes, coupez-les régulièrement, pesez les quantités et égouttez les conserves.\",\"2. Préchauffez le four à 180 °C. Placez le poisson et les légumes prévus dans un plat, puis ajoutez citron, huile et assaisonnement.\",\"3. Enfournez 15 à 20 minutes, selon l’épaisseur, jusqu’à ce que le poisson soit opaque et se détache à la fourchette.\",\"4. Préparez l’accompagnement indiqué, rectifiez l’assaisonnement et répartissez en quatre portions.\",\"Cuisson vapeur\"]},{\"id\":\"r-16b9a93f41\",\"name\":\"🥘 Tian de légumes provençal\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"1 courgettes\",\"2 tomates\",\"2 oignons\",\"thym\",\"1 gousse d’ail\",\"basilic\",\"ail\",\"chaud\",\"froid\",\"avec œufs\",\"avec poisson\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\"]},{\"id\":\"r-4c3c676c65\",\"name\":\"🥑 Verrine fraîche apéro avocat crevettes\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"200 g de avocat\",\"400 g de crevettes\",\"100 g de fromage blanc\",\"200 g de citron\",\"1 c. à café de paprika\",\"1 c. à soupe d’ciboulette\",\"paprika\",\"ciboulette\",\"\\\"Sauce froide\\\"\",\"1. Préchauffer le four à 190 °C si une cuisson au four est prévue; laver et couper les légumes.\",\"2. Assaisonner le poisson avec le citron, les herbes, le sel et le poivre; répartir les légumes dans un plat et ajouter l’huile.\",\"3. Cuire au four 12 à 18 minutes selon l’épaisseur, ou à la poêle 3 à 5 minutes par face selon le poisson. Les fruits de mer doivent être cuits à cœur.\",\"4. Vérifier la cuisson, arroser du jus de cuisson et servir immédiatement avec l’accompagnement prévu.\",\"Sauce froide\"]},{\"id\":\"r-291b2944c5\",\"name\":\"🧀 Plateau apéro équilibré terrasse\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"🥒 bâtonnets de légumes\",\"🍅 tomates cerises\",\"🧀 cubes de fromage\",\"🐟 rillettes de thon maison\",\"🥚 œufs mimosa\",\"1 bâtonnets de légumes\",\"2 tomates cerises\",\"100 g de cubes de fromage\",\"400 g de rillettes de thon maison\",\"1 œufs mimosa\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\"]},{\"id\":\"r-fa4268ac37\",\"name\":\"🥜 quelques noix\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"\\\"Rillettes de thon\\\"\",\"400 g de légumes de saison\",\"300 g de légumes de saison\",\"200 g de féculent adapté\",\"1 c. à soupe d’huile d’olive\",\"Sel et poivre\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Rillettes de thon\"]},{\"id\":\"cco-gaspacho-andalou\",\"name\":\"🍅 Gaspacho andalou frais\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"700 g de tomates mûres\",\"1/2 concombre (environ 150 g)\",\"1/2 poivron rouge\",\"1/2 petit oignon rouge\",\"1 petite gousse d’ail\",\"2 c. à soupe d’huile d’olive\",\"1 c. à soupe de vinaigre de vin\",\"100 ml d’eau froide\",\"Sel fin (2 g) et poivre moulu (0,5 g)\",\"1. Préparez les ingrédients pour 4 personnes : lavez et épluchez les légumes, coupez-les régulièrement, pesez les quantités et égouttez les conserves.\",\"2. Faites revenir les aromates dans un peu d’huile 3 minutes. Ajoutez les légumes coupés et le bouillon indiqué.\",\"3. Couvrez et laissez frémir 20 minutes, jusqu’à ce que les légumes soient tendres. Mixez finement.\",\"4. Ajoutez les herbes ou la crème prévues, rectifiez sel et poivre, puis servez chaud.\",\"Mettre les légumes coupés dans le bol et mixer 30 sec/vitesse 6 puis 30 sec/vitesse 8.\",\"Ajouter huile, vinaigre, eau, sel et poivre. Mixer encore 30 sec/vitesse 8. Réfrigérer au moins 1 h.\"]},{\"id\":\"cco-gaspacho-concombre\",\"name\":\"🥒 Gaspacho concombre-menthe\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"2 concombres (environ 700 g)\",\"150 g de yaourt nature\",\"1/2 citron\",\"8 feuilles de menthe\",\"1 petite gousse d’ail\",\"2 c. à soupe d’huile d’olive\",\"100 ml d’eau froide\",\"Sel et poivre\",\"1. Laver les concombres; les éplucher partiellement si la peau est épaisse puis les couper en morceaux.\",\"2. Mettre les concombres, le yaourt, le jus de citron, la menthe, l’ail, l’huile et l’eau dans un blender.\",\"3. Mixer jusqu’à obtenir une texture lisse. Ajouter un peu d’eau si nécessaire.\",\"4. Saler, poivrer et rectifier le citron.\",\"5. Réfrigérer au moins 1 heure et servir bien frais.\",\"Mettre tous les ingrédients dans le bol et mixer 30 sec/vitesse 6 puis 30 sec/vitesse 8.\",\"Goûter et rectifier l’assaisonnement. Réfrigérer au moins 1 h avant de servir.\"]}]}]]}]\ne:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#8FA89B\"}]]\n13:I[27201,[\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/_next/static/chunks/0cl_z50-te9eh.js\"],\"IconMark\"]\nb:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Pas de panique, on mange quoi ce soir ? 52 semaines de menus, du batchcooking simple et vos listes de courses automatisées.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"6\",{\"rel\":\"icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/icon-192.png\",\"sizes\":\"192x192\",\"type\":\"image/png\"}],[\"$\",\"link\",\"7\",{\"rel\":\"icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/icon-512.png\",\"sizes\":\"512x512\",\"type\":\"image/png\"}],[\"$\",\"link\",\"8\",{\"rel\":\"apple-touch-icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/apple-touch-icon.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L13\",\"9\",{}]]\n"])</script></body></html>
