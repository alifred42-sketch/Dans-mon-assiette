\",\"4. Faites cuire l’accompagnement si nécessaire, rectifiez l’assaisonnement et servez chaud.\",\"Poulet citron\"]},{\"id\":\"r-2de02c9080\",\"name\":\"🥧 Quiche légère poireaux saumon\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"1 œufs\",\"1 poireaux\",\"400 g de saumon fumé\",\"150 ml de fromage blanc\",\"1 pâte brisée\",\"aneth\",\"poivre\",\"\\\"Quiche\\\"\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Assembler les ingrédients dans un plat adapté et cuire au four préchauffé à 180 °C jusqu’à cuisson à cœur.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Quiche\"]},{\"id\":\"r-b5ed3259b0\",\"name\":\"🍚 Risotto asperges \u0026 parmesan\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"300 g de riz arborio\",\"1 asperges vertes\",\"100 g de parmesan\",\"150 ml de bouillon\",\"persil\",\"poivre\",\"\\\"Risotto\\\"\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Risotto\"]},{\"id\":\"r-96900930bb\",\"name\":\"🥗 Taboulé maison revisité\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"300 g de semoule\",\"2 tomates\",\"1 concombre\",\"menthe\",\"1 citron\",\"400 g de crevettes\",\"400 g de poulet froid\",\"100 g de feta\",\"\\\"Taboulé\\\"\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Taboulé\"]},{\"id\":\"r-fc447e98b5\",\"name\":\"🧀 Courgettes farcies chèvre \u0026 jambon\",\"lines\":[\"⏱️ Préparation : 20 min\",\"🔥 Cuisson : 35 min\",\"👥 Pour 4 personnes\",\"4 courgettes rondes moyennes (environ 800 g)\",\"150 g de chèvre frais\",\"120 g de jambon blanc\",\"1 œuf\",\"1 c. à soupe d’huile d’olive\",\"6 feuilles de basilic\",\"Poivre\",\"basilic\",\"poivre\",\"\\\"Courgettes farcies\\\"\",\"1. Préchauffer le four à 190 °C.\",\"2. Laver les courgettes, couper un chapeau puis évider délicatement le centre en gardant une coque d’environ 1 cm.\",\"3. Hacher la chair récupérée et la faire revenir 5 minutes dans une poêle avec un filet d’huile; laisser tiédir.\",\"4. Mélanger la chair, le jambon coupé en petits dés, le chèvre, l’œuf, le basilic ciselé et le poivre.\",\"5. Farcir les courgettes, replacer les chapeaux et cuire 30 à 35 minutes, jusqu’à ce que la chair soit tendre et la farce prise.\",\"Courgettes farcies\"]},{\"id\":\"r-2e9d82d053\",\"name\":\"🐟 Tartine fraîche sardines ou maquereaux\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"4 pain complet\",\"400 g de maquereaux ou sardines\",\"100 g de fromage frais\",\"1 citron\",\"1 salade\",\"Ciboulette (5 g)\",\"Poivre moulu (0,5 g)\",\"ciboulette\",\"poivre\",\"1. Préparez les ingrédients pour 4 personnes : lavez et épluchez les légumes, coupez-les régulièrement, pesez les quantités et égouttez les conserves.\",\"2. Préchauffez le four à 180 °C. Placez le poisson et les légumes prévus dans un plat, puis ajoutez citron, huile et assaisonnement.\",\"3. Enfournez 15 à 20 minutes, selon l’épaisseur, jusqu’à ce que le poisson soit opaque et se détache à la fourchette.\",\"4. Préparez l’accompagnement indiqué, rectifiez l’assaisonnement et répartissez en quatre portions.\"]},{\"id\":\"r-4f567f7e1f\",\"name\":\"🍲 Velouté petits pois menthe\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"➡️ remplacer par courgette + menthe\",\"\\\"Velouté de légumes\\\"\",\"1. Épluchez les carottes et les pommes de terre, nettoyez les poireaux et coupez tous les légumes en morceaux de taille similaire. Émincez l’oignon.\",\"2. Placez les légumes et le bouillon dans une casserole, portez à ébullition puis laissez mijoter 20 minutes. Ajoutez les petits pois pour les 8 dernières minutes de cuisson.\",\"3. Vérifiez que les légumes sont tendres, puis mixez jusqu’à obtenir une soupe lisse. Ajoutez la menthe fraîche et mixez brièvement.\",\"4. Goûtez, rectifiez le sel et le poivre, puis servez chaud en quatre bols.\",\"400 g de petits pois frais ou surgelés\",\"3 carottes\",\"2 poireaux\",\"400 g de pommes de terre\",\"1 oignon\",\"1 l de bouillon de légumes\",\"10 g de menthe fraîche\",\"Sel et poivre\",\"Velouté de légumes\"]},{\"id\":\"r-0c8602c079\",\"name\":\"🥩 Steak haché sauce champignons\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"400 g de steak haché\",\"2 champignons\",\"150 ml de crème légère\",\"1 salade\",\"persil\",\"1 gousse d’ail\",\"ail\",\"\\\"Sauce champignons\\\"\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Sauce champignons\"]},{\"id\":\"r-af6f91eb76\",\"name\":\"🍅 RECETTE 027 — Tomates farcies légères\",\"lines\":[\"1. Préparez pour 4 personnes : 300 g de grosses tomates, 400 g de viande hachée, 1 oignon, 1 c. à soupe d’herbes, 250 g de riz complet (facultatif), 300 g de tomates, 250 g de riz, 1 c. à soupe de basilic ciselé, 1 c. à café de paprika. Préchauffez le four à 180 °C et coupez les légumes. (20 min)\",\"2. Faites revenir 400 g de viande hachée dans la matière grasse prévue 5 à 8 min; vérifiez la cuisson de la viande.\",\"3. Disposez 300 g de grosses tomates, 1 oignon, 300 g de tomates, 400 g de viande hachée dans un plat et ajoutez les condiments indiqués; répartissez uniformément.\",\"4. Enfournez 40 min à 180 °C, jusqu’à tendreté et dessus doré; vérifiez la cuisson à cœur, reposez 5 min et servez en 4 portions.\",\"300 g de grosses tomates\",\"400 g de viande hachée\",\"1 oignon\",\"1 c. à soupe d’herbes\",\"250 g de riz complet (facultatif)\",\"300 g de tomates\",\"250 g de riz\",\"1 c. à soupe de basilic ciselé\",\"1 c. à café de paprika\",\"❄️ une partie au congélateur pour un repas de secours.\",\"Tomates farcies\"]},{\"id\":\"cco-veloute-carotte-poireau\",\"name\":\"🥣 Velouté printanier carotte-poireau\",\"lines\":[\"⏱️ Préparation : 12 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"4 carottes (environ 350 g)\",\"2 poireaux (environ 300 g)\",\"1 petite pomme de terre\",\"1 oignon\",\"750 ml de bouillon de légumes\",\"1 c. à soupe d’huile d’olive\",\"2 c. à soupe de fromage frais (facultatif)\",\"Sel fin (2 g) et poivre moulu (0,5 g)\",\"1. Laver les poireaux et les carottes; éplucher la pomme de terre et l’oignon.\",\"2. Lavez et séchez 4 carottes (environ 350 g), 2 poireaux (environ 300 g), 1 petite pomme de terre, 1 oignon. Épluchez ceux qui le nécessitent et coupez-les en morceaux réguliers d’environ 1 à 2 cm.\",\"3. Faire revenir l’oignon dans l’huile 3 minutes, puis ajouter les légumes et le bouillon.\",\"4. Cuire 20 à 25 minutes à frémissement, jusqu’à ce que les carottes soient tendres.\",\"5. Mixer, ajouter le fromage frais si souhaité, puis saler et poivrer.\",\"Hacher l’oignon 5 sec/vitesse 5 puis faire revenir 3 min/120 °C/vitesse 1 avec l’huile.\",\"Ajouter les légumes coupés et le bouillon. Cuire 22 min/100 °C/vitesse 1.\",\"Mixer progressivement 30 à 60 sec/vitesse 6 à 8. Ajouter le fromage frais si utilisé.\"]},{\"id\":\"cco-veloute-courgette-basilic\",\"name\":\"🥣 Velouté doux courgette-basilic\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 22 min\",\"👥 Pour 4 personnes\",\"700 g de courgettes\",\"1 pomme de terre (environ 180 g)\",\"1 oignon\",\"650 ml de bouillon de légumes\",\"8 feuilles de basilic\",\"80 g de fromage frais\",\"1 c. à soupe d’huile d’olive\",\"Sel fin (2 g) et poivre moulu (0,5 g)\",\"1. Laver les courgettes et les couper en dés. Éplucher la pomme de terre et l’oignon.\",\"2. Faire revenir l’oignon dans l’huile 3 minutes dans une casserole.\",\"3. Ajouter les courgettes, la pomme de terre et le bouillon. Cuire 18 à 22 minutes, jusqu’à ce que les légumes soient tendres.\",\"4. Mixer avec le fromage frais et le basilic jusqu’à obtenir une texture lisse.\",\"5. Goûter, saler et poivrer. Servir chaud ou laisser refroidir rapidement puis réfrigérer pour une version fraîche.\",\"Hacher l’oignon 5 sec/vitesse 5 puis faire revenir 3 min/120 °C/vitesse 1.\",\"Ajouter courgettes, pomme de terre et bouillon. Cuire 20 min/100 °C/vitesse 1.\",\"Ajouter le fromage frais et le basilic puis mixer progressivement 30 à 60 sec/vitesse 6 à 8.\"]}]}]]}]\ne:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#8FA89B\"}]]\n13:I[27201,[\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/_next/static/chunks/17zc-rvp6k0u-.js\"],\"IconMark\"]\nb:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Pas de panique, on mange quoi ce soir ? 52 semaines de menus, du batchcooking simple et vos listes de courses automatisées.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"CUISI
