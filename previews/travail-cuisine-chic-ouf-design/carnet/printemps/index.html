ame\":\"font-heading text-3xl\",\"children\":\"Printemps\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-sm font-normal leading-relaxed text-[#2B2B2B]\",\"children\":\"Le retour des légumes croquants, des herbes fraîches et de la légèreté. La cuisine se réveille avec le soleil !\"}]]}],[\"$\",\"$L12\",null,{\"items\":[{\"id\":\"r-c5e88517e5\",\"name\":\"🥗 Salade complète printemps œufs \u0026 saumon\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 10 min\",\"👥 Pour 4 personnes\",\"1 grande salade verte\",\"4 œufs durs\",\"400 g de saumon fumé\",\"2 tomates\",\"1 concombre\",\"2 radis\",\"150 g de fromage blanc\",\"1 citron\",\"5 g de ciboulette\",\"4 tranches de pain complet (facultatif)\",\"fromage blanc\",\"citron\",\"ciboulette\",\"1 tranche de pain complet si besoin\",\"\\\"Œufs durs\\\"\",\"1. Si les œufs ne sont pas déjà cuits, faites-les cuire 9 à 10 minutes dans l’eau frémissante, refroidissez-les puis écalez-les.\",\"2. Lavez et essorez la salade. Coupez les tomates et le concombre en dés, les radis en fines rondelles et le saumon fumé en lanières.\",\"3. Mélangez le fromage blanc avec le jus de citron et la ciboulette ciselée; poivrez selon votre goût.\",\"4. Répartissez la salade et les crudités dans quatre assiettes, ajoutez les œufs coupés en quartiers et le saumon, puis servez avec la sauce et le pain si souhaité.\",\"Œufs durs\"]},{\"id\":\"r-95028bc469\",\"name\":\"🐟 Cabillaud sauce citron \u0026 légumes verts\",\"lines\":[\"1. Le vert vapeur: Faites cuire les sommités de brocolis et les haricots verts à la vapeur pendant 8 minutes pour qu'ils restent bien verts et légèrement croquants.\",\"2. La saisie: Parallèlement, faites chauffer l'huile d'olive dans une poêle antiadhésive. Saisissez les filets de cabillaud 3 minutes de chaque côté à feu moyen. Salez et poivrez. Réservez au chaud.\",\"3. Le déglaçage: Dans la même poêle, versez le jus de citron à feu doux pour décoller les sucs de cuisson du poisson.\",\"4. Le crémeux: Ajoutez la crème fraîche légère, ajustez en sel et poivre, et remuez pendant 1 minute au fouet pour lier la sauce sans la faire bouillir.\",\"5. Le dressage: Disposez les légumes verts et le cabillaud dans les assiettes, puis nappez généreusement le poisson de sauce au citron bien chaude.\",\"400 g de Filets de cabillaud (ou autre poisson blanc): 4 filets (environ 600 g)\",\"1 Brocolis: 1 petite tête coupée en sommités\",\"200 g d’Haricots verts (frais ou surgelés)\",\"150 ml de Crème fraîche légère (15% MG): 4 cuillères à soupe\",\"1 Citron jaune: Le jus d'un gros citron entier\",\"1 cuillère à café d’Huile d'olive\",\"1 pincée de Sel, poivre\"]},{\"id\":\"r-596f33ac6d\",\"name\":\"🥚 Omelette roulée aux légumes\",\"lines\":[\"1. La suée express: Dans une grande poêle antiadhésive, faites chauffer l'huile d'olive. Faites sauter la courgette et la carotte râpées pendant 3 minutes à feu vif pour évaporer leur eau. Réservez dans un bol.\",\"2. L'appareil: Dans un saladier, battez les œufs avec le lait, le sel et le poivre. Intégrez les légumes râpés cuits.\",\"3. La cuisson plate: Versez les œufs aux légumes dans la poêle bien chaude. Laissez cuire l'omelette à feu moyen pendant 3 à 4 minutes sans y toucher, jusqu'à ce que le dessous soit doré et le dessus tout juste pris.\",\"4. Le roulage: Hors du feu, étalez de petits morceaux de fromage frais sur toute l'omelette, puis roulez-la délicatement sur elle-même à l'aide d'une spatule directement dans la poêle.\",\"5. Le service: Coupez le rouleau d'omelette en tranches épaisses et servez chaud ou tiède avec une salade.\",\"1 Œufs frais: 8 gros œufs\",\"1 Courgette: 1 petite courgette râpée finement\",\"2 Carotte: 1 petite carotte râpée finement\",\"150 ml de Lait demi-écrémé: 2 cuillères à soupe\",\"50 g de Fromage frais de chèvre ou St Môret\",\"1 cuillère à café d’Huile d'olive\",\"2 pincées de Sel, poivre\"]},{\"id\":\"r-261284b831\",\"name\":\"🍗 Poulet citron courgettes\",\"lines\":[\"1. La saisie vive: Dans une grande sauteuse, faites chauffer l'huile d'olive. Faites dorer les dés de poulet à feu vif pendant 4 minutes.\",\"2. L'apport vert: Ajoutez l'ail pressé et les demi-rondelles de courgettes dans la sauteuse. Poursuivez la cuisson à feu vif pendant 4 minutes en remuant régulièrement.\",\"3. L'acidité: Versez le jus de citron, les zestes et saupoudrez d'origan séché. Salez et poivrez.\",\"4. Le mijotage: Baissez le feu, couvrez et laissez mijoter pendant 4 minutes pour que les courgettes deviennent tendres et s'imprègnent du jus de citron.\",\"5. L'utilisation: Servez chaud, idéalement avec du quinoa ou du riz complet pour napper le féculent de sauce citronnée.\",\"400 g de Blancs de poulet: 600 g coupés en gros dés\",\"1 Courgettes: 2 courgettes coupées en demi-rondelles\",\"1 Citron jaune: Le jus de 2 citrons + les zestes d'un demi-citron\",\"1 gousse d’Ail: 2 gousses d'ail pressées\",\"1 cuillère à soupe d’Huile d'olive\",\"1 cuillère à café d’Origan séché\",\"1 pincée de Sel, poivre\"]},{\"id\":\"r-2de02c9080\",\"name\":\"🥧 Quiche légère poireaux saumon\",\"lines\":[\"1. La tombée de poireaux: Dans une poêle contenant l'huile d'olive, faites cuire les poireaux émincés pendant 8 minutes à feu doux jusqu'à ce qu'ils soient bien tendres. Laissez tiédir.\",\"2. Le fond de tarte: Préchauffez le four à 180°C. Déroulez la pâte brisée dans un moule et piquez le fond avec une fourchette.\",\"3. L'appareil: Dans un saladier, fouettez les 3 œufs avec la crème fraîche légère, la muscade, le sel et le poivre.\",\"4. L'assemblage: Répartissez les poireaux tièdes et les dés de saumon cru uniformément sur le fond de pâte. Versez l'appareil liquide par-dessus.\",\"5. La cuisson: Enfournez pendant 35 minutes jusqu'à ce que la quiche soit bien gonflée et dorée. Coupez en 4 parts.\",\"1 Pâte brisée légère (ou classique): 1 rouleau\",\"400 g de Pavé de saumon frais (sans peau ni arêtes): 250 g coupé en petits dés cru\",\"1 Poireaux: 2 beaux poireaux émincés finement\",\"1 Œufs frais: 3 gros œufs\",\"200 ml de Crème fraîche légère (12% MG)\",\"1 cuillère à café d’Huile d'olive\",\"Sel, poivre, muscade: 1 pincée de chaque\"]},{\"id\":\"r-b5ed3259b0\",\"name\":\"🍚 Risotto asperges \u0026 parmesan\",\"lines\":[\"1. Le blanchiment: Plongez les tronçons d'asperges (et les pointes) dans le bouillon de légumes bouillant pendant 3 minutes pour les précuire. Retirez-les avec une écumoire et réservez-les. Gardez le bouillon au chaud.\",\"2. Le démarrage: Dans une sauteuse, faites chauffer l'huile d'olive. Faites suer l'oignon ciselé pendant 2 minutes à feu moyen.\",\"3. Le nacrage: Ajoutez le riz Arborio et remuez pendant 1 minute jusqu'à ce qu'il devienne translucide.\",\"4. Le mouillement progressif: Ajoutez le bouillon chaud louche après louche au fur et à mesure de son absorption, en remuant constamment. À mi-cuisson (après 8 minutes), intégrez les tronçons d'asperges (réservez les pointes pour le décor). Poursuivez la cuisson pendant 8 minutes supplémentaires.\",\"5. La \\\"mantecatura\\\": Retirez la sauteuse du feu. Le riz doit être crémeux et al dente. Intégrez le parmesan râpé, poivrez généreusement et décorez avec les pointes d'asperges sur le dessus. Couvrez 2 minutes avant de servir.\",\"250 g de Riz à risotto (Arborio)\",\"1 Asperges vertes: 1 botte (environ 400g) coupées en tronçons (gardez les pointes entières)\",\"40 g de Parmesan râpé (Reggiano)\",\"2 Oignon jaune: 1 oignon ciselé\",\"800 ml de Bouillon de légumes chaud\",\"1 cuillère à soupe d’Huile d'olive\",\"1 pincée de Sel, poivre noir\"]},{\"id\":\"r-96900930bb\",\"name\":\"🥗 Taboulé maison revisité\",\"lines\":[\"1. Le grain cru: Dans un grand saladier, déposez la semoule complète crue (ne la faites pas cuire, elle va gonfler grâce au jus des légumes).\",\"2. L'apport liquide naturel: Ajoutez les dés de tomates avec tout leur jus de découpe ainsi que les dés de concombre directement sur la semoule.\",\"3. L'herbage de précision: Intégrez la masse de persil et de menthe fraîchement hachés.\",\"4. L'assaisonnement: Versez le jus de citron, l'huile d'olive, le sel et le poivre. Mélangez énergiquement à la fourchette pour bien amalgamer l'ensemble.\",\"5. La macération: Tassez le taboulé dans le saladier, couvrez hermétiquement et placez au réfrigérateur pendant au moins 4 heures (idéalement toute une nuit) pour que la semoule s'hydrate et devienne ultra-tendre.\",\"150 g de Semoule de blé complet crue\",\"2 Tomates bien mûres: 3 tomates coupées en très petits dés (avec leur jus)\",\"1 Concombre: 1/2 concombre coupé en minuscules dés\",\"Persil plat et Menthe fraîche: 1 gros bouquet complet haché très finement\",\"1 Jus de citron jaune: Le jus de 2 gros citrons\",\"1 c. à soupe de Huile d'olive: 2 cuillères à soupe\",\"1 pincée de Sel, poivre\"]},{\"id\":\"r-fc447e98b5\",\"name\":\"🧀 Courgettes farcies chèvre \u0026 jambon\",\"lines\":[\"1. Le parage: Préchauffez le four à 190°C. Lavez les courgettes. Si elles sont longues, coupez-les en deux dans le sens de la longueur (façon barquettes). À l'aide d'une petite cuillère, évidez le centre en retirant la chair (gardez la moitié de la chair et jetez le reste si trop de pépins).\",\"2. La farce crémeuse: Dans un saladier, écrasez le chèvre frais à la fourchette avec l'œuf entier. Ajoutez les morceaux de jambon blanc, la chair de courgette récupérée et hachée menue, ainsi que les herbes de Provence. Salez et poivrez.\",\"3. Le garnissage: Disposez les barquettes de courgettes vides dans un plat à four. Remplissez généreusement les cavités avec la farce au chèvre et au jambon.\",\"4. La cuisson: Enfournez pour 25 minutes. La courgette doit être tendre sous la pointe d'un couteau et la farce doit être légèrement dorée et prise.\",\"5. Le service: Servez bien chaud en plat complet.\",\"1 Courgettes (rondes ou longues): 4 petites courgettes\",\"400 g de Jambon blanc dégraissé: 3 tranches coupées en petits morceaux\",\"120 g de Chèvre frais (type Chavroux ou Petit Billy)\",\"1 Œuf: 1 gros œuf frais\",\"1 cuillère à café de Mélange herbes de Provence (recette 1)\",\"1 pincée de Sel, poivre\"]},{\"id\":\"r-2e9d82d053\",\"name\":\"🐟 Tartine fraîche sardines ou maquereaux\",\"lines\":[\"1. Le toastage: Passez vos tranches de pain de céréales au grille-pain pour leur donner du croustillant et de la tenue.\",\"2. Le liant frais: Dans un bol, détendez le fromage frais avec le jus de citron, l'échalote ciselée et la ciboulette. Poivrez.\",\"3. Les rillettes minute: Égouttez soigneusement les poissons (sardines ou maquereaux). Retirez l'arête centrale des sardines si nécessaire. Ajoutez-les au fromage frais et écrasez grossièrement à la fourchette pour garder de la texture.\",\"4. Le montage: Tartinez généreusement et de manière égale la préparation de poisson sur les 4 tranches de pain encore tièdes.\",\"5. Le dressage: Décorez d'un brin de ciboulette supplémentaire et d'un tour de moulin à poivre. Servez frais avec quelques crudités.\",\"4 Pain complet ou aux céréales: 4 grandes tranches épaisses\",\"400 g de Sardines ou Maquereaux au naturel (en conserve): 2 boîtes (environ 200 g égoutté)\",\"100 g de Fromage frais (type St Môret Ligne)\",\"1 cuillère à café de Jus de citron jaune\",\"2 Échalote: 1/2 échalote ciselée microscopiquement\",\"Ciboulette fraîche: 1 cuillère à soupe ciselée\",\"1 pincée de Poivre noir du moulin\"]},{\"id\":\"r-4f567f7e1f\",\"name\":\"🍲 Velouté petits pois menthe\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"➡️ remplacer par courgette + menthe\",\"\\\"Velouté de légumes\\\"\",\"1. Épluchez les carottes et les pommes de terre, nettoyez les poireaux et coupez tous les légumes en morceaux de taille similaire. Émincez l’oignon.\",\"2. Placez les légumes et le bouillon dans une casserole, portez à ébullition puis laissez mijoter 20 minutes. Ajoutez les petits pois pour les 8 dernières minutes de cuisson.\",\"3. Vérifiez que les légumes sont tendres, puis mixez jusqu’à obtenir une soupe lisse. Ajoutez la menthe fraîche et mixez brièvement.\",\"4. Goûtez, rectifiez le sel et le poivre, puis servez chaud en quatre bols.\",\"400 g de petits pois frais ou surgelés\",\"3 carottes\",\"2 poireaux\",\"400 g de pommes de terre\",\"1 oignon\",\"1 l de bouillon de légumes\",\"10 g de menthe fraîche\",\"Sel et poivre\",\"Velouté de légumes\"]},{\"id\":\"r-0c8602c079\",\"name\":\"🥩 Steak haché sauce champignons\",\"lines\":[\"1. La saisie: Dans une poêle antiadhésive, faites chauffer l'huile. Saisissez les steaks hachés pendant 2 minutes de chaque côté à feu vif. Salez, poivrez et réservez-les sous une feuille d'aluminium.\",\"2. Le sauté de légumes: Dans la même poêle encore fumante, jetez les champignons émincés. Faites-les sauter à feu vif pendant 3 minutes jusqu'à ce qu'ils colorent et absorbent les sucs de la viande.\",\"3. Le déglaçage: Versez le bouillon de bœuf chaud sur les champignons pour décoller le fond de la poêle. Laissez réduire de moitié pendant 1 minute à feu moyen.\",\"4. La crème nappante: Baissez le feu au minimum. Ajoutez la crème fraîche légère, mélangez bien et laissez épaissir la sauce pendant 1 minute.\",\"5. La finition: Remettez les steaks hachés et leur jus de repos dans la poêle pendant 30 secondes pour les napper de sauce forestière crémeuse avant de servir.\",\"400 g de Steaks hachés de bœuf (5% MG): 4 pièces\",\"2 Champignons de Paris: 250 g émincés finement\",\"100 ml de Crème fraîche légère (15% MG)\",\"150 ml de Bouillon de bœuf (déshydraté): 50 ml d'eau chaude + 1/2 cuillère à café de poudre\",\"1 cuillère à café d’Huile de tournesol\",\"1 pincée de Sel, poivre noir\"]},{\"id\":\"r-af6f91eb76\",\"name\":\"Tomates farcies légères\",\"lines\":[\"1. Préchauffez le four à 180 °C (ou à la température indiquée sur l’emballage de la pâte). Préparez et coupez les ingrédients de la fiche.\",\"2. Faites cuire à la poêle les viandes ou légumes qui doivent être précuits; égouttez les ingrédients humides si nécessaire.\",\"3. Assemblez les ingrédients dans le moule ou sur la pâte, en répartissant uniformément la garniture et les assaisonnements prévus.\",\"4. Enfournez environ 40 minutes, en contrôlant la cuisson et la coloration; prolongez si nécessaire jusqu’à ce que le plat soit cuit à cœur.\",\"300 g de grosses tomates\",\"400 g de viande hachée\",\"1 oignon\",\"1 c. à soupe d’herbes\",\"250 g de riz complet (facultatif)\",\"300 g de tomates\",\"250 g de riz\",\"1 c. à soupe de basilic ciselé\",\"1 c. à café de paprika\",\"❄️ une partie au congélateur pour un repas de secours.\",\"Tomates farcies\"]},{\"id\":\"cco-veloute-carotte-poireau\",\"name\":\"🥣 Velouté printanier carotte-poireau\",\"lines\":[\"⏱️ Préparation : 12 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"4 carottes (environ 350 g)\",\"2 poireaux (environ 300 g)\",\"1 petite pomme de terre\",\"1 oignon\",\"750 ml de bouillon de légumes\",\"1 c. à soupe d’huile d’olive\",\"2 c. à soupe de fromage frais (facultatif)\",\"Sel fin (2 g) et poivre moulu (0,5 g)\",\"1. Laver les poireaux et les carottes; éplucher la pomme de terre et l’oignon.\",\"2. Lavez et séchez 4 carottes (environ 350 g), 2 poireaux (environ 300 g), 1 petite pomme de terre, 1 oignon. Épluchez ceux qui le nécessitent et coupez-les en morceaux réguliers d’environ 1 à 2 cm.\",\"3. Faire revenir l’oignon dans l’huile 3 minutes, puis ajouter les légumes et le bouillon.\",\"4. Cuire 20 à 25 minutes à frémissement, jusqu’à ce que les carottes soient tendres.\",\"5. Mixer, ajouter le fromage frais si souhaité, puis saler et poivrer.\",\"Hacher l’oignon 5 sec/vitesse 5 puis faire revenir 3 min/120 °C/vitesse 1 avec l’huile.\",\"Ajouter les légumes coupés et le bouillon. Cuire 22 min/100 °C/vitesse 1.\",\"Mixer progressivement 30 à 60 sec/vitesse 6 à 8. Ajouter le fromage frais si utilisé.\"]},{\"id\":\"cco-veloute-courgette-basilic\",\"name\":\"🥣 Velouté doux courgette-basilic\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 22 min\",\"👥 Pour 4 personnes\",\"700 g de courgettes\",\"1 pomme de terre (environ 180 g)\",\"1 oignon\",\"650 ml de bouillon de légumes\",\"8 feuilles de basilic\",\"80 g de fromage frais\",\"1 c. à soupe d’huile d’olive\",\"Sel fin (2 g) et poivre moulu (0,5 g)\",\"1. Laver les courgettes et les couper en dés. Éplucher la pomme de terre et l’oignon.\",\"2. Faire revenir l’oignon dans l’huile 3 minutes dans une casserole.\",\"3. Ajouter les courgettes, la pomme de terre et le bouillon. Cuire 18 à 22 minutes, jusqu’à ce que les légumes soient tendres.\",\"4. Mixer avec le fromage frais et le basilic jusqu’à obtenir une texture lisse.\",\"5. Goûter, saler et poivrer. Servir chaud ou laisser refroidir rapidement puis réfrigérer pour une version fraîche.\",\"Hacher l’oignon 5 sec/vitesse 5 puis faire revenir 3 min/120 °C/vitesse 1.\",\"Ajouter courgettes, pomme de terre et bouillon. Cuire 20 min/100 °C/vitesse 1.\",\"Ajouter le fromage frais et le basilic puis mixer progressivement 30 à 60 sec/vitesse 6 à 8.\"]}]}]]}]\ne:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#8FA89B\"}]]\n13:I[27201,[\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/_next/static/chunks/0x95rhs_coz14.js\"],\"IconMark\"]\nb:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Pas de panique, on mange quoi ce soir ? 52 semaines de menus, du batchcooking simple et vos listes de courses automatisées.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"6\",{\"rel\":\"icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/icon-192.png\",\"sizes\":\"192x192\",\"type\":\"image/png\"}],[\"$\",\"link\",\"7\",{\"rel\":\"icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/icon-512.png\",\"sizes\":\"512x512\",\"type\":\"image/png\"}],[\"$\",\"link\",\"8\",{\"rel\":\"apple-touch-icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/apple-touch-icon.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L13\",\"9\",{}]]\n"])</script></body></html>
