",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"400 g de poulet : 500 g\",\"2 carottes\",\"1 poireaux\",\"2 champignons\",\"1 courgettes\",\"300 g de nouilles de riz : 160 g\",\"1 gingembre : 1 c. à café\",\"Coriandre fraîche (5 g)\",\"Poivre moulu (0,5 g)\",\"piment doux (10 g pour 4 personnes)\",\"gingembre\",\"ail\",\"citron vert\",\"sauce soja légère\",\"gingembre : 1 c. à café\",\"coriandre\",\"poivre\",\"piment doux\",\"✅ Découpe légumes\",\"1. Préparez les ingrédients pour 4 personnes : lavez et épluchez les légumes, coupez-les régulièrement, pesez les quantités et égouttez les conserves.\",\"2. Faites revenir les aromates dans un peu d’huile 3 minutes. Ajoutez les légumes coupés et le bouillon indiqué.\",\"3. Couvrez et laissez frémir 20 minutes, jusqu’à ce que les légumes soient tendres. Mixez finement.\",\"4. Ajoutez les herbes ou la crème prévues, rectifiez sel et poivre, puis servez chaud.\",\"❌ Non\",\"Découpe légumes\"]},{\"id\":\"r-3191a7ce46\",\"name\":\"🍚 Risotto crevettes, courgettes \u0026 citron\",\"lines\":[\"⏱️ Préparation : 12 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"150 ml de fromage blanc : 150 g\",\"100 g de parmesan : 40 g\",\"curry doux : 1/2 c. à café\",\"1 gousse d’ail : 1/2 c. à café\",\"persil : 1 c. à soupe\",\"Poivre moulu (0,5 g)\",\"100 g de Parmesan déjà compté\",\"fromage blanc : 150 g\",\"parmesan : 40 g\",\"ail : 1/2 c. à café\",\"poivre\",\"➡️ cuisson du risotto sans surveiller\",\"➡️ mélange régulier\",\"➡️ texture crémeuse\",\"➡️ 60 g riz cru/personne\",\"❌ Non\",\"⚠️ Parmesan déjà compté\",\"1. Préparez les ingrédients pour 4 personnes : lavez et épluchez les légumes, coupez-les régulièrement, pesez les quantités et égouttez les conserves.\",\"2. Faites cuire le féculent dans l’eau bouillante salée selon le temps du paquet, puis égouttez.\",\"3. Faites revenir les légumes et aromates 5 à 8 minutes dans l’huile prévue; ajoutez sauce ou bouillon et laissez réduire 3 minutes.\",\"4. Mélangez avec le féculent cuit, ajoutez les herbes, le fromage ou la crème prévus, rectifiez l’assaisonnement et servez.\",\"➡️ mode risotto\"]},{\"id\":\"r-33b3fe63c3\",\"name\":\"🍲 Dahl doux de lentilles corail \u0026 légumes\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"1 gousse d’lentilles corail : 240 g\",\"2 carottes\",\"1 courgettes\",\"150 ml de tomates concassées\",\"2 oignon\",\"150 ml de lait de coco léger : petite quantité\",\"curry doux : 2 c. à café\",\"1 curcuma : 1/2 c. à café\",\"cumin : 1 c. à café\",\"1 gingembre : 1/2 c. à café\",\"Poivre moulu (0,5 g)\",\"tomates\",\"bouillon\",\"citron\",\"curcuma : 1/2 c. à café\",\"gingembre : 1/2 c. à café\",\"poivre\",\"1. Préparez les ingrédients pour 4 personnes : lavez et épluchez les légumes, coupez-les régulièrement, pesez les quantités et égouttez les conserves.\",\"2. Faites revenir les ingrédients à cuire dans une poêle ou casserole avec l’huile prévue pendant 4 à 6 minutes.\",\"3. Ajoutez les autres ingrédients dans l’ordre de cuisson et poursuivez 10 à 15 minutes à feu moyen-doux, en remuant.\",\"4. Vérifiez la cuisson, ajoutez les herbes ou la sauce prévues, rectifiez l’assaisonnement et servez en quatre portions.\",\"➡️ riz basmati : 40 à 50 g cru/personne\",\"❌ Non\"]},{\"id\":\"r-1ba8280664\",\"name\":\"🥘 Gratin de légumes du soleil façon provençale\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"1 courgettes : 3\",\"2 tomates : 5\",\"2 poivrons\",\"1 aubergine (facultatif puisque tu en manges peu )\",\"2 oignons\",\"400 g de poulet ou jambon blanc\",\"150 ml de fromage blanc : 200 g\",\"1 œufs : 2\",\"Basilic frais (5 g)\",\"herbes de Provence : 1 c. à café\",\"paprika fumé : 1 c. à café\",\"1 gousse d’ail : 1/2 c. à café\",\"Poivre moulu (0,5 g)\",\"1 aubergine (facultatif )\",\"400 g de poulet ou jambon\",\"1 Herbes aromatiques (5 g)\",\"Épices ou aromates (2 g)\",\"1 gousse d’ail\",\"100 g de mozzarella ou chèvre : 30 g/personne\",\"fromage blanc : 200 g\",\"œufs : 2\",\"basilic\",\"ail : 1/2 c. à café\",\"poivre\",\"✅ Préparer l’appareil\",\"✅ Mixer les herbes/épices\",\"✅ Découper les légumes\",\"❌ Non\",\"✅ Possible :\",\"➡️ chèvre frais ou mozzarella 30 g/personne\",\"1. Préparez les ingrédients pour 4 personnes : lavez et épluchez les légumes, coupez-les régulièrement, pesez les quantités et égouttez les conserves.\",\"2. Préchauffez le four à 180 °C. Précuisez 5 à 8 minutes les légumes ou féculents les plus fermes, puis égouttez.\",\"3. Disposez les ingrédients dans un plat huilé et ajoutez la sauce, la crème ou le fromage prévus.\",\"4. Enfournez 25 à 35 minutes, jusqu’à ce que les ingrédients soient tendres et le dessus doré. Laissez reposer 5 minutes.\",\"➡️ environ 35 minutes + cuisson four\",\"Préparer l’appareil\",\"Mixer les herbes/épices\",\"Découper les légumes\",\"Hacher les herbes\",\"Mélanger la préparation\",\"Gagner du temps avant cuisson au four\"]},{\"id\":\"r-ae4f6aaa28\",\"name\":\"🌯 Wrap froid façon niçoise\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"4 tortillas complètes : 4\",\"400 g de thon naturel : 2 boîtes\",\"2 tomates\",\"1 salade\",\"1 œufs durs\",\"300 g de haricots verts\",\"1 concombre\",\"basilic : 1 c. à café\",\"Poivre moulu (0,5 g)\",\"1 gousse d’ail : 1 pincée\",\"4 Tortilla à la place\",\"fromage blanc : 150 g\",\"moutarde\",\"citron\",\"ciboulette\",\"poivre\",\"ail : 1 pincée\",\"✅ Cuisson œufs\",\"✅ Sauce maison\",\"✅ Découpe légumes\",\"⚠️ Tortilla à la place\",\"❌ Non\",\"1. Préparez les ingrédients pour 4 personnes : lavez et épluchez les légumes, coupez-les régulièrement, pesez les quantités et égouttez les conserves.\",\"2. Préparez la sauce en mélangeant l’huile, le citron ou le vinaigre et les condiments indiqués.\",\"3. Coupez les ingrédients régulièrement; faites cuire complètement ceux qui le nécessitent, puis laissez-les tiédir.\",\"4. Assemblez les ingrédients, ajoutez la sauce au dernier moment, mélangez délicatement et servez en quatre portions.\",\"Cuisson œufs\",\"Sauce maison\",\"Découpe légumes\"]},{\"id\":\"r-a566224646\",\"name\":\"🥣 Soupe repas potiron, poulet \u0026 épices douces\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"1 potiron ou potimarron : 1 kg\",\"400 g de poulet : 400 g\",\"2 carottes\",\"200 g de poireaux\",\"1 oignon\",\"500 ml de bouillon\",\"curry doux : 1 c. à café\",\"muscade : 1 pincée\",\"1 gingembre : 1 pincée\",\"Poivre moulu (0,5 g)\",\"fromage blanc : 100 g\",\"gingembre : 1 pincée\",\"poivre\",\"➡️ cuisson soupe\",\"➡️ mixage velours\",\"➡️ 1 tranche complète possible\",\"❌ Non\",\"1. Laver et couper les légumes en morceaux de taille similaire; éplucher l’oignon et la pomme de terre s’ils figurent dans la fiche.\",\"2. Faire revenir l’oignon dans l’huile 3 minutes dans une casserole.\",\"3. Ajouter les légumes et le bouillon, porter à frémissement puis cuire 20 à 25 minutes, jusqu’à ce que les morceaux soient tendres.\",\"4. Mixer soigneusement jusqu’à obtenir une texture lisse. Ajouter la crème facultative, saler, poivrer et servir chaud.\",\"Hacher l’oignon 5 sec/vitesse 5 et racler les parois.\",\"Ajouter l’huile et faire revenir 3 min/120 °C/vitesse 1.\",\"Ajouter les légumes et le liquide, puis cuire 20 à 25 min/100 °C/vitesse 1; vérifier la tendreté.\",\"Mixer progressivement 30 à 60 sec/vitesse 6 à 8, en augmentant doucement. Respecter la capacité maximale du bol.\"]},{\"id\":\"r-a474a6ba76\",\"name\":\"🐟 Blanquette de poisson légère aux légumes\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"aneth : 1 c. à café\",\"persil : 1 c. à soupe\",\"muscade : 1 pincée\",\"poivre\",\"fromage blanc : 200 g\",\"bouillon de légumes\",\"citron\",\"moutarde douce : 1 c. à café\",\"✅ Cuisson vapeur du poisson\",\"1. Préchauffer le four à 190 °C si une cuisson au four est prévue; laver et couper les légumes.\",\"2. Assaisonner le poisson avec le citron, les herbes, le sel et le poivre; répartir les légumes dans un plat et ajouter l’huile.\",\"3. Cuire au four 12 à 18 minutes selon l’épaisseur, ou à la poêle 3 à 5 minutes par face selon le poisson. Les fruits de mer doivent être cuits à cœur.\",\"4. Vérifier la cuisson, arroser du jus de cuisson et servir immédiatement avec l’accompagnement prévu.\",\"➡️ pommes de terre vapeur : 150 g/personne\",\"❌ Non\",\"Cuisson vapeur du poisson\"]},{\"id\":\"r-735df2ae7c\",\"name\":\"🍚 Risotto poulet, poireaux \u0026 parmesan\",\"lines\":[\"⏱️ Préparation : 12 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"300 g de riz arborio : 240 g\",\"400 g de poulet : 500 g\",\"4 poireaux\",\"200 g de échalotes\",\"500 ml de bouillon\",\"150 ml de fromage blanc : 150 g\",\"100 g de parmesan : 40 g\",\"thym : 1 c. à café\",\"1 gousse d’ail : 1/2 c. à café\",\"1 c. à soupe d’persil\",\"poivre\",\"100 g de Parmesan déjà compté\",\"fromage blanc : 150 g\",\"parmesan : 40 g\",\"ail : 1/2 c. à café\",\"persil\",\"✅ cuisson du riz\",\"✅ mélange régulier\",\"✅ texture crémeuse\",\"➡️ 60 g riz cru/personne\",\"❌ Non\",\"⚠️ Parmesan déjà compté\",\"1. Lavez et séchez 4 poireaux. Épluchez ceux qui le nécessitent et coupez-les en morceaux réguliers d’environ 1 à 2 cm.\",\"2. Porter une grande casserole d’eau à ébullition et cuire les pâtes selon le temps indiqué sur le paquet; pour un risotto, faire revenir le riz puis ajouter le bouillon progressivement.\",\"3. Dans une poêle, cuire les légumes et la protéine de la recette jusqu’à ce qu’ils soient tendres et cuits à cœur.\",\"4. Réunir la base féculente, la garniture et la sauce; mélanger 1 à 2 minutes, goûter et rectifier l’assaisonnement.\",\"5. Répartissez la préparation dans quatre assiettes, ajoutez la garniture prévue et servez dès que la cuisson est terminée.\",\"cuisson du riz\",\"mélange régulier\",\"texture crémeuse\",\"Risotto\"]},{\"id\":\"r-63e354bf25\",\"name\":\"🌯 Wrap chaud façon César au poulet croustillant léger\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"4 tortillas complètes : 4\",\"400 g de poulet : 600 g\",\"200 g de salade\",\"300 g de tomates\",\"1 concombre\",\"paprika fumé : 1 c. à café\",\"1 gousse d’ail : 1/2 c. à café\",\"Poivre moulu (0,5 g)\",\"4 Tortilla à la place\",\"100 g de Parmesan dans la sauce\",\"fromage blanc : 150 g\",\"parmesan : 30 g\",\"citron\",\"moutarde\",\"ail\",\"ail : 1/2 c. à café\",\"poivre\",\"✅ Sauce maison\",\"✅ Découpe légumes\",\"⚠️ Tortilla à la place\",\"⚠️ Parmesan dans la sauce\",\"1. Préparez les ingrédients pour 4 personnes : lavez et épluchez les légumes, coupez-les régulièrement, pesez les quantités et égouttez les conserves.\",\"2. Préparez la sauce en mélangeant l’huile, le citron ou le vinaigre et les condiments indiqués.\",\"3. Coupez les ingrédients régulièrement; faites cuire complètement ceux qui le nécessitent, puis laissez-les tiédir.\",\"4. Assemblez les ingrédients, ajoutez la sauce au dernier moment, mélangez délicatement et servez en quatre portions.\",\"Sauce maison\",\"Découpe légumes\"]},{\"id\":\"r-9924216821\",\"name\":\"🥣 Soupe repas « retour du marché »\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"1 poireaux\",\"2 carottes\",\"1 courgettes\",\"2 pommes de terre\",\"400 g de poulet effiloché : 400 g\",\"150 ml de bouillon\",\"curry doux : 1/2 c. à café\",\"thym : 1 c. à café\",\"Persil frais (5 g)\",\"Poivre moulu (0,5 g)\",\"fromage blanc : 100 g\",\"persil\",\"poivre\",\"✅ Cuisson légumes\",\"✅ Mixage partiel\",\"✅ Texture veloutée\",\"➡️ 1 tranche complète possible\",\"❌ Non\",\"1. Préparez les ingrédients pour 4 personnes : lavez et épluchez les légumes, coupez-les régulièrement, pesez les quantités et égouttez les conserves.\",\"2. Faites revenir les aromates dans un peu d’huile 3 minutes. Ajoutez les légumes coupés et le bouillon indiqué.\",\"3. Couvrez et laissez frémir 20 minutes, jusqu’à ce que les légumes soient tendres. Mixez finement.\",\"4. Ajoutez les herbes ou la crème prévues, rectifiez sel et poivre, puis servez chaud.\",\"Cuisson légumes\",\"Mixage partiel\",\"Texture veloutée\"]},{\"id\":\"r-c0a4656cd7\",\"name\":\"🥘 Poulet façon basquaise aux légumes du soleil\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"400 g de poulet : 700 g\",\"2 tomates\",\"2 poivrons\",\"1 courgettes\",\"2 oignons\",\"1 gousse d’ail\",\"paprika fumé : 1 c. à café\",\"piment doux : 1 pincée\",\"thym : 1 c. à café\",\"basilic : 1 c. à café\",\"Poivre moulu (0,5 g)\",\"tomates concassées\",\"bouillon\",\"herbes\",\"poivre\",\"1. Préparez les ingrédients pour 4 personnes : lavez et épluchez les légumes, coupez-les régulièrement, pesez les quantités et égouttez les conserves.\",\"2. Faites chauffer l’huile prévue et faites dorer la viande 4 à 6 minutes en remuant.\",\"3. Ajoutez légumes, épices et liquide indiqués. Couvrez et laissez mijoter 15 à 20 minutes à feu doux, en vérifiant la cuisson à cœur.\",\"4. Faites cuire l’accompagnement si nécessaire, rectifiez l’assaisonnement et servez chaud.\",\"➡️ riz : 60 g cru/personne\",\"❌ Non\"]},{\"id\":\"cco-pizza-mediterranee\",\"name\":\"🍕 Pizza maison méditerranéenne\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"1 pâte à pizza (environ 260 g)\",\"200 g de coulis de tomate\",\"150 g de mozzarella\",\"1 courgette\",\"150 g de tomates cerises\",\"1 c. à soupe d’huile d’olive\",\"1 c. à café d’origan\",\"Poivre moulu (0,5 g)\",\"1. Préchauffer le four à 220 °C en chaleur tournante.\",\"2. Étaler la pâte sur une plaque couverte de papier cuisson et répartir le coulis en laissant 1 cm de bord.\",\"3. Laver la courgette et les tomates; couper la courgette en fines demi-rondelles et les tomates en deux.\",\"4. Répartissez la préparation dans quatre assiettes, ajoutez la garniture prévue et servez dès que la cuisson est terminée.\",\"5. Cuire 12 à 16 minutes, jusqu’à ce que la pâte soit dorée et le fromage fondu.\"]},{\"id\":\"cco-pizza-jambon-champignons\",\"name\":\"🍕 Pizza maison jambon-champignons\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"1 pâte à pizza (environ 260 g)\",\"180 g de coulis de tomate\",\"150 g de mozzarella\",\"120 g de jambon blanc\",\"150 g de champignons\",\"1 c. à café d’origan\",\"Poivre moulu (0,5 g)\",\"1. Préchauffer le four à 220 °C.\",\"2. Répartissez la préparation dans quatre assiettes, ajoutez la garniture prévue et servez dès que la cuisson est terminée.\",\"3. Nettoyer les champignons et les émincer; couper le jambon en lanières.\",\"4. Répartissez la préparation dans quatre assiettes, ajoutez la garniture prévue et servez dès que la cuisson est terminée.\",\"5. Cuire 12 à 16 minutes; vérifier que la pâte est bien cuite dessous.\"]},{\"id\":\"cco-pizza-trois-fromages\",\"name\":\"🍕 Pizza maison trois fromages\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"1 pâte à pizza (environ 260 g)\",\"150 g de coulis de tomate\",\"100 g de mozzarella\",\"60 g de chèvre\",\"40 g d’emmental râpé\",\"1 c. à café d’origan\",\"Poivre moulu (0,5 g)\",\"1. Préchauffer le four à 220 °C.\",\"2. Répartissez la préparation dans quatre assiettes, ajoutez la garniture prévue et servez dès que la cuisson est terminée.\",\"3. Lavez et séchez 150 g de coulis de tomate. Épluchez ceux qui le nécessitent et coupez-les en morceaux réguliers d’environ 1 à 2 cm.\",\"4. Répartissez la préparation dans quatre assiettes, ajoutez la garniture prévue et servez dès que la cuisson est terminée.\",\"5. Cuire 12 à 16 minutes, jusqu’à ce que le fromage soit fondu et la pâte dorée.\"]},{\"id\":\"cco-pizza-poulet-bbq\",\"name\":\"🍕 Pizza maison poulet barbecue\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"1 pâte à pizza (environ 260 g)\",\"150 g de coulis de tomate\",\"120 g de poulet déjà cuit\",\"120 g de mozzarella\",\"1 petit oignon rouge\",\"2 c. à soupe de sauce barbecue\",\"Poivre moulu (0,5 g)\",\"1. Préchauffer le four à 220 °C.\",\"2. Étaler la pâte, répartir le coulis et déposer le poulet cuit coupé en petits morceaux.\",\"3. Émincer finement l’oignon et égoutter la mozzarella.\",\"4. Dans un bol, mélangez 2 c. à soupe de sauce barbecue au fouet pendant 30 à 45 secondes, jusqu’à obtenir une texture homogène. Goûtez et rectifiez l’assaisonnement.\",\"5. Cuire 12 à 16 minutes. Le poulet doit être bien chaud à cœur.\"]},{\"id\":\"cco-burger-bistrot\",\"name\":\"🍔 Burger maison façon bistrot\",\"lines\":[\"⏱️ Préparation : 20 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"4 pains à burger\",\"4 steaks hachés de bœuf (environ 100 g chacun)\",\"4 tranches de cheddar\",\"1 tomate\",\"1 petit oignon rouge\",\"4 feuilles de salade\",\"4 c. à café de moutarde ou sauce burger\",\"500 g de pommes de terre\",\"1 c. à soupe d’huile d’olive\",\"1 c. à café de paprika, sel et poivre\",\"1. Préchauffer le four à 210 °C. Laver les pommes de terre et les couper en quartiers réguliers.\",\"2. Mélanger les quartiers avec l’huile, le paprika, le sel et le poivre; étaler sur une plaque et cuire 30 à 35 minutes en retournant à mi-cuisson.\",\"3. Laver la tomate et la couper en rondelles; émincer l’oignon et laver la salade.\",\"4. Cuire les steaks dans une poêle chaude 3 à 5 minutes par face selon l’épaisseur et la cuisson souhaitée; déposer le cheddar en fin de cuisson.\",\"5. Réchauffer les pains 2 minutes au four, tartiner la base de sauce puis monter les burgers avec salade, tomate, oignon et steak. Servir avec les frites.\"]},{\"id\":\"cco-burger-poulet\",\"name\":\"🍔 Burger de poulet croustillant au four\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"4 pains à burger\",\"4 petits filets de poulet (environ 120 g chacun)\",\"1 œuf\",\"60 g de chapelure\",\"4 feuilles de salade\",\"1 tomate\",\"4 c. à soupe de yaourt nature\",\"1 c. à café de paprika\",\"1 c. à soupe d’huile\",\"Sel fin (2 g) et poivre moulu (0,5 g)\",\"1. Préchauffer le four à 210 °C et huiler légèrement une plaque.\",\"2. Battre l’œuf dans une assiette; mélanger la chapelure avec le paprika, le sel et le poivre.\",\"3. Passer les filets de poulet dans l’œuf puis dans la chapelure et les déposer sur la plaque. Cuire 20 à 25 minutes en les retournant à mi-cuisson; le centre doit atteindre 74 °C.\",\"4. Mélanger le yaourt avec une pincée de sel et de poivre pour préparer une sauce rapide.\",\"5. Laver la salade et la tomate, réchauffer les pains puis assembler les burgers avec le poulet et la sauce.\"]},{\"id\":\"cco-burger-montagnard\",\"name\":\"🍔 Burger maison façon montagnarde\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"4 pains à burger\",\"4 steaks hachés de bœuf (environ 100 g chacun)\",\"4 tranches de raclette\",\"150 g de champignons\",\"1 oignon\",\"4 feuilles de salade\",\"1 c. à café d’huile\",\"Poivre moulu (0,5 g)\",\"1. Nettoyer les champignons et émincer les champignons et l’oignon.\",\"2. Faire chauffer l’huile dans une poêle et cuire les champignons et l’oignon 7 à 9 minutes, jusqu’à ce que leur eau soit évaporée.\",\"3. Dans une autre poêle, cuire les steaks 3 à 5 minutes par face selon l’épaisseur. Poser la raclette dessus pendant la dernière minute et couvrir.\",\"4. Réchauffer les pains coupés en deux pendant 2 minutes.\",\"5. Garnir chaque pain de salade, steak au fromage et poêlée de champignons. Servir chaud.\"]},{\"id\":\"cco-burger-italien\",\"name\":\"🍔 Burger italien tomate-mozzarella\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 10 min\",\"👥 Pour 4 personnes\",\"4 pains à burger\",\"4 steaks hachés de bœuf (environ 100 g chacun)\",\"1 boule de mozzarella (125 g)\",\"2 tomates\",\"4 feuilles de roquette\",\"2 c. à soupe de pesto\",\"Poivre moulu (0,5 g)\",\"1. Laver les tomates et les couper en rondelles; égoutter la mozzarella et la trancher.\",\"2. Cuire les steaks dans une poêle chaude 3 à 5 minutes par face selon l’épaisseur.\",\"3. Poser la mozzarella sur les steaks pendant la dernière minute de cuisson et couvrir pour la faire fondre légèrement.\",\"4. Réchauffer les pains 2 minutes et étaler un peu de pesto sur chaque base.\",\"5. Assembler avec le steak, les rondelles de tomate et la roquette. Servir sans attendre.\"]},{\"id\":\"cco-tacos-poulet\",\"name\":\"🌮 Tacos maison poulet-poivrons\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"4 grandes tortillas de blé\",\"500 g de poulet en lanières\",\"2 poivrons\",\"1 oignon\",\"100 g de cheddar râpé\",\"4 c. à soupe de yaourt nature\",\"1 c. à café de paprika\",\"1 c. à café de cumin\",\"1 c. à soupe d’huile\",\"Sel et poivre\",\"1. Émincer l’oignon et les poivrons; couper le poulet en lanières régulières.\",\"2. Faire chauffer l’huile dans une grande poêle, ajouter le poulet, le paprika, le cumin, le sel et le poivre, puis cuire 6 à 8 minutes.\",\"3. Ajouter les poivrons et l’oignon et poursuivre 8 à 10 minutes, jusqu’à ce que le poulet soit cuit à cœur et les légumes tendres.\",\"4. Réchauffer les tortillas selon les indications du paquet.\",\"5. Garnir chaque tortilla de poulet et légumes, ajouter le yaourt et le cheddar, puis replier et servir.\"]},{\"id\":\"cco-tacos-boeuf\",\"name\":\"🌮 Tacos maison bœuf épicé\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"4 grandes tortillas de blé\",\"400 g de bœuf haché\",\"1 oignon\",\"1 poivron rouge\",\"200 g de tomates concassées\",\"1 c. à café de cumin\",\"1 c. à café de paprika\",\"100 g de cheddar râpé\",\"1 c. à soupe d’huile\",\"1. Émincer l’oignon et couper le poivron en petits dés.\",\"2. Faire chauffer l’huile dans une poêle et faire revenir l’oignon et le poivron 4 minutes.\",\"3. Ajouter le bœuf haché, le cumin et le paprika; cuire 6 à 8 minutes en émiettant la viande.\",\"4. Ajouter les tomates concassées et laisser réduire 8 minutes à feu moyen. La viande doit être cuite à cœur.\",\"5. Réchauffer les tortillas, répartir la garniture et le cheddar, puis servir.\"]},{\"id\":\"cco-tacos-poisson\",\"name\":\"🌮 Tacos de poisson citron-cumin\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"4 grandes tortillas de blé\",\"500 g de filets de colin ou cabillaud\",\"1 citron\",\"1 c. à café de cumin\",\"1 c. à soupe d’huile d’olive\",\"150 g de chou rouge émincé\",\"1 avocat\",\"100 g de yaourt nature\",\"Sel fin (2 g) et poivre moulu (0,5 g)\",\"1. Préchauffer le four à 200 °C.\",\"2. Déposer le poisson dans un plat, arroser d’huile et de jus de citron, puis assaisonner avec le cumin, le sel et le poivre.\",\"3. Cuire 12 à 15 minutes selon l’épaisseur, jusqu’à ce que le poisson se détache facilement en flocons.\",\"4. Écraser l’avocat et le mélanger au yaourt avec un peu de citron pour obtenir une sauce.\",\"5. Réchauffer les tortillas et garnir de chou rouge, poisson émietté et sauce avocat.\"]},{\"id\":\"cco-tacos-veggie\",\"name\":\"🌮 Tacos végétariens haricots-maïs\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"4 grandes tortillas de blé\",\"1 boîte de haricots rouges (environ 240 g égouttés)\",\"150 g de maïs égoutté\",\"1 poivron rouge\",\"1 oignon\",\"200 g de tomates concassées\",\"1 c. à café de cumin\",\"1 c. à café de paprika\",\"1 c. à soupe d’huile\",\"100 g de cheddar râpé\",\"1. Préparez les ingrédients selon les quantités indiquées, mélangez soigneusement pour répartir les saveurs et vérifiez la texture avant de poursuivre.\",\"2. Émincer l’oignon et couper le poivron en dés.\",\"3. Faire chauffer l’huile et cuire l’oignon et le poivron 5 minutes.\",\"4. Ajouter les haricots, le maïs, les tomates, le cumin et le paprika. Laisser mijoter 12 à 15 minutes en remuant.\",\"5. Réchauffer les tortillas, répartir la garniture et le cheddar, puis servir.\"]}]}]]}]\n13:I[27201,[\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/_next/static/chunks/0hh4zp5mj8k-i.js\"],\"IconMark\"]\ne:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#8FA89B\"}]]\nb:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Pas de panique, on mange quoi ce soir ? 52 semaines de menus, du batchcooking simple et vos listes de courses automatisées.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"6\",{\"rel\":\"icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/icon-192.png\",\"sizes\":\"192x192\",\"type\":\"image/png\"}],[\"$\",\"link\",\"7\",{\"rel\":\"icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/icon-512.png\",\"sizes\":\"512x512\",\"type\":\"image/png\"}],[\"$\",\"link\",\"8\",{\"rel\":\"apple-touch-icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/apple-touch-icon.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L13\",\"9\",{}]]\n"])</script></body></html>
