,\"h1\",null,{\"className\":\"font-heading text-3xl\",\"children\":\"Sauces\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-sm font-normal leading-relaxed text-[#2B2B2B]\",\"children\":\"Le secret des grands chefs est dans la sauce. Des textures onctueuses et des saveurs intenses pour sublimer vos assiettes.\"}]]}],[\"$\",\"$L12\",null,{\"items\":[{\"id\":\"r-6a536a8796\",\"name\":\"🍋 RECETTE SAUCE 001 — Sauce skyr citron\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"280g de Skyr nature (environ 2 petits pots)\",\"1 Le jus de 1/2 citron jaune + le zeste finement râpé\",\"3 branches d'aneth fraîche ou ciboulette ciselée\",\"1 c. à café d'huile d'olive\",\"1 pincée de sel et poivre blanc\",\"1. Dans un bol, battez le skyr à la fourchette pour obtenir une texture bien lisse.\",\"2. Ajoutez le jus de citron pressé ainsi que les zestes fins.\",\"3. Incorporez la cuillère d'huile d'olive, le sel et le poivre blanc.\",\"4. Ajoutez l'aneth ou la ciboulette ciselée et mélangez de nouveau.\",\"5. Laissez reposer au moins 30 minutes au réfrigérateur avant de servir pour infuser les saveurs.\"]},{\"id\":\"r-0aff2c7b56\",\"name\":\"🥕 légumes rôtis\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 35 min\",\"👥 Pour 4 personnes\",\"2 patates douces moyennes (environ 500g)\",\"4 panais ou grosses carottes\",\"1 gros oignon rouge\",\"2 c. à soupe d'huile d'olive\",\"1 c. à café de paprika doux ou curcuma\",\"1 pincée de sel et poivre\",\"1. Préchauffez le four à 200°C. Épluchez les légumes.\",\"2. Coupez les patates douces et les panais en frites épaisses ou cubes réguliers. Taillez l'oignon rouge en gros quartiers.\",\"3. Dans un saladier, enrobez les légumes avec l'huile d'olive, les épices, le sel et le poivre.\",\"4. Étalez-les sur une plaque recouverte de papier sulfurisé en une couche uniforme.\",\"5. Enfournez pour 35 minutes en retournant délicatement à la spatule à mi-cuisson.\"]},{\"id\":\"r-01dfb0c638\",\"name\":\"🥣 1 — SAUCE CITRONNÉE AUX HERBES 🌿\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"200g de fromage blanc (0% ou 3% MG)\",\"3 c. à soupe de jus de citron jaune\",\"1/2 bouquet d'herbes fraîches (ciboulette, persil, menthe)\",\"1 c. à soupe d'huile d'olive\",\"1 pincée de sel et poivre blanc\",\"1. Fouettez le fromage blanc avec le jus de citron et l'huile d'olive dans un bol.\",\"2. Lavez, séchez et ciselez finement votre mélange d'herbes fraîches.\",\"3. Incorporez les herbes à la préparation crémeuse.\",\"4. Salez, poivrez à votre convenance et ajustez l'assaisonnement.\",\"5. Réservez au frais dans un pot hermétique.\"]},{\"id\":\"r-ed136e86f9\",\"name\":\"🥣 2 — SAUCE BLANCHE AUX HERBES FAÇON KEBAB LÉGER 🌯\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"2 pots de yaourt grec authentique (environ 250g)\",\"1 belle gousse d'ail\",\"1 c. à café de menthe séchée (ou fraîche)\",\"1 c. à café de jus de citron\",\"1 pincée de sel et poivre\",\"1. Épluchez la gousse d'ail, retirez le germe vert et réduisez-la en purée à l'aide d'un presse- ail.\",\"2. Détendez le yaourt grec dans un bol en le battant légèrement à la fourchette.\",\"3. Ajoutez l'ail pressé, la menthe, le jus de citron, le sel et le poivre.\",\"4. Mélangez vigoureusement pour répartir les arômes de façon homogène.\",\"5. Laissez reposer au réfrigérateur au moins 1 heure avant de servir afin que l'ail infuse pleinement.\"]},{\"id\":\"r-d810d08dfd\",\"name\":\"🥣 3 — SAUCE CÉSAR LÉGÈRE 🥗\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"150g de fromage blanc ou Skyr\",\"30g de parmesan râpé\",\"1 c. à soupe de jus de citron\",\"1 c. à café de sauce Worcestershire\",\"1 c. à café rase de moutarde de Dijon\",\"1/2 c. à café de pâte d'anchois (ou 1 petit filet écrasé)\",\"1 bonne pincée de poivre noir du moulin\",\"1. Écrasez parfaitement l'anchois avec la moutarde et le jus de citron au fond d'un bol.\",\"2. Ajoutez le fromage blanc (ou le skyr) et la sauce Worcestershire, puis mélangez au fouet.\",\"3. Incorporez le parmesan râpé.\",\"4. Ajoutez un tour généreux de poivre noir. Si la sauce est trop épaisse, détendez-la avec 1 c. à soupe d'eau tiède.\"]},{\"id\":\"r-f057cd27f7\",\"name\":\"🥣 4 — SAUCE MOUTARDE LÉGÈRE 🟡\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"150g de crème fraîche légère 15% MG (ou fromage blanc épais)\",\"2 c. à soupe rases de moutarde de Dijon forte\",\"1 c. à soupe de moutarde à l'ancienne (en grains)\",\"1 c. à café de jus de citron\",\"1 pincée de sel et poivre\",\"1. Déposez les deux moutardes dans un récipient.\",\"2. Ajoutez la crème fraîche légère et mélangez énergiquement jusqu'à obtenir un rendu lisse.\",\"3. Incorporez le jus de citron, la pincée de sel et de poivre.\",\"4. Conservez au frais. (Pour une version chaude, passez la sauce 2 minutes à la casserole à feu très doux avant de servir).\"]},{\"id\":\"r-be34bab262\",\"name\":\"🥣 5 — TZATZIKI LÉGER 🇬🇷\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"1/2 concombre\",\"2 pots de yaourt grec authentique (environ 250g)\",\"1 gousse d'ail pressée\",\"1 c. à soupe d'huile d'olive\",\"1 c. à soupe de jus de citron\",\"6 belles feuilles de menthe fraîche ou d'aneth ciselées\",\"1 c. à café de gros sel (pour faire dégorger), poivre\",\"1. Lavez le concombre et râpez-le grossièrement avec sa peau.\",\"2. Mettez-le dans une passoire avec le gros sel pendant 5 minutes. Pressez-le ensuite très fort dans vos mains pour évacuer toute l'eau.\",\"3. Dans un saladier, assemblez le yaourt grec, l'huile d'olive, le jus de citron et l'ail très finement pressé.\",\"4. Ajoutez le concombre râpé essoré et les herbes ciselées.\",\"5. Poivrez, mélangez bien et laissez reposer au frais 30 minutes avant de servir.\"]},{\"id\":\"r-ed67aa8240\",\"name\":\"🥣 6 — SAUCE BARBECUE LÉGÈRE 🍅\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 5 min\",\"👥 Pour 4 personnes\",\"100g de double concentré de tomates\",\"2 c. à soupe de vinaigre de cidre\",\"1 c. à soupe de sirop d'érable ou de miel\",\"1 c. à soupe de sauce soja (salée)\",\"1 c. à café bombée de paprika fumé\",\"1/2 c. à café d'ail en poudre\",\"4 à 5 c. à soupe d'eau (pour lier)\",\"1. Dans une petite casserole, réunissez le concentré de tomates, le vinaigre, le sirop d'érable, la sauce soja, le paprika fumé et l'ail.\",\"2. Ajoutez l'eau progressivement en fouettant doucement pour assouplir la texture.\",\"3. Portez à petits bouillons à feu très doux pendant 5 minutes sans cesser de remuer.\",\"4. Ajustez la texture avec un filet d'eau si la sauce est trop dense, puis laissez refroidir.\"]},{\"id\":\"r-711331ddec\",\"name\":\"🥣 7 — SAUCE COCKTAIL LÉGÈRE 🦐\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"150g de fromage blanc épais ou Skyr\",\"2 c. à soupe de ketchup (si possible réduit en sucres)\",\"1 c. à café de Cognac ou Porto (optionnel)\",\"3 gouttes de sauce Worcestershire\",\"1 petite pincée de piment de Cayenne ou de paprika, sel, poivre\",\"1. Mélangez le fromage blanc et le ketchup dans un bol jusqu'à obtenir une couleur rosée homogène.\",\"2. Ajoutez la sauce Worcestershire, la pincée de piment ou de paprika.\",\"3. Incorporez la cuillère de Cognac et remuez énergiquement.\",\"4. Ajustez en sel et poivre, puis réservez au frais jusqu'au service.\"]},{\"id\":\"r-e85586d79b\",\"name\":\"🥣 8 — SAUCE BASILIC LÉGÈRE 🇮🇹\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"150 ml de Fromage blanc ou yaourt grec (0% ou classique) : 200 g\",\"Basilic frais : 1 gros bouquet (environ 30g de feuilles)\",\"100 g de Parmesan râpé : 15 g (1 cuillère à soupe bombée)\",\"1 c. à soupe de Huile d'olive : 1 cuillère à soupe\",\"1 gousse d’Ail : 1/2 gousse d'ail dégermée\",\"Sel, poivre : 1 pincée\",\"1. Dans le bol d'un petit mixeur, déposez les feuilles de basilic préalablement lavées et séchées, la demi-gousse d'ail et la cuillère d'huile d'olive. Mixez par à-coups pour obtenir un hachis fin.\",\"2. Ajoutez le fromage blanc (ou yaourt grec) et le parmesan râpé directement dans le mixeur.\",\"3. Mixez à nouveau pendant quelques secondes jusqu'à ce que la sauce prenne une jolie couleur verte et une texture bien lisse.\",\"4. Salez et poivrez à votre convenance.\",\"5. Transférez la sauce dans un bocal hermétique et conservez au frais. Elle se garde 2 à 3 jours au réfrigérateur.\",\"🍝 pâtes saumon\",\"🍕 pizzas maison\",\"🥪 tartines italiennes\"]},{\"id\":\"r-1ff349ef48\",\"name\":\"🥣 9 — SAUCE YAOURT CITRONNÉE MÉDITERRANÉENNE ☀️\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"150 ml de Yaourt nature classique (ou yaourt au lait de brebis) : 2 pots (environ 250g)\",\"1 Citron jaune : Le jus d'un citron entier + les zestes fins\",\"1 c. à soupe de Huile d'olive : 1 cuillère à soupe\",\"Cumin en poudre : 1/2 cuillère à café\",\"Menthe fraîche ou coriandre : 1/2 bouquet ciselé\",\"Sel, poivre : 1 pincée\",\"1. Dans un bol, versez les yaourts et fouettez-les vivement à la fourchette pour rendre la texture fluide.\",\"2. Ajoutez le jus de citron frais et la cuillère d'huile d'olive tout en continuant de mélanger.\",\"3. Incorporez les zestes de citron, le cumin en poudre, le sel et le poivre noir.\",\"4. Ciselez très finement les feuilles de menthe ou de coriandre et ajoutez-les à la préparation.\",\"5. Mélangez bien et réservez au réfrigérateur. Les saveurs de cumin et d'herbes vont s'intensifier après 30 minutes de repos.\",\"🥗 bowls\",\"🍗 poulet grillé\",\"🌯 wraps\"]},{\"id\":\"r-a4f8af9be1\",\"name\":\"🥣 10 — SAUCE CHAMPIGNONS CRÉMEUSE LÉGÈRE 🍄\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 10 min\",\"👥 Pour 4 personnes\",\"2 Champignons de Paris : 250 g (frais)\",\"2 Échalote : 1 belle échalote\",\"1 gousse d’Bouillon de volaille ou de légumes : 100 ml (préparé avec 1/4 de cube)\",\"150 ml de Crème fraîche légère (15% MG) : 150 ml\",\"1 c. à soupe de Huile d'olive : 1 cuillère à café\",\"Sel, poivre blanc : 1 pincée\",\"1. Nettoyez les champignons et émincez-les très finement. Émincez l'échalote.\",\"2. Dans une petite casserole, faites chauffer l'huile d'olive. Faites suer l'échalote pendant 2 minutes, puis ajoutez les champignons. Laissez cuire à feu moyen pendant 5 minutes jusqu'à ce qu'ils aient rendu leur eau.\",\"3. Versez les 100 ml de bouillon chaud sur les champignons. Laissez réduire de moitié à petits bouillons pendant 3 minutes pour concentrer les saveurs.\",\"4. Baissez le feu au minimum, ajoutez la crème fraîche légère, salez et poivrez. Mélangez bien à la spatule en bois.\",\"5. Laissez frémir tout doucement pendant 2 minutes sans faire bouillir, jusqu'à ce que la sauce devienne bien nappante. Servez chaud ou mettez en pot.\",\"🍗 poulet moutarde\",\"🥩 viandes blanches\"]},{\"id\":\"r-b07360fd58\",\"name\":\"🍅 11 — SAUCE TOMATE PROVENÇALE MAISON ☀️\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"2 Tomates pelées concassées (en conserve) : 1 grande boîte (800g)\",\"2 Oignon jaune : 1 oignon\",\"1 gousse d’Ail : 2 gousses\",\"1 c. à soupe de Huile d'olive : 1 cuillère à soupe\",\"Herbes de Provence : 1 cuillère à soupe rase\",\"100 g de Sucre blanc : 1/2 cuillère à café\",\"Sel, poivre : 1 pincée\",\"1. Épluchez et émincez finement l'oignon. Hachez les gousses d'ail.\",\"2. Dans une casserole, faites chauffer l'huile d'olive à feu moyen. Ajoutez l'oignon émincé et faites-le revenir pendant 3 à 4 minutes jusqu'à ce qu'il devienne translucide. Ajoutez l'ail haché et poursuivez la cuisson 1 minute.\",\"3. Versez la boîte de tomates concassées dans la casserole. Remuez bien.\",\"4. Ajoutez les herbes de Provence, le sel, le poivre et la demi-cuillère de sucre pour adoucir la sauce.\",\"5. Baissez le feu, couvrez partiellement et laissez mijoter doucement pendant 15 à 20 minutes en remuant de temps en temps. La sauce doit s'épaissir.\",\"🐟 Cabillaud façon provençale\",\"🍝 Pâtes bolognaise\",\"🍕 Pizza maison\",\"🥘 Paëlla\"]},{\"id\":\"r-8cfb8fe28b\",\"name\":\"🍅 12 — COULIS TOMATE PIZZA LÉGER 🍕\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 10 min\",\"👥 Pour 4 personnes\",\"150 ml de Purée de tomates (Passata) : 400 g\",\"2 Concentré de tomates : 1 cuillère à soupe\",\"Origan séché : 1 cuillère à café bombée\",\"1 gousse d’Ail en poudre : 1/2 cuillère à café\",\"1 c. à soupe de Huile d'olive : 1 cuillère à café\",\"Sel, poivre : 1 pincée\",\"1. Dans une petite casserole, versez la passata et la cuillère de concentré de tomates.\",\"2. Ajoutez l'origan séché, l'ail en poudre, le sel et le poivre. Mélangez vigoureusement.\",\"3. Ajoutez la cuillère d'huile d'olive.\",\"4. Faites chauffer la casserole à feu doux pendant 8 à 10 minutes à découvert. Cette étape permet d'évaporer l'excès d'eau pour obtenir un coulis très concentré.\",\"5. Laissez refroidir impérativement avant de l'étaler sur votre pâte fine ou de la stocker.\"]},{\"id\":\"r-597a60e2de\",\"name\":\"🥣 13 — BÉCHAMEL LÉGÈRE AU FROMAGE BLANC 🤍\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 2 minutes\",\"👥 Pour 4 personnes\",\"150 ml de Fromage blanc (0% ou 3% MG, épais) : 300 g\",\"1 Œuf : 1 œuf entier\",\"1 Fécule de maïs (Maïzena) : 1 cuillère à soupe bombée\",\"150 ml de Lait demi-écrémé : 3 cuillères à soupe\",\"100 g de Noix de muscade râpée : 1 belle pincée\",\"Sel, poivre blanc : 1 pincée de chaque\",\"1. Dans une petite casserole à froid, délayez la cuillère de fécule de maïs avec les 3 cuillères à soupe de lait froid pour éviter tout grumeau.\",\"2. Mettez la casserole sur feu doux et remuez sans vous arrêter pendant 1 à 2 minutes jusqu'à ce que le mélange s'épaississe de manière compacte. Retirez du feu.\",\"3. Hors du feu, ajoutez le fromage blanc et l'œuf entier. Fouettez énergiquement pour lier l'ensemble.\",\"4. Ajoutez le sel, le poivre blanc et une dose généreuse de noix de muscade râpée.\",\"5. Votre fausse béchamel est prête. Utilisez-la directement pour monter vos gratins ou vos lasagnes avant d'enfourner.\",\"🍝 Lasagnes courgettes saumon\",\"🥒 Gratin léger de légumes\"]},{\"id\":\"r-e692c705a1\",\"name\":\"🍄 14 — SAUCE CHAMPIGNONS CRÉMEUSE LÉGÈRE\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"2 Champignons : 500 g\",\"2 Échalote : 1\",\"150 ml de Bouillon : 150 ml\",\"150 ml de Fromage blanc : 150 g\",\"Persil frais (5 g)\",\"1 gousse d’Ail\",\"Poivre moulu (0,5 g)\",\"1 gousse d’Échalote + ail\",\"1. Préparez les ingrédients pour 4 personnes : lavez et épluchez les légumes, coupez-les régulièrement, pesez les quantités et égouttez les conserves.\",\"2. Faites revenir les ingrédients à cuire dans une poêle ou casserole avec l’huile prévue pendant 4 à 6 minutes.\",\"3. Ajoutez les autres ingrédients dans l’ordre de cuisson et poursuivez 10 à 15 minutes à feu moyen-doux, en remuant.\",\"4. Vérifiez la cuisson, ajoutez les herbes ou la sauce prévues, rectifiez l’assaisonnement et servez en quatre portions.\"]},{\"id\":\"r-23de17a7d0\",\"name\":\"🍛 15 — SAUCE TIKKA MASALA LÉGÈRE 🇮🇳\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"150 ml de Purée de tomates (Passata) : 400 g\",\"150 ml de Fromage blanc (épais) ou Yaourt grec : 150 g\",\"2 Oignon jaune : 1 oignon émincé\",\"1 gousse d’Ail et Gingembre frais : 1 gousse d'ail et 2 cm de gingembre hachés\",\"1 Mélange d'épices Garam Masala : 1 cuillère à soupe bombée\",\"Paprika doux : 1 cuillère à café\",\"1 c. à soupe de Huile d'olive : 1 cuillère à soupe\",\"Sel, poivre : 1 pincée\",\"1. Dans une sauteuse, faites chauffer l'huile d'olive à feu moyen. Faites revenir l'oignon émincé pendant 3 minutes. Ajoutez l'ail et le gingembre hachés, puis laissez cuire 1 minute de plus.\",\"2. Saupoudrez le Garam Masala et le paprika sur les oignons. Remuez bien à sec pendant 30 secondes pour réveiller les épices.\",\"3. Versez la passata de tomate, salez et poivrez. Baissez le feu, couvrez et laissez mijoter doucement pendant 10 minutes.\",\"4. Retirez la sauteuse du feu. Laissez tiédir une minute, puis incorporez le fromage blanc en remuant délicatement pour obtenir une sauce onctueuse.\"]},{\"id\":\"r-e91edd3409\",\"name\":\"🍲 16 — SAUCE TAJINE MAROCAINE 🌍\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"150 ml de Bouillon de légumes : 300 ml (préparé avec 1/2 cube)\",\"2 Oignon jaune : 1 gros oignon émincé\",\"1 gousse d’Ail : 2 gousses hachées\",\"1 Miel : 1 cuillère à soupe\",\"Épices à Tajine (Ras el Hanout) : 1 cuillère à soupe rase\",\"Coriandre fraîche : 1/2 bouquet ciselé\",\"1 c. à soupe de Huile d'olive : 1 cuillère à soupe\",\"Sel, poivre : 1 pincée\",\"1. Dans une casserole, faites chauffer l'huile d'olive. Ajoutez l'oignon émincé et l'ail haché. Faites-les suer à feu doux pendant 5 minutes.\",\"2. Ajoutez la cuillère de miel et les épices Ras el Hanout. Mélangez bien avec les oignons pendant 1 minute à feu moyen.\",\"3. Versez le bouillon de légumes chaud dans la casserole. Salez légèrement et poivrez.\",\"4. Laissez mijoter à découvert et à petits bouillons pendant 15 minutes jusqu'à ce que la sauce réduise et s'épaississe.\",\"5. Hors du feu, ajoutez la coriandre fraîche finement ciselée. Remuez et mettez en boîte.\",\"🍗 Tajine poulet légumes\",\"🐟 Tajine poisson\"]},{\"id\":\"r-a699ffc3fe\",\"name\":\"🍛 17 — SAUCE CURRY DOUX LÉGÈRE 🌿\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 5 min\",\"👥 Pour 4 personnes\",\"150 ml de Crème fraîche légère (15% MG) : 200 ml\",\"Curry en poudre doux : 1 cuillère à soupe rase\",\"1 gousse d’Ail en poudre : 1/2 cuillère à café\",\"1 Fécule de maïs (Maïzena) : 1 cuillère à café rase\",\"1 Eau froide : 2 cuillères à soupe\",\"Sel, poivre : 1 pincée\",\"1. Dans une petite casserole à froid, délayez la cuillère de fécule de maïs avec les 2 cuillères à soupe d'eau froide.\",\"2. Ajoutez la crème fraîche légère, la poudre de curry doux et l'ail en poudre. Mélangez bien au fouet.\",\"3. Placez la casserole sur feu moyen. Remuez constamment à l'aide d'une spatule en bois.\",\"4. Dès que la sauce commence à frémir, baissez le feu au minimum, salez, poivrez et laissez cuire encore 1 minute sans cesser de remuer.\",\"5. Retirez du feu et laissez refroidir avant stockage.\",\"🐟 poissons\",\"🍗 poulet\",\"🥦 légumes vapeur\"]},{\"id\":\"r-c10747f72a\",\"name\":\"🍝 18 — SAUCE BOLOGNAISE LÉGÈRE 🍅\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"400 g de Viande de bœuf hachée (5% MG) : 400 g\",\"2 Tomates pelées concassées (en conserve) : 1 grande boîte (800g)\",\"2 Carotte : 1 carotte coupée en tout petits dés (brunoise)\",\"2 Oignon : 1 oignon émincé\",\"1 gousse d’Ail : 2 gousses hachées\",\"1 c. à soupe de Huile d'olive : 1 cuillère à soupe\",\"Origan ou Basilic séché : 1 cuillère à soupe\",\"Sel, poivre : À votre convenance\",\"1. Dans une grande sauteuse, faites chauffer l'huile d'olive. Ajoutez l'oignon émincé et les petits dés de carotte. Faites revenir à feu moyen pendant 5 à 7 minutes. Ajoutez l'ail à la fin.\",\"2. Ajoutez la viande de bœuf hachée. Augmentez le feu et détachez bien la viande à l'aide d'une spatule en bois. Faites-la cuire environ 5 minutes.\",\"3. Versez la boîte de tomates concassées par-dessus le mélange viande/légumes. Remuez bien.\",\"4. Ajoutez l'origan séché, le sel et le poivre noir du moulin.\",\"5. Bainte le feu au minimum, couvrez partiellement et laissez mijoter doucement pendant au moins 20 à 30 minutes jusqu'à ce que la sauce devienne dense.\"]},{\"id\":\"r-8f0b77a830\",\"name\":\"🧀 19 — SAUCE CARBONARA LÉGÈRE 🤍\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 5 min\",\"👥 Pour 4 personnes\",\"1 Jaunes d'œufs frais : 3 jaunes d'œufs\",\"100 g de Parmesan râpé (ou Pecorino) : 40 g\",\"150 ml de Crème fraîche légère (15% MG) : 3 cuillères à soupe rases\",\"1 gousse d’Allumettes de bacon ou de volaille fumée : 150 g\",\"Poivre noir du moulin : 1 bonne pincée\",\"1. Dans une poêle bien chaude et sans ajout de matière grasse, faites griller les allumettes de bacon pendant 4 à 5 minutes. Déposez-les sur du papier absorbant.\",\"2. Dans un grand bol, mélangez énergiquement les 3 jaunes d'œufs avec le parmesan râpé et les 3 cuillères de crème légère.\",\"3. Ajoutez une quantité généreuse de poivre noir moulu dans le bol.\",\"4. Astuce batch cooking : stockez séparément le bacon grillé d'un côté, et l'appareil aux œufs/ parmesan au réfrigérateur (consommer sous 48h maximum).\",\"5. Au moment du repas, mélangez les pâtes égouttées très chaudes directement dans le bol avec l'appareil, le bacon et 2 cuillères à soupe d'eau de cuisson des pâtes.\"]},{\"id\":\"r-5d0275bd29\",\"name\":\"🍋 20 — SAUCE BLANQUETTE LÉGÈRE\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 10 min\",\"👥 Pour 4 personnes\",\"250 ml de bouillon de volaille ou de légumes (préparé avec 1/2 cube)\",\"1 cuillère à soupe bombée de fécule de maïs (Maïzena)\",\"4 cuillerées à soupe de crème fraîche légère (15 % MG)\",\"1 jaune d’œuf\",\"1 cuillère à soupe de jus de citron\",\"100 g de champignons de Paris (en boîte ou frais, émincés)\",\"1 pincée de sel\",\"1 pincée de poivre\",\"1 pincée de noix de muscade\",\"1. À froid, délayez la fécule de maïs dans le bouillon à l'aide d'un fouet.\",\"2. Placez la casserole sur feu doux et portez à petite ébullition sans cesser de remuer. Laissez épaissir 2 à 3 minutes.\",\"3. Dans un récipient à part, mélangez la crème fraîche, le jaune d'œuf et le jus de citron.\",\"4. Baissez le feu au minimum. Versez doucement cette liaison dans la sauce en fouettant. Maintenez à feu doux sans faire bouillir.\",\"5. Ajoutez les champignons, le sel, le poivre et la muscade. Réchauffez 2 minutes à feu très doux avant de stocker ou d'incorporer à vos plats.\",\"Temps total : 20 min.\"]},{\"id\":\"r-0f052d9c9b\",\"name\":\"🌯 21 — SAUCE WRAP POULET MÉDITERRANÉENNE ☀️\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"250 g de yaourt grec (ou fromage blanc épais)\",\"4 pétales de tomates séchées, égouttés et hachés finement\",\"1/2 cuillère à café d’ail en poudre\",\"1 cuillère à café d’origan séché\",\"1 cuillère à café de jus de citron\",\"1 pincée de sel\",\"1 pincée de poivre\",\"1. Hachez finement les pétales de tomates séchées.\",\"2. Dans un bol, déposez le yaourt grec et battez-le légèrement à la fourchette pour le rendre crémeux.\",\"3. Incorporez l'ail en poudre, l'origan, le jus de citron, le sel et le poivre.\",\"4. Ajoutez les tomates séchées hachées et remuez pour répartir uniformément les ingrédients.\",\"5. Transférez la sauce dans un pot hermétique et placez-la au réfrigérateur pour laisser diffuser les saveurs.\",\"Temps total : 5 min.\"]},{\"id\":\"r-66e7b3d12b\",\"name\":\"🌯 22 — SAUCE WRAP MEXICAINE ÉPICÉE 🌶️\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"100 g de purée de tomates (passata)\",\"100 g de fromage blanc (ou yaourt nature épais)\",\"1 cuillère à café bombée de mélange d’épices mexicaines (ou épices à chili)\",\"1 pincée de piment de Cayenne (à ajuster selon la sensibilité)\",\"1/4 de poivron rouge, coupé en très petits dés\",\"1 pincée de sel\",\"1 pincée de poivre\",\"1. Nettoyez le quart de poivron rouge et taillez-le en tout petits dés.\",\"2. Dans un récipient, mélangez la passata de tomate et le fromage blanc jusqu'à obtenir une couleur rosée homogène.\",\"3. Incorporez les épices mexicaines, le piment de Cayenne, le sel et le poivre.\",\"4. Ajoutez les dés de poivron rouge frais.\",\"5. Transférez la sauce dans un pot hermétique et réservez au frais jusqu'au montage des wraps.\",\"Temps total : 5 min.\"]},{\"id\":\"r-3377862991\",\"name\":\"🌯 23 — SAUCE WRAP SAUMON CITRON-ANETH 🐟\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"250 g de skyr nature (ou fromage blanc ferme)\",\"1/2 bouquet d’aneth fraîche, ciselée finement\",\"1/2 citron jaune : jus et zestes fins\",\"1/2 cuillère à café de baies roses (ou poivre blanc du moulin)\",\"1 pincée de sel fin\",\"1. Lavez et séchez soigneusement l'aneth, puis ciselez finement les pluches.\",\"2. Dans un bol, fouettez le skyr avec le jus de citron et les zestes fins.\",\"3. Écrasez légèrement les baies roses entre vos doigts et ajoutez-les avec le sel.\",\"4. Incorporez l'aneth ciselée et remuez délicatement.\",\"5. Conservez au frais. Étalez sur les tortillas avant d'y disposer les lanières de saumon.\",\"Temps total : 5 min.\"]},{\"id\":\"r-b0d7f88c40\",\"name\":\"🌯 24 — SAUCE BURGER LÉGÈRE 🍔\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"150 g de fromage blanc épais (type Fjord ou skyr)\",\"2 cuillères à soupe de ketchup (de préférence réduit en sucres)\",\"1 cuillère à café rase de moutarde douce\",\"2 cornichons, hachés finement\",\"1 cuillère à café de vinaigre de cornichon\",\"1 pincée de paprika doux\",\"1 pincée d’ail en poudre\",\"1. Émincez puis hachez très finement les cornichons.\",\"2. Dans un bol, mélangez le fromage blanc, le ketchup et la moutarde douce.\",\"3. Incorporez le vinaigre de cornichon.\",\"4. Ajoutez le paprika doux, l'ail en poudre et les cornichons hachés.\",\"5. Remuez jusqu'à obtenir une préparation homogène et réservez au frais dans un récipient étanche.\",\"Temps total : 5 min.\"]},{\"id\":\"r-ffab58c92c\",\"name\":\"🍔 25 — SAUCE BURGER FAÇON BIG MAC LÉGÈRE 😋\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"150 g de fromage blanc (ou yaourt grec épais)\",\"1 cuillère à soupe bombée de moutarde jaune douce\",\"1 cuillère à soupe de relish de cornichons (ou 2 cornichons aigres-doux hachés et 1 pincée de sucre roux)\",\"1 cuillère à café de vinaigre blanc\",\"1/2 cuillère à café de paprika doux\",\"1/2 cuillère à café d’oignon en poudre\",\"1/2 cuillère à café d’ail en poudre\",\"1 pincée de sel\",\"1. Au fond d'un bol, mélangez l'oignon en poudre, l'ail en poudre, le paprika et le sel.\",\"2. Versez le vinaigre blanc et la moutarde jaune sur les épices. Mélangez pour former une pâte lisse.\",\"3. Incorporez le fromage blanc (ou le yaourt grec) et la relish, ou les cornichons hachés avec le sucre.\",\"4. Battez vigoureusement à la fourchette jusqu'à ce que la sauce soit homogène et de couleur ocre orangée.\",\"5. Laissez reposer au réfrigérateur au moins 2 heures avant de servir.\",\"Temps total : 5 min.\"]},{\"id\":\"r-0a4deb6e49\",\"name\":\"🥗 26 — SAUCE SALADE MOUTARDE \u0026 MIEL LÉGÈRE 🍯\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"1 cuillère à soupe bombée de moutarde de Dijon (ou moutarde à l’ancienne)\",\"1 cuillère à soupe de miel liquide\",\"3 cuillères à soupe de vinaigre de cidre\",\"2 cuillères à soupe d’huile d’olive\",\"2 cuillères à soupe d’eau tiède\",\"1 pincée de sel fin\",\"1 pincée de poivre\",\"1. Dans un bol, mélangez énergiquement la moutarde et le miel.\",\"2. Versez le vinaigre de cidre, ajoutez le sel et le poivre, puis mélangez au fouet.\",\"3. Ajoutez l'huile d'olive en filet mince sans cesser de fouetter.\",\"4. Incorporez l'eau tiède pour assouplir la vinaigrette.\",\"5. Versez dans un bocal propre pour la semaine.\",\"Temps total : 5 min.\"]},{\"id\":\"r-81a47c2b6e\",\"name\":\"🥗 27 — SAUCE NIÇOISE LÉGÈRE 🌊\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"4 cuillères à soupe d’huile d’olive\",\"2 cuillères à soupe de vinaigre de vin rouge\",\"2 petits filets d’anchois à l’huile, égouttés\",\"1/2 gousse d’ail\",\"5 à 6 feuilles de basilic frais\",\"1 pincée de poivre noir (pas de sel nécessaire)\",\"1. Sur une planche, écrasez finement les filets d'anchois à la fourchette.\",\"2. Dans un petit bol, mélangez la purée d'anchois avec la demi-gousse d'ail pressée et le poivre noir.\",\"3. Versez le vinaigre de vin rouge et amalgamez le mélange à la fourchette.\",\"4. Incorporez l'huile d'olive en mélangeant énergiquement pour émulsionner légèrement la vinaigrette.\",\"5. Ajoutez le basilic frais finement ciselé juste avant de fermer le bocal.\",\"Temps total : 5 min.\"]},{\"id\":\"r-f3c93751c3\",\"name\":\"🥗 28 — SAUCE ARTICHAUTS \u0026 CRUDITÉS 🌿\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"4 cœurs d’artichauts en boîte au naturel, bien égouttés (environ 150 g)\",\"100 g de fromage blanc ou de skyr\",\"1 cuillère à soupe de jus de citron\",\"1 cuillère à café d’huile d’olive\",\"1/2 cuillère à café de moutarde douce\",\"1 pincée de sel fin\",\"1 pincée de poivre blanc\",\"1. Égouttez soigneusement les cœurs d'artichauts et pressez-les délicatement dans du papier absorbant.\",\"2. Déposez les cœurs d'artichauts dans un mixeur avec le jus de citron et l'huile d'olive. Mixez jusqu'à obtenir une purée fine.\",\"3. Ajoutez le fromage blanc (ou le skyr) et la moutarde douce.\",\"4. Complétez avec le sel et le poivre blanc.\",\"5. Mixez à nouveau 10 à 15 secondes jusqu'à obtenir une crème lisse, à servir en dip avec des crudités.\",\"Temps total : 5 min.\"]},{\"id\":\"r-0f5bc800ca\",\"name\":\"🐟 29 — SAUCE TARTARE LÉGÈRE\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"200 g de fromage blanc épais (type Fjord ou yaourt grec)\",\"3 petits cornichons, hachés\",\"1 cuillère à soupe rase de câpres au vinaigre, hachées\",\"1/2 petite échalote, ciselée finement\",\"3 branches d’estragon frais (ou persil ciselé)\",\"1 pincée de sel fin\",\"1 pincée de poivre du moulin\",\"1. Hachez finement les cornichons, les câpres et la demi-échalote.\",\"2. Effeuillez et ciselez finement l'estragon frais ou le persil.\",\"3. Dans un bol, versez le fromage blanc et incorporez les condiments hachés ainsi que les herbes.\",\"4. Ajoutez le sel et un tour généreux de poivre noir du moulin.\",\"5. Mélangez à la cuillère et réservez au réfrigérateur. Servez frais avec du poisson ou des terrines marines.\",\"Temps total : 5 min.\"]},{\"id\":\"r-5e0d4a15ca\",\"name\":\"🐟 30 — SAUCE AIL \u0026 FINES HERBES 🧄\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"250 g de fromage blanc pressé (ou fromage de chèvre frais ou tartinable léger)\",\"1 petite gousse d’ail dégermée\",\"4 cuillères à soupe bombées de fines herbes fraîches (ciboulette, persil, estragon)\",\"1/2 cuillère à café de jus de citron\",\"1 pincée de sel fin\",\"1 pincée de poivre blanc\",\"1. Dans un bol, travaillez le fromage frais à la fourchette pour l'assouplir.\",\"2. Pressez la gousse d'ail dégermée au-dessus du bol et ajoutez le jus de citron.\",\"3. Lavez, séchez soigneusement et ciselez les fines herbes. Ajoutez-les à la préparation.\",\"4. Salez et poivrez.\",\"5. Mélangez à la cuillère et placez au réfrigérateur au moins 1 heure pour laisser diffuser le parfum de l'ail.\",\"Temps total : 5 min.\"]},{\"id\":\"r-f505361e63\",\"name\":\"🥑 31 — SAUCE AVOCAT CITRONNÉE 🥑\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"1 bel avocat bien mûr\",\"100 g de fromage blanc (ou yaourt nature)\",\"1 citron vert ou jaune : jus entier\",\"4 à 5 branches de coriandre fraîche (ou persil)\",\"1 pincée de sel fin\",\"1 pincée de piment d’Espelette\",\"1. Fendez l'avocat en deux, ôtez le noyau et prélevez toute la chair à l'aide d'une cuillère.\",\"2. Placez immédiatement la chair dans le bol du mixeur et arrosez-la de jus de citron.\",\"3. Ajoutez le fromage blanc et les feuilles de coriandre préalablement rincées.\",\"4. Relevez avec le sel et le piment d'Espelette.\",\"5. Mixez à pleine puissance 30 à 45 secondes jusqu'à obtenir une crème lisse. Conservez dans un bocal fermé.\",\"Temps total : 5 min.\"]},{\"id\":\"r-7404843379\",\"name\":\"🌿 32 — SAUCE PESTO LÉGER AU BASILIC 🇮🇹\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"2 gros bouquets de basilic frais (environ 60 g de feuilles)\",\"30 g de parmesan râpé\",\"15 g de pignons de pin (1 cuillère à soupe)\",\"2 cuillères à soupe d’huile d’olive\",\"2 à 3 cuillères à soupe d’eau froide\",\"1 gousse d’ail dégermée\",\"1 pincée de sel\",\"1 pincée de poivre\",\"1. Dans une poêle à sec, faites dorer les pignons 2 minutes à feu moyen en remuant souvent. Laissez-les refroidir.\",\"2. Dans le bol d'un petit mixeur, déposez les feuilles de basilic lavées et séchées, l'ail, les pignons refroidis et l'huile d'olive.\",\"3. Ajoutez le parmesan râpé, le sel, le poivre et 2 cuillères à soupe d'eau froide.\",\"4. Mixez par impulsions jusqu'à obtenir une texture finement granuleuse et homogène. Si le pesto est trop compact, ajoutez la dernière cuillère d'eau.\",\"5. Transférez dans un bocal et recouvrez d'un mince filet d'huile d'olive pour limiter l'oxydation au réfrigérateur.\",\"Temps total : 5 min.\"]},{\"id\":\"r-d34e4eb000\",\"name\":\"🧄 33 — SAUCE FROMAGE BLANC FAÇON RANCH 🇺🇸\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"200 g de fromage blanc épais ou de skyr\",\"2 cuillères à soupe de crème fraîche légère (15 % MG)\",\"1 cuillère à café de jus de citron\",\"1/2 cuillère à café d’ail en poudre\",\"1/2 cuillère à café d’oignon en poudre\",\"1 cuillère à soupe de ciboulette, persil et aneth ciselés\",\"1 pincée de sel\",\"1 pincée de poivre noir\",\"1. Dans un bol, mélangez le fromage blanc, la crème fraîche et le jus de citron jusqu'à obtenir une préparation lisse.\",\"2. Incorporez l'ail en poudre, l'oignon en poudre, le sel et le poivre.\",\"3. Ajoutez la ciboulette, le persil et l'aneth finement ciselés.\",\"4. Mélangez vigoureusement à la fourchette pour répartir les herbes et les épices.\",\"5. Conservez au frais dans un pot hermétique et laissez reposer au moins 30 minutes avant de servir.\",\"Temps total : 5 min.\"]},{\"id\":\"r-85d0dcbaa2\",\"name\":\"🍋 34 — SAUCE CITRONNÉE AVEC ÉCHALOTE\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"1 belle échalote, ciselée très finement\",\"1 Le jus d’un citron jaune entier\",\"3 cuillères à soupe d’huile de colza ou d’olive\",\"1 cuillère à soupe d’eau tiède\",\"1/2 cuillère à café de moutarde de Dijon\",\"1 pincée de sel\",\"1 pincée de poivre\",\"1. Épluchez et coupez l'échalote en dés très fins.\",\"2. Dans un bol, versez le jus de citron sur l'échalote avec le sel. Laissez reposer 2 minutes.\",\"3. Ajoutez la moutarde de Dijon et le poivre. Mélangez.\",\"4. Versez l'huile en filet tout en remuant à la fourchette.\",\"5. Ajoutez l'eau tiède pour lier la sauce, puis versez dans un flacon hermétique.\",\"Temps total : 5 min.\",\"Mixer échalote\",\"➡️ 5 sec vitesse 6\",\"Ajouter reste\",\"➡️ 15 sec vitesse 3\"]},{\"id\":\"r-89cac3eec0\",\"name\":\"🍅 35 — BASE TOMATE À TOUT FAIRE (BATCH COOKING)\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"2 grandes boîtes de tomates pelées concassées (environ 1,6 kg)\",\"2 oignons jaunes, émincés\",\"3 gousses d’ail, pressées\",\"1 cuillère à soupe d’huile d’olive\",\"1 cuillère à café rase de sucre blanc\",\"2 pincées de sel\",\"2 pincées de poivre\",\"1. Dans une grande marmite, faites chauffer l'huile d'olive. Ajoutez les oignons et faites-les suer 5 minutes à feu moyen.\",\"2. Ajoutez l'ail pressé et laissez cuire 1 minute sans le laisser colorer.\",\"3. Versez les tomates concassées. Ajoutez le sel, le poivre et le sucre.\",\"4. Portez à ébullition, puis baissez le feu. Laissez mijoter à découvert 20 minutes en remuant régulièrement.\",\"5. Mixez grossièrement ou finement selon la texture désirée. Laissez refroidir, puis répartissez en bocaux ou portions.\",\"Temps total : 35 min.\",\"Pour le batch cooking : réfrigérez au plus tard 2 heures après cuisson, gardez à 4 °C au plus et consommez sous 3 jours. Congelez rapidement les portions prévues pour plus tard.\"]},{\"id\":\"r-89c1a2bc15\",\"name\":\"🥕 36 — SAUCE LÉGUMES RÔTIS MIXÉS ☀️\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"1 poivron rouge, épépiné et coupé en morceaux\",\"1 petite courgette, en rondelles\",\"3 tomates, coupées en quartiers\",\"1 oignon rouge, en quartiers\",\"1 cuillère à soupe d’huile d’olive\",\"100 ml de bouillon de légumes\",\"1 pincée de sel\",\"1 pincée de poivre\",\"1 pincée d’herbes de Provence\",\"1. Préchauffez le four à 200 °C. Sur une plaque recouverte de papier cuisson, étalez les morceaux de légumes.\",\"2. Arrosez d'huile d'olive, saupoudrez d'herbes de Provence, de sel et de poivre. Mélangez.\",\"3. Enfournez 30 minutes, jusqu'à ce que les légumes soient tendres et légèrement roussis sur les bords.\",\"4. Transférez les légumes rôtis chauds dans un blender ou un récipient adapté au mixeur plongeant. Ajoutez le bouillon de légumes chaud.\",\"5. Mixez environ 1 minute jusqu'à obtenir une sauce lisse. Ajustez l'assaisonnement si nécessaire.\",\"Temps total : 45 min.\",\"Pour le batch cooking : réfrigérez au plus tard 2 heures après cuisson, gardez à 4 °C au plus et consommez sous 3 jours. Congelez rapidement les portions prévues pour plus tard.\"]},{\"id\":\"r-4356461b3b\",\"name\":\"🍄 37 — SAUCE CHAMPIGNONS BATCH\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 12 min\",\"👥 Pour 4 personnes\",\"600 g de champignons de Paris blancs ou bruns\",\"2 oignons, émincés\",\"1 cuillère à soupe de jus de citron\",\"1 cuillère à soupe d’huile d’olive\",\"1 pincée de sel\",\"1 pincée de poivre\",\"1. Nettoyez les champignons et coupez-les en lamelles régulières. Arrosez-les immédiatement avec le jus de citron.\",\"2. Dans une large poêle, faites chauffer l'huile d'olive et faites dorer les oignons 3 minutes.\",\"3. Ajoutez les champignons à feu vif. Laissez-les rendre leur eau en remuant constamment, environ 5 à 7 minutes.\",\"4. Quand l'eau est évaporée et que les champignons commencent à dorer, salez et poivrez.\",\"5. Laissez refroidir rapidement et répartissez dans un récipient hermétique. Pour une conservation plus longue, congelez des portions.\",\"Temps total : 22 min.\",\"Pour le batch cooking : réfrigérez au plus tard 2 heures après cuisson, gardez à 4 °C au plus et consommez sous 3 jours. Congelez rapidement les portions prévues pour plus tard.\"]},{\"id\":\"r-42d55c2112\",\"name\":\"🥣 38 — POT DE SAUCE BLANCHE AUX HERBES (1 SEMAINE)\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"400 g de fromage blanc (0 % ou classique)\",\"150 g de yaourt grec nature\",\"2 cuillères à soupe de jus de citron jaune\",\"1 bouquet complet d’herbes fraîches (ciboulette, persil, menthe), lavées et séchées\",\"1 gousse d’ail réduite en purée\",\"1 belle pincée de sel\",\"1 pincée de poivre blanc\",\"1. Après avoir lavé les herbes, essorez-les soigneusement et ciselez-les finement.\",\"2. Dans un grand saladier, fouettez le fromage blanc et le yaourt grec pour homogénéiser la texture.\",\"3. Ajoutez le jus de citron, la purée d'ail, le sel et le poivre blanc.\",\"4. Incorporez les herbes ciselées et mélangez délicatement à la spatule.\",\"5. Transférez dans un bocal propre et hermétique. Conservez au réfrigérateur et consommez dans les 3 jours.\",\"Temps total : 10 min.\",\"Pour le batch cooking : réfrigérez au plus tard 2 heures après cuisson, gardez à 4 °C au plus et consommez sous 3 jours. Congelez rapidement les portions prévues pour plus tard.\"]},{\"id\":\"r-a2385c8974\",\"name\":\"🍋 39 — SAUCE CITRON ANETH GRAND FORMAT 🐟\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"400 g de skyr ou de fromage blanc épais\",\"1 bouquet complet d’aneth fraîche, ciselée\",\"1 Le jus d’un gros citron jaune et les zestes fins de la moitié\",\"1 cuillère à soupe d’huile d’olive\",\"1 pincée de poivre blanc ou de baies roses\",\"1 pincée de sel\",\"1. Prélevez les zestes fins du citron lavé, puis pressez-le pour en récolter le jus.\",\"2. Dans un grand récipient, mélangez le skyr avec le jus de citron, les zestes et l'huile d'olive.\",\"3. Ciselez finement l'aneth et ajoutez-la au mélange.\",\"4. Salez et poivrez selon votre goût.\",\"5. Mettez en pot hermétique et réservez au réfrigérateur. La sauce gagne en saveur après quelques heures.\",\"Temps total : 5 min.\",\"Pour le batch cooking : réfrigérez au plus tard 2 heures après cuisson, gardez à 4 °C au plus et consommez sous 3 jours. Congelez rapidement les portions prévues pour plus tard.\"]},{\"id\":\"r-6116939142\",\"name\":\"🌶️ 40 — SAUCE TEX-MEX BATCH 🌮\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 10 min\",\"👥 Pour 4 personnes\",\"500 g de purée de tomates (passata)\",\"1 cuillère à soupe bombée de mélange d’épices Tex-Mex (cumin, paprika, origan, piment)\",\"1 cuillère à café d’oignon en poudre\",\"1 cuillère à soupe de vinaigre de cidre\",\"1/2 cuillère à café de sel\",\"1. Dans une casserole, versez la passata de tomate et le vinaigre de cidre.\",\"2. Ajoutez le mélange Tex-Mex, l'oignon en poudre et le sel. Fouettez bien.\",\"3. Portez à frémissement à feu doux et laissez réduire à découvert 10 minutes.\",\"4. Retirez du feu et laissez refroidir.\",\"5. Versez dans un bocal propre et réservez au frais pour vos repas mexicains.\",\"Temps total : 15 min.\",\"Pour le batch cooking : réfrigérez au plus tard 2 heures après cuisson, gardez à 4 °C au plus et consommez sous 3 jours. Congelez rapidement les portions prévues pour plus tard.\"]},{\"id\":\"r-a46551cd3f\",\"name\":\"🍔 41 — SAUCE PLAISIR BURGER MAISON\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"150 g de yaourt grec nature\",\"1 cuillère à soupe de mayonnaise allégée\",\"1 cuillère à soupe bombée de ketchup réduit en sucres\",\"2 cornichons aigres-doux, finement hachés\",\"1/2 cuillère à café de paprika doux\",\"1 pincée de sel\",\"1 pincée de poivre\",\"1. Émincez les cornichons aigres-doux en très petits morceaux.\",\"2. Dans un bol, mélangez le yaourt grec et la mayonnaise allégée.\",\"3. Ajoutez le ketchup et le paprika doux. Mélangez jusqu'à obtenir une teinte saumonée.\",\"4. Incorporez les cornichons hachés, salez et poivrez.\",\"5. Réservez au frais. Étalez sur les pains à burger toastés au moment de servir.\",\"Temps total : 5 min.\",\"Pour le batch cooking : réfrigérez au plus tard 2 heures après cuisson, gardez à 4 °C au plus et consommez sous 3 jours. Congelez rapidement les portions prévues pour plus tard.\",\"Mixer cornichons\",\"➡️ 5 sec vitesse 5\",\"Ajouter reste\",\"➡️ 15 sec vitesse 3\"]},{\"id\":\"r-08d99317f5\",\"name\":\"🍅 42 — SAUCE BOLOGNAISE FAMILIALE À CONGELER\",\"lines\":[\"⏱️ Préparation : 20 min\",\"🔥 Cuisson : 45 min\",\"👥 Pour 4 personnes\",\"500 g de viande hachée de bœuf (5 % MG)\",\"100 g de chair à saucisse de volaille\",\"800 g de purée de tomates (passata)\",\"1 carotte, hachée très finement\",\"1 branche de céleri, hachée très finement\",\"1 oignon, haché\",\"2 gousses d’ail, hachées\",\"150 ml de bouillon de bœuf\",\"1 cuillère à soupe d’huile d’olive\",\"1 feuille de laurier\",\"Sel\",\"Poivre\",\"1. Dans une grande cocotte, faites chauffer l'huile d'olive. Ajoutez l'oignon, l'ail, la carotte et le céleri. Faites suer 8 minutes à feu doux.\",\"2. Ajoutez le bœuf haché et la chair de volaille. Augmentez le feu, séparez la viande à la spatule et faites cuire 6 minutes.\",\"3. Versez le bouillon de bœuf chaud pour déglacer, puis ajoutez la passata et la feuille de laurier.\",\"4. Salez, poivrez, couvrez et laissez mijoter 45 minutes à feu très doux.\",\"5. Retirez le laurier. Laissez refroidir rapidement, répartissez en portions et congelez pour les repas à venir.\",\"Temps total : 65 min.\",\"Pour le batch cooking : réfrigérez au plus tard 2 heures après cuisson, gardez à 4 °C au plus et consommez sous 3 jours. Congelez rapidement les portions prévues pour plus tard.\"]},{\"id\":\"r-68d1f430fd\",\"name\":\"🥣 43 — SAUCE CURRY COCO LÉGÈRE\",\"lines\":[\"1. La torréfaction: Dans une petite casserole, faites chauffer l'huile à feu doux. Ajoutez le curry et le gingembre pour libérer les arômes pendant 30 secondes.\",\"2. Le mouillement: Versez le lait de coco allégé. Portez à un léger frémissement et laissez réduire pendant 3 à 4 minutes à feu doux pour épaissir.\",\"3. Le lissage: Retirez la casserole du feu. Laissez tiédir 2 minutes, puis incorporez le fromage blanc (ou Skyr) et le jus de citron vert en fouettant vigoureusement.\",\"4. L'assaisonnement: Ajoutez le sel et le poivre selon votre goût.\",\"5. Le stockage: Versez dans un bocal étanche. Conservez au frais jusqu'à 4 jours. Idéal pour napper du poulet, des crevettes ou des légumes.\",\"150 ml de Lait de coco allégé: 200 ml\",\"150 ml de Fromage blanc 0% ou Skyr: 100 g\",\"Curry en poudre: 1 cuillère à soupe rase\",\"1 Gingembre frais: 1 cm râpé (ou \\\\(1/2\\\\) cuillère à café en poudre)\",\"1 Jus de citron vert: 1 cuillère à soupe\",\"1 c. à soupe de Huile de coco ou d'olive: 1 cuillère à café\",\"Sel, poivre: 1 pincée\"]},{\"id\":\"r-0b46f44a1f\",\"name\":\"🍅 44 — SAUCE POIVRONS GRILLÉS\",\"lines\":[\"1. Le rôtissage: Préchauffez le four à \\\\(210^{\\\\circ}C\\\\). Placez les poivrons entiers et les gousses d'ail non épluchées sur une plaque. Enfournez pour 25 minutes (la peau doit cloquer et noircir légèrement).\",\"2. La suée: Sortez les poivrons du four et enfermez-les immédiatement dans un sac de congélation ou un récipient couvert pendant 10 minutes. La vapeur va décoller la peau.\",\"3. Le parage: Retirez la peau, les tiges et les pépins des poivrons. Récupérez la pulpe de l'ail en pressant sur les gousses rôties.\",\"4. Le mixage: Dans le bol d'un blender, déposez la chair des poivrons, l'ail, le fromage frais, l'huile d'olive et le paprika fumé.\",\"5. Le velouté: Mixez à pleine puissance pendant 1 minute jusqu'à l'obtention d'une crème lisse. Transférez en bocal et réservez au frais (se conserve 5 jours).\",\"2 Poivrons rouges: 3 gros poivrons\",\"1 gousse d’Ail: 2 gousses d'ail entières (en chemise)\",\"100 g de Fromage frais de chèvre (type Petit Billy) ou St Môret Ligne: 50 g\",\"1 c. à soupe de Huile d'olive: 1 cuillère à soupe\",\"Paprika fumé: \\\\(1/2\\\\) cuillère à café\",\"Sel, poivre: 1 pincée\"]},{\"id\":\"r-35f255bf02\",\"name\":\"🧀 45 — SAUCE FROMAGÈRE LÉGÈRE\",\"lines\":[\"1. La dilution: Dans un bol, délayez la Maïzena dans 2 cuillères à soupe de crème fraîche froide pour éviter les grumeaux.\",\"2. La chauffe: Dans une casserole, versez le reste de la crème fraîche et le mélange à la Maïzena. Faites chauffer à feu moyen en remuant constamment au fouet jusqu'à épaississement.\",\"3. La fonte: Baissez le feu au minimum. Ajoutez la cancoillotte cuillère par cuillère en continuant de mélanger jusqu'à ce qu'elle soit entièrement fondue et filante.\",\"4. L'aromatisation: Retirez du feu. Ajoutez la muscade, le sel et le poivre blanc.\",\"5. Le conditionnement: Versez dans un récipient en verre. Laissez refroidir. Elle va figer légèrement au frais (4 jours maximum) mais retrouvera tout son fondant après 30 secondes au micro-ondes.\",\"150 ml de Crème fraîche légère (12% ou 15% MG): 200 ml\",\"1 gousse d’Cancoillotte nature ou à l'ail (fromage très maigre): 120 g\",\"1 Maïzena (Fécule de maïs): 1 cuillère à café rase\",\"100 g de Noix de muscade: 1 râpée de pinces\",\"Sel, poivre blanc: 1 pincée\"]},{\"id\":\"test-sauce-champignons\",\"name\":\"Sauce champignons légère\",\"lines\":[\"1. La suée : Dans une casserole contenant l'huile d'olive, faites revenir l'échalote ciselée pendant 2 minutes à feu moyen.\",\"2. Le sauté forestier : Ajoutez les fines lamelles de champignons. Faites-les sauter à feu vif pendant 4 minutes jusqu'à ce que leur eau de végétation se soit entièrement évaporée.\",\"3. Le déglaçage : Versez les 50 ml de bouillon chaud pour décoller tous les sucs aromatiques du fond de la casserole.\",\"4. La liaison : Baissez le feu au minimum. Versez la crème fraîche légère, ajoutez le sel et le poivre noir.\",\"5. L'épaississement : Mélangez continuellement au fouet pendant 2 minutes à feu très doux pour lier la crème. Transférez dans un bol. Cette sauce nappante est parfaite pour napper un blanc de poulet, une escalope ou des pâtes.\",\"2 Champignons de Paris: 250 g coupés en lamelles fines\",\"150 ml de Crème fraîche légère (12% MG): 200 ml\",\"1 gousse d’Bouillon de volaille ou de légumes chaud: 50 ml\",\"2 Échalote: 1 échalote ciselée\",\"1 c. à soupe de Huile d'olive: 1 cuillère à café\",\"Sel, poivre noir: 1 pincée de chaque\"]},{\"id\":\"test-sauce-citron-ciboulette\",\"name\":\"Sauce citron-ciboulette au skyr\",\"lines\":[\"1. Le lissage : Dans un grand bol, déposez les 300 g de skyr nature. Fouettez-le énergiquement à la fourchette pendant 30 secondes pour rendre la texture lisse et brillante.\",\"2. L'acidité : Prélevez les zestes fins du citron bien lavé, puis pressez-le. Ajoutez le jus de citron, les zestes et la cuillère à café d'huile d'olive dans le skyr.\",\"3. L'herbage : Ciselez finement la ciboulette fraîche au-dessus du bol.\",\"4. L'assaisonnement : Ajoutez le sel fin et le poivre blanc.\",\"5. Le mélange final : Remuez longuement pour bien répartir les herbes et les arômes. Mettez en pot hermétique au frais. Cette sauce fraîche et protéinée est idéale pour accompagner vos crudités, vos poissons ou tartiner vos wraps de la semaine.\",\"150 ml de Skyr nature (ou fromage blanc épais 0%): 300 g\",\"1 Citron jaune: Le jus d'un demi-citron + les zestes fins\",\"Ciboulette fraîche: 1/2 bouquet ciselé finement\",\"1 c. à soupe de Huile d'olive: 1 cuillère à café (pour le liant brillant)\",\"Sel fin, poivre blanc: 1 belle pincée de chaque\"]},{\"id\":\"test-vinaigrette-moutarde-citron\",\"name\":\"Vinaigrette légère moutarde-citron\",\"lines\":[\"1. Le liant : Dans un petit bol ou directement dans un flacon à sauce, déposez la cuillère de moutarde de Dijon.\",\"2. L'acidité : Versez le jus de citron frais sur la moutarde et mélangez à la fourchette pour détendre la texture.\",\"3. L'huile : Ajoutez les deux cuillères à soupe d'huile d'olive en filet tout en continuant de remuer pour créer une émulsion.\",\"4. L'allègement : Versez les deux cuillères à soupe d'eau tiède. Secouez ou fouettez vigoureusement. L'eau va lier définitivement la vinaigrette sans ajouter de calories.\",\"5. Le stockage : Ajoutez le sel fin et le poivre noir. Conservez dans un flacon hermétique au réfrigérateur jusqu'à 7 jours. Secouez bien avant chaque utilisation sur vos crudités.\",\"1 c. à soupe de Moutarde de Dijon fine: 1 cuillère à soupe bombée\",\"1 Jus de citron jaune: Le jus d'un gros citron entier\",\"1 c. à soupe de Huile d'olive ou de colza: 2 cuillères à soupe\",\"1 Eau tiède: 2 cuillères à soupe (le secret pour alléger et émulsionner)\",\"Sel fin, poivre noir: 1 pincée de chaque\"]},{\"id\":\"test-sauce-yaourt-moutarde\",\"name\":\"Sauce yaourt-moutarde aux herbes\",\"lines\":[\"1. La base laitière : Dans un saladier, fouettez le yaourt nature à la fourchette pour homogénéiser et lisser la texture.\",\"2. Le piquant doux : Incorporez la moutarde à l'ancienne et la moutarde de Dijon fine. Mélangez bien.\",\"3. L'acidité : Ajoutez le jus de citron jaune pour apporter du peps à la sauce.\",\"4. Les herbes : Ajoutez le persil et la ciboulette finement ciselés.\",\"5. La finition : Ajoutez la pincée de sel et de poivre noir. Mélangez vigoureusement à la fourchette, puis versez dans un pot hermétique. Laissez reposer 15 minutes au frais avant de servir avec vos salades complètes ou vos viandes froides.\",\"150 ml de Yaourt nature classique ou fromage blanc 0%: 2 pots (environ 250 g)\",\"1 c. à soupe de Moutarde à l'ancienne (en grains): 1 cuillère à soupe rase\",\"1 c. à soupe de Moutarde de Dijon fine: 1 cuillère à café\",\"Persil et ciboulette fraîche: 1 cuillère à soupe du mélange ciselé\",\"1 Jus de citron jaune: 1 cuillère à café\",\"Sel, poivre: 1 pincée\"]},{\"id\":\"r-3ff1d4abc1\",\"name\":\"Sauce tomate maison légère\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"800 g de tomates concassées\",\"1 oignon\",\"2 gousses d’ail\",\"1 carotte râpée\",\"1 c. à soupe d’huile d’olive\",\"1 c. à café d’origan\",\"1 feuilles de basilic\",\"Sel fin (2 g) et poivre moulu (0,5 g)\",\"1. Préparez pour 4 personnes : 800 g de tomates concassées, 1 oignon, 2 gousses d’ail, 1 carotte râpée, 1 c. à soupe d’huile d’olive, 1 c. à café d’origan, 1 feuilles de basilic, Sel fin (2 g) et poivre moulu (0,5 g). Lavez et coupez les légumes. (10 min)\",\"2. Faites revenir 800 g de tomates concassées, 1 oignon, 2 gousses d’ail, 1 carotte râpée avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez les autres ingrédients de la fiche et 1 c. à soupe d’huile d’olive; cuisez à feu moyen-doux 30 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\"]}]}]]}]\ne:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#8FA89B\"}]]\n13:I[27201,[\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/_next/static/chunks/0wk86n3bmty0z.js\"],\"IconMark\"]\nb:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Pas de panique, on mange quoi ce soir ? 52 semaines de menus, du batchcooking simple et vos listes de courses automatisées.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":
