 un saladier, réunissez les ingrédients préparés et mélangez 30 à 45 secondes pour répartir l’assaisonnement; goûtez puis rectifiez si nécessaire.\",\"2. Répartissez la préparation dans quatre assiettes, ajoutez la garniture prévue et servez dès que la cuisson est terminée.\",\"3. Ajoutez les ingrédients restants de la fiche, mélangez délicatement pendant 30 secondes et vérifiez l’assaisonnement.\",\"4. Goûter et ajuster le citron ou l’eau selon l’acidité souhaitée.\"]},{\"id\":\"test-sauce-yaourt-moutarde\",\"name\":\"Sauce yaourt-moutarde aux herbes\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"150 g de yaourt nature ou de skyr\",\"1 c. à café de moutarde\",\"1 Le jus de 1/2 citron\",\"1 c. à soupe de ciboulette ou de persil ciselé\",\"Poivre et une petite pincée de sel\",\"1. Dans un saladier, réunissez les ingrédients préparés et mélangez 30 à 45 secondes pour répartir l’assaisonnement; goûtez puis rectifiez si nécessaire.\",\"2. Ajoutez les ingrédients restants de la fiche, mélangez délicatement pendant 30 secondes et vérifiez l’assaisonnement.\",\"3. Poivrer, saler légèrement puis laisser reposer 5 à 10 minutes au frais.\"]},{\"id\":\"r-3ff1d4abc1\",\"name\":\"Sauce tomate maison légère\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"800 g de tomates concassées\",\"1 oignon\",\"2 gousses d’ail\",\"1 carotte râpée\",\"1 c. à soupe d’huile d’olive\",\"1 c. à café d’origan\",\"1 feuilles de basilic\",\"Sel et poivre\",\"1. Émincer l’oignon, hacher l’ail et râper la carotte.\",\"2. Faire chauffer l’huile dans une casserole et faire revenir l’oignon et la carotte 5 minutes.\",\"3. Ajoutez les ingrédients restants de la fiche, mélangez délicatement pendant 30 secondes et vérifiez l’assaisonnement.\",\"4. Laisser mijoter à feu doux 25 à 30 minutes en remuant de temps en temps.\",\"5. Ajouter le basilic ciselé, goûter et rectifier l’assaisonnement. Mixer si une texture lisse est souhaité
