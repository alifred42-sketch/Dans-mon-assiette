\",\"h1\",null,{\"className\":\"font-heading text-3xl\",\"children\":\"Automne\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-sm font-normal leading-relaxed text-[#2B2B2B]\",\"children\":\"Les premiers champignons, les courges dorées et les douces odeurs de mijotés. Une cuisine cocooning et réconfortante.\"}]]}],[\"$\",\"$L12\",null,{\"items\":[{\"id\":\"r-0e5be70f69\",\"name\":\"🍲 Velouté butternut, carottes \u0026 St Môret\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"800 g de courge butternut épluchée\",\"2 carottes (environ 200 g)\",\"1 oignon\",\"2 pommes de terre (environ 300 g)\",\"800 ml de bouillon de légumes\",\"150 g de St Môret\",\"1 pincée de muscade\",\"Sel et poivre\",\"4 tranches de pain complet\",\"curry doux\",\"muscade\",\"poivre\",\"\\\"Velouté de potiron\\\"\",\"1 tranche de pain complet grillé\",\"1. Épluchez la butternut, les carottes et les pommes de terre. Coupez-les en cubes de 2 cm et émincez l’oignon.\",\"2. Mettez les légumes dans une grande casserole avec le bouillon. Portez à ébullition, puis baissez le feu et laissez mijoter 20 à 25 minutes, jusqu’à ce que les légumes soient tendres.\",\"3. Retirez du feu et mixez jusqu’à obtenir un velouté lisse. Incorporez le St Môret et la muscade, puis mixez brièvement pour homogénéiser.\",\"4. Goûtez, rectifiez le sel et le poivre, puis servez en quatre bols avec le pain complet grillé.\",\"Velouté de potiron\"]},{\"id\":\"r-94157150e2\",\"name\":\"🥘 Gratin de courgettes jambon fromage\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"1 courgettes\",\"400 g de jambon\",\"1 œufs\",\"150 ml de crème légère\",\"100 g de fromage râpé\",\"muscade\",\"poivre\",\"1 gousse d’ail\",\"ail\",\"\\\"Gratin de courgettes\\\"\",\"Déjà intégré 😍\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Assembler les ingrédients dans un plat adapté et cuire au four préchauffé à 180 °C jusqu’à cuisson à cœur.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Gratin de courgettes\"]},{\"id\":\"r-2cf7843ce5\",\"name\":\"🥩 Sauté de veau aux champignons\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"1 veau\",\"2 champignons\",\"2 carottes\",\"2 oignons\",\"thym\",\"laurier\",\"\\\"Sauté de veau\\\"\",\"riz\",\"pommes de terre vapeur\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Sauté de veau\"]},{\"id\":\"r-505f3338a3\",\"name\":\"Risotto aux champignons et parmesan\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"320 g de riz arborio\",\"400 g de champignons de Paris\",\"1 oignon\",\"1,1 l de bouillon chaud\",\"100 ml de vin blanc (facultatif)\",\"60 g de parmesan râpé\",\"1 c. à soupe d’huile d’olive\",\"20 g de beurre\",\"Poivre et persil frais\",\"1. Préparez pour 4 personnes : 320 g de riz arborio, 400 g de champignons de Paris, 1 oignon, 1,1 l de bouillon chaud, 100 ml de vin blanc (facultatif), 60 g de parmesan râpé, 1 c. à soupe d’huile d’olive, 20 g de beurre, Poivre et persil frais. Lavez et coupez les légumes. (10 min)\",\"2. Cuisez 320 g de riz arborio dans l’eau bouillante salée selon le paquet; égouttez.\",\"3. Faites revenir 400 g de champignons de Paris, 1 oignon 5 à 8 min dans la matière grasse prévue; ajoutez 1,1 l de bouillon chaud, 1 c. à soupe d’huile d’olive et poursuivez 15 min en vérifiant la cuisson.\",\"4. Mélangez avec le féculent cuit, ajoutez les herbes et assaisonnements de la fiche, puis répartissez en 4 portions.\",\"Monsieur Cuisine : hacher l’oignon 5 s / vitesse 6, racler. Ajouter huile et faire revenir 3 min / 120 °C / vitesse 1. Ajouter riz, faire nacrer 2 min / 100 °C / vitesse 1 inversée si disponible. Ajouter les champignons et le bouillon chaud, cuire environ 18 à 20 min / 100 °C / vitesse 1 inversée; contrôler la cuisson et ajouter un peu de bouillon si nécessaire. Incorporer parmesan et persil en fin de cuisson.\",\"🐟 saumon\",\"🍗 poulet\",\"🥒 courgettes\",\"Étapes complétées lors de l’audit test des semaines 1 et 2 : adapter les cuissons aux ingrédients exacts et vérifier la cuisson à cœur des viandes et poissons.\"]},{\"id\":\"r-19ce31994f\",\"name\":\"🐟 Saumon poireaux crème citron\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"400 g de saumon\",\"1 poireaux\",\"150 ml de crème légère\",\"1 citron\",\"aneth\",\"poivre\",\"\\\"Fondue de poireaux\\\"\",\"1. Préchauffer le four à 190 °C si une cuisson au four est prévue; laver et couper les légumes.\",\"2. Assaisonner le poisson avec le citron, les herbes, le sel et le poivre; répartir les légumes dans un plat et ajouter l’huile.\",\"3. Cuire au four 12 à 18 minutes selon l’épaisseur, ou à la poêle 3 à 5 minutes par face selon le poisson. Les fruits de mer doivent être cuits à cœur.\",\"4. Vérifier la cuisson, arroser du jus de cuisson et servir immédiatement avec l’accompagnement prévu.\",\"Fondue de poireaux\"]},{\"id\":\"r-777fb77d40\",\"name\":\"🥚 Œufs cocotte champignons\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"4 œufs\",\"250 g de champignons de Paris\",\"100 ml de crème légère\",\"40 g de fromage râpé\",\"1 c. à soupe de ciboulette ciselée\",\"Poivre\",\"4 tranches de pain complet\",\"ciboulette\",\"poivre\",\"pain complet grillé\",\"\\\"Œufs cocotte\\\"\",\"1. Préchauffer le four à 180 °C et beurrer légèrement quatre ramequins.\",\"2. Nettoyer les champignons, les émincer et les faire revenir 6 à 8 minutes dans une poêle jusqu’à évaporation de leur eau.\",\"3. Répartir les champignons dans les ramequins, ajouter une cuillère de crème et un peu de fromage râpé.\",\"4. Casser un œuf dans chaque ramequin, poivrer et placer les ramequins dans un plat contenant de l’eau chaude à mi-hauteur.\",\"5. Cuire au bain-marie 12 à 15 minutes, jusqu’à ce que le blanc soit pris; parsemer de ciboulette et servir avec le pain grillé.\",\"Œufs cocotte\"]},{\"id\":\"r-50e9f84517\",\"name\":\"🍛 RECETTE 191 — Chili con carne doux\",\"lines\":[\"1. Préparez pour 4 personnes : 500 g de bœuf haché, 200 g de haricots rouges (selon goût), 300 g de tomates concassées, 2 carottes, 2 poivron, 1 oignon, 1 c. à café de paprika fumé, 1 c. à café de cumin, 200 g de piment doux (facultatif), 1 gousse d’ail, 1 c. à soupe d’coriandre, 250 g de riz, 200 g de salade, 30 g de cheddar râpé, 100 g de ou feta émiettée, 200 g de bœuf haché, 300 g de tomates, 200 g de haricots rouges, 2 poivrons, 200 g de piment doux, 20 g de cheddar ou mozzarella.. Lavez et coupez les légumes. (20 min)\",\"2. Faites revenir 300 g de tomates concassées, 2 carottes, 2 poivron, 1 oignon, 1 gousse d’ail, 300 g de tomates, 2 poivrons avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez 500 g de bœuf haché, 200 g de bœuf haché et les condiments indiqués; cuisez à feu moyen-doux 30 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"💪 Satiété : 💪 Très rassasiant\",\"500 g de bœuf haché\",\"200 g de haricots rouges (selon goût)\",\"300 g de tomates concassées\",\"2 carottes\",\"2 poivron\",\"1 oignon\",\"1 c. à café de paprika fumé\",\"1 c. à café de cumin\",\"200 g de piment doux (facultatif)\",\"1 gousse d’ail\",\"1 c. à soupe d’coriandre\",\"250 g de riz\",\"200 g de salade\",\"30 g de cheddar râpé\",\"100 g de ou feta émiettée\",\"200 g de bœuf haché\",\"300 g de tomates\",\"200 g de haricots rouges\",\"2 poivrons\",\"200 g de piment doux\",\"20 g de cheddar ou mozzarella.\",\"🌶️ Paprika fumé\",\"🟡 Cumin\",\"🌶️ Piment doux (facultatif)\",\"🧄 Ail\",\"🌿 Coriandre\",\"Riz\",\"Salade\",\"❌ Non avec riz\",\"✅ Possible :\",\"ou feta émiettée\",\"➡️ Version poulet ou légumes.\",\"Avec patate douce.\",\"Chili con carne\"]},{\"id\":\"r-0d88134e0e\",\"name\":\"🥧 Quiche poireaux saumon\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"1 pâte brisée\",\"1 œufs\",\"1 poireaux\",\"400 g de saumon fumé\",\"100 g de fromage frais\",\"aneth\",\"poivre\",\"\\\"Quiche\\\"\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Assembler les ingrédients dans un plat adapté et cuire au four préchauffé à 180 °C jusqu’à cuisson à cœur.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Quiche\"]},{\"id\":\"r-89467af8af\",\"name\":\"🍗 Poulet moutarde champignons\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"400 g de poulet\",\"2 champignons\",\"1 c. à soupe de moutarde\",\"150 ml de crème légère\",\"thym (10 g pour 4 personnes)\",\"Poivre moulu (0,5 g)\",\"thym\",\"poivre\",\"\\\"Poulet à la moutarde\\\"\",\"1. Préparez les ingrédients pour 4 personnes : lavez et épluchez les légumes, coupez-les régulièrement, pesez les quantités et égouttez les conserves.\",\"2. Faites chauffer l’huile prévue et faites dorer la viande 4 à 6 minutes en remuant.\",\"3. Ajoutez légumes, épices et liquide indiqués. Couvrez et laissez mijoter 15 à 20 minutes à feu doux, en vérifiant la cuisson à cœur.\",\"4. Faites cuire l’accompagnement si nécessaire, rectifiez l’assaisonnement et servez chaud.\",\"Poulet à la moutarde\"]},{\"id\":\"r-32efaae5de\",\"name\":\"🥔 Tartiflette revisitée légère\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"2 pommes de terre\",\"2 oignons\",\"400 g de jambon\",\"1 reblochon (portion raisonnable)\",\"1 salade verte\",\"salade verte\",\"\\\"Tartiflette\\\"\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Tartiflette\"]},{\"id\":\"cco-veloute-courge-chataigne\",\"name\":\"🥣 Velouté de courge et châtaignes\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 28 min\",\"👥 Pour 4 personnes\",\"800 g de courge butternut\",\"150 g de châtaignes cuites\",\"1 oignon\",\"700 ml de bouillon de légumes\",\"100 ml de crème légère\",\"1 c. à soupe d’huile d’olive\",\"Sel fin (2 g) et poivre moulu (0,5 g)\",\"1. Éplucher la courge et retirer les graines; couper la chair en cubes. Émincer l’oignon.\",\"2. Faire revenir l’oignon dans l’huile 3 minutes.\",\"3. Ajouter la courge et le bouillon. Cuire 20 à 25 minutes jusqu’à ce que la courge soit tendre.\",\"4. Ajouter les châtaignes et cuire encore 3 minutes.\",\"5. Mixer finement, incorporer la crème et la muscade, puis saler et poivrer.\",\"Hacher l’oignon 5 sec/vitesse 5 puis faire revenir 3 min/120 °C/vitesse 1.\",\"Ajouter la courge et le bouillon. Cuire 22 min/100 °C/vitesse 1; ajouter les châtaignes 3 min avant la fin.\",\"Mixer progressivement 30 à 60 sec/vitesse 6 à 8, puis ajouter la crème.\"]},{\"id\":\"cco-veloute-carotte-lentilles\",\"name\":\"🥣 Velouté carotte-lentilles corail\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"500 g de carottes\",\"120 g de lentilles corail rincées\",\"1 oignon\",\"800 ml de bouillon de légumes\",\"1 c. à café de cumin doux\",\"1 c. à soupe d’huile d’olive\",\"Sel fin (2 g) et poivre moulu (0,5 g)\",\"1. Lavez et séchez 500 g de carottes, 1 oignon. Épluchez ceux qui le nécessitent et coupez-les en morceaux réguliers d’environ 1 à 2 cm.\",\"2. Faire revenir l’oignon dans l’huile 3 minutes avec le cumin.\",\"3. Versez le bouillon chaud progressivement en remuant entre chaque ajout, puis poursuivez la cuisson jusqu’à ce que le féculent soit tendre.\",\"4. Cuire à petits frémissements 20 à 25 minutes, jusqu’à ce que les lentilles et les carottes soient très tendres.\",\"5. Mixer jusqu’à obtenir une texture lisse; saler et poivrer.\",\"Hacher l’oignon 5 sec/vitesse 5 puis faire revenir 3 min/120 °C/vitesse 1 avec l’huile et le cumin.\",\"Ajouter carottes, lentilles rincées et bouillon. Cuire 23 min/100 °C/vitesse 1.\",\"Mixer progressivement 30 à 60 sec/vitesse 6 à 8 et rectifier l’assaisonnement.\"]}]}]]}]\ne:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#8FA89B\"}]]\n13:I[27201,[\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/_next/static/chunks/0wk86n3bmty0z.js\"],\"IconMark\"]\nb:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Pas de panique, on mange quoi ce soir ? 52 semaines de menus, du batchcooking simple et vos listes de courses automatisées.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"6\",{\"rel\":\"icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/icon-192.png\",\"sizes\":\"192x192\",\"type\":\"image/png\"}],[\"$\",\"link\",\"7\",{\"rel\":\"icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/icon-512.png\",\"sizes\"
