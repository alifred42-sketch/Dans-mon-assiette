":\"font-heading text-3xl\",\"children\":\"Automne\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-sm font-normal leading-relaxed text-[#2B2B2B]\",\"children\":\"Les premiers champignons, les courges dorées et les douces odeurs de mijotés. Une cuisine cocooning et réconfortante.\"}]]}],[\"$\",\"$L12\",null,{\"items\":[{\"id\":\"r-0e5be70f69\",\"name\":\"🍲 Velouté butternut, carottes \u0026 St Môret\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"800 g de courge butternut épluchée\",\"2 carottes (environ 200 g)\",\"1 oignon\",\"2 pommes de terre (environ 300 g)\",\"800 ml de bouillon de légumes\",\"150 g de St Môret\",\"1 pincée de muscade\",\"Sel et poivre\",\"4 tranches de pain complet\",\"curry doux\",\"muscade\",\"poivre\",\"\\\"Velouté de potiron\\\"\",\"1 tranche de pain complet grillé\",\"1. Épluchez la butternut, les carottes et les pommes de terre. Coupez-les en cubes de 2 cm et émincez l’oignon.\",\"2. Mettez les légumes dans une grande casserole avec le bouillon. Portez à ébullition, puis baissez le feu et laissez mijoter 20 à 25 minutes, jusqu’à ce que les légumes soient tendres.\",\"3. Retirez du feu et mixez jusqu’à obtenir un velouté lisse. Incorporez le St Môret et la muscade, puis mixez brièvement pour homogénéiser.\",\"4. Goûtez, rectifiez le sel et le poivre, puis servez en quatre bols avec le pain complet grillé.\",\"Velouté de potiron\"]},{\"id\":\"r-94157150e2\",\"name\":\"🥘 Gratin de courgettes jambon fromage\",\"lines\":[\"1. Le pré-flétrissement: Dans une poêle à sec, faites revenir les rondelles de courgettes pendant 5 minutes à feu vif pour leur faire rendre une partie de leur eau de végétation. Égouttez-les.\",\"2. L'appareil à gratin: Dans un bol, fouettez l'œuf, la crème fraîche légère, la muscade, le sel et le poivre noir.\",\"3. Le montage: Dans un plat à gratin, déposez la moitié des rondelles de courgettes cuites. Ajoutez les lanières de jambon blanc par-dessus, puis couvrez avec le reste des courgettes.\",\"4. Le nappage: Versez l'appareil à la crème uniformément sur tout le plat. Saupoudrez d'Emmental râpé pour le gratinage.\",\"5. La cuisson au four: Enfournez à 200°C pour 15 à 20 minutes, jusqu'à ce que le dessus soit bien doré et bouillonnant. Servez bien chaud.\",\"3 belles courgettes coupées en fines rondelles\",\"3 tranches coupées en lanières\",\"150 ml de Crème fraîche légère (12% MG)\",\"1 gros œuf frais\",\"40 g d’Emmental râpé\",\"1 pincée de Noix de muscade\",\"1 pincée de Sel, poivre\"]},{\"id\":\"r-2cf7843ce5\",\"name\":\"🥩 Sauté de veau aux champignons\",\"lines\":[\"1. La saisie de la viande: Dans une grande cocotte, faites chauffer l'huile d'olive. Faites dorer les morceaux de veau à feu vif pendant 5 minutes pour bien marquer la viande. Réservez-les hors de la cocotte.\",\"2. Les sucs: Dans la même cocotte, ajoutez l'oignon émincé et les champignons en lamelles. Faites sauter pendant 5 minutes à feu moyen.\",\"3. Le singeage léger: Saupoudrez la cuillère de fécule de maïs sur les champignons et remuez pendant 30 secondes.\",\"4. Le mouillement: Remettez le veau dans la cocotte avec son jus. Versez le bouillon de bœuf chaud. Salez et poivrez.\",\"5. Le mijotage: Portez à ébullition, couvrez et baissez le feu au minimum. Laissez mijoter doucement pendant 25 minutes. La sauce doit s'épaissir et enrober la viande tendre.\",\"600 g coupés en morceaux réguliers de quasi ou épaule de veau\",\"400 g coupés en lamelles de champignons de Paris\",\"1 oignon émincé\",\"200 ml de Bouillon de bœuf ou de volaille chaud\",\"1 c. à soupe d’Huile d'olive\",\"1 c. à café (pour l'onctuosité) de fécule de maïs (Maïzena)\",\"2 pincées de Sel, poivre\"]},{\"id\":\"r-505f3338a3\",\"name\":\"Risotto aux champignons et parmesan\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"320 g de riz arborio\",\"400 g de champignons de Paris\",\"1 oignon\",\"1,1 l de bouillon chaud\",\"100 ml de vin blanc (facultatif)\",\"60 g de parmesan râpé\",\"1 c. à soupe d’huile d’olive\",\"20 g de beurre\",\"Poivre et persil frais\",\"1. Émincez l’oignon et coupez 400 g de champignons de Paris, 1 oignon en petits dés. Faites chauffer le bouillon indiqué et gardez-le chaud.\",\"2. Faites revenir l’oignon dans 1 c. à soupe d’huile d’olive 2 à 3 minutes. Ajoutez le riz à risotto et remuez 1 minute.\",\"3. Versez le bouillon chaud progressivement en remuant pendant 18 à 20 minutes; ajoutez les légumes en dés au cours de la cuisson.\",\"4. Quand le riz est tendre mais légèrement ferme, retirez du feu, incorporez le fromage listé et laissez reposer 2 minutes.\",\"Monsieur Cuisine : hacher l’oignon 5 s / vitesse 6, racler. Ajouter huile et faire revenir 3 min / 120 °C / vitesse 1. Ajouter riz, faire nacrer 2 min / 100 °C / vitesse 1 inversée si disponible. Ajouter les champignons et le bouillon chaud, cuire environ 18 à 20 min / 100 °C / vitesse 1 inversée; contrôler la cuisson et ajouter un peu de bouillon si nécessaire. Incorporer parmesan et persil en fin de cuisson.\",\"🐟 saumon\",\"🍗 poulet\",\"🥒 courgettes\",\"Étapes complétées lors de l’audit test des semaines 1 et 2 : adapter les cuissons aux ingrédients exacts et vérifier la cuisson à cœur des viandes et poissons.\"]},{\"id\":\"r-19ce31994f\",\"name\":\"🐟 Saumon poireaux crème citron\",\"lines\":[\"1. La fondue verte : Dans une grande sauteuse, faites chauffer l'huile d'olive. Ajoutez les poireaux émincés. Couvrez et faites-les suer à feu doux pendant 10 minutes en remuant régulièrement jusqu'à ce qu'ils soient tendres.\",\"2. L'assaisonnement : Ajoutez la crème fraîche légère, le jus de citron, le sel et le poivre dans la fondue de poireaux. Mélangez bien.\",\"3. L'immersion : Déposez les 4 pavés de saumon frais directement sur le lit de poireaux crémés dans la sauteuse.\",\"4. La cuisson étouffée : Couvrez hermétiquement la sauteuse avec un couvercle et laissez cuire à feu doux pendant 5 minutes. La vapeur de la crème va cuire délicatement le poisson à cœur.\",\"5. Le dressage : Servez un pavé de saumon bien rose nappé de sa fondue de poireaux à la crème citronnée.\",\"4 pavés (environ 500 g)\",\"3 poireaux émincés finement\",\"4 c. à soupe de crème fraîche légère (12% MG)\",\"1 c. à soupe de Jus de citron jaune\",\"1 c. à café d’Huile d'olive\",\"1 pincée de Sel, poivre\"]},{\"id\":\"r-777fb77d40\",\"name\":\"🥚 Œufs cocotte champignons\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"4 œufs\",\"250 g de champignons de Paris\",\"100 ml de crème légère\",\"40 g de fromage râpé\",\"1 c. à soupe de ciboulette ciselée\",\"Poivre\",\"4 tranches de pain complet\",\"ciboulette\",\"poivre\",\"pain complet grillé\",\"\\\"Œufs cocotte\\\"\",\"1. Préchauffer le four à 180 °C et beurrer légèrement quatre ramequins.\",\"2. Nettoyer les champignons, les émincer et les faire revenir 6 à 8 minutes dans une poêle jusqu’à évaporation de leur eau.\",\"3. Répartir les champignons dans les ramequins, ajouter une cuillère de crème et un peu de fromage râpé.\",\"4. Casser un œuf dans chaque ramequin, poivrer et placer les ramequins dans un plat contenant de l’eau chaude à mi-hauteur.\",\"5. Cuire au bain-marie 12 à 15 minutes, jusqu’à ce que le blanc soit pris; parsemer de ciboulette et servir avec le pain grillé.\",\"Œufs cocotte\"]},{\"id\":\"r-50e9f84517\",\"name\":\"Chili con carne doux\",\"lines\":[\"1. Émincez l’oignon et l’ail; coupez les carottes et le poivron en petits dés.\",\"2. Faites revenir l’oignon, l’ail et les légumes dans un filet d’huile pendant 5 à 7 minutes.\",\"3. Ajoutez le bœuf haché et faites-le cuire en l’émiettant jusqu’à ce qu’il ne soit plus rosé.\",\"4. Incorporez les tomates, les haricots rouges et les épices. Laissez mijoter 25 à 30 minutes à feu doux.\",\"5. Faites cuire le riz selon les indications du paquet et servez avec le chili.\",\"💪 Satiété : 💪 Très rassasiant\",\"500 g de bœuf haché\",\"200 g de haricots rouges égouttés\",\"400 g de tomates concassées\",\"2 carottes\",\"1 poivron rouge\",\"1 oignon\",\"2 gousses d’ail\",\"1 c. à café de paprika fumé\",\"1 c. à café de cumin\",\"1 c. à café de piment doux (facultatif)\",\"250 g de riz cru\",\"Sel et poivre\",\"🌶️ Paprika fumé\",\"🟡 Cumin\",\"🌶️ Piment doux (facultatif)\",\"🧄 Ail\",\"🌿 Coriandre\",\"Riz\",\"Salade\",\"❌ Non avec riz\",\"✅ Possible :\",\"30 g de cheddar râpé\",\"ou feta émiettée\",\"➡️ Version poulet ou légumes.\",\"Avec patate douce.\",\"Chili con carne\"]},{\"id\":\"r-0d88134e0e\",\"name\":\"🥧 Quiche poireaux saumon\",\"lines\":[\"1. La tombée de poireaux: Dans une poêle contenant la cuillère d'huile d'olive, faites cuire les poireaux émincés pendant 8 minutes à feu doux jusqu'à ce qu'ils réduisent et soient tendres. Laissez tiédir.\",\"2. Le fond de tarte: Préchauffez le four à 180°C. Déroulez la pâte brisée dans un moule à tarte et piquez le fond avec une fourchette.\",\"3. L'appareil à quiche: Dans un saladier, fouettez les 3 œufs avec la crème fraîche légère, le sel, le poivre et une râpée de noix de muscade.\",\"4. L'assemblage: Répartissez les poireaux cuits et le saumon effiloché sur le fond de pâte. Versez l'appareil aux œufs par-dessus pour bien couvrir la garniture.\",\"5. La cuisson: Enfournez pendant 30 minutes jusqu'à ce que la pâte soit bien cuite en dessous et le dessus joliment doré. Coupez en 4 parts.\",\"1 rouleau de Pâte brisée légère ou classique\",\"250 g cuit et effiloché de pavé de saumon frais\",\"2 poireaux émincés finement\",\"3 gros œufs\",\"200 ml de Crème fraîche légère (12% MG)\",\"1 c. à café d’Huile d'olive\",\"1 Sel, poivre, muscade\"]},{\"id\":\"r-89467af8af\",\"name\":\"🍗 Poulet moutarde champignons\",\"lines\":[\"1. La dorure : Dans une sauteuse antiadhésive, faites chauffer l'huile d'olive. Faites revenir l'échalote ciselée et les aiguillettes de poulet à feu vif pendant 5 minutes.\",\"2. Le sauté de légumes : Ajoutez les lamelles de champignons dans la sauteuse. Poursuivez la cuisson à feu vif pendant 5 minutes. L'eau des champignons doit s'évaporer.\",\"3. Le laquage : Baissez le feu. Ajoutez la moutarde à l'ancienne directement sur les ingrédients et mélangez bien pendant 30 secondes.\",\"4. La crème : Versez la crème fraîche légère, salez et poivrez. Remuez délicatement à la spatule pour créer une sauce homogène.\",\"5. Le mijotage : Laissez frémir à feu doux pendant 2 à 3 minutes pour l'épaissir. Servez bien chaud.\",\"600 g coupés en aiguillettes de blancs de poulet\",\"300 g coupés en lamelles de champignons de Paris\",\"4 c. à soupe de crème fraîche légère (15% MG)\",\"1 c. à soupe bombée de moutarde à l'ancienne (en grains)\",\"1 échalote ciselée\",\"1 c. à café d’Huile d'olive\",\"1 pincée de Sel, poivre\"]},{\"id\":\"r-32efaae5de\",\"name\":\"🥔 Tartiflette revisitée légère\",\"lines\":[\"1. Le féculent : Faites cuire les cubes de pommes de terre à l'eau bouillante salée pendant 12 minutes. Ils doivent être tendres. Égouttez-les.\",\"2. La fondue de légumes : Dans une poêle à sec, faites suer l'oignon émincé, les légumes de saison et les allumettes de bacon pendant 8 minutes à feu moyen. Déglacez avec le vin blanc sec et laissez s'évaporer.\",\"3. L'assemblage : Préchauffez le four à 200°C. Dans un plat à gratin, mélangez les pommes de terre, le contenu de la poêle et la crème fraîche. Poivrez.\",\"4. Le fromage : Disposez les tranches de Reblochon (croûte vers le haut) sur toute la surface du plat.\",\"5. Le gratinage : Enfournez pour 15 minutes jusqu'à ce que le Reblochon soit fondu, coulant et bien doré.\",\"500 g épluchées et coupées en cubes de pommes de terre\",\"300 g émincés finement de poireaux ou Carottes (légumes de saison)\",\"150 g d’Allumettes de bacon (plus maigres que les lardons)\",\"150 g (environ 1/2 fromage coupé en tranches) de reblochon\",\"3 c. à soupe de crème fraîche légère (12% MG)\",\"1 gros oignon émincé\",\"2 c. à soupe de vin blanc sec (optionnel)\",\"1 pincée de Sel, poivre\"]},{\"id\":\"cco-veloute-courge-chataigne\",\"name\":\"🥣 Velouté de courge et châtaignes\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 28 min\",\"👥 Pour 4 personnes\",\"800 g de courge butternut\",\"150 g de châtaignes cuites\",\"1 oignon\",\"700 ml de bouillon de légumes\",\"100 ml de crème légère\",\"1 c. à soupe d’huile d’olive\",\"Sel fin (2 g) et poivre moulu (0,5 g)\",\"1. Éplucher la courge et retirer les graines; couper la chair en cubes. Émincer l’oignon.\",\"2. Faire revenir l’oignon dans l’huile 3 minutes.\",\"3. Ajouter la courge et le bouillon. Cuire 20 à 25 minutes jusqu’à ce que la courge soit tendre.\",\"4. Ajouter les châtaignes et cuire encore 3 minutes.\",\"5. Mixer finement, incorporer la crème et la muscade, puis saler et poivrer.\",\"Hacher l’oignon 5 sec/vitesse 5 puis faire revenir 3 min/120 °C/vitesse 1.\",\"Ajouter la courge et le bouillon. Cuire 22 min/100 °C/vitesse 1; ajouter les châtaignes 3 min avant la fin.\",\"Mixer progressivement 30 à 60 sec/vitesse 6 à 8, puis ajouter la crème.\"]},{\"id\":\"cco-veloute-carotte-lentilles\",\"name\":\"🥣 Velouté carotte-lentilles corail\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"500 g de carottes\",\"120 g de lentilles corail rincées\",\"1 oignon\",\"800 ml de bouillon de légumes\",\"1 c. à café de cumin doux\",\"1 c. à soupe d’huile d’olive\",\"Sel fin (2 g) et poivre moulu (0,5 g)\",\"1. Lavez et séchez 500 g de carottes, 1 oignon. Épluchez ceux qui le nécessitent et coupez-les en morceaux réguliers d’environ 1 à 2 cm.\",\"2. Faire revenir l’oignon dans l’huile 3 minutes avec le cumin.\",\"3. Versez le bouillon chaud progressivement en remuant entre chaque ajout, puis poursuivez la cuisson jusqu’à ce que le féculent soit tendre.\",\"4. Cuire à petits frémissements 20 à 25 minutes, jusqu’à ce que les lentilles et les carottes soient très tendres.\",\"5. Mixer jusqu’à obtenir une texture lisse; saler et poivrer.\",\"Hacher l’oignon 5 sec/vitesse 5 puis faire revenir 3 min/120 °C/vitesse 1 avec l’huile et le cumin.\",\"Ajouter carottes, lentilles rincées et bouillon. Cuire 23 min/100 °C/vitesse 1.\",\"Mixer progressivement 30 à 60 sec/vitesse 6 à 8 et rectifier l’assaisonnement.\"]}]}]]}]\ne:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#8FA89B\"}]]\n13:I[27201,[\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/_next/static/chunks/0x95rhs_coz14.js\"],\"IconMark\"]\nb:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Pas de panique, on mange quoi ce soir ? 52 semaines de menus, du batchcooking simple et vos listes de courses automatisées.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"6\",{\"rel\":\"icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/icon-192.png\",\"sizes\":\"192x192\",\"type\":\"image/png\"}],[\"$\",\"link\",\"7\",{\"rel\":\"icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/icon-512.png\",\"sizes\":\"512x512\",\"type\":\"image/png\"}],[\"$\",\"link\",\"8\",{\"rel\":\"apple-touch-icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/apple-touch-icon.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L13\",\"9\",{}]]\n"])</script></body></html>
