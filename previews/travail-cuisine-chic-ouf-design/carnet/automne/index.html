\",\"h1\",null,{\"className\":\"font-heading text-3xl\",\"children\":\"Automne\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-sm font-normal leading-relaxed text-[#2B2B2B]\",\"children\":\"Les premiers champignons, les courges dorées et les douces odeurs de mijotés. Une cuisine cocooning et réconfortante.\"}]]}],[\"$\",\"$L12\",null,{\"items\":[{\"id\":\"r-0e5be70f69\",\"name\":\"🍲 Velouté butternut, carottes \u0026 St Môret\",\"lines\":[\"courge butternut\",\"carottes\",\"oignon\",\"pomme de terre\",\"St Môret\",\"curry doux\",\"muscade\",\"poivre\",\"\\\"Velouté de potiron\\\"\",\"1 tranche de pain complet grillé\",\"Velouté de potiron\"]},{\"id\":\"r-94157150e2\",\"name\":\"🥘 Gratin de courgettes jambon fromage\",\"lines\":[\"courgettes\",\"jambon\",\"œufs\",\"crème légère\",\"fromage râpé\",\"muscade\",\"poivre\",\"ail\",\"\\\"Gratin de courgettes\\\"\",\"Déjà intégré 😍\",\"Gratin de courgettes\"]},{\"id\":\"r-2cf7843ce5\",\"name\":\"🥩 Sauté de veau aux champignons\",\"lines\":[\"veau\",\"champignons\",\"carottes\",\"oignons\",\"thym\",\"laurier\",\"\\\"Sauté de veau\\\"\",\"riz\",\"pommes de terre vapeur\",\"Sauté de veau\"]},{\"id\":\"r-505f3338a3\",\"name\":\"Risotto aux champignons et parmesan\",\"lines\":[\"320 g de riz arborio\",\"400 g de champignons de Paris\",\"1 oignon\",\"1,1 l de bouillon chaud\",\"100 ml de vin blanc (facultatif)\",\"60 g de parmesan râpé\",\"1 c. à soupe d’huile d’olive\",\"20 g de beurre\",\"Poivre et persil frais\",\"1. Nettoyer les champignons et les couper en lamelles. Émincer l’oignon et garder le bouillon chaud.\",\"2. Dans une sauteuse, faire revenir l’oignon dans l’huile et le beurre 2 minutes. Ajouter les champignons et cuire 5 minutes.\",\"3. Ajouter le riz et remuer 1 à 2 minutes jusqu’à ce que les grains deviennent nacrés. Verser le vin blanc si utilisé et laisser évaporer.\",\"4. Ajouter le bouillon chaud progressivement, une louche à la fois, en remuant souvent. Cuire environ 18 à 20 minutes, jusqu’à ce que le riz soit crémeux et tendre.\",\"5. Hors du feu, incorporer le parmesan et le persil. Poivrer, goûter et servir immédiatement.\",\"Monsieur Cuisine : hacher l’oignon 5 s / vitesse 6, racler. Ajouter huile et faire revenir 3 min / 120 °C / vitesse 1. Ajouter riz, faire nacrer 2 min / 100 °C / vitesse 1 inversée si disponible. Ajouter les champignons et le bouillon chaud, cuire environ 18 à 20 min / 100 °C / vitesse 1 inversée; contrôler la cuisson et ajouter un peu de bouillon si nécessaire. Incorporer parmesan et persil en fin de cuisson.\",\"🐟 saumon\",\"🍗 poulet\",\"🥒 courgettes\",\"Étapes complétées lors de l’audit test des semaines 1 et 2 : adapter les cuissons aux ingrédients exacts et vérifier la cuisson à cœur des viandes et poissons.\"]},{\"id\":\"r-19ce31994f\",\"name\":\"🐟 Saumon poireaux crème citron\",\"lines\":[\"saumon\",\"poireaux\",\"crème légère\",\"citron\",\"aneth\",\"poivre\",\"\\\"Fondue de poireaux\\\"\",\"1. Préchauffer le four à 190 °C si une cuisson au four est prévue; laver et couper les légumes.\",\"2. Assaisonner le poisson avec le citron, les herbes, le sel et le poivre; répartir les légumes dans un plat et ajouter l’huile.\",\"3. Cuire au four 12 à 18 minutes selon l’épaisseur, ou à la poêle 3 à 5 minutes par face selon le poisson. Les fruits de mer doivent être cuits à cœur.\",\"4. Vérifier la cuisson, arroser du jus de cuisson et servir immédiatement avec l’accompagnement prévu.\",\"Fondue de poireaux\"]},{\"id\":\"r-777fb77d40\",\"name\":\"🥚 Œufs cocotte champignons\",\"lines\":[\"4 œufs\",\"250 g de champignons de Paris\",\"100 ml de crème légère\",\"40 g de fromage râpé\",\"1 c. à soupe de ciboulette ciselée\",\"Poivre\",\"4 tranches de pain complet\",\"ciboulette\",\"poivre\",\"pain complet grillé\",\"\\\"Œufs cocotte\\\"\",\"1. Préchauffer le four à 180 °C et beurrer légèrement quatre ramequins.\",\"2. Nettoyer les champignons, les émincer et les faire revenir 6 à 8 minutes dans une poêle jusqu’à évaporation de leur eau.\",\"3. Répartir les champignons dans les ramequins, ajouter une cuillère de crème et un peu de fromage râpé.\",\"4. Casser un œuf dans chaque ramequin, poivrer et placer les ramequins dans un plat contenant de l’eau chaude à mi-hauteur.\",\"5. Cuire au bain-marie 12 à 15 minutes, jusqu’à ce que le blanc soit pris; parsemer de ciboulette et servir avec le pain grillé.\",\"Œufs cocotte\"]},{\"id\":\"r-50e9f84517\",\"name\":\"🍛 RECETTE 191 — Chili con carne doux\",\"lines\":[\"1. Faire revenir la viande.\",\"2. Ajouter légumes et épices.\",\"3. Laisser mijoter.\",\"💪 Satiété : 💪 Très rassasiant\",\"500 g de bœuf haché\",\"200 g de haricots rouges (selon goût)\",\"300 g de tomates concassées\",\"2 carottes\",\"2 poivron\",\"1 oignon\",\"1 c. à café de paprika fumé\",\"1 c. à café de 🟡 cumin\",\"200 g de piment doux (facultatif)\",\"1 gousse d’\",\"1 c. à soupe d’coriandre\",\"250 g de riz\",\"200 g de salade\",\"30 g de cheddar râpé\",\"100 g de ou feta émiettée\",\"200 g de bœuf haché\",\"300 g de tomates\",\"200 g de haricots rouges\",\"2 poivrons\",\"200 g de piment doux\",\"20 g de cheddar ou mozzarella.\",\"🌶️ Paprika fumé\",\"🟡 Cumin\",\"🌶️ Piment doux (facultatif)\",\"🧄 Ail\",\"🌿 Coriandre\",\"Riz\",\"Salade\",\"❌ Non avec riz\",\"✅ Possible :\",\"ou feta émiettée\",\"➡️ Version poulet ou légumes.\",\"Avec patate douce.\",\"Chili con carne\"]},{\"id\":\"r-0d88134e0e\",\"name\":\"🥧 Quiche poireaux saumon\",\"lines\":[\"pâte brisée\",\"œufs\",\"poireaux\",\"saumon fumé\",\"fromage frais\",\"aneth\",\"poivre\",\"\\\"Quiche\\\"\",\"Quiche\"]},{\"id\":\"r-89467af8af\",\"name\":\"🍗 Poulet moutarde champignons\",\"lines\":[\"poulet\",\"champignons\",\"moutarde\",\"crème légère\",\"thym\",\"poivre\",\"\\\"Poulet à la moutarde\\\"\",\"Poulet à la moutarde\"]},{\"id\":\"r-32efaae5de\",\"name\":\"🥔 Tartiflette revisitée légère\",\"lines\":[\"pommes de terre\",\"oignons\",\"jambon\",\"reblochon (portion raisonnable)\",\"salade verte\",\"\\\"Tartiflette\\\"\",\"Tartiflette\"]},{\"id\":\"cco-veloute-courge-chataigne\",\"name\":\"🥣 Velouté de courge et châtaignes\",\"lines\":[\"800 g de courge butternut\",\"150 g de châtaignes cuites\",\"1 oignon\",\"700 ml de bouillon de légumes\",\"100 ml de crème légère\",\"1 c. à soupe d’huile d’olive\",\"Sel, poivre et muscade\",\"1. Éplucher la courge et retirer les graines; couper la chair en cubes. Émincer l’oignon.\",\"2. Faire revenir l’oignon dans l’huile 3 minutes.\",\"3. Ajouter la courge et le bouillon. Cuire 20 à 25 minutes jusqu’à ce que la courge soit tendre.\",\"4. Ajouter les châtaignes et cuire encore 3 minutes.\",\"5. Mixer finement, incorporer la crème et la muscade, puis saler et poivrer.\",\"Hacher l’oignon 5 sec/vitesse 5 puis faire revenir 3 min/120 °C/vitesse 1.\",\"Ajouter la courge et le bouillon. Cuire 22 min/100 °C/vitesse 1; ajouter les châtaignes 3 min avant la fin.\",\"Mixer progressivement 30 à 60 sec/vitesse 6 à 8, puis ajouter la crème.\"]},{\"id\":\"cco-veloute-carotte-lentilles\",\"name\":\"🥣 Velouté carotte-lentilles corail\",\"lines\":[\"500 g de carottes\",\"120 g de lentilles corail rincées\",\"1 oignon\",\"800 ml de bouillon de légumes\",\"1 c. à café de cumin doux\",\"1 c. à soupe d’huile d’olive\",\"Sel et poivre\",\"1. Éplucher les carottes et l’oignon puis couper les carottes en rondelles.\",\"2. Faire revenir l’oignon dans l’huile 3 minutes avec le cumin.\",\"3. Ajouter les carottes, les lentilles rincées et le bouillon.\",\"4. Cuire à petits frémissements 20 à 25 minutes, jusqu’à ce que les lentilles et les carottes soient très tendres.\",\"5. Mixer jusqu’à obtenir une texture lisse; saler et poivrer.\",\"Hacher l’oignon 5 sec/vitesse 5 puis faire revenir 3 min/120 °C/vitesse 1 avec l’huile et le cumin.\",\"Ajouter carottes, lentilles rincées et bouillon. Cuire 23 min/100 °C/vitesse 1.\",\"Mixer progressivement 30 à 60 sec/vitesse 6 à 8 et rectifier l’assaisonnement.\"]}]}]]}]\ne:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\
