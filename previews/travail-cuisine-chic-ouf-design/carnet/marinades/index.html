ame\":\"font-heading text-3xl\",\"children\":\"Marinades\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-sm font-normal leading-relaxed text-[#2B2B2B]\",\"children\":\"Donnez du relief à vos viandes, poissons et légumes. Du temps pour infuser les saveurs, du peps à la dégustation !\"}]]}],[\"$\",\"$L12\",null,{\"items\":[{\"id\":\"r-ac143ab639\",\"name\":\"MARINADE POULET MÉDITERRANÉENNE ☀️\",\"lines\":[\"1. L'émulsion: Dans un grand bol ou directement dans le sac de congélation destiné au poulet, fouettez l'huile d'olive, le jus de citron et la moutarde.\",\"2. L'aromatisation: Incorporez l'ail écrasé, les herbes de Provence, le sel et le poivre.\",\"3. L'enrobage: Coupez vos blancs de poulet en cubes ou en aiguillettes. Plongez-les dans la marinade et mélangez bien à la main pour imprégner la viande.\",\"4. Le repos: Fermez hermétiquement. Laissez mariner au minimum 30 minutes au réfrigérateur (idéalement 2 heures) avant la cuisson à la poêle ou au barbecue.\",\"2 c. à soupe d’huile d’olive\",\"2 c. à soupe de jus de citron jaune\",\"1 c. à café de Moutarde de Dijon\",\"2 gousses d'ail écrasées\",\"1 c. à soupe d’Herbes de Provence (ou Origan)\",\"2 pincées de Sel, poivre\"]},{\"id\":\"r-aef573f3e9\",\"name\":\"MARINADE POULET TEX-MEX 🌮\",\"lines\":[\"1. L'assemblage sec: Dans un récipient, mélangez les épices Tex-Mex, l'oignon en poudre et le sel.\",\"2. Les liquides: Ajoutez l'huile, le jus de citron vert frais et le miel. Mélangez jusqu'à obtenir une pâte homogène et rouge ambrée.\",\"3. L'application: Badigeonnez généreusement vos filets de poulet avec cette préparation.\",\"4. Le stockage: Laissez reposer au frais. Cette marinade protège la viande et lui permet de rester très tendre à la cuisson. Elle peut être congelée directement avec le poulet cru.\",\"2 c. à soupe de huile de colza ou de tournesol\",\"1 citron jaune (jus et zestes)\",\"1 c. à soupe bombée de mélange d'épices Tex-Mex (Cumin, Paprika, Chili)\",\"1 c. à café d’Oignon en poudre\",\"1 c. à café (pour caraméliser) de miel de fleurs\",\"Sel: \\\\(1/2\\\\) c. à café\"]},{\"id\":\"r-504ccafb94\",\"name\":\"MARINADE POULET GRECQUE 🇬🇷\",\"lines\":[\"1. La base laitière: Dans un saladier, fouettez le yaourt grec avec l'huile d'olive et le jus de citron pour détendre la texture.\",\"2. Le parfum: Ajoutez la purée d'ail, les zestes de citron, l'origan, le sel et le poivre.\",\"3. Le massage: Immergez les morceaux de poulet dans cette sauce. Massez bien la viande pour répartir le mélange (l'acidité du yaourt va attendrir les fibres du poulet).\",\"4. La macération: Couvrez et laissez reposer au frais pendant au moins 1 heure. Idéal pour réaliser des brochettes (souvlakis).\",\"1 pot de Yaourt grec nature (authentique) (150 g)\",\"1 c. à soupe d’Huile d'olive\",\"2 c. à soupe de jus de citron jaune\",\"1 c. à soupe d’Origan séché\",\"1 gousse d'ail réduite en purée de Ail\",\"1 Zeste de citron: \\\\(1/2\\\\) c. à café\",\"1 pincée de Sel, poivre noir\"]},{\"id\":\"r-298329f096\",\"name\":\"MARINADE POULET BARBECUE LÉGÈRE 🍖\",\"lines\":[\"1. Le liant: Dans un bol, diluez le concentré de tomates avec la sauce soja et le vinaigre de cidre.\",\"2. La douceur fumée: Intégrez le sirop d'érable, le paprika fumé, l'ail et l'oignon en poudre. Fouettez jusqu'à obtenir une laque lisse.\",\"3. Le laquage: Enrobez vos morceaux de poulet (parfait sur des pilons ou des émincés) de cette sauce épaisse.\",\"4. La mise en attente: Réservez au réfrigérateur dans un contenant hermétique avant de cuire.\",\"2 c. à soupe de double concentré de tomates\",\"2 c. à soupe de sauce soja salée (réduite en sodium)\",\"1 c. à soupe de Vinaigre de cidre\",\"1 c. à soupe de Sirop d'érable ou miel\",\"1 c. à café (indispensable pour le goût \\\"BBQ\\\") de paprika fumé (Pimentón)\",\"1 gousse d’Ail et oignon en poudre: \\\\(1/2\\\\) c. à café de chaque\"]},{\"id\":\"r-71976bc5c2\",\"name\":\"MARINADE POULET TIKKA 🇮🇳\",\"lines\":[\"1. Le mix aromatique: Dans un grand récipient, combinez le skyr, la pâte de curry (ou les épices en poudre) et le jus de citron vert.\",\"2. Le piquant doux: Ajoutez le duo ail/gingembre râpé et le paprika doux pour accentuer la couleur rouge caractéristique.\",\"3. L'immersion: Entaillez légèrement vos blancs de poulet pour que la marinade pénètre au cœur de la viande. Plongez-les dans le mélange.\",\"4. Le repos long: Laissez mariner idéalement toute une nuit au frais, ou au moins 2 heures, avant une cuisson grillée au four ou à la poêle.\",\"150 g de Skyr ou Fromage blanc 0%\",\"1 c. à soupe bombée de pâte de curry Tikka (ou Garam Masala en poudre)\",\"1 c. à soupe de Jus de citron vert\",\"1 c. à café du mélange râpé frais de gingembre et Ail\",\"1 c. à café de Paprika doux (pour la couleur)\",\"1 pincée de Sel\"]},{\"id\":\"r-6536cd83a4\",\"name\":\"MARINADE BŒUF FAÇON MÉDITERRANÉENNE\",\"lines\":[\"1. L'émulsion: Dans un récipient, fouettez l'huile d'olive, le vinaigre balsamique et la sauce Worcester pour lier les liquides.\",\"2. Le parfum: Ajoutez les gousses d'ail écrasées, le romarin, le thym, le sel et le poivre noir concassé.\",\"3. Le découpage: Taillez votre pièce de bœuf (bifteck, rumsteck) en cubes pour brochettes ou laissez-la entière.\",\"4. L'immersion: Plongez la viande dans la marinade. Retournez-la plusieurs fois pour bien l'enrober.\",\"5. La tendreté: Fermez le contenant et laissez reposer au moins 1 heure au frais. L'acidité du vinaigre va attendrir les fibres du bœuf.\",\"2 c. à soupe d’huile d’olive\",\"1 c. à soupe de Vinaigre balsamique\",\"1 c. à café de Sauce Worcester (ou sauce soja salée)\",\"2 gousses d'ail écrasées\",\"1 c. à soupe du mélange haché (ou séché) de romarin et Thym frais\",\"1 Poivre noir concassé, sel\"]},{\"id\":\"r-5e0dbe7f91\",\"name\":\"MARINADE FILET MIGNON MOUTARDE \u0026 HERBES\",\"lines\":[\"1. Le liant: Dans un bol, mélangez la moutarde à l'ancienne, la moutarde de Dijon fine et la cuillère d'huile d'olive.\",\"2. La fluidité: Délayez le mélange en ajoutant le vin blanc sec (ou le bouillon) pour obtenir une texture de crème épaisse.\",\"3. L'assaisonnement: Incorporez le thym frais, le sel et le poivre blanc.\",\"4. L'enrobage: Badigeonnez le filet mignon entier (ou coupé en médaillons) à l'aide d'un pinceau de cuisine ou de vos mains.\",\"5. Le stockage: Placez la viande en bocal ou en sac étanche. Laissez reposer 30 minutes au frais avant de lancer la cuisson au four ou à la cocotte.\",\"1 c. à soupe bombée de moutarde à l'ancienne (en grains)\",\"1 c. à café de Moutarde de Dijon fine\",\"1 c. à soupe d’Huile d'olive\",\"2 c. à soupe de vin blanc sec (ou bouillon de volaille)\",\"1 c. à café de Thym frais effeuillé\",\"1 pincée de Sel, poivre blanc\"]},{\"id\":\"r-f8f03a0136\",\"name\":\"MARINADE SAUMON CITRON-ANETH 🍋\",\"lines\":[\"1. La fraîcheur: Râpez finement les zestes du demi-citron, puis pressez-le pour en récolter le jus.\",\"2. Le mélange: Dans un plat creux, combinez le jus de citron, les zestes, l'huile d'olive et l'aneth fraîchement ciselée.\",\"3. Le piquant doux: Ajoutez les baies roses concassées et la fleur de sel.\",\"4. Le contact: Déposez les pavés de saumon côté chair dans le plat pour qu'ils s'imprègnent des saveurs.\",\"5. La chrono-limite: Laissez mariner 15 à 20 minutes maximum au frais. L'acidité du citron \\\"cuit\\\" le poisson rapidement si le repos est trop long.\",\"1 c. à soupe d’Huile d'olive\",\"1/2 citron jaune (jus et zestes)\",\"1/2 bouquet ciselé finement\",\"1/2 c. à café concassée de baies roses (ou poivre blanc)\",\"1 pincée de Fleur de sel\"]},{\"id\":\"r-40469275db\",\"name\":\"MARINADE POISSON PROVENÇALE ☀️\",\"lines\":[\"1. La base de tomate: Dans un bol, diluez le concentré de tomates avec le jus de citron et l'huile d'olive jusqu'à obtenir un liquide fluide.\",\"2. Les aromates: Ajoutez les herbes de Provence, l'ail en poudre, le sel et le poivre.\",\"3. L'application: Enrobez vos filets de poisson blanc (cabillaud, colin, dorade) avec cette préparation rouge translucide.\",\"4. La mise en attente: Couvrez le plat et réservez au réfrigérateur pendant 20 minutes.\",\"5. La cuisson: Cette marinade est parfaite pour une cuisson du poisson en papillote ou à la poêle.\",\"2 c. à soupe d’huile d’olive\",\"1 c. à soupe de Jus de citron jaune\",\"1 c. à café rase de concentré de tomates\",\"1 c. à café d’Herbes de Provence\",\"1/2 c. à café d’Ail en poudre\",\"1 pincée de Sel, poivre\"]},{\"id\":\"r-6aabb8fd2b\",\"name\":\"MARINADE POISSON MAROCAINE 🌍\",\"lines\":[\"1. La chermoula: Dans un grand bol, mélangez l'huile d'olive et le jus de citron frais.\",\"2. L'apport d'herbes: Intégrez la coriandre, le persil haché et la purée d'ail.\",\"3. L'assaisonnement sec: Ajoutez le cumin, le paprika, le sel et le piment selon votre tolérance. Mélangez bien.\",\"4. L'enrobage: Plongez vos morceaux de poisson ou vos crevettes décortiquées dans cette chermoula traditionnelle.\",\"5. Le repos: Laissez macérer 30 minutes au frais pour que les épices imprègnent le cœur du poisson.\",\"2 c. à soupe d’huile d’olive\",\"2 c. à soupe de jus de citron jaune\",\"2 c. à soupe du mélange haché très finement de coriandre et Persil frais\",\"1/2 c. à café de chaque de paprika doux et Cumin en poudre\",\"1 gousse d'ail réduite en purée de Ail\",\"1 petite pointe de couteau (facultatif)\",\"1 pincée de Sel\"]},{\"id\":\"r-09e623b38b\",\"name\":\"MARINADE LÉGUMES RÔTIS ☀️\",\"lines\":[\"1. L'émulsion sucrée-salée: Dans un très grand saladier, fouettez l'huile d'olive, la sauce soja et le sirop d'agave.\",\"2. Le relief sec: Incorporez l'origan, l'ail en poudre, le sel et le poivre.\",\"3. Le bain de légumes: Jetez vos légumes coupés (brocolis, courgettes, carottes, champignons) directement dans le saladier.\",\"4. Le brassage: Mélangez énergiquement à l'aide de deux cuillères (ou avec vos mains propres) pour laquer chaque morceau de légume.\",\"5. L'utilisation: Il n'y a pas besoin de temps de repos. Étalez immédiatement les légumes sur une plaque de cuisson pour les enfourner.\",\"2 c. à soupe d’huile d’olive\",\"1 c. à soupe (pour l'effet umami) de sauce soja salée\",\"1 c. à café (aide à la caramélisation au four) de sirop d'agave (ou miel)\",\"1 c. à soupe d’Origan ou Thym séché\",\"1 c. à café d’Ail en poudre\",\"1 belle pincée\"]},{\"id\":\"r-b4b0610f04\",\"name\":\"MARINADE PATATE DOUCE / POMMES DE TERRE\",\"lines\":[\"1. Le mélange sec: Dans un grand saladier, combinez le paprika, les herbes de Provence, l'oignon en poudre, le sel et la fécule de maïs.\",\"2. La liaison: Versez l'huile sur les épices et mélangez pour obtenir une texture de pâte fluide.\",\"3. L'intégration: Ajoutez vos pommes de terre ou patates douces préalablement coupées en frites, en cubes ou en wedges.\",\"4. L'enrobage complet: Remuez longuement. La fécule et le paprika doivent former une fine pellicule colorée tout autour des morceaux.\",\"5. Le rôtissage: Disposez sur une plaque sans les superposer et enfournez à 200°C pour un résultat ultra-croustillant.\",\"2 c. à soupe de huile de colza ou de tournesol\",\"1 c. à soupe bombée de paprika doux\",\"1 c. à café d’Herbes de Provence\",\"1 c. à café d’Oignon en poudre\",\"1 c. à café (le secret pour le croustillant) de fécule de maïs (Maïzena)\",\"1/2 c. à café de Sel fin\"]}]}]]}]\ne:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#8FA89B\"}]]\n13:I[27201,[\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/_next/static/chunks/3_ww1dphlm37f.js\"],\"IconMark\"]\nb:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Pas de panique, on mange quoi ce soir ? 52 semaines de menus, du batchcooking simple et vos listes de courses automatisées.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/manifest.j
