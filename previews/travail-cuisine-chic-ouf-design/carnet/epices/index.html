\"font-heading text-3xl\",\"children\":\"Épices\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-sm font-normal leading-relaxed text-[#2B2B2B]\",\"children\":\"Voyagez depuis votre cuisine. Le dosage parfait pour réveiller vos plats sans jamais vous brûler le palais.\"}]]}],[\"$\",\"$L12\",null,{\"items\":[{\"id\":\"r-2b72316717\",\"name\":\"MÉLANGE HERBES DE PROVENCE MAISON ☀️🇫🇷\",\"lines\":[\"1. Le dosage: Mesurez précisément les herbes séchées à l'aide d'une cuillère doseuse.\",\"2. Le broyage léger: Versez toutes les herbes dans un mortier. Pilez très légèrement pendant quelques secondes pour casser les brins de romarin trop durs et libérer les huiles essentielles.\",\"3. L'homogénéisation: Mélangez le tout à l'aide d'une petite cuillère.\",\"4. Le transfert: Entonnez le mélange dans un bocal en verre propre et parfaitement sec.\",\"5. La conservation: Fermez hermétiquement et stockez à l'abri de la lumière et de l'humidité. Ce mélange se conserve 1 an et parfume les viandes, poissons et sauces tomates.\",\"3 c. à soupe de romarin séché\",\"3 c. à soupe de thym séché\",\"2 c. à soupe de sarriette séchée\",\"2 c. à soupe de origan séché\",\"1 c. à soupe de Basilic séché\"]},{\"id\":\"r-943f15fbe2\",\"name\":\"MÉLANGE SPÉCIAL POULET GRILLÉ ❤️\",\"lines\":[\"1. L'assemblage: Dans un petit bol, versez le paprika doux (qui donnera la belle couleur rouge), l'ail et l'oignon en poudre.\",\"2. Le relief: Ajoutez le thym séché, le cumin, le sel, le poivre noir et la pincée de piment si désiré.\",\"3. Le mélange: Remuez énergiquement à l'aide d'un mini-fouet ou d'une fourchette pour briser les petits amalgames d'épices.\",\"4. Le flaconnage: Versez la poudre homogène dans un flacon à épices (idéalement avec un opercule saupoudreur).\",\"5. L'usage: Prêt à l'emploi. Saupoudrez directement sur vos blancs de poulet ou frottez vos cuisses de poulet avant de les passer au four ou au grill.\",\"3 c. à soupe de paprika doux\",\"1 c. à soupe d’Ail en poudre\",\"1 c. à soupe d’Oignon en poudre\",\"1 c. à café de Thym séché\",\"1/2 c. à café de Cumin en poudre\",\"1 Piment de Cayenne\",\"1 c. à café de chaque de sel fin, poivre noir\"]},{\"id\":\"r-e5b6c7beb1\",\"name\":\"MÉLANGE FAJITAS / TEX-MEX 🌮\",\"lines\":[\"1. L'assemblage : Dans un récipient sec, rassemblez le chili, le paprika doux et le cumin en poudre.\",\"2. L'aromatisation : Ajoutez l'ail en poudre, l'origan séché, le sucre roux, le sel et le poivre.\",\"3. Le brassage : Mélangez vigoureusement à la fourchette pour éclater les agglomérats d'épices.\",\"4. Le stockage : Transférez le mélange dans un pot étanche à l'abri de la lumière.\",\"5. L'application : Utilisez 1 cuillère à soupe de ce mélange combiné à un filet d'huile pour enrober des lanières de poulet, des oignons et des poivrons avant de les sauter à la poêle pour vos fajitas.\",\"2 c. à soupe de chili en poudre\",\"2 c. à soupe de paprika doux\",\"1 c. à soupe bombée de cumin en poudre\",\"1 c. à café d’Ail en poudre\",\"1 c. à café d’Origan séché\",\"1/2 c. à café (indispensable pour casser le piquant et lier les saveurs) de sucre roux\",\"1/2 c. à café de chaque de sel, poivre noir\"]},{\"id\":\"r-bbee576cfa\",\"name\":\"🍗 poulet épicé\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"3 c. à soupe de Paprika fumé\",\"2 c. à soupe de Cumin\",\"1 c. à soupe de Coriandre moulue\",\"1 c. à soupe d’ail en poudre\",\"1 c. à soupe d’Oignon poudre\",\"1 c. à café d’Origan\",\"1 c. à café de Piment doux\",\"1. Coupez les légumes et aromates listés. Détaillez la viande en morceaux réguliers si nécessaire et préparez les épices et liquides prévus. Ingrédients à préparer pour cette recette : 3 c. à soupe de Paprika fumé, 2 c. à soupe de Cumin, 1 c. à soupe de Coriandre moulue, 1 c. à soupe d’ail en poudre, 1 c. à soupe d’Oignon poudre, 1 c. à café d’Origan.\",\"2. Faites dorer la viande dans la matière grasse indiquée, en plusieurs fois si nécessaire. Ajoutez les aromates et faites revenir brièvement sans les brûler.\",\"3. Ajoutez les légumes, épices, tomates ou liquide figurant dans la liste. Couvrez partiellement et laissez cuire jusqu’à ce que la viande soit cuite à cœur.\",\"4. Vérifiez la cuisson, goûtez et rectifiez l’assaisonnement avec les ingrédients prévus. Servez avec l’accompagnement mentionné dans la recette.\"]},{\"id\":\"r-cc0110cfac\",\"name\":\"MÉLANGE GREC SOLEIL ☀️\",\"lines\":[\"1. Le dosage : Mesurez l'origan séché et la menthe séchée dans un petit bol.\",\"2. Les poudres : Intégrez l'ail, l'oignon en poudre, le persil, le sel et le poivre noir.\",\"3. L'homogénéisation : Remuez délicatement avec une cuillère pour répartir les herbes et les poudres de manière uniforme.\",\"4. Le flaconnage : Versez dans votre contenant de stockage bien propre.\",\"5. L'application : Saupoudrez généreusement sur une salade composée de tomates, concombres, olives noires et feta, puis arrosez simplement d'un filet d'huile d'olive et de jus de citron.\",\"3 c. à soupe de origan séché\",\"1 c. à soupe (apporte la fraîcheur typique) de menthe séchée\",\"1 c. à soupe d’Ail en poudre\",\"1 c. à café d’Oignon en poudre\",\"1 c. à café de Persil séché\",\"1/2 c. à café de chaque de poivre noir, sel fin\"]},{\"id\":\"r-05b735f44d\",\"name\":\"🥗 salades méditerranéennes\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"3 c. à soupe d’Origan\",\"2 c. à soupe de Basilic\",\"1 c. à soupe d’ail en poudre\",\"1 c. à soupe de Paprika doux\",\"1 c. à soupe de Thym\",\"1 c. à café de Menthe séchée\",\"Poivre\",\"1. Laver et sécher les légumes. Couper les tomates et les crudités en morceaux réguliers.\",\"2. Si la fiche contient des œufs, les cuire 9 à 10 minutes dans l’eau bouillante puis les refroidir; cuire la protéine indiquée séparément jusqu’à cuisson complète.\",\"3. Répartir la salade et les légumes dans les assiettes, ajouter le féculent cuit et la protéine.\",\"4. Mélanger l’huile, le citron, les herbes, le sel et le poivre; assaisonner juste avant de servir.\",\"Cuisson des lentilles\"]},{\"id\":\"r-0fb1660969\",\"name\":\"MÉLANGE ITALIEN TOMATE \u0026 PIZZA 🍕\",\"lines\":[\"1. La base d'herbes : Combinez l'origan, le basilic et la marjolaine séchée dans un récipient.\",\"2. Le relief : Ajoutez l'ail en poudre, le sel et les flocons de piment rouge si vous aimez relever vos sauces.\",\"3. Le mélange : Brassez le tout pour obtenir une distribution homogène des différents éléments.\",\"4. Le conditionnement : Versez dans un bocal en verre muni d'un couvercle hermétique.\",\"5. L'application : Incorporez ce mélange directement dans une passata de tomates pour créer instantanément une sauce à pizza parfumée ou pour assaisonner un plat de pâtes.\",\"2 c. à soupe de origan séché\",\"2 c. à soupe de basilic séché\",\"1 c. à soupe de Marjolaine séchée\",\"1 c. à café d’Ail en poudre\",\"1/2 c. à café (facultatif, pour une note piquante) de flocons de piment rouge (peperoncino)\",\"1/2 c. à café de Sel fin\"]},{\"id\":\"r-b98c773116\",\"name\":\"🍆 légumes grillés\",\"lines\":[\"⏱️ Préparation : 12 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"300 g de courgette\",\"300 g de poivron rouge\",\"300 g d’aubergine\",\"1 oignon rouge\",\"2 c. à soupe d’huile d’olive\",\"2 gousses d’ail\",\"1 c. à café d’origan séché\",\"1 c. à café de thym\",\"Sel et poivre\",\"1. Préchauffez le four à 200 °C. Lavez les courgettes, le poivron et l’aubergine; coupez-les en morceaux d’environ 2 cm. Émincez l’oignon et hachez l’ail.\",\"2. Étalez les légumes sur une plaque. Ajoutez l’huile d’olive, l’ail, l’origan, le thym, le sel et le poivre, puis mélangez pour bien les enrober.\",\"3. Enfournez 25 à 30 minutes à 200 °C en retournant les légumes à mi-cuisson, jusqu’à ce qu’ils soient tendres et dorés.\",\"4. Goûtez, rectifiez l’assaisonnement si nécessaire et servez chaud pour 4 personnes.\"]},{\"id\":\"r-39b79f5312\",\"name\":\"MÉLANGE TAJINE MAROC 🌍\",\"lines\":[\"1. L'assemblage aromatique : Versez le gingembre, la cannelle, la coriandre et le cumin dans un bol.\",\"2. La couleur : Ajoutez le curcuma pour donner la teinte jaune-orangée traditionnelle des plats du Maghreb.\",\"3. Le liant sec : Intégrez le sel et le poivre noir, puis mélangez soigneusement les poudres.\",\"4. La mise en pot : Transférez dans un pot à épices hermétique.\",\"5. L'application : Idéal pour frictionner des cuisses de poulet ou des morceaux d'agneau avant de les faire mijoter en cocotte avec des olives, des citrons confits et un fond d'eau.\",\"2 c. à soupe de gingembre en poudre\",\"1 c. à soupe (la touche douce-amère emblématique) de cannelle en poudre\",\"1 c. à soupe de Coriandre en poudre\",\"1 c. à soupe de Cumin en poudre\",\"1 c. à soupe (pour la couleur dorée) de turmeric (Curcuma) en poudre\",\"1/2 c. à café de chaque de sel, poivre noir\"]},{\"id\":\"r-7e9ac7cf02\",\"name\":\"🍗 poulet marocain\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"2 c. à soupe de Cumin\",\"2 c. à soupe de Paprika\",\"1 c. à soupe de Curcuma\",\"1 c. à soupe d’ingembre\",\"1/2 c. à café de Cannelle\",\"1 c. à soupe de Coriandre moulue\",\"Poivre\",\"1. Coupez les légumes et aromates listés. Détaillez la viande en morceaux réguliers si nécessaire et préparez les épices et liquides prévus. Ingrédients à préparer pour cette recette : 2 c. à soupe de Cumin, 2 c. à soupe de Paprika, 1 c. à soupe de Curcuma, 1 c. à soupe d’ingembre, 1/2 c. à café de Cannelle, 1 c. à soupe de Coriandre moulue.\",\"2. Faites dorer la viande dans la matière grasse indiquée, en plusieurs fois si nécessaire. Ajoutez les aromates et faites revenir brièvement sans les brûler.\",\"3. Ajoutez les légumes, épices, tomates ou liquide figurant dans la liste. Couvrez partiellement et laissez cuire jusqu’à ce que la viande soit cuite à cœur.\",\"4. Vérifiez la cuisson, goûtez et rectifiez l’assaisonnement avec les ingrédients prévus. Servez avec l’accompagnement mentionné dans la recette.\"]},{\"id\":\"r-c526145b8c\",\"name\":\"MÉLANGE CURRY DOUX INDIEN 🍛\",\"lines\":[\"1. La base colorée : Mélangez le curcuma et la coriandre en poudre dans un bol sec.\",\"2. La profondeur : Ajoutez le cumin, le garam masala, le fenugrec et la cardamome qui apporte une note fraîche et camphrée.\",\"3. La finition : Intégrez le sel fin et brassez vigoureusement l'ensemble.\",\"4. Le stockage : Versez dans un flacon propre et sec, hermétiquement fermé.\",\"5. L'application : Faites revenir ce mélange 30 secondes dans un filet d'huile avant d'ajouter vos légumes coupés (carottes, pois chiches, pommes de terre) et du lait de coco pour un curry parfumé sans piquant agressif.\",\"2 c. à soupe de curcuma en poudre\",\"2 c. à soupe de coriandre en poudre\",\"1 c. à soupe de Cumin en poudre\",\"1 c. à café de Garam Masala\",\"1/2 c. à café de Fenugrec en poudre (facultatif)\",\"1/2 c. à café de Cardamome en poudre\",\"1/2 c. à café de Sel fin\"]},{\"id\":\"r-d7a5212511\",\"name\":\"🥕 légumes curry\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"4 c. à soupe de Curry doux\",\"1 c. à soupe de Curcuma\",\"1 c. à soupe d’ingembre\",\"1 c. à soupe de Cumin\",\"2 c. à soupe de Coriandre moulue\",\"1 c. à soupe de Paprika\",\"1. Coupez les légumes et aromates listés. Détaillez la viande en morceaux réguliers si nécessaire et préparez les épices et liquides prévus. Ingrédients à préparer pour cette recette : 4 c. à soupe de Curry doux, 1 c. à soupe de Curcuma, 1 c. à soupe d’ingembre, 1 c. à soupe de Cumin, 2 c. à soupe de Coriandre moulue, 1 c. à soupe de Paprika.\",\"2. Faites dorer la viande dans la matière grasse indiquée, en plusieurs fois si nécessaire. Ajoutez les aromates et faites revenir brièvement sans les brûler.\",\"3. Ajoutez les légumes, épices, tomates ou liquide figurant dans la liste. Couvrez partiellement et laissez cuire jusqu’à ce que la viande soit cuite à cœur.\",\"4. Vérifiez la cuisson, goûtez et rectifiez l’assaisonnement avec les ingrédients prévus. Servez avec l’accompagnement mentionné dans la recette.\"]},{\"id\":\"r-30b15ff2e3\",\"name\":\"MÉLANGE POISSON CITRONNÉ 🍋\",\"lines\":[\"1. L'acidité sèche : Versez les zestes de citron séchés et l'aneth dans un récipient.\",\"2. Le piquant subtil : Ajoutez le poivre blanc, l'ail en poudre et la pointe de gingembre.\",\"3. Le sel : Terminez par la fleur de sel et remuez l'ensemble délicatement.\",\"4. La mise en flacon : Versez le mélange dans un flacon à épices.\",\"5. L'application : Saupoudrez directement sur vos filets de poisson blanc, pavés de saumon ou brochettes de crevettes juste avant la cuisson à la vapeur, en papillote ou à la planche.\",\"2 c. à soupe de zestes de citron jaune séchés\",\"1 c. à soupe (plus subtil que le poivre noir pour le poisson) de poivre blanc moulu\",\"1 c. à soupe d’Aneth séché\",\"1 c. à café d’Ail en poudre\",\"1/2 c. à café de Gingembre en poudre\",\"1 c. à café de Fleur de sel\"]},{\"id\":\"r-b6e0c1f1bb\",\"name\":\"MÉLANGE LÉGUMES RÔTIS AU FOUR 🥕\",\"lines\":[\"1. Les herbes de terre : Dans un bol, rassemblez le romarin broyé fin et le thym séché.\",\"2. Le relief : Incorporez l'ail en poudre, le paprika, le sel et le poivre noir.\",\"3. Le brassage : Mélangez énergiquement à la fourchette pour casser les mottes d'ail en poudre.\",\"4. Le transfert : Versez dans un pot hermétique.\",\"5. L'application : Coupez vos pommes de terre en quartiers, arrosez-les d'une cuillère à soupe d'huile d'olive, saupoudrez de ce mélange et mélangez à la main avant d'étaler sur une plaque de cuisson.\",\"2 c. à soupe de romarin séché broyé\",\"2 c. à soupe de thym séché\",\"1 c. à soupe d’Ail en poudre\",\"1 c. à soupe (pour la coloration dorée) de paprika doux\",\"1 c. à café de chaque de sel fin, poivre noir\"]},{\"id\":\"r-cf9d5e66cb\",\"name\":\"🥔 pommes de terre\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"800 g de pommes de terre à chair ferme\",\"1 c. à soupe d’huile d’olive\",\"1 c. à café de paprika fumé\",\"1 c. à café de thym séché\",\"1 c. à café d’origan séché\",\"1/2 c. à café d’ail en poudre\",\"1/2 c. à café d’oignon en poudre\",\"Sel et poivre\",\"1. Préchauffer le four à 210 °C en chaleur tournante.\",\"2. Laver les pommes de terre et les couper en quartiers de taille similaire; les sécher soigneusement.\",\"3. Mélanger les quartiers avec l’huile, le paprika, le thym, l’origan, l’ail, l’oignon, le sel et le poivre.\",\"4. Étaler en une seule couche sur une plaque et cuire 30 minutes, en retournant à mi-cuisson.\",\"5. Vérifier que les pommes de terre sont dorées et tendres à cœur; prolonger 5 minutes si nécessaire.\",\"Velouté de poireaux\"]},{\"id\":\"r-c52e7c5a0c\",\"name\":\"MÉLANGE FRITES AU FOUR VERSION BISTROT 😋\",\"lines\":[\"1. Le goût fumé : Versez le paprika fumé et l'oignon en poudre dans un bol.\",\"2. Les aromates : Ajoutez l'ail en poudre, l'origan et la pincée de piment si vous souhaitez relever vos frites.\",\"3. L'homogénéisation : Mélangez longuement pour répartir uniformément le sel au sein des épices.\",\"4. La conservation : Stockez dans un récipient étanche.\",\"5. L'application : Saupoudrez sur vos frites de patates douces ou de pommes de terre préalablement huilées juste avant de les enfourner à 210°C pour obtenir un enrobage croustillant et très parfumé.\",\"2 c. à soupe (apporte le goût authentique du fumé de bistrot) de paprika fumé (Pimentón)\",\"1 c. à soupe d’Oignon en poudre\",\"1 c. à café d’Ail en poudre\",\"1 c. à café d’Origan séché\",\"1 c. à café rase de sel fin\",\"1 Piment de Cayenne\"]},{\"id\":\"r-a59202e976\",\"name\":\"🍠 patates douces\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"2 c. à soupe de Paprika fumé\",\"1 c. à soupe de Paprika doux\",\"1 c. à soupe d’ail en poudre\",\"1 c. à soupe d’Oignon poudre\",\"1 c. à soupe de Thym\",\"Poivre\",\"1. Préparez tous les ingrédients listés : lavez et coupez les légumes, émincez les aromates et mesurez les condiments et liquides prévus.\",\"2. Commencez par cuire les ingrédients demandant le plus de temps, avec la matière grasse indiquée. Faites dorer les protéines crues séparément si nécessaire.\",\"3. Ajoutez les autres ingrédients et les liquides prévus dans la liste. Faites cuire en remuant régulièrement jusqu’à ce que les légumes soient tendres et les protéines cuites à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement uniquement avec les éléments prévus dans la recette et servez avec l’accompagnement indiqué.\"]},{\"id\":\"r-6a927551a7\",\"name\":\"MÉLANGE RIZ \u0026 SEMOULE PARFUMÉS\",\"lines\":[\"1. La base visuelle : Mettez le curcuma dans votre récipient de préparation.\",\"2. Le profil oriental : Intégrez le cumin, la cannelle, la coriandre et la cardamome.\",\"3. Le liant sec : Ajoutez le sel fin et mélangez l'ensemble des poudres.\",\"4. Le flaconnage : Versez dans votre bocal de stockage.\",\"5. L'application : Ajoutez 1 cuillère à café de ce mélange directement dans l'eau de cuisson de votre riz ou mélangez-le à sec dans votre semoule avant de la réhydrater à l'eau bouillante.\",\"2 c. à soupe (donne une magnifique couleur jaune) de curcuma en poudre\",\"1 c. à soupe de Cumin en poudre\",\"1/2 c. à café de Cannelle en poudre\",\"1 c. à café de Graines de coriandre moulues\",\"1/2 c. à café de Cardamome en poudre\",\"1/2 c. à café de Sel fin\"]},{\"id\":\"r-b5131d111b\",\"name\":\"MÉLANGE SALADES FRAÎCHES 🌱\",\"lines\":[\"1. Les herbes vertes : Combinez la ciboulette, le persil et l'estragon séché dans un bol.\",\"2. La touche acidulée \u0026 croquante : Ajoutez l'écorce de citron (ou le sumac), les graines de sésame, le sel et le poivre blanc.\",\"3. Le mélange : Remuez délicatement pour ne pas écraser les graines de sésame.\",\"4. La mise en flacon : Transférez dans un flacon muni d'un opercule à larges trous.\",\"5. L'application : Saupoudrez directement sur vos salades vertes, salades de tomates ou crudités râpées, en complément de votre vinaigrette habituelle.\",\"2 c. à soupe de ciboulette séchée\",\"2 c. à soupe de persil séché\",\"1 c. à soupe d’Estragon séché\",\"1 c. à café d’Écorce de citron en poudre (ou sumac)\",\"1 c. à soupe (pour le croquant) de graines de sésame\",\"1/2 c. à café de chaque de sel marin fin, poivre blanc\"]}]}]]}]\ne:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#8FA89B\"}]]\n13:I[27201,[\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/_next/static/chunks/0x95rhs_coz14.js\"],\"IconMark\"]\nb:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Pas de panique, on mange quoi ce soir ? 52 semaines de menus, du batchcooking simple et vos listes de courses automatisées.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"6\",{\"rel\":\"icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/icon-192.png\",\"sizes\":\"192x192\",\"type\":\"image/png\"}],[\"$\",\"link\",\"7\",{\"rel\":\"icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/icon-512.png\",\"sizes\":\"512x512\",\"type\":\"image/png\"}],[\"$\",\"link\",\"8\",{\"rel\":\"apple-touch-icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/apple-touch-icon.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L13\",\"9\",{}]]\n"])</script></body></html>
