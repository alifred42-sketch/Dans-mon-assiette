ir le riz puis ajouter le bouillon progressivement.\",\"3. Dans une poêle, cuire les légumes et la protéine de la recette jusqu’à ce qu’ils soient tendres et cuits à cœur.\",\"4. Réunir la base féculente, la garniture et la sauce; mélanger 1 à 2 minutes, goûter et rectifier l’assaisonnement.\",\"5. Répartissez la préparation dans quatre assiettes, ajoutez la garniture prévue et servez dès que la cuisson est terminée.\",\"Sauce tomate\",\"Hachage basilic/ail\",\"Mélange final\"]},{\"id\":\"r-98311d04fe\",\"name\":\"Soupe froide courgettes St Môret\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"1 courgettes\",\"1 St Môret\",\"Menthe fraîche (5 g)\",\"1 citron\",\"Poivre moulu (0,5 g)\",\"Basilic frais (5 g)\",\"1 à 2 tartines complètes\",\"poivre\",\"basilic\",\"✅ 1 à 2 tartines complètes\",\"⚪ Déjà présent\",\"⭐⭐⭐⭐ parfait.\",\"1. Préparez les ingrédients pour 4 personnes : lavez et épluchez les légumes, coupez-les régulièrement, pesez les quantités et égouttez les conserves.\",\"2. Faites revenir les aromates dans un peu d’huile 3 minutes. Ajoutez les légumes coupés et le bouillon indiqué.\",\"3. Couvrez et laissez frémir 20 minutes, jusqu’à ce que les légumes soient tendres. Mixez finement.\",\"4. Ajoutez les herbes ou la crème prévues, rectifiez sel et poivre, puis servez chaud.\"]},{\"id\":\"r-24b005c4bf\",\"name\":\"🍳 Poêlée œufs brouillés, courgettes \u0026 tomates façon provençale\",\"lines\":[\"⏱️ Préparation : 12 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"fromage blanc : 100 g\",\"citron\",\"ciboulette\",\"paprika fumé : 1 c. à café\",\"herbes de Provence : 1 c. à café\",\"poivre\",\"✅ Découpe légumes\",\"✅ Sauce fromage blanc\",\"➡️ 1 tranche complète/personne\",\"❌ Non\",\"1. Lavez les courgettes et les tomates. Coupez les courgettes en petits dés, les tomates en quartiers et émincez l’oignon.\",\"2. Chauffez l’huile dans une grande poêle à feu moyen. Faites revenir l’oignon 3 minutes, puis ajoutez les co
