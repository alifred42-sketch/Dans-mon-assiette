e\":\"font-heading text-3xl\",\"children\":\"Je suis fatiguée\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-sm font-normal leading-relaxed text-[#2B2B2B]\",\"children\":\"Alerte rouge à la flemme !🚨 Zéro courage ? Voici nos jokers du placard ultra-réconfortants prêts avec 3 ingrédients.\"}]]}],[\"$\",\"$L12\",null,{\"items\":[{\"id\":\"r-c27d71faed\",\"name\":\"🥚 Tartine complète œuf avocat St Môret\",\"lines\":[\"1. Le support croustillant : Faites griller les 4 grandes tranches de pain complet au grille-pain pour qu'elles soient bien fermes et croustillantes.\",\"2. Le tartinage : Étalez le St Môret de manière égale sur une face de chaque tranche de pain encore tiède.\",\"3. Le lit vert : Coupez l'avocat en lamelles régulières. Répartissez-les sur la couche de St Môret et arrosez-les de quelques gouttes de jus de citron pour garder une couleur verte éclatante.\",\"4. L'œuf au plat : Dans une poêle antiadhésive à sec (ou avec une goutte d'huile), faites cuire les 4 œufs au plat pendant 3 à 4 minutes à feu moyen. Le blanc doit être pris et le jaune doit rester bien coulant.\",\"5. L'assemblage : Déposez délicatement un œuf au plat chaud sur chaque tartine à l'avocat. Ajoutez un tour de moulin à poivre noir et une mini-pincée de sel. Servez immédiatement (le jaune d'œuf va couler et napper l'avocat).\",\"4 tranches\",\"4 gros œufs\",\"1 bel avocat mûr coupé en tranches\",\"100 g de St Môret Ligne (ou nature)\",\"1 c. à café de Jus de citron jaune\",\"1 Sel, poivre noir du moulin\"]},{\"id\":\"r-50f64b1080\",\"name\":\"🍝 Pâtes express sauce tomate maison\",\"lines\":[\"1. La sauce tomate : Dans une casserole, faites chauffer l'huile d'olive. Ajoutez l'oignon émincé et l'ail pressé. Faites-les suer à feu moyen pendant 3 minutes sans les laisser colorer.\",\"2. Le mijotage : Versez la passata de tomates, ajoutez le mélange d'épices italiennes, le sel et le poivre. Portez à frémissement, baissez le feu au minimum et laissez mijoter à découvert pendant 12 minutes pour concentrer les saveurs.\",\"3. Le féculent : Parallèlement, faites cuire les pâtes dans un grand volume d'eau bouillante salée en suivant le temps indiqué sur le paquet pour une cuisson al dente. Égouttez-les.\",\"4. La liaison : Versez les pâtes égouttées directement dans la casserole de sauce tomate. Mélangez bien à la spatule pendant 1 minute à feu doux pour que la sauce nappe intimement les pâtes.\",\"5. Le service : Répartissez dans 4 assiettes creuses et saupoudrez d'un voile de parmesan râpé avant de servir bien chaud.\",\"280 g (poids cru) de pâtes (type Penne ou Spaghetti)\",\"500 g de Purée de tomates (Passata)\",\"1 oignon émincé\",\"2 gousses d'ail pressées\",\"1 c. à soupe d’Huile d'olive\",\"1 c. à soupe rase de mélange italien tomate \u0026 pizza\",\"20 g (pour le décor) de parmesan râpé\",\"1 pincée de Sel, poivre\"]},{\"id\":\"r-d5da6a7f15\",\"name\":\"🐟 Saumon fumé \u0026 pommes de terre minute\",\"lines\":[\"1. Le féculent rapide : Placez les petits dés de pommes de terre dans un récipient adapté au micro-ondes avec 2 cuillères à soupe d'eau. Couvrez d'un film étirable percé ou d'un couvercle et faites cuire à pleine puissance pendant 8 à 10 minutes. Les dés doivent être très fondants.\",\"2. La sauce fraîcheur : Pendant la cuisson, mélangez le fromage blanc (ou le Skyr) avec le jus de citron, la ciboulette ciselée, le sel et le poivre blanc dans un grand saladier.\",\"3. L'assemblage tiède : Ajoutez les dés de pommes de terre cuits et encore tièdes directement dans le saladier. Remuez délicatement pour les enrober de sauce crémeuse.\",\"4. L'apport marin : Intégrez les lanières de saumon fumé à la préparation de pommes de terre crémées.\",\"5. Le dressage : Mélangez une dernière fois tout doucement et servez immédiatement ce plat tiède-frais, parfait pour un déjeuner express.\",\"4 tranches (environ 160 g) coupées en lanières\",\"600 g épluchées et coupées en petits dés de pommes de terre à chair ferme\",\"4 c. à soupe de fromage blanc épais 0% ou Skyr\",\"1 c. à soupe ciselée de ciboulette fraîche\",\"1 c. à soupe de Jus de citron jaune\",\"1 pincée de Sel, poivre blanc\"]},{\"id\":\"r-a373d67eb6\",\"name\":\"Steak haché façon bistrot, haricots verts et champignons\",\"lines\":[\"1. Les légumes vapeur : Faites cuire les haricots verts à la vapeur (ou dans l'eau bouillante salée) pendant 8 minutes pour qu'ils soient tendres mais encore bien fermes. Égouttez-les.\",\"2. Le sauté forestier : Dans une grande poêle antiadhésive, faites chauffer la cuillère d'huile d'olive. Faites sauter les lamelles de champignons à feu vif pendant 3 minutes. Ajoutez les haricots verts cuits, l'ail en poudre, une pincée de sel et de poivre. Remuez pendant 2 minutes pour lier les légumes. Réservez au chaud.\",\"3. La viande : Dans la même poêle bien chaude, déposez les 4 steaks hachés de bœuf. Faites-les saisir à feu vif pendant 2 minutes de chaque côté (ajustez selon la cuisson désirée : saignant ou à point). Salez et poivrez en fin de cuisson.\",\"4. Le dressage bistrot : Dans 4 grandes assiettes, déposez un steak haché bien juteux. Disposez une généreuse poêlée de haricots verts et de champignons à côté.\",\"5. Le service : Servez immédiatement bien chaud, avec une pointe de moutarde si vous le souhaitez.\",\"4 pièces\",\"400 g d’Haricots verts (frais équeutés ou surgelés)\",\"200 g coupés en lamelles de champignons de Paris\",\"1 c. à café d’Huile d'olive\",\"1/2 c. à café d’Ail en poudre\",\"2 pincées de Sel, poivre noir\"]},{\"id\":\"r-63e8770e3f\",\"name\":\"Grande salade repas, sauce yaourt-moutarde\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 10 min\",\"👥 Pour 4 personnes\",\"1 grande salade verte\",\"3 tomates\",\"4 œufs\",\"1 boîte de thon au naturel (environ 140 g égoutté)\",\"125 g de mozzarella\",\"30 g de noix\",\"1 c. à soupe de moutarde\",\"1 citron\",\"3 c. à soupe d’huile d’olive\",\"4 tranches de pain complet\",\"Sel et poivre\",\"1. Cuire les œufs 9 à 10 minutes dans l’eau frémissante. Les refroidir sous l’eau froide, les écaler et les couper en quartiers.\",\"2. Laver et essorer la salade. Couper les tomates et la mozzarella en morceaux; égoutter le thon.\",\"3. Dans un bol, mélanger la moutarde, 1 à 2 c. à soupe de jus de citron, l’huile d’olive, le sel et le poivre. Ajouter une cuillère d’eau si la sauce est trop épaisse.\",\"4. Répartir salade, tomates, thon, mozzarella, œufs et noix dans quatre assiettes. Napper de sauce et servir avec le pain complet.\",\"Sauce yaourt-moutarde aux herbes\",\"Hacher les aromates 5 sec/vitesse 5 et racler les parois.\",\"Ajouter l’huile et faire revenir 3 min/120 °C/vitesse 1.\",\"Ajouter les ingrédients de la sauce et cuire 15 à 25 min/100 °C/vitesse 1; vérifier la réduction et la cuisson.\",\"Pour la viande hachée, utiliser le sens inverse et la vitesse mijotage si le modèle le permet; vérifier la cuisson à cœur.\",\"Étapes complétées lors de l’audit test des semaines 1 et 2 : adapter les cuissons aux ingrédients exacts et vérifier la cuisson à cœur des viandes et poissons.\"]},{\"id\":\"r-f39050adb8\",\"name\":\"🌯 Wrap chaud poulet fromage\",\"lines\":[\"1. La grillade : Dans une poêle contenant l'huile d'olive, faites sauter l'oignon émincé et les lanières de poulet avec le mélange d'épices pour poulet grillé pendant 6 minutes à feu vif. Le poulet doit être bien cuit et doré. Salez et poivrez.\",\"2. Le montage : Étalez les 4 tortillas sur votre plan de travail. Répartissez le poulet et les oignons chauds au centre de chaque wrap.\",\"3. Le fromage fondant : Saupoudrez immédiatement le fromage râpé (ou des morceaux de mozzarella) sur le poulet brûlant.\",\"4. Le pliage serré : Rabattez le bas de la tortilla, puis roulez le wrap fermement sur lui-même pour enfermer la garniture.\",\"5. Le toastage en poêle : Déposez les wraps pliés dans la poêle encore chaude à sec (côté pliure vers le bas) pendant 1 à 2 minutes de chaque côté. La tortilla va devenir croustillante et le fromage va fondre à l'\",\"4 grands wraps\",\"400 g coupés en fines lanières de blancs de poulet\",\"100 g de Mozzarella allégée ou Emmental râpé\",\"1/2 oignon émincé\",\"1 c. à café de Mélange spécial poulet grillé\",\"1 c. à café d’Huile d'olive\",\"1 pincée de Sel, poivre\"]},{\"id\":\"r-a36eca5de2\",\"name\":\"🍳 Poêlée œufs façon espagnole\",\"lines\":[\"1. La base aromatique: Dans une grande poêle antiadhésive, faites chauffer l'huile d'olive. Faites suer l'oignon émincé et les lanières de poivrons pendant 7 minutes à feu moyen jusqu'à ce qu'ils soient tendres.\",\"2. Le relief: Ajoutez les tranches de chorizo (ou bacon) et les rondelles de pommes de terre précuites. Saupoudrez de paprika fumé, de sel et de poivre. Laissez dorer le tout pendant 4 minutes en remuant délicatement.\",\"3. Les puits de cuisson: À l'aide d'une cuillère en bois, creusez 4 petits puits distincts dans la poêlée de légumes.\",\"4. Les œufs: Cassez délicatement un œuf frais dans chaque puits (veillez à ce que le jaune reste entier).\",\"5. La prise: Couvrez la poêle et laissez cuire à feu doux pendant 4 minutes. Le blanc d'œuf doit être parfaitement opaque et le jaune rester bien coulant. Servez chaud directement dans la poêle.\",\"4 gros œufs\",\"1 de chaque, coupés en lanières\",\"1 gros oignon émincé\",\"200 g coupées en rondelles de pommes de terre cuites\",\"50 g coupés en fines tranches de chorizo doux (ou bacon en dés pour plus de légèreté)\",\"1 c. à café d’Huile d'olive\",\"1 Paprika fumé, sel, poivre\"]},{\"id\":\"r-5ab6473efd\",\"name\":\"🐟 Cabillaud tomate courgettes express\",\"lines\":[\"1. Le sauté de légumes: Dans une grande sauteuse, faites chauffer l'huile d'olive. Ajoutez l'ail pressé et les fines rondelles de courgettes. Faites sauter à feu vif pendant 4 minutes.\",\"2. La sauce: Versez la passata de tomates sur les courgettes. Ajoutez le mélange d'épices italiennes, le sel et le poivre. Mélangez bien et laissez frémir pendant 3 minutes à feu moyen.\",\"3. Le poisson: Déposez délicatement les 4 filets de cabillaud crus directement dans la sauce tomate aux courgettes.\",\"4. Le mijotage à l'étouffée: Couvrez la sauteuse, baissez le feu et laissez pocher le poisson pendant 7 à 8 minutes. La chair du cabillaud doit devenir opaque et se détacher facilement.\",\"5. Le service: Répartissez le poisson et sa sauce aux légumes dans 4 assiettes creuses. Accompagnez de riz ou de quinoa.\",\"4 filets (environ 600 g)\",\"2 courgettes moyennes coupées en fines rondelles\",\"400 g de Purée de tomates (Passata) ou pulpe en conserve\",\"2 gousses d'ail pressées\",\"1 c. à café d’Huile d'olive\",\"1 c. à soupe rase de mélange italien tomate \u0026 pizza\",\"1 pincée de Sel, poivre\"]},{\"id\":\"r-26c39ad517\",\"name\":\"🧀 Croque complet salade\",\"lines\":[\"1. Le tartinage: Tartinez une face des 8 tranches de pain de mie complet avec le fromage frais.\",\"2. Le montage: Sur 4 tranches (face fromage vers le haut), déposez une tranche de jambon blanc pliée et répartissez la moitié de l'Emmental râpé. Refermez les croques avec les 4 tranches restantes. Saupoudrez le dessus avec le reste d'Emmental.\",\"3. La cuisson grill: Placez les croques sous le grill du four à 200°C (ou dans un appareil adapté) pendant 6 minutes jusqu'à ce que le pain soit doré et croustillant.\",\"4. L'accompagnement: Pendant ce temps, préparez la vinaigrette dans un saladier en mélangeant l'huile, le jus de citron, le sel et le poivre. Ajoutez les jeunes pousses et remuez.\",\"5. Le dressage: Servez chaque croque-monsieur chaud coupé en deux triangles, accompagné d'une généreuse poignée de salade parsemée du mélange d'épices pour salade.\",\"8 tranches\",\"4 tranches\",\"4 c. à soupe de fromage frais (type St Môret Ligne)\",\"40 g d’Emmental râpé\",\"1 c. à café de Mélange salades fraîches\",\"150 g de jeunes pousses + 1 c. à soupe d'huile d'olive + 1 c. à soupe de jus de citron. de pour la salade\"]},{\"id\":\"r-46db79901d\",\"name\":\"🍚 Riz sauté express façon asiatique\",\"lines\":[\"1. La cuisson protéinée: Dans un grand wok ou une grande poêle, faites chauffer l'huile à feu vif. Faites sauter les petits dés de poulet pendant 3 minutes jusqu'à ce qu'ils soient cuits et dorés.\",\"2. L'omelette minute: Poussez le poulet sur un côté du wok. Versez les œufs battus de l'autre côté et mélangez-les rapidement à la spatule pour créer des œufs brouillés. Remuez ensuite le tout.\",\"3. Le grain: Ajoutez le riz cuit froid et les petits pois dans le wok. Faites sauter l'ensemble pendant 2 minutes à feu très vif en remuant constamment pour détacher les grains de riz.\",\"4. L'assaisonnement: Versez la sauce soja salée en filet sur le riz tout en continuant de remuer pendant 1 minute pour bien colorer le plat.\",\"5. La fraîcheur: Retirez du feu, parsemez avec l'oignon nouveau émincé et servez immédiatement bien chaud.\",\"500 g cuit de riz blanc précuit (type Basmati, idéalement de la veille)\",\"250 g coupés en petits dés de blancs de poulet (ou crevettes)\",\"100 g de Petits pois (surgelés ou en conserve)\",\"2 œufs battus\",\"2 c. à soupe de sauce soja salée (réduite en sodium)\",\"1 c. à soupe d’Huile de sésame (ou de tournesol)\",\"1 pièce émincée de Oignon nouveau (ou ciboule)\"]}]}]]}]\ne:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#8FA89B\"}]]\n13:I[27201,[\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/_next/static/chunks/3_ww1dphlm37f.js\"],\"IconMark\"]\nb:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Pas de panique, on mange quoi ce soir ? 52 semaines de menus, du batchcooking simple et vos listes de courses automatisées.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\
