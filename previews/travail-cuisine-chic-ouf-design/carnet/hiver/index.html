 200 g de jaune d’œuf et 150 ml de crème légère, 200 g de citron; cuisez à feu moyen-doux 30 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Blanquette\",\"Blanquette de poulet\"]},{\"id\":\"r-f33821e206\",\"name\":\"🧀 Gratin dauphinois + salade\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 50 min\",\"👥 Pour 4 personnes\",\"800 g de pommes de terre\",\"250 ml de lait\",\"250 ml de crème légère\",\"1 gousse d’ail\",\"1 pincée de muscade\",\"100 g de fromage râpé\",\"Sel et poivre\",\"\\\"Gratin dauphinois\\\"\",\"1. Préchauffez le four à 180 °C. Épluchez les pommes de terre et coupez-les en rondelles fines de 2 à 3 mm. Frottez un plat à gratin avec la gousse d’ail coupée en deux.\",\"2. Disposez les pommes de terre en couches dans le plat. Salez et poivrez légèrement chaque couche, puis ajoutez la muscade.\",\"3. Mélangez le lait et la crème, versez sur les pommes de terre et répartissez le fromage râpé sur le dessus.\",\"4. Enfournez 45 à 50 minutes à 180 °C. Vérifiez la tendreté avec la pointe d’un couteau; couvrez de papier cuisson si le dessus dore trop vite.\",\"Gratin dauphinois\"]},{\"id\":\"r-768e2e4a95\",\"name\":\"🐟 Parmentier de poisson\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"400 g de cabillaud\",\"400 g de saumon\",\"2 pommes de terre\",\"150 ml de lait\",\"persil\",\"100 g de parmesan dessus\",\"\\\"Hachis parmentier\\\"\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Assembler les ingrédients dans un plat adapté et cuire au four préchauffé à 180 °C jusqu’à cuisson à cœur.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Hachis parmentier\"]},{\"id\":\"r-48999379ec\",\"name\":\"🥚 Œufs cocotte poireaux chèvre\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"200 g de œufs\",\"200 g de fondue de poireaux\",\"100 g de chèvre frais\",\"150 ml de crème légère\",\"poivre\",\"1 c. à soupe d’ciboulette\",\"4 tranches de pain complet\",\"ciboulette\",\"pain complet\",\"\\\"Œufs cocotte\\\"\",\"1. Laver et couper les légumes en petits morceaux; râper ou émietter le fromage.\",\"2. Faire revenir les légumes dans une poêle avec l’huile pendant 5 à 8 minutes, jusqu’à ce qu’ils soient tendres.\",\"3. Battre les œufs avec le sel et le poivre, puis verser sur les légumes.\",\"4. Cuire à feu moyen-doux 4 à 6 minutes, ajouter le fromage et couvrir jusqu’à ce que les œufs soient pris.\",\"Œufs cocotte\"]},{\"id\":\"r-4b8db26421\",\"name\":\"🥩 Bœuf bourguignon\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"200 g de bœuf à mijoter\",\"2 carottes\",\"250 g de champignons\",\"1 oignon\",\"1 c. à soupe d’thym\",\"200 g de laurier\",\"1 gousse d’ail\",\"200 g de bœuf\",\"thym\",\"laurier\",\"ail\",\"\\\"Bœuf bourguignon\\\"\",\"À préparer le dimanche pour plusieurs repas.\",\"1. Préparez pour 4 personnes : 200 g de bœuf à mijoter, 2 carottes, 250 g de champignons, 1 oignon, 1 c. à soupe d’thym, 200 g de laurier, 1 gousse d’ail, 200 g de bœuf. Battez les œufs avec le sel, le poivre et les herbes indiqués. (15 min)\",\"2. Faites revenir 2 carottes, 250 g de champignons, 1 oignon, 1 gousse d’ail dans une poêle antiadhésive 5 à 7 min.\",\"3. Ajoutez les œufs battus et 200 g de bœuf à mijoter, 200 g de bœuf; cuisez à feu moyen-doux 15 min, jusqu’à ce que le centre soit pris.\",\"4. Vérifiez que les œufs sont entièrement cuits, partagez en 4 portions et servez.\",\"Bœuf bourguignon\"]},{\"id\":\"r-3c29bc5010\",\"name\":\"🥬 Chou farci revisité\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"1 chou vert\",\"400 g de viande hachée\",\"300 g de riz\",\"2 tomates\",\"paprika\",\"persil\",\"\\\"Chou farci\\\"\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Chou farci\"]},{\"id\":\"r-45b814e25e\",\"name\":\"🍝 Gratin de pâtes jambon mozzarella\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"300 g de pâtes\",\"400 g de jambon\",\"100 g de mozzarella\",\"2 sauce tomate\",\"basilic\",\"origan\",\"\\\"Gratin de pâtes\\\"\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Cuire le féculent dans l’eau ou le bouillon selon les indications du paquet, puis l’associer aux autres ingrédients.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Gratin de pâtes\"]},{\"id\":\"r-ae5fd0a220\",\"name\":\"🥔 Tartiflette légère\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"2 pommes de terre\",\"2 oignons\",\"400 g de lardons ou jambon\",\"1 reblochon\",\"1 une grosse salade verte\",\"une grosse salade verte\",\"\\\"Tartiflette\\\"\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Tartiflette\"]},{\"id\":\"r-30a78971c9\",\"name\":\"🍲 Lentilles corail façon curry\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"1 gousse d’lentilles corail\",\"2 carottes\",\"2 tomates\",\"150 ml de lait de coco\",\"curry\",\"1 curcuma\",\"cumin\",\"curcuma\",\"\\\"Dahl de lentilles\\\"\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Dahl de lentilles\"]},{\"id\":\"r-505f3338a3\",\"name\":\"Risotto aux champignons et parmesan\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"320 g de riz arborio\",\"400 g de champignons de Paris\",\"1 oignon\",\"1,1 l de bouillon chaud\",\"100 ml de vin blanc (facultatif)\",\"60 g de parmesan râpé\",\"1 c. à soupe d’huile d’olive\",\"20 g de beurre\",\"Poivre et persil frais\",\"1. Préparez pour 4 personnes : 320 g de riz arborio, 400 g de champignons de Paris, 1 oignon, 1,1 l de bouillon chaud, 100 ml de vin blanc (facultatif), 60 g de parmesan râpé, 1 c. à soupe d’huile d’olive, 20 g de beurre, Poivre et persil frais. Lavez et coupez les légumes. (10 min)\",\"2. Cuisez 320 g de riz arborio dans l’eau bouillante salée selon le paquet; égouttez.\",\"3. Faites revenir 400 g de champignons de Paris, 1 oignon 5 à 8 min dans la matière grasse prévue; ajoutez 1,1 l de bouillon chaud, 1 c. à soupe d’huile d’olive et poursuivez 15 min en vérifiant la cuisson.\",\"4. Mélangez avec le féculent cuit, ajoutez les herbes et assaisonnements de la fiche, puis répartissez en 4 portions.\",\"Monsieur Cuisine : hacher l’oignon 5 s / vitesse 6, racler. Ajouter huile et faire revenir 3 min / 120 °C / vitesse 1. Ajouter riz, faire nacrer 2 min / 100 °C / vitesse 1 inversée si disponible. Ajouter les champignons et le bouillon chaud, cuire environ 18 à 20 min / 100 °C / vitesse 1 inversée; contrôler la cuisson et ajouter un peu de bouillon si nécessaire. Incorporer parmesan et persil en fin de cuisson.\",\"🐟 saumon\",\"🍗 poulet\",\"🥒 courgettes\",\"Étapes complétées lors de l’audit test des semaines 1 et 2 : adapter les cuissons aux ingrédients exacts et vérifier la cuisson à cœur des viandes et poissons.\"]},{\"id\":\"cco-veloute-potimarron\",\"name\":\"🥣 Velouté de potimarron et carotte\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"800 g de potimarron épépiné\",\"2 carottes (environ 200 g)\",\"1 pomme de terre (environ 180 g)\",\"1 oignon\",\"700 ml de bouillon de légumes\",\"100 ml de crème légère\",\"1 c. à soupe d’huile d’olive\",\"Sel fin (2 g) et poivre moulu (0,5 g)\",\"1. Éplucher l’oignon, les carottes et la pomme de terre. Retirer les graines du potimarron et couper la chair en cubes.\",\"2. Faire revenir l’oignon dans l’huile 3 minutes dans une grande casserole.\",\"3. Ajouter les légumes et le bouillon; porter à frémissement puis cuire 20 à 25 minutes, jusqu’à ce que tous les morceaux soient tendres.\",\"4. Mixer soigneusement jusqu’à obtenir un velouté lisse. Ajouter la crème, la muscade, le sel et le poivre.\",\"5. Réchauffer 2 minutes à feu doux sans faire bouillir, puis servir.\",\"Hacher l’oignon 5 sec/vitesse 5. Racler les parois, ajouter l’huile et faire revenir 3 min/120 °C/vitesse 1.\",\"Ajouter les légumes en cubes et le bouillon. Cuire 22 min/100 °C/vitesse 1.\",\"Mixer progressivement 30 à 60 sec/vitesse 6 à 8, en augmentant doucement. Ajouter la crème et assaisonner. Ne pas dépasser la capacité maximale du bol.\"]},{\"id\":\"cco-veloute-poireaux\",\"name\":\"🥣 Velouté poireaux-pomme de terre\",\"lines\":[\"⏱️ Préparation : 12 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"3 poireaux (environ 450 g)\",\"400 g de pommes de terre\",\"1 oignon\",\"750 ml de bouillon de légumes\",\"100 ml de lait ou crème légère\",\"1 c. à soupe d’huile d’olive\",\"Sel fin (2 g) et poivre moulu (0,5 g)\",\"1. Laver soigneusement les poireaux et les émincer. Éplucher les pommes de terre et les couper en cubes.\",\"2. Faire revenir l’oignon émincé dans l’huile 3 minutes.\",\"3. Ajouter les poireaux, les pommes de terre et le bouillon. Porter à ébullition puis cuire 22 à 25 minutes à petits frémissements.\",\"4. Mixer jusqu’à obtenir une texture lisse; incorporer le lait ou la crème.\",\"5. Saler, poivrer et servir chaud.\",\"Hacher l’oignon 5 sec/vitesse 5 puis faire revenir avec l’huile 3 min/120 °C/vitesse 1.\",\"Ajouter poireaux, pommes de terre et bouillon. Cuire 23 min/100 °C/vitesse 1.\",\"Mixer progressivement 30 à 60 sec/vitesse 6 à 8. Ajouter le lait ou la crème et assaisonner.\"]}]}]]}]\ne:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#8FA89B\"}]]\n13:I[27201,[\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/_next/static/chunks/0wk86n3bmty0z.js\"],\"IconMark\"]\nb:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Pas de panique, on mange quoi ce soir ? 52 semaines de menus, du batchcooking simple et vos listes de courses automatisées.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"6\",{\"rel\":\"icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/icon-192.png\",\"sizes\":\"192x192\",\"type\":\"image/png\"}],[\"$\",\"link\",\"7\",{\"rel\":\"icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/icon-512.png\",\"sizes\":\"512x512\",\"type\":\"image/png\"}],[\"$\",\"link\",\"8\",{\"rel\":\"apple-touch-icon\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/apple-touch-icon.png\",
