t émincer l’oignon; laver et couper les légumes en morceaux réguliers.\",\"2. Faire chauffer l’huile dans une cocotte. Saisir la viande en plusieurs fois 3 à 5 minutes pour la colorer, puis réserver si nécessaire.\",\"3. Faire revenir l’oignon 3 minutes, ajouter les légumes et les épices de la recette, puis mélanger 1 minute.\",\"4. Remettre la viande, ajouter le liquide ou la sauce prévus et couvrir. Mijoter 20 à 35 minutes selon la pièce et la taille des morceaux; vérifier la cuisson à cœur.\",\"5. Goûter, rectifier l’assaisonnement et servir chaud avec l’accompagnement prévu.\",\"Blanquette\",\"Blanquette de poulet\"]},{\"id\":\"r-f33821e206\",\"name\":\"🧀 Gratin dauphinois + salade\",\"lines\":[\"pommes de terre\",\"lait\",\"crème\",\"ail\",\"muscade\",\"🧀 Option :\",\"un peu de fromage râpé\",\"\\\"Gratin dauphinois\\\"\",\"Gratin dauphinois\"]},{\"id\":\"r-768e2e4a95\",\"name\":\"🐟 Parmentier de poisson\",\"lines\":[\"cabillaud\",\"saumon\",\"pommes de terre\",\"lait\",\"persil\",\"🧀 Option :\",\"parmesan dessus\",\"\\\"Hachis parmentier\\\"\",\"Hachis parmentier\"]},{\"id\":\"r-48999379ec\",\"name\":\"🥚 Œufs cocotte poireaux chèvre\",\"lines\":[\"200 g de œufs\",\"200 g de fondue de poireaux\",\"100 g de chèvre frais\",\"150 ml de crème légère\",\"poivre\",\"1 c. à soupe d’ciboulette\",\"4 tranches de pain complet\",\"ciboulette\",\"pain complet\",\"\\\"Œufs cocotte\\\"\",\"1. Laver et couper les légumes en petits morceaux; râper ou émietter le fromage.\",\"2. Faire revenir les légumes dans une poêle avec l’huile pendant 5 à 8 minutes, jusqu’à ce qu’ils soient tendres.\",\"3. Battre les œufs avec le sel et le poivre, puis verser sur les légumes.\",\"4. Cuire à feu moyen-doux 4 à 6 minutes, ajouter le fromage et couvrir jusqu’à ce que les œufs soient pris.\",\"Œufs cocotte\"]},{\"id\":\"r-4b8db26421\",\"name\":\"🥩 Bœuf bourguignon\",\"lines\":[\"200 g de bœuf à mijoter\",\"2 carottes\",\"250 g de champignons\",\"1 oignons\",\"1 c. à soupe d’thym\",\"200 g de laurier\",\"1 gousse d’\",\"200 g de bœuf\",\"thym\",\"laurier\",\"ail\",\"\\\"Bœuf bourguignon\\\"\",\"À préparer le dimanche pour plusieurs repas.\",\"1. Laver et couper les légumes en petits morceaux; râper ou émietter le fromage.\",\"2. Faire revenir les légumes dans une poêle avec l’huile pendant 5 à 8 minutes, jusqu’à ce qu’ils soient tendres.\",\"3. Battre les œufs avec le sel et le poivre, puis verser sur les légumes.\",\"4. Cuire à feu moyen-doux 4 à 6 minutes, ajouter le fromage et couvrir jusqu’à ce que les œufs soient pris.\",\"Bœuf bourguignon\"]},{\"id\":\"r-3c29bc5010\",\"name\":\"🥬 Chou farci revisité\",\"lines\":[\"chou vert\",\"viande hachée\",\"riz\",\"tomates\",\"paprika\",\"persil\",\"\\\"Chou farci\\\"\",\"Chou farci\"]},{\"id\":\"r-45b814e25e\",\"name\":\"🍝 Gratin de pâtes jambon mozzarella\",\"lines\":[\"pâtes\",\"jambon\",\"mozzarella\",\"sauce tomate\",\"basilic\",\"origan\",\"\\\"Gratin de pâtes\\\"\",\"Gratin de pâtes\"]},{\"id\":\"r-ae5fd0a220\",\"name\":\"🥔 Tartiflette légère\",\"lines\":[\"pommes de terre\",\"oignons\",\"lardons ou jambon\",\"reblochon\",\"une grosse salade verte\",\"\\\"Tartiflette\\\"\",\"Tartiflette\"]},{\"id\":\"r-30a78971c9\",\"name\":\"🍲 Lentilles corail façon curry\",\"lines\":[\"lentilles corail\",\"carottes\",\"tomates\",\"lait de coco\",\"curry\",\"curcuma\",\"cumin\",\"\\\"Dahl de lentilles\\\"\",\"Dahl de lentilles\"]},{\"id\":\"r-505f3338a3\",\"name\":\"Risotto aux champignons et parmesan\",\"lines\":[\"320 g de riz arborio\",\"400 g de champignons de Paris\",\"1 oignon\",\"1,1 l de bouillon chaud\",\"100 ml de vin blanc (facultatif)\",\"60 g de parmesan râpé\",\"1 c. à soupe d’huile d’olive\",\"20 g de beurre\",\"Poivre et persil frais\",\"1. Nettoyer les champignons et les couper en lamelles. Émincer l’oignon et garder le bouillon chaud.\",\"2. Dans une sauteuse, faire revenir l’oignon dans l’huile et le beurre 2 minutes. Ajouter les champignons et cuire 5 minutes.\",\"3. Ajouter le riz et remuer 1 à 2 minutes jusqu’à ce que les grains deviennent nacrés. Verser le vin blanc si utilisé et laisser évaporer.\",\"4. Ajouter le bouillon chaud progressivement, une louche à la fois, en remuant souvent. Cuire environ 18 à 20 minutes, jusqu’à ce que le riz soit crémeux et tendre.\",\"5. Hors du feu, incorporer le parmesan et le persil. Poivrer, goûter et servir immédiatement.\",\"Monsieur Cuisine : hacher l’oignon 5 s / vitesse 6, racler. Ajouter huile et faire revenir 3 min / 120 °C / vitesse 1. Ajouter riz, faire nacrer 2 min / 100 °C / vitesse 1 inversée si disponible. Ajouter les champignons et le bouillon chaud, cuire environ 18 à 20 min / 100 °C / vitesse 1 inversée; contrôler la cuisson et ajouter un peu de bouillon si nécessaire. Incorporer parmesan et persil en fin de cuisson.\",\"🐟 saumon\",\"🍗 poulet\",\"🥒 courgettes\",\"Étapes complétées lors de l’audit test des semaines 1 et 2 : adapter les cuissons aux ingrédients exacts et vérifier la cuisson à cœur des viandes et poissons.\"]},{\"id\":\"cco-veloute-potimarron\",\"name\":\"🥣 Velouté de potimarron et carotte\",\"lines\":[\"800 g de potimarron épépiné\",\"2 carottes (environ 200 g)\",\"1 pomme de terre (environ 180 g)\",\"1 oignon\",\"700 ml de bouillon de légumes\",\"100 ml de crème légère\",\"1 c. à soupe d’huile d’olive\",\"Sel, poivre et noix de muscade\",\"1. Éplucher l’oignon, les carottes et la pomme de terre. Retirer les graines du potimarron et couper la chair en cubes.\",\"2. Faire revenir l’oignon dans l’huile 3 minutes dans une grande casserole.\",\"3. Ajouter les légumes et le bouillon; porter à frémissement puis cuire 20 à 25 minutes, jusqu’à ce que tous les morceaux soient tendres.\",\"4. Mixer soigneusement jusqu’à obtenir un velouté lisse. Ajouter la crème, la muscade, le sel et le poivre.\",\"5. Réchauffer 2 minutes à feu doux sans faire bouillir, puis servir.\",\"Hacher l’oignon 5 sec/vitesse 5. Racler les parois, ajouter l’huile et faire revenir 3 min/120 °C/vitesse 1.\",\"Ajouter les légumes en cubes et le bouillon. Cuire 22 min/100 °C/vitesse 1.\",\"Mixer progressivement 30 à 60 sec/vitesse 6 à 8, en augmentant doucement. Ajouter la crème et assaisonner. Ne pas dépasser la capacité maximale du bol.\"]},{\"id\":\"cco-veloute-poireaux\",\"name\":\"🥣 Velouté poireaux-pomme de terre\",\"lines\":[\"3 poireaux (environ 450 g)\",\"400 g de pommes de terre\",\"1 oignon\",\"750 ml de bouillon de légumes\",\"100 ml de lait ou crème légère\",\"1 c. à soupe d’huile d’olive\",\"Sel et poivre\",\"1. Laver soigneusement les poireaux et les émincer. Éplucher les pommes de terre et les couper en cubes.\",\"2. Faire revenir l’oignon émincé dans l’huile 3 minutes.\",\"3. Ajouter les poireaux, les pommes de terre et le bouillon. Porter à ébullition puis cuire 22 à 25 minutes à petits frémissements.\",\"4. Mixer jusqu’à obtenir une texture lisse; incorporer le lait ou la crème.\",\"5. Saler, poivrer et servir chaud.\",\"Hacher l’oignon 5 sec/vitesse 5 puis faire revenir avec l’huile 3 min/120 °C/vitesse 1.\",\"Ajouter poireaux, pommes de terre et bouillon. Cuire 23 min/100 °C/vitesse 1.\",\"Mixer progressivement 30 à 60 sec/vitesse 6 à 8. Ajouter le lait ou la crème et assaisonner.\"]}]}]]}]\ne:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#8FA89B\"}]]\n13:I[27201,[\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/_next/static/chunks/2fj33kogub60x.js\"],\"IconMark\"]\nb:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Pas de panique, on mange quoi ce soir ? 52 semaines de menus, du batchcooking simple et vos listes de courses automatisées.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"met
