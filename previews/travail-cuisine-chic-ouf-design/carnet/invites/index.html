\",\"h1\",null,{\"className\":\"font-heading text-3xl\",\"children\":\"Recevoir\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-sm font-normal leading-relaxed text-[#2B2B2B]\",\"children\":\"Mettez les petits plats dans les grands sans y laisser votre calme. Vos invités vont être bluffés, et vous aussi !\"}]]}],[\"$\",\"$L12\",null,{\"items\":[{\"id\":\"r-77321f17d7\",\"name\":\"🥒 Verrines avocat crevettes citron\",\"lines\":[\"1. La crème d'avocat: Prélevez la chair des deux avocats. Mixez-la finement avec la moitié du jus de citron jaune et une pincée de sel pour obtenir une texture de purée lisse et bien verte.\",\"2. Le fond de verrine: Répartissez cette crème d'avocat équitablement au fond de 4 verrines à l'aide d'une petite cuillère.\",\"3. La sauce crémée: Dans un bol séparé, mélangez le fromage blanc (ou Skyr) avec le reste du jus de citron et le mélange d'épices pour poisson. Salez et poivrez.\",\"4. L'apport marin: Ajoutez les petites crevettes roses décortiquées dans la sauce blanche et mélangez pour bien les napper.\",\"5. Le montage: Déposez délicatement le mélange de crevettes crémées sur la purée d'avocat dans chaque verrine. Réservez au frais jusqu'au moment de servir.\",\"1 Avocats mûrs: 2 beaux avocats\",\"400 g de Petites crevettes roses décortiquées: 150 g\",\"150 ml de Fromage blanc épais ou Skyr: 2 cuillères à soupe\",\"1 Citron jaune: Le jus d'un gros citron entier\",\"400 g de Mélange poisson citronné (recette 8): 1/2 cuillère à café\",\"Sel, poivre: 1 pincée\"]},{\"id\":\"r-01f05a70bc\",\"name\":\"🍅 Verrines tomate mozzarella basilic\",\"lines\":[\"1. L'assaisonnement rouge: Dans un bol, mélangez les très petits dés de tomates fraîches avec la cuillère à café d'huile d'olive, une mini-pincée de sel et de poivre.\",\"2. La base de la verrine: Répartissez la moitié des dés de tomates assaisonnés au fond de 4 verrines.\",\"3. La couche italienne: Ajoutez les petits cubes de mozzarella par-dessus la tomate dans chaque verrine.\",\"4. Le laquage vert: Déposez une demi-cuillère à soupe de sauce pesto léger au basilic directement sur la couche de mozzarella.\",\"5. La finition: Recouvrez avec le reste des dés de tomates. Décorez le dessus de chaque verrine avec une belle feuille de basilic frais et réservez au frais.\",\"2 Tomates bien mûres: 3 belles tomates coupées en très petits dés\",\"100 g de Mozzarella allégée: 1 boule (125 g) coupée en petits cubes\",\"1 c. à soupe de Sauce pesto léger au basilic (recette 32): 2 cuillères à soupe\",\"1 c. à soupe de Huile d'olive: 1 cuillère à café\",\"1 Feuilles de basilic frais: Pour le décor\",\"Sel fin, poivre: 1 pincée\"]},{\"id\":\"r-76f65ddf01\",\"name\":\"🐟 Rillettes de thon maison\",\"lines\":[\"1. L'égouttage: Égouttez très soigneusement le thon en conserve pour retirer tout l'excès d'eau.\",\"2. Le liant: Dans un saladier, écrasez le fromage frais à la fourchette avec le jus de citron jaune jusqu'à ce qu'il devienne souple.\",\"3. Le mélange: Ajoutez le thon égoutté dans le saladier et écrasez le tout à la fourchette pour amalgamer les ingrédients tout en gardant des petits morceaux texturés.\",\"4. Les aromates: Intégrez l'échalote très finement ciselée et la ciboulette. Ajoutez le sel et le poivre noir.\",\"5. Le stockage: Transférez les rillettes dans un joli pot hermétique. Laissez reposer au moins 30 minutes au réfrigérateur avant de servir sur des toasts de pain complet ou avec des bâtonnets de légumes.\",\"400 g de Thon au naturel (en conserve): 1 grande boîte (environ 280 g égoutté)\",\"100 g de Fromage frais (type St Môret Ligne ou Carré Frais): 150 g\",\"1 Jus de citron jaune: 1 cuillère à soupe\",\"2 Échalote: 1/2 échalote ciselée très finement\",\"Ciboulette ou ciboule fraîche: 1 cuillère à soupe ciselée\",\"Poivre noir du moulin, sel: 1 pincée\"]},{\"id\":\"r-0e364bc1eb\",\"name\":\"🥚 Œufs mimosa apéro\",\"lines\":[\"1. La cuisson dure: Plongez les œufs dans l'eau bouillante pendant 10 minutes. Rafraîchissez-les immédiatement dans l'eau glacée pour stopper la cuisson, puis écalez-les.\",\"2. Le parage: Coupez les œufs en deux dans le sens de la longueur. Retirez délicatement les jaunes d'œufs durs et déposez-les dans un petit bol. Rangez les blancs vides sur un plat de service.\",\"3. La crème mimosa: Écrasez les jaunes d'œufs à la fourchette avec le fromage blanc (ou Skyr) et la moutarde fine jusqu'à l'obtention d'une crème lisse et homogène. Salez et poivrez.\",\"4. Le garnissage apéritif: Remplissez proprement les cavités des blancs d'œufs avec cette crème de jaunes à l'aide d'une petite cuillère.\",\"5. Le graphisme: Saupoudrez d'un très léger voile de paprika doux et parsemez de ciboulette ciselée avant de réserver au frais jusqu'au moment de l'apéritif.\",\"1 Œufs frais: 4 gros œufs\",\"150 ml de Fromage blanc épais 0% ou Skyr: 2 cuillères à soupe rases\",\"1 c. à soupe de Moutarde de Dijon fine: 1/2 cuillère à café\",\"Paprika doux: 1 pincée (pour le décor)\",\"Ciboulette fraîche: 1 cuillère à café ciselée\",\"Sel, poivre fin: 1 pincée\"]},{\"id\":\"r-9958fa88f3\",\"name\":\"🔥 Barbecue entre amis\",\"lines\":[\"1. Le parage des grenailles: Lavez soigneusement les pommes de terre grenaille et coupez-les simplement en deux (ne les épluchez pas).\",\"2. L'enrobage aromatique: Dans un saladier, mélangez les grenailles avec la cuillère d'huile d'olive et le mélange d'épices pour légumes rôtis.\",\"3. La cuisson des pommes de terre: Préchauffez le four à 200°C (ou utilisez une plaque en fonte fermée sur le barbecue). Étalez les grenailles sur une plaque de cuisson et enfournez pour 25 minutes jusqu'à ce qu'elles soient bien dorées et fondantes à cœur.\",\"4. La grillade de la viande: Pendant les 10 dernières minutes de cuisson des grenailles, déposez les aiguillettes de poulet marinées sur la grille bien chaude du barbecue. Faites-les cuire 4 à 5 minutes de chaque côté.\",\"5. Le dressage convivial: Disposez les aiguillettes de poulet grillées et laquées au centre d'un grand plat, entourées des pommes de terre grenaille croustillantes aux herbes. Servez chaud entre amis.\",\"400 g de Aiguillettes de poulet marinées (recette 4): 500 g\",\"1 gousse d’Pommes de terre grenaille (petites et fermes): 600 g lavées (gardez la peau)\",\"1 Mélange légumes rôtis au four (recette 9): 1 cuillère à soupe\",\"1 c. à soupe de Huile d'olive: 1 cuillère à soupe\",\"1 Gros sel: 1 pincée\"]},{\"id\":\"r-43f1667b8e\",\"name\":\"Marinade :\",\"lines\":[\"✅ Hacher les légumes\",\"✅ Préparer la marinade\",\"✅ Cuire doucement le poulet\",\"✅ Préparer une garniture prête pour plusieurs jours\",\"🌯 wraps\",\"🥗 salades\",\"🍚 bowls\",\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"1 citron\",\"paprika\",\"1 c. à soupe de huile d’olive\",\"1 herbes\",\"400 g de steak haché façonné\",\"2 poivrons\",\"1 courgettes grillées\",\"2 tomates provençales\",\"4 Tortilla à la place\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"➡️ environ 30 minutes\",\"Sauce blanche\",\"Marinade\",\"Découpe légumes\",\"Hacher les légumes\",\"Préparer la marinade\",\"Cuire doucement le poulet\",\"Préparer une garniture prête pour plusieurs jours\"]},{\"id\":\"r-570d3ee146\",\"name\":\"🥔 Pommes de terre grenaille aux herbes\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"thym\",\"paprika\",\"ail\",\"(je garde une petite partie car tu en fais peu 😉)\",\"🍓 Salade de fruits frais\",\"1 gousse d’ail\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\"]},{\"id\":\"r-8aa6f62f61\",\"name\":\"🥂 Mini verrines saumon fumé\",\"lines\":[\"1. La mousse de fromage: Dans un petit bol, fouettez énergiquement le fromage frais avec les deux cuillères de crème fraîche légère et le jus de citron pour obtenir une texture souple et aérienne.\",\"2. L'herbage: Intégrez l'aneth fraîchement ciselée à la crème de fromage. Poivrez légèrement.\",\"3. Le fond de la verrine: Répartissez cette crème d'aneth au fond de 4 à 6 mini verrines apéritives à l'aide d'une poche à douille ou d'une petite cuillère.\",\"4. Le poisson: Déposez délicatement les petits dés de saumon fumé par- dessus la couche de fromage frais dans chaque verrine.\",\"5. Le décor: Parsemez le saumon de quelques baies roses concassées pour la couleur et le relief. Réservez au réfrigérateur jusqu'à l'arrivée de vos invités.\",\"400 g de Saumon fumé: 2 belles tranches (environ 80 g) coupées en petits dés\",\"100 g de Fromage frais (type St Môret Ligne): 100 g\",\"150 ml de Crème fraîche légère (12% MG): 2 cuillères à soupe (pour détendre)\",\"1 Jus de citron jaune: 1 cuillère à café\",\"Aneth fraîche: 1 cuillère à soupe ciselée\",\"1 Baies roses concassées: 1 pincée\"]},{\"id\":\"r-5754f74ea4\",\"name\":\"🥂 Mini toasts chèvre miel\",\"lines\":[\"1. Le découpage : Coupez vos tranches de pain de mie complet en 4 petits carrés réguliers (ou tranchez la baguette en rondelles). Préchauffez le four en mode grill à 200°C.\",\"2. Le montage : Disposez les mini toasts de pain sur une plaque de cuisson. Déposez une rondelle fine de fromage de chèvre sur chaque morceau de pain.\",\"3. La touche sucrée : Faites couler un filet très mince de miel de fleurs sur chaque rondelle de chèvre.\",\"4. L'assaisonnement : Saupoudrez d'une mini-pincée d'herbes de Provence et de poivre noir.\",\"5. La fonte : Enfournez pour seulement 3 à 4 minutes sous le grill. Le chèvre doit être tout juste chaud, tremblotant et légèrement doré sur les bords. Servez immédiatement pour l'apéritif.\",\"4 Pain de mie complet (ou baguette aux céréales): 4 tranches (coupées en 4 pour faire 16 mini toasts)\",\"1 Bûchette de chèvre: 16 petites rondelles fines\",\"1 Miel de fleurs liquide: 1 cuillère à soupe (en filet)\",\"1 Mélange herbes de Provence (recette 1): 1 pincée\",\"Poivre noir: 1 pincée\"]},{\"id\":\"r-72156ca948\",\"name\":\"👨‍👩‍👧 Repas famille du dimanche\",\"lines\":[\"1. Le soffritto familial : Dans une grande cocotte en fonte, faites chauffer l'huile d'olive. Ajoutez les dés de carottes et de céleri. Faites-les suer pendant 5 minutes à feu moyen.\",\"2. La saisie : Poussez les légumes sur les bords. Déposez les rouelles de jarret de veau au centre de la cocotte (saupoudrées de la fécule de maïs) et faites- les colorer pendant 3 minutes de chaque côté à feu vif.\",\"3. Le mouillement : Versez le vin blanc sec pour déglacer et décoller tous les sucs de cuisson. Laissez réduire pendant 2 minutes.\",\"4. Le volume de sauce : Ajoutez la passata de tomates, la feuille de laurier, le sel et le poivre. Mélangez bien pour immerger la viande.\",\"5. Le long mijotage : Portez à ébullition, puis couvrez hermétiquement la cocotte et baissez le feu au minimum. Laissez mijoter doucement pendant 1 heure à 1 heure 15. La viande doit être extrêmement tendre et se détacher de l'os. Servez chaud en famille.\",\"1 Rouelles de jarret de veau (osso bucco): 4 belles pièces (environ 800 g)\",\"150 ml de Base tomate à tout faire (recette 45) ou passata: 400 g\",\"2 Carottes: 2 carottes coupées en petits dés\",\"1 Branche de céleri: 1 branche coupée en petits dés\",\"1 gousse d’Vin blanc sec (ou bouillon de volaille): 150 ml\",\"1 c. à soupe de Huile d'olive: 1 cuillère à soupe\",\"1 Fécule de maïs (Maïzena): 1 cuillère à café rase\",\"Sel, poivre, laurier: 1 feuille de laurier, sel et poivre\"]},{\"id\":\"r-6d6b3ad6a7\",\"name\":\"🌴 Apéro dînatoire complet\",\"lines\":[\"1. Le point central : Prenez une très grande planche en bois ou un grand plateau. Déposez le pot de rillettes de thon maison bien frais au centre du plateau.\",\"2. Le trempage (dip) : Disposez de façon rayonnante les bâtonnets de carottes, de concombres et les gressins complets autour du pot pour pouvoir les tremper facilement.\",\"3. Les piques fraîcheur : Placez les piques alternant tomate cerise et bille de mozzarella dans les espaces libres.\",\"4. L'apport de protéines : Ajoutez les petits rouleaux de blancs de dinde de manière ordonnée sur le plateau.\",\"5. Le relief : Parsemez les amandes décortiquées dans les derniers espaces vides pour apporter du croquant. Servez ce plateau complet et convivial sur la table de la terrasse ou du salon.\",\"400 g de Rillettes de thon maison (recette précédente): 1 pot complet\",\"1 Gressins au blé complet: 12 gressins\",\"1 Bâtonnets de légumes (Carotte, concombre): 2 de chaque coupés en bâtons\",\"2 Billes de mozzarella allégée \u0026 Tomates cerises: 12 de chaque montées en piques\",\"400 g de Tranches de blanc de dinde: 4 tranches coupées en lanières et roulées\",\"100 g de Amandes décortiquées (non salées): 30 g\"]}]}]]}]\ne:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#8FA89B\"}]]\n13:I[27201,[\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/_next/static/chunks/0vtm3owulsv-e.js\"],\"IconMark\"]\nb:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"CUISINE CHIC OUF !\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Pas de panique, on mange quoi ce soir ? 52 semaines de menus, du batchcooking simple et vos listes de courses automatisées.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\
