ser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Bœuf bourguignon\"]},{\"id\":\"r-6d6b3ad6a7\",\"name\":\"🌴 Apéro dînatoire complet\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"100 g de Planche fromage\",\"1 comté\",\"1 chèvre\",\"100 g de mozzarella\",\"100 g de noix\",\"1 Planche fraîcheur\",\"400 g de saumon fumé\",\"400 g de crevettes\",\"1 œufs mimosa\",\"1 Crudités\",\"1 concombre\",\"2 tomates cerises\",\"2 carottes\",\"400 g de rillettes de thon\",\"1 c. à soupe de pesto\",\"100 g de fromage frais aux herbes\",\"1 Mettre les boissons au frais\",\"1 Sortir les plats\",\"1 Dresser la table\",\"1 Profiter des invités\",\"🧀 Planche fromage\",\"comté\",\"chèvre\",\"mozzarella\",\"noix\",\"🐟 Planche fraîcheur\",\"saumon fumé\",\"crevettes\",\"œufs mimosa\",\"🥒 Crudités\",\"concombre\",\"tomates cerises\",\"carottes\",\"rillettes de thon\",\"pesto\",\"fromage frais aux herbes\",\"📌 PAGE ORGANISATION À AJOUTER\",\"\\\"Je reçois demain\\\" 😱😂\",\"☐ Préparer les verrines\",\"☐ Faire les sauces\",\"☐ Cuire les œufs\",\"☐ Préparer les légumes\",\"☐ Mettre les boissons au frais\",\"☐ Sortir les plats\",\"☐ Cuire la viande/poisson\",\"☐ Dresser la table\",\"☐ Profiter des invités ❤️\",\"1. Préparez les ingrédients selon les quantités indiquées, mélangez soigneusement pour répartir les saveurs et vérifiez la texture avant de poursuivre.\",\"2. Faire les sauces\",\"3. Faites chauffer une poêle à feu moyen avec l’huile prévue et faites revenir les ingrédients 6 à 8 minutes en remuant régulièrement, jusqu’à ce qu’ils soient tendres et bien chauds.\",\"4. Lavez et séchez 1 concombre, 2 tomates cerises, 2 carottes. Épluchez ceux qui le nécessitent et coupez-les en morceaux réguliers d’environ 1 à 2 cm.\",\"5. Faites chauffer une poêle à feu
