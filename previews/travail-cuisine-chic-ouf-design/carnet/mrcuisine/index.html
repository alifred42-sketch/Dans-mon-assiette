[\"$\",\"h1\",null,{\"className\":\"font-heading text-3xl\",\"children\":\"Mr Cuisine\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-sm font-normal leading-relaxed text-[#2B2B2B]\",\"children\":\"Votre robot s'occupe de tout. Lisez la consigne universelle, lancez les paramètres, et allez vous reposer.\"}]]}],[\"$\",\"$L12\",null,{\"items\":[{\"id\":\"r-b17bf4bbeb\",\"name\":\"Velouté de courgettes au fromage frais\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"800 g de courgettes\",\"1 pomme de terre moyenne (environ 180 g)\",\"1 oignon\",\"700 ml de bouillon de légumes\",\"100 g de fromage frais type St Môret\",\"1 c. à café de curry doux (facultatif)\",\"Sel fin (2 g) et poivre moulu (0,5 g)\",\"1 c. à soupe d’quelques feuilles de basilic\",\"1. Préparez pour 4 personnes : 800 g de courgettes, 1 pomme de terre moyenne (environ 180 g), 1 oignon, 700 ml de bouillon de légumes, 100 g de fromage frais type St Môret, 1 c. à café de curry doux (facultatif), Sel fin (2 g) et poivre moulu (0,5 g), 1 c. à soupe d’quelques feuilles de basilic. Lavez, épluchez et coupez les légumes. (10 min)\",\"2. Faites revenir 800 g de courgettes, 1 oignon, 700 ml de bouillon de légumes avec la matière grasse prévue pendant 3 à 5 min en remuant.\",\"3. Ajoutez 1 pomme de terre moyenne (environ 180 g) et 700 ml de bouillon de légumes; couvrez et laissez frémir 25 min, jusqu’à tendreté.\",\"4. Mixez si besoin, ajoutez les herbes prévues, rectifiez l’assaisonnement et servez en 4 bols.\",\"Monsieur Cuisine : mettre les légumes coupés et le bouillon dans le bol, cuire environ 20 à 25 min / 100 °C / vitesse 1. Attendre que la préparation ne soit plus bouillante, puis mixer progressivement 30 à 60 s / vitesse 5 à 8. Ajouter le fromage frais et mélanger 15 s / vitesse 3. Respecter la capacité maximale du bol et le manuel du modèle.\",\"chèvre frais\",\"ricotta\",\"fromage blanc\",\"Étapes complétées lors de l’audit test des semaines 1 et 2 : adapter les cuissons aux ingrédients exacts et vérifier la cuisson à cœur des viandes et poissons.\"]},{\"id\":\"r-7715637c6c\",\"name\":\"🍅 Sauce tomate maison familiale\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"150 ml de tomates concassées\",\"2 oignons\",\"1 gousse d’ail\",\"2 carottes\",\"1 Herbes aromatiques (5 g)\",\"Basilic frais (5 g)\",\"thym (10 g pour 4 personnes)\",\"Épices ou aromates (2 g)\",\"basilic\",\"thym\",\"origan\",\"\\\"Sauce tomate\\\"\",\"🍝 pâtes\",\"🍕 pizzas\",\"🥩 boulettes\",\"🥘 plats mijotés\",\"1. Préparez pour 4 personnes : 150 ml de tomates concassées, 2 oignons, 1 gousse d’ail, 2 carottes, Herbes aromatiques (5 g), Basilic frais (5 g), thym (10 g pour 4 personnes), Épices ou aromates (2 g). Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir 150 ml de tomates concassées, 2 oignons, 1 gousse d’ail, 2 carottes avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez les autres ingrédients de la fiche et les condiments indiqués; cuisez à feu moyen-doux 15 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"tomates concassées\",\"oignons\",\"carottes\",\"ail\",\"herbes de Provence\",\"portions de 250 à 500 g\",\"🍳 œufs à la tomate\",\"Sauce tomate\"]},{\"id\":\"r-190641843a\",\"name\":\"🥕 Purée maison carottes \u0026 pommes de terre\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"2 pommes de terre\",\"2 carottes\",\"150 ml de lait\",\"1 beurre (petite quantité)\",\"Épices ou aromates (2 g)\",\"Poivre moulu (0,5 g)\",\"muscade\",\"poivre\",\"\\\"Purée de pommes de terre\\\"\",\"patate douce\",\"courgette\",\"céleri\",\"1. Préparez pour 4 personnes : 2 pommes de terre, 2 carottes, 150 ml de lait, 1 beurre (petite quantité), Épices ou aromates (2 g), Poivre moulu (0,5 g). Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir 2 carottes avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez les autres ingrédients de la fiche et 150 ml de lait; cuisez à feu moyen-doux 15 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Purée de pommes de terre\"]},{\"id\":\"r-627302c625\",\"name\":\"🥚 Œufs cocotte au saumon fumé\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"200 g de œufs\",\"600 g de saumon fumé\",\"150 ml de crème légère\",\"1 c. à soupe d’ciboulette\",\"1 c. à soupe d’aneth\",\"poivre\",\"200 g de citron\",\"aneth\",\"citron\",\"\\\"Œufs cocotte\\\"\",\"🥖 pain complet grillé\",\"1. Préparez pour 4 personnes : 200 g de œufs, 600 g de saumon fumé, 150 ml de crème légère, 1 c. à soupe d’ciboulette, 1 c. à soupe d’aneth, poivre, 200 g de citron. Coupez les légumes et préchauffez le four à 180 °C. (15 min)\",\"2. Disposez 200 g de œufs, 600 g de saumon fumé et les légumes de la fiche dans un plat; ajoutez les aromates, l’huile et le citron de la fiche.\",\"3. Enfournez 20 min à 180 °C, jusqu’à chair opaque qui se détache facilement. Cuisez l’accompagnement séparément si nécessaire.\",\"4. Vérifiez la cuisson à cœur et répartissez en 4 portions avec les légumes préparés.\",\"Œufs cocotte\"]},{\"id\":\"r-505f3338a3\",\"name\":\"Risotto aux champignons et parmesan\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"320 g de riz arborio\",\"400 g de champignons de Paris\",\"1 oignon\",\"1,1 l de bouillon chaud\",\"100 ml de vin blanc (facultatif)\",\"60 g de parmesan râpé\",\"1 c. à soupe d’huile d’olive\",\"20 g de beurre\",\"Poivre et persil frais\",\"1. Préparez pour 4 personnes : 320 g de riz arborio, 400 g de champignons de Paris, 1 oignon, 1,1 l de bouillon chaud, 100 ml de vin blanc (facultatif), 60 g de parmesan râpé, 1 c. à soupe d’huile d’olive, 20 g de beurre, Poivre et persil frais. Lavez et coupez les légumes. (10 min)\",\"2. Cuisez 320 g de riz arborio dans l’eau bouillante salée selon le paquet; égouttez.\",\"3. Faites revenir 400 g de champignons de Paris, 1 oignon 5 à 8 min dans la matière grasse prévue; ajoutez 1,1 l de bouillon chaud, 1 c. à soupe d’huile d’olive et poursuivez 15 min en vérifiant la cuisson.\",\"4. Mélangez avec le féculent cuit, ajoutez les herbes et assaisonnements de la fiche, puis répartissez en 4 portions.\",\"Monsieur Cuisine : hacher l’oignon 5 s / vitesse 6, racler. Ajouter huile et faire revenir 3 min / 120 °C / vitesse 1. Ajouter riz, faire nacrer 2 min / 100 °C / vitesse 1 inversée si disponible. Ajouter les champignons et le bouillon chaud, cuire environ 18 à 20 min / 100 °C / vitesse 1 inversée; contrôler la cuisson et ajouter un peu de bouillon si nécessaire. Incorporer parmesan et persil en fin de cuisson.\",\"🐟 saumon\",\"🍗 poulet\",\"🥒 courgettes\",\"Étapes complétées lors de l’audit test des semaines 1 et 2 : adapter les cuissons aux ingrédients exacts et vérifier la cuisson à cœur des viandes et poissons.\"]},{\"id\":\"r-9b996df25a\",\"name\":\"🥣 Soupe à l’oignon façon bistrot\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"1 oignon\",\"500 ml de bouillon\",\"4 tranches de pain complet grillé\",\"100 g de fromage râpé\",\"100 g de un peu de comté ou emmental dessus\",\"Un peu de comté ou emmental dessus 😍\",\"\\\"Soupe à l'oignon\\\"\",\"1. Préparez pour 4 personnes : 1 oignon, 500 ml de bouillon, 4 tranches de pain complet grillé, 100 g de fromage râpé, 100 g de un peu de comté ou emmental dessus. Lavez, épluchez et coupez les légumes. (15 min)\",\"2. Faites revenir 1 oignon avec la matière grasse prévue pendant 3 à 5 min en remuant.\",\"3. Ajoutez 4 tranches de pain complet grillé et 500 ml de bouillon; couvrez et laissez frémir 30 min, jusqu’à tendreté.\",\"4. Mixez si besoin, ajoutez les herbes prévues, rectifiez l’assaisonnement et servez en 4 bols.\",\"Soupe à l'oignon\"]},{\"id\":\"r-4ce28d774d\",\"name\":\"🍫 Crème dessert chocolat maison\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"1 chocolat noir\",\"150 ml de lait\",\"1 œufs\",\"100 g de cacao\",\"Faire des petites verrines.\",\"\\\"Crème dessert chocolat\\\"\",\"1. Préparez pour 4 personnes : 1 chocolat noir, 150 ml de lait, 1 œufs, 100 g de cacao. Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir les légumes de la fiche avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez 1 œufs et 150 ml de lait; cuisez à feu moyen-doux 15 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Crème dessert chocolat\"]},{\"id\":\"r-8c62c53b61\",\"name\":\"🍏 Compote maison sans sucre ajouté\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"2 pommes\",\"cannelle (10 g pour 4 personnes)\",\"1 vanille\",\"\\\"Compote\\\"\",\"🍐 pomme-poire\",\"🍎 pomme-cannelle\",\"1. Préparez pour 4 personnes : 2 pommes, cannelle (10 g pour 4 personnes), 1 vanille. Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir les légumes de la fiche avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez les autres ingrédients de la fiche et les condiments indiqués; cuisez à feu moyen-doux 15 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Compote\"]},{\"id\":\"r-4d5e2c63aa\",\"name\":\"🥞 Pâte à crêpes légère\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"100 g de farine\",\"1 œufs\",\"150 ml de lait\",\"fleur d’oranger\",\"vanille\",\"\\\"Pâte à crêpes\\\"\",\"Congeler quelques crêpes.\",\"1. Préparez pour 4 personnes : 100 g de farine, 1 œufs, 150 ml de lait. Lavez et coupez les légumes. (15 min)\",\"2. Cuisez le féculent dans l’eau bouillante salée selon le paquet; égouttez.\",\"3. Faites revenir les légumes de la fiche 5 à 8 min dans la matière grasse prévue; ajoutez 1 œufs et poursuivez 15 min en vérifiant la cuisson.\",\"4. Mélangez avec le féculent cuit, ajoutez les herbes et assaisonnements de la fiche, puis répartissez en 4 portions.\",\"Pâte à crêpes\"]},{\"id\":\"r-f1352e28e6\",\"name\":\"🍞 Pain complet maison (option)\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"\\\"Pain\\\"\",\"🥪 tartines\",\"🥣 soupes\",\"🥚 œufs cocotte\",\"400 g de légumes de saison\",\"300 g de légumes de saison\",\"200 g de féculent adapté\",\"1 c. à soupe d’huile d’olive\",\"Sel fin (2 g) et poivre moulu (0,5 g)\",\"1. Préparez pour 4 personnes : 400 g de légumes de saison, 300 g de légumes de saison, 200 g de féculent adapté, 1 c. à soupe d’huile d’olive, Sel fin (2 g) et poivre moulu (0,5 g). Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir 400 g de légumes de saison, 300 g de légumes de saison avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez les autres ingrédients de la fiche et 1 c. à soupe d’huile d’olive; cuisez à feu moyen-doux 25 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Pain\"]},{\"id\":\"r-1aff5ca09b\",\"name\":\"🍝 Lasagnes bolognaises maison\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"1 plaques de lasagnes\",\"400 g de viande hachée\",\"2 tomates\",\"2 carottes\",\"2 oignons\",\"1 béchamel\",\"100 g de fromage râpé\",\"Basilic frais (5 g)\",\"Épices ou aromates (2 g)\",\"Poivre moulu (0,5 g)\",\"basilic\",\"origan\",\"poivre\",\"\\\"Lasagnes\\\"\",\"ou\",\"\\\"Sauce bolognaise\\\" + \\\"Béchamel\\\"\",\"Faire une grosse quantité de sauce et congeler.\",\"1. Préparez pour 4 personnes : 1 plaques de lasagnes, 400 g de viande hachée, 2 tomates, 2 carottes, 2 oignons, 1 béchamel, 100 g de fromage râpé, Basilic frais (5 g), Épices ou aromates (2 g), Poivre moulu (0,5 g). Lavez et coupez les légumes. (15 min)\",\"2. Cuisez 1 plaques de lasagnes dans l’eau bouillante salée selon le paquet; égouttez.\",\"3. Faites revenir 2 tomates, 2 carottes, 2 oignons 5 à 8 min dans la matière grasse prévue; ajoutez 400 g de viande hachée et poursuivez 15 min en vérifiant la cuisson.\",\"4. Mélangez avec le féculent cuit, ajoutez les herbes et assaisonnements de la fiche, puis répartissez en 4 portions.\",\"Lasagnes\",\"Sauce bolognaise\\\" + \\\"Béchamel\"]},{\"id\":\"r-21c5d3d2ba\",\"name\":\"🍲 Blanquette de poulet légère\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"500 g de poulet\",\"2 carottes\",\"250 g de champignons\",\"200 g de poireaux\",\"250 g de riz\",\"150 ml de crème légère\",\"200 g de citron\",\"200 g de jaune d’œuf\",\"1 c. à soupe d’thym\",\"200 g de laurier\",\"Poivre moulu (0,5 g)\",\"crème légère\",\"citron\",\"jaune d’œuf\",\"thym\",\"laurier\",\"poivre\",\"\\\"Blanquette\\\"\",\"1. Préparez pour 4 personnes : 500 g de poulet, 2 carottes, 250 g de champignons, 200 g de poireaux, 250 g de riz, 150 ml de crème légère, 200 g de citron, 200 g de jaune d’œuf, 1 c. à soupe d’thym, 200 g de laurier, Poivre moulu (0,5 g). Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir 2 carottes, 250 g de champignons, 200 g de poireaux avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez 500 g de poulet, 200 g de jaune d’œuf et 150 ml de crème légère, 200 g de citron; cuisez à feu moyen-doux 30 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Blanquette\",\"Blanquette de poulet\"]},{\"id\":\"r-24aeaed5b9\",\"name\":\"🥘 Chili con carne\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"200 g de bœuf haché\",\"300 g de tomates\",\"200 g de haricots rouges\",\"2 poivrons\",\"1 oignon\",\"1 c. à café de cumin\",\"1 c. à café de paprika fumé\",\"200 g de piment doux\",\"cumin\",\"paprika fumé\",\"piment doux\",\"\\\"Chili con carne\\\"\",\"1. Préparez pour 4 personnes : 200 g de bœuf haché, 300 g de tomates, 200 g de haricots rouges, 2 poivrons, 1 oignon, 1 c. à café de cumin, 1 c. à café de paprika fumé, 200 g de piment doux. Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir 300 g de tomates, 2 poivrons, 1 oignon avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez 200 g de bœuf haché et les condiments indiqués; cuisez à feu moyen-doux 30 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Chili con carne\"]},{\"id\":\"r-52e8e85167\",\"name\":\"🍛 Curry de poulet coco\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"500 g de poulet\",\"150 ml de lait de coco\",\"2 courgettes\",\"2 carottes\",\"250 g de riz\",\"1 c. à café de curry\",\"1 c. à café de gingembre\",\"1 c. à café de curcuma\",\"curry\",\"gingembre\",\"curcuma\",\"\\\"Curry de poulet\\\"\",\"Avec crevettes.\",\"1. Préparez pour 4 personnes : 500 g de poulet, 150 ml de lait de coco, 2 courgettes, 2 carottes, 250 g de riz, 1 c. à café de curry, 1 c. à café de gingembre, 1 c. à café de curcuma. Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir 2 courgettes, 2 carottes avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez 500 g de poulet et 150 ml de lait de coco; cuisez à feu moyen-doux 30 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Curry de poulet\"]},{\"id\":\"r-ed96c4899e\",\"name\":\"🐟 Brandade de morue/cabillaud\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"400 g de poisson\",\"2 pommes de terre\",\"150 ml de lait\",\"1 gousse d’ail\",\"Persil frais (5 g)\",\"100 g de parmesan dessus.\",\"\\\"Brandade\\\"\",\"1. Préparez pour 4 personnes : 400 g de poisson, 2 pommes de terre, 150 ml de lait, 1 gousse d’ail, Persil frais (5 g), 100 g de parmesan dessus.. Coupez les légumes et préchauffez le four à 180 °C. (15 min)\",\"2. Disposez 400 g de poisson et 1 gousse d’ail dans un plat; ajoutez les aromates, l’huile et le citron de la fiche.\",\"3. Enfournez 15 min à 180 °C, jusqu’à chair opaque qui se détache facilement. Cuisez l’accompagnement séparément si nécessaire.\",\"4. Vérifiez la cuisson à cœur et répartissez en 4 portions avec les légumes préparés.\",\"Brandade\"]},{\"id\":\"r-3ad7aa939f\",\"name\":\"🍅 Poivrons farcis\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"2 poivrons\",\"400 g de viande hachée\",\"300 g de riz\",\"2 tomates\",\"1 herbes\",\"Épices ou aromates (2 g)\",\"Basilic frais (5 g)\",\"paprika\",\"basilic\",\"\\\"Poivrons farcis\\\"\",\"1. Préparez pour 4 personnes : 2 poivrons, 400 g de viande hachée, 300 g de riz, 2 tomates, 1 herbes, Épices ou aromates (2 g), Basilic frais (5 g). Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir 2 poivrons, 2 tomates avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez 400 g de viande hachée et les condiments indiqués; cuisez à feu moyen-doux 15 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Poivrons farcis\"]},{\"id\":\"r-f5d1d509b0\",\"name\":\"🥩 Boulettes sauce tomate\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"400 g de viande hachée\",\"1 œuf\",\"Persil frais (5 g)\",\"2 tomates\",\"2 oignons\",\"Épices ou aromates (2 g)\",\"1 gousse d’ail\",\"Poivre moulu (0,5 g)\",\"paprika\",\"ail\",\"poivre\",\"\\\"Boulettes de viande\\\"\",\"1. Préparez pour 4 personnes : 400 g de viande hachée, 1 œuf, Persil frais (5 g), 2 tomates, 2 oignons, Épices ou aromates (2 g), 1 gousse d’ail, Poivre moulu (0,5 g). Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir 2 tomates, 2 oignons, 1 gousse d’ail avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez 400 g de viande hachée, 1 œuf et les condiments indiqués; cuisez à feu moyen-doux 15 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Boulettes de viande\"]},{\"id\":\"r-34ef9f1b64\",\"name\":\"🥔 Gratin dauphinois\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"2 pommes de terre\",\"150 ml de lait\",\"150 ml de crème\",\"1 gousse d’ail\",\"Épices ou aromates (2 g)\",\"100 g de fromage dessus.\",\"\\\"Gratin dauphinois\\\"\",\"1. Préparez pour 4 personnes : 2 pommes de terre, 150 ml de lait, 150 ml de crème, 1 gousse d’ail, Épices ou aromates (2 g), 100 g de fromage dessus.. Préchauffez le four à 180 °C et coupez les légumes. (15 min)\",\"2. Faites revenir 1 gousse d’ail dans la matière grasse prévue 5 à 8 min; vérifiez la cuisson de la viande.\",\"3. Disposez 1 gousse d’ail dans un plat et ajoutez 150 ml de lait, 150 ml de crème; répartissez uniformément.\",\"4. Enfournez 30 min à 180 °C, jusqu’à tendreté et dessus doré; vérifiez la cuisson à cœur, reposez 5 min et servez en 4 portions.\",\"Gratin dauphinois\"]},{\"id\":\"r-415aece0d7\",\"name\":\"🥧 Quiche lorraine maison\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"1 pâte brisée\",\"1 œufs\",\"400 g de jambon\",\"150 ml de crème\",\"Épices ou aromates (2 g)\",\"Poivre moulu (0,5 g)\",\"muscade\",\"poivre\",\"\\\"Quiche lorraine\\\"\",\"🥬 poireaux saumon\",\"🍄 champignons\",\"🥒 courgettes chèvre\",\"1. Préparez pour 4 personnes : 1 pâte brisée, 1 œufs, 400 g de jambon, 150 ml de crème, Épices ou aromates (2 g), Poivre moulu (0,5 g). Préchauffez le four à 180 °C et coupez les légumes. (15 min)\",\"2. Faites revenir 1 œufs, 400 g de jambon dans la matière grasse prévue 5 à 8 min; vérifiez la cuisson de la viande.\",\"3. Disposez les légumes de la fiche, 1 œufs, 400 g de jambon dans un plat et ajoutez 150 ml de crème; répartissez uniformément.\",\"4. Enfournez 30 min à 180 °C, jusqu’à tendreté et dessus doré; vérifiez la cuisson à cœur, reposez 5 min et servez en 4 portions.\",\"Quiche lorraine\"]},{\"id\":\"r-185194203e\",\"name\":\"🍕 Pâte à pizza maison\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"100 g de farine\",\"1 levure\",\"1 eau\",\"1 c. à soupe de huile d’olive\",\"2 tomate mozzarella basilic\",\"400 g de jambon champignons\",\"150 ml de saumon crème\",\"\\\"Pâte à pizza\\\"\",\"🍅 tomate mozzarella basilic\",\"🍄 jambon champignons\",\"🐟 saumon crème\",\"1. Préparez pour 4 personnes : 100 g de farine, 1 levure, 1 eau, 1 c. à soupe de huile d’olive, 2 tomate mozzarella basilic, 400 g de jambon champignons, 150 ml de saumon crème. Lavez et coupez les légumes. (15 min)\",\"2. Cuisez le féculent dans l’eau bouillante salée selon le paquet; égouttez.\",\"3. Faites revenir 2 tomate mozzarella basilic, 400 g de jambon champignons 5 à 8 min dans la matière grasse prévue; ajoutez 400 g de jambon champignons, 150 ml de saumon crème et poursuivez 15 min en vérifiant la cuisson.\",\"4. Mélangez avec le féculent cuit, ajoutez les herbes et assaisonnements de la fiche, puis répartissez en 4 portions.\",\"Pâte à pizza\"]},{\"id\":\"r-0f4e91c956\",\"name\":\"🥞 Pancakes protéinés\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"1 œufs\",\"100 g de farine d’avoine\",\"150 ml de lait\",\"150 ml de fromage blanc\",\"\\\"Pancakes\\\"\",\"1. Préparez pour 4 personnes : 1 œufs, 100 g de farine d’avoine, 150 ml de lait, 150 ml de fromage blanc. Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir les légumes de la fiche avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez 1 œufs et 150 ml de lait, 150 ml de fromage blanc; cuisez à feu moyen-doux 30 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Pancakes\"]},{\"id\":\"r-14aa59c57e\",\"name\":\"🍰 Gâteau au yaourt revisité\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"150 ml de yaourt\",\"1 œufs\",\"100 g de farine\",\"1 fruits\",\"🍎 pommes cannelle\",\"🍫 chocolat noir\",\"🍋 citron\",\"\\\"Gâteau au yaourt\\\"\",\"1. Préparez pour 4 personnes : 150 ml de yaourt, 1 œufs, 100 g de farine, 1 fruits. Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir les légumes de la fiche avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez 1 œufs et 150 ml de yaourt; cuisez à feu moyen-doux 20 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Gâteau au yaourt\"]},{\"id\":\"r-f756d2c53e\",\"name\":\"🍫 chocolat noir\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"\\\"Gâteau au yaourt\\\"\",\"400 g de légumes de saison\",\"300 g de légumes de saison\",\"200 g de féculent adapté\",\"1 c. à soupe d’huile d’olive\",\"Sel et poivre\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Gâteau au yaourt\"]},{\"id\":\"r-0afd842152\",\"name\":\"🍮 Flan pâtissier maison\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"150 ml de lait\",\"1 œufs\",\"1 vanille\",\"1 maïzena\",\"\\\"Flan pâtissier\\\"\",\"1. Préparez pour 4 personnes : 150 ml de lait, 1 œufs, 1 vanille, 1 maïzena. Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir les légumes de la fiche avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez 1 œufs et 150 ml de lait; cuisez à feu moyen-doux 15 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Flan pâtissier\"]},{\"id\":\"r-e6ef289c1b\",\"name\":\"🍫 Mousse au chocolat\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"1 chocolat noir\",\"1 œufs\",\"1 c. à soupe d’huile d’olive\",\"\\\"Mousse au chocolat\\\"\",\"Faire en petites verrines pour garder le plaisir.\",\"1. Préparez pour 4 personnes : 1 chocolat noir, 1 œufs, 1 c. à soupe d’huile d’olive. Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir les légumes de la fiche avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez 1 œufs et 1 c. à soupe d’huile d’olive; cuisez à feu moyen-doux 25 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Mousse au chocolat\"]},{\"id\":\"r-1c4329d6f0\",\"name\":\"🍗 Poulet basquaise\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"500 g de poulet\",\"2 poivrons rouges et verts\",\"300 g de tomates\",\"1 oignon\",\"1 gousse d’ail\",\"1 c. à café de paprika\",\"200 g de piment doux\",\"1 c. à soupe d’thym\",\"200 g de laurier\",\"30 g possible après repas\",\"paprika\",\"piment doux\",\"thym\",\"laurier\",\"❌ Non si servi avec riz\",\"✅ 30 g possible après repas\",\"\\\"Poulet basquaise\\\"\",\"Avec cuisses de poulet ou dinde.\",\"1. Préparez pour 4 personnes : 500 g de poulet, 2 poivrons rouges et verts, 300 g de tomates, 1 oignon, 1 gousse d’ail, 1 c. à café de paprika, 200 g de piment doux, 1 c. à soupe d’thym, 200 g de laurier, 30 g possible après repas. Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir 2 poivrons rouges et verts, 300 g de tomates, 1 oignon, 1 gousse d’ail avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez 500 g de poulet et les condiments indiqués; cuisez à feu moyen-doux 30 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Poulet basquaise\"]},{\"id\":\"r-b8c81518b8\",\"name\":\"🥘 Blanquette de veau traditionnelle\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"400 g de veau\",\"2 carottes\",\"250 g de champignons\",\"200 g de poireaux\",\"1 oignon\",\"500 ml de bouillon\",\"150 ml de crème légère\",\"200 g de citron\",\"200 g de jaune d’œuf\",\"1 c. à soupe d’thym\",\"200 g de laurier\",\"Poivre moulu (0,5 g)\",\"bouillon\",\"crème légère\",\"citron\",\"jaune d’œuf\",\"thym\",\"laurier\",\"poivre\",\"\\\"Blanquette de veau\\\"\",\"Encore meilleure réchauffée le lendemain.\",\"1. Préparez pour 4 personnes : 400 g de veau, 2 carottes, 250 g de champignons, 200 g de poireaux, 1 oignon, 500 ml de bouillon, 150 ml de crème légère, 200 g de citron, 200 g de jaune d’œuf, 1 c. à soupe d’thym, 200 g de laurier, Poivre moulu (0,5 g). Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir 2 carottes, 250 g de champignons, 200 g de poireaux, 1 oignon avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez 200 g de jaune d’œuf et 500 ml de bouillon, 150 ml de crème légère, 200 g de citron; cuisez à feu moyen-doux 30 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Blanquette de veau\"]},{\"id\":\"r-8250ffc152\",\"name\":\"🍖 Sauté de porc à la moutarde\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"400 g de sauté de porc\",\"250 g de champignons\",\"1 oignon\",\"1 c. à café de moutarde à l’ancienne\",\"1 c. à soupe d’thym\",\"Poivre moulu (0,5 g)\",\"1 c. à soupe d’persil\",\"thym\",\"poivre\",\"persil\",\"\\\"Sauté de porc\\\"\",\"Avec filet mignon.\",\"1. Préparez pour 4 personnes : 400 g de sauté de porc, 250 g de champignons, 1 oignon, 1 c. à café de moutarde à l’ancienne, 1 c. à soupe d’thym, Poivre moulu (0,5 g), 1 c. à soupe d’persil. Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir 250 g de champignons, 1 oignon avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez 400 g de sauté de porc et 1 c. à café de moutarde à l’ancienne; cuisez à feu moyen-doux 30 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Sauté de porc\"]},{\"id\":\"r-4b8db26421\",\"name\":\"🥩 Bœuf bourguignon\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"200 g de bœuf à mijoter\",\"2 carottes\",\"250 g de champignons\",\"1 oignon\",\"1 c. à soupe d’thym\",\"200 g de laurier\",\"1 gousse d’ail\",\"200 g de bœuf\",\"thym\",\"laurier\",\"ail\",\"\\\"Bœuf bourguignon\\\"\",\"À préparer le dimanche pour plusieurs repas.\",\"1. Préparez pour 4 personnes : 200 g de bœuf à mijoter, 2 carottes, 250 g de champignons, 1 oignon, 1 c. à soupe d’thym, 200 g de laurier, 1 gousse d’ail, 200 g de bœuf. Battez les œufs avec le sel, le poivre et les herbes indiqués. (15 min)\",\"2. Faites revenir 2 carottes, 250 g de champignons, 1 oignon, 1 gousse d’ail dans une poêle antiadhésive 5 à 7 min.\",\"3. Ajoutez les œufs battus et 200 g de bœuf à mijoter, 200 g de bœuf; cuisez à feu moyen-doux 15 min, jusqu’à ce que le centre soit pris.\",\"4. Vérifiez que les œufs sont entièrement cuits, partagez en 4 portions et servez.\",\"Bœuf bourguignon\"]},{\"id\":\"r-7d7c6a6118\",\"name\":\"🌶️ Merguez sauce tomate façon orientale\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"1 merguez\",\"2 tomates\",\"2 poivrons\",\"2 oignons\",\"1 courgette\",\"Épices ou aromates (2 g)\",\"Coriandre fraîche (5 g)\",\"cumin\",\"paprika\",\"coriandre\",\"\\\"Merguez sauce tomate\\\"\",\"semoule\",\"légumes\",\"1. Préparez pour 4 personnes : 1 merguez, 2 tomates, 2 poivrons, 2 oignons, 1 courgette, Épices ou aromates (2 g), Épices ou aromates (2 g), Coriandre fraîche (5 g). Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir 2 tomates, 2 poivrons, 2 oignons, 1 courgette avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez les autres ingrédients de la fiche et les condiments indiqués; cuisez à feu moyen-doux 15 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Merguez sauce tomate\"]},{\"id\":\"r-806ae50db7\",\"name\":\"🍲 Couscous maison simplifié\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"400 g de poulet\",\"1 merguez\",\"1 légumes\",\"300 g de semoule\",\"1 ras el hanout\",\"Épices ou aromates (2 g)\",\"ras el hanout\",\"cumin\",\"paprika\",\"\\\"Couscous\\\"\",\"Plus de légumes, portion de semoule adaptée.\",\"1. Préparez pour 4 personnes : 400 g de poulet, 1 merguez, 1 légumes, 300 g de semoule, 1 ras el hanout, Épices ou aromates (2 g), Épices ou aromates (2 g). Lavez et coupez les légumes. (15 min)\",\"2. Cuisez 300 g de semoule dans l’eau bouillante salée selon le paquet; égouttez.\",\"3. Faites revenir 1 légumes 5 à 8 min dans la matière grasse prévue; ajoutez 400 g de poulet et poursuivez 15 min en vérifiant la cuisson.\",\"4. Mélangez avec le féculent cuit, ajoutez les herbes et assaisonnements de la fiche, puis répartissez en 4 portions.\",\"Couscous\"]},{\"id\":\"r-cf3eca399d\",\"name\":\"🐟 Saumon sauce citron \u0026 poireaux\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"600 g de pavés de saumon\",\"200 g de poireaux\",\"150 ml de crème légère\",\"200 g de citron\",\"1 c. à soupe d’aneth\",\"poivre\",\"aneth\",\"\\\"Saumon sauce citron\\\"\",\"1. Préparez pour 4 personnes : 600 g de pavés de saumon, 200 g de poireaux, 150 ml de crème légère, 200 g de citron, 1 c. à soupe d’aneth, poivre. Coupez les légumes et préchauffez le four à 180 °C. (10 min)\",\"2. Disposez 600 g de pavés de saumon et 200 g de poireaux dans un plat; ajoutez les aromates, l’huile et le citron de la fiche.\",\"3. Enfournez 15 min à 180 °C, jusqu’à chair opaque qui se détache facilement. Cuisez l’accompagnement séparément si nécessaire.\",\"4. Vérifiez la cuisson à cœur et répartissez en 4 portions avec les légumes préparés.\",\"Saumon sauce citron\"]},{\"id\":\"r-7ac321af8c\",\"name\":\"Cabillaud à la sauce tomate provençale\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"4 dos de cabillaud (environ 600 g)\",\"400 g de tomates concassées\",\"1 courgette\",\"1 oignon\",\"2 gousses d’ail\",\"1 c. à soupe d’huile d’olive\",\"40 g d’olives noires dénoyautées (facultatif)\",\"1 c. à café d’origan\",\"1 c. à soupe d’quelques feuilles de basilic\",\"Sel et poivre\",\"1. Préparez pour 4 personnes : 4 dos de cabillaud (environ 600 g), 400 g de tomates concassées, 1 courgette, 1 oignon, 2 gousses d’ail, 1 c. à soupe d’huile d’olive, 40 g d’olives noires dénoyautées (facultatif), 1 c. à café d’origan, 1 c. à soupe d’quelques feuilles de basilic, Sel et poivre. Coupez les légumes et préchauffez le four à 180 °C. (10 min)\",\"2. Disposez 4 dos de cabillaud (environ 600 g) et 400 g de tomates concassées, 1 courgette, 1 oignon, 2 gousses d’ail dans un plat; ajoutez les aromates, l’huile et le citron de la fiche.\",\"3. Enfournez 25 min à 180 °C, jusqu’à chair opaque qui se détache facilement. Cuisez l’accompagnement séparément si nécessaire.\",\"4. Vérifiez la cuisson à cœur et répartissez en 4 portions avec les légumes préparés.\",\"La sauce peut être préparée au Monsieur Cuisine : hacher l’oignon et l’ail 5 s / vitesse 6, racler, ajouter huile et courgette 5 min / 120 °C / vitesse 1, puis tomates et aromates 10 min / 100 °C / vitesse 1. Cuire le cabillaud séparément à la vapeur ou à la poêle et vérifier sa cuisson.\",\"Étapes complétées lors de l’audit test des semaines 1 et 2 : adapter les cuissons aux ingrédients exacts et vérifier la cuisson à cœur des viandes et poissons.\"]},{\"id\":\"r-cac89622a2\",\"name\":\"🍝 Sauce bolognaise grande quantité\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"400 g de viande hachée\",\"2 tomates\",\"2 carottes\",\"2 oignons\",\"1 céleri (facultatif)\",\"Basilic frais (5 g)\",\"Épices ou aromates (2 g)\",\"basilic\",\"origan\",\"\\\"Bolognaise\\\"\",\"➡️ 2 repas + congélation.\",\"1. Préparez pour 4 personnes : 400 g de viande hachée, 2 tomates, 2 carottes, 2 oignons, 1 céleri (facultatif), Basilic frais (5 g), Épices ou aromates (2 g). Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir 2 tomates, 2 carottes, 2 oignons avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez 400 g de viande hachée et les condiments indiqués; cuisez à feu moyen-doux 15 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Bolognaise\"]},{\"id\":\"r-ff99d9e090\",\"name\":\"🥣 Dahl de lentilles corail\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 23 min\",\"👥 Pour 4 personnes\",\"200 g de lentilles corail rincées\",\"400 g de tomates concassées\",\"200 ml de lait de coco\",\"2 carottes (environ 200 g)\",\"1 oignon\",\"1 c. à soupe d’huile d’olive\",\"1 c. à café de curry doux\",\"1/2 c. à café de cumin\",\"400 ml d’eau\",\"Sel fin (2 g) et poivre moulu (0,5 g)\",\"curry\",\"curcuma\",\"cumin\",\"\\\"Dahl de lentilles\\\"\",\"1. Préparez pour 4 personnes : 200 g de lentilles corail rincées, 400 g de tomates concassées, 200 ml de lait de coco, 2 carottes (environ 200 g), 1 oignon, 1 c. à soupe d’huile d’olive, 1 c. à café de curry doux, 1/2 c. à café de cumin, 400 ml d’eau, Sel fin (2 g) et poivre moulu (0,5 g). Lavez et coupez les légumes. (10 min)\",\"2. Faites revenir 200 g de lentilles corail rincées, 400 g de tomates concassées, 2 carottes (environ 200 g), 1 oignon avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez 200 g de lentilles corail rincées et 200 ml de lait de coco, 1 c. à soupe d’huile d’olive; cuisez à feu moyen-doux 23 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Dahl de lentilles\"]},{\"id\":\"r-538fe567c8\",\"name\":\"🍚 Riz cantonais maison\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"300 g de riz\",\"1 œufs\",\"400 g de jambon\",\"1 petits pois (facultatif selon tes goûts)\",\"2 carottes\",\"1 c. à soupe de sauce soja\",\"Ciboulette (5 g)\",\"sauce soja\",\"ciboulette\",\"\\\"Riz cantonais\\\"\",\"1. Préparez pour 4 personnes : 300 g de riz, 1 œufs, 400 g de jambon, 1 petits pois (facultatif selon tes goûts), 2 carottes, 1 c. à soupe de sauce soja, Ciboulette (5 g). Lavez et coupez les légumes. (15 min)\",\"2. Cuisez 300 g de riz dans l’eau bouillante salée selon le paquet; égouttez.\",\"3. Faites revenir 2 carottes 5 à 8 min dans la matière grasse prévue; ajoutez 1 œufs, 400 g de jambon et poursuivez 15 min en vérifiant la cuisson.\",\"4. Mélangez avec le féculent cuit, ajoutez les herbes et assaisonnements de la fiche, puis répartissez en 4 portions.\",\"Riz cantonais\"]},{\"id\":\"r-5896f01ad1\",\"name\":\"🥘 Paëlla simplifiée\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"300 g de riz\",\"400 g de poulet\",\"400 g de crevettes\",\"300 g de chorizo\",\"2 poivrons\",\"1 safran\",\"Épices ou aromates (2 g)\",\"1 gousse d’ail\",\"safran\",\"paprika\",\"ail\",\"\\\"Paella\\\"\",\"🤖 ONGLET MR CUISINE SMART\",\"🥣 SOUPES • ENTRÉES • ACCOMPAGNEMENTS MAISON\",\"1. Préparez pour 4 personnes : 300 g de riz, 400 g de poulet, 400 g de crevettes, 300 g de chorizo, 2 poivrons, 1 safran, Épices ou aromates (2 g), 1 gousse d’ail. Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir 2 poivrons, 1 gousse d’ail avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez 400 g de poulet, 400 g de crevettes et les condiments indiqués; cuisez à feu moyen-doux 30 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Paella\",\"ONGLET MR CUISINE SMART\"]},{\"id\":\"r-3a7b357b85\",\"name\":\"🥣 Velouté de courge façon douceur d’automne 🍂\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"700 g de courge butternut ou potimarron\",\"2 carottes (environ 200 g)\",\"1 oignon\",\"1 pomme de terre (environ 180 g)\",\"750 ml de bouillon de légumes\",\"1 c. à café de curry doux\",\"1 pincée de muscade\",\"1 c. à soupe d’huile d’olive\",\"1 c. à soupe de fromage frais (facultatif)\",\"Sel fin (2 g) et poivre moulu (0,5 g)\",\"curry doux\",\"muscade\",\"poivre\",\"🧀 Option plaisir :\",\"1 cuillère de St Môret au moment de mixer.\",\"\\\"Velouté de potiron\\\"\",\"1. Préparez pour 4 personnes : 700 g de courge butternut ou potimarron, 2 carottes (environ 200 g), 1 oignon, 1 pomme de terre (environ 180 g), 750 ml de bouillon de légumes, 1 c. à café de curry doux, 1 pincée de muscade, 1 c. à soupe d’huile d’olive, 1 c. à soupe de fromage frais (facultatif), Sel fin (2 g) et poivre moulu (0,5 g). Lavez, épluchez et coupez les légumes. (15 min)\",\"2. Faites revenir 2 carottes (environ 200 g), 1 oignon, 750 ml de bouillon de légumes avec la matière grasse prévue pendant 3 à 5 min en remuant.\",\"3. Ajoutez 1 pomme de terre (environ 180 g) et 750 ml de bouillon de légumes, 1 c. à soupe d’huile d’olive; couvrez et laissez frémir 30 min, jusqu’à tendreté.\",\"4. Mixez si besoin, ajoutez les herbes prévues, rectifiez l’assaisonnement et servez en 4 bols.\",\"Velouté de potiron\"]},{\"id\":\"r-45b3ac4798\",\"name\":\"🍅 Velouté tomate basilic façon restaurant\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"300 g de tomates\",\"2 carottes\",\"1 oignon\",\"1 gousse d’ail\",\"500 ml de bouillon\",\"1 c. à soupe de basilic ciselé\",\"1 c. à soupe d’origan\",\"Poivre moulu (0,5 g)\",\"basilic\",\"origan\",\"poivre\",\"\\\"Soupe tomate\\\"\",\"Faire en grande quantité et congeler.\",\"1. Préparez pour 4 personnes : 300 g de tomates, 2 carottes, 1 oignon, 1 gousse d’ail, 500 ml de bouillon, 1 c. à soupe de basilic ciselé, 1 c. à soupe d’origan, Poivre moulu (0,5 g). Lavez, épluchez et coupez les légumes. (15 min)\",\"2. Faites revenir 300 g de tomates, 2 carottes, 1 oignon, 1 gousse d’ail avec la matière grasse prévue pendant 3 à 5 min en remuant.\",\"3. Ajoutez les autres ingrédients et 500 ml de bouillon; couvrez et laissez frémir 30 min, jusqu’à tendreté.\",\"4. Mixez si besoin, ajoutez les herbes prévues, rectifiez l’assaisonnement et servez en 4 bols.\",\"Soupe tomate\"]},{\"id\":\"r-089cee7987\",\"name\":\"Velouté de carottes, lait de coco et curry\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"800 g de carottes\",\"1 oignon\",\"700 ml de bouillon de légumes\",\"200 ml de lait de coco\",\"1 c. à café de curry doux\",\"1/2 c. à café de curcuma\",\"1 petit morceau de gingembre (facultatif)\",\"Sel et poivre\",\"1. Préparez pour 4 personnes : 800 g de carottes, 1 oignon, 700 ml de bouillon de légumes, 200 ml de lait de coco, 1 c. à café de curry doux, 1/2 c. à café de curcuma, 1 petit morceau de gingembre (facultatif), Sel et poivre. Lavez, épluchez et coupez les légumes. (10 min)\",\"2. Faites revenir 800 g de carottes, 1 oignon, 700 ml de bouillon de légumes avec la matière grasse prévue pendant 3 à 5 min en remuant.\",\"3. Ajoutez les autres ingrédients et 700 ml de bouillon de légumes, 200 ml de lait de coco; couvrez et laissez frémir 30 min, jusqu’à tendreté.\",\"4. Mixez si besoin, ajoutez les herbes prévues, rectifiez l’assaisonnement et servez en 4 bols.\",\"Monsieur Cuisine : hacher l’oignon 5 s / vitesse 6 et racler. Ajouter carottes, bouillon et épices; cuire 25 min / 100 °C / vitesse 1. Mixer progressivement 30 à 60 s / vitesse 5 à 8. Ajouter le lait de coco et mélanger 20 s / vitesse 3. Vérifier la capacité du bol et le manuel.\",\"Étapes complétées lors de l’audit test des semaines 1 et 2 : adapter les cuissons aux ingrédients exacts et vérifier la cuisson à cœur des viandes et poissons.\"]},{\"id\":\"r-2ca8d6a24c\",\"name\":\"🥒 Soupe froide courgette menthe (été ☀️)\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 45 min\",\"👥 Pour 4 personnes\",\"1 courgette\",\"150 ml de fromage blanc ou St Môret\",\"Menthe fraîche (5 g)\",\"1 citron\",\"Poivre moulu (0,5 g)\",\"Basilic frais (5 g)\",\"poivre\",\"basilic\",\"\\\"Soupe froide\\\"\",\"⭐ Parfaite quand il fait chaud.\",\"1. Préparez pour 4 personnes : 1 courgette, 150 ml de fromage blanc ou St Môret, Menthe fraîche (5 g), 1 citron, Poivre moulu (0,5 g), Basilic frais (5 g). Lavez, épluchez et coupez les légumes. (15 min)\",\"2. Faites revenir 1 courgette avec la matière grasse prévue pendant 3 à 5 min en remuant.\",\"3. Ajoutez les autres ingrédients et 150 ml de fromage blanc ou St Môret, 1 citron; couvrez et laissez frémir 35 min, jusqu’à tendreté.\",\"4. Mixez si besoin, ajoutez les herbes prévues, rectifiez l’assaisonnement et servez en 4 bols.\",\"Soupe froide\"]},{\"id\":\"r-425ae8fe60\",\"name\":\"🧅 Soupe à l’oignon gratinée\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"2 oignons\",\"150 ml de bouillon\",\"4 pain complet grillé\",\"100 g de fromage râpé\",\"1 Comté ou emmental.\",\"Comté ou emmental.\",\"\\\"Soupe à l'oignon\\\"\",\"1. Préparez pour 4 personnes : 2 oignons, 150 ml de bouillon, 4 pain complet grillé, 100 g de fromage râpé, 1 Comté ou emmental.. Lavez, épluchez et coupez les légumes. (15 min)\",\"2. Faites revenir 2 oignons avec la matière grasse prévue pendant 3 à 5 min en remuant.\",\"3. Ajoutez 4 pain complet grillé et 150 ml de bouillon; couvrez et laissez frémir 25 min, jusqu’à tendreté.\",\"4. Mixez si besoin, ajoutez les herbes prévues, rectifiez l’assaisonnement et servez en 4 bols.\",\"Soupe à l'oignon\"]},{\"id\":\"r-e79335a6fc\",\"name\":\"🍄 Velouté de champignons\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"2 champignons\",\"2 oignon\",\"2 pomme de terre\",\"150 ml de crème légère\",\"Épices ou aromates (2 g)\",\"Persil frais (5 g)\",\"Poivre moulu (0,5 g)\",\"muscade\",\"persil\",\"poivre\",\"\\\"Velouté champignons\\\"\",\"1. Préparez pour 4 personnes : 2 champignons, 2 oignon, 2 pomme de terre, 150 ml de crème légère, Épices ou aromates (2 g), Persil frais (5 g), Poivre moulu (0,5 g). Lavez, épluchez et coupez les légumes. (15 min)\",\"2. Faites revenir 2 champignons, 2 oignon avec la matière grasse prévue pendant 3 à 5 min en remuant.\",\"3. Ajoutez 2 pomme de terre et 150 ml de crème légère; couvrez et laissez frémir 25 min, jusqu’à tendreté.\",\"4. Mixez si besoin, ajoutez les herbes prévues, rectifiez l’assaisonnement et servez en 4 bols.\",\"Velouté champignons\"]},{\"id\":\"r-1e76dc3c99\",\"name\":\"🥚 Œufs mimosa maison\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"1 œufs\",\"400 g de thon\",\"150 ml de St Môret ou fromage blanc\",\"ciboulette\",\"paprika\",\"poivre\",\"\\\"Œufs mimosa\\\"\",\"En verrine pour apéro.\",\"1. Préparez pour 4 personnes : 1 œufs, 400 g de thon, 150 ml de St Môret ou fromage blanc, ciboulette, paprika, poivre. Battez les œufs avec le sel, le poivre et les herbes indiqués. (15 min)\",\"2. Faites revenir les légumes de la fiche dans une poêle antiadhésive 5 à 7 min.\",\"3. Ajoutez les œufs battus et 1 œufs, 400 g de thon; cuisez à feu moyen-doux 15 min, jusqu’à ce que le centre soit pris.\",\"4. Vérifiez que les œufs sont entièrement cuits, partagez en 4 portions et servez.\",\"Œufs mimosa\"]},{\"id\":\"r-4eb3e0935b\",\"name\":\"🥧 Appareil à quiche maison\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"1 œufs\",\"150 ml de lait\",\"150 ml de crème légère\",\"🥬 poireaux saumon\",\"🍄 champignons jambon\",\"🥒 courgettes chèvre\",\"🐟 thon tomate\",\"\\\"Quiche\\\"\",\"1. Préparez pour 4 personnes : 1 œufs, 150 ml de lait, 150 ml de crème légère. Préchauffez le four à 180 °C et coupez les légumes. (15 min)\",\"2. Faites revenir 1 œufs dans la matière grasse prévue 5 à 8 min; vérifiez la cuisson de la viande.\",\"3. Disposez les légumes de la fiche, 1 œufs dans un plat et ajoutez 150 ml de lait, 150 ml de crème légère; répartissez uniformément.\",\"4. Enfournez 30 min à 180 °C, jusqu’à tendreté et dessus doré; vérifiez la cuisson à cœur, reposez 5 min et servez en 4 portions.\",\"Quiche\"]},{\"id\":\"r-cfc62d8178\",\"name\":\"🐟 thon tomate\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"\\\"Quiche\\\"\",\"400 g de thon\",\"300 g de légumes de saison\",\"200 g de féculent adapté\",\"1 c. à soupe d’huile d’olive\",\"Sel et poivre\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Quiche\"]},{\"id\":\"r-1a027a4e41\",\"name\":\"🥞 Crêpes salées maison\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"🍄 jambon champignons\",\"🐟 saumon poireaux\",\"400 g de jambon champignons\",\"400 g de saumon poireaux\",\"1 c. à soupe d’huile d’olive\",\"1. Préparez pour 4 personnes : 400 g de jambon champignons, 400 g de saumon poireaux, 1 c. à soupe d’huile d’olive. Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir 400 g de jambon champignons, 400 g de saumon poireaux avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez 400 g de jambon champignons, 400 g de saumon poireaux et 1 c. à soupe d’huile d’olive; cuisez à feu moyen-doux 25 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\"]},{\"id\":\"r-bac7e05aac\",\"name\":\"🥚 œuf fromage\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"\\\"Pâte à crêpes\\\"\",\"400 g de légumes de saison\",\"300 g de légumes de saison\",\"200 g de féculent adapté\",\"1 c. à soupe d’huile d’olive\",\"Sel et poivre\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Pâte à crêpes\"]},{\"id\":\"r-bc488517c3\",\"name\":\"🥔 Purée maison ultra crémeuse\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"2 pommes de terre\",\"150 ml de lait\",\"1 beurre\",\"Épices ou aromates (2 g)\",\"Poivre moulu (0,5 g)\",\"poivre\",\"\\\"Purée de pommes de terre\\\"\",\"🥕 carottes\",\"🥒 courgettes\",\"🍠 patate douce\",\"1. Préparez pour 4 personnes : 2 pommes de terre, 150 ml de lait, 1 beurre, Épices ou aromates (2 g), Poivre moulu (0,5 g). Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir les légumes de la fiche avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez les autres ingrédients de la fiche et 150 ml de lait; cuisez à feu moyen-doux 15 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnemen 9b\",\"name\":\"🍳 œufs à la tomate\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"\\\"Coulis de tomates\\\"\",\"400 g de légumes de saison\",\"300 g de légumes de saison\",\"200 g de féculent adapté\",\"1 c. à soupe d’huile d’olive\",\"Sel et poivre\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Coulis de tomates\"]},{\"id\":\"r-cca632b0a5\",\"name\":\"🥣 Béchamel maison légère\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"lasagnes\",\"gratins\",\"croques\",\"150 ml de lait\",\"100 g de farine\",\"1 beurre\",\"Épices ou aromates (2 g)\",\"\\\"Béchamel\\\"\",\"1. Préparez pour 4 personnes : 150 ml de lait, 100 g de farine, 1 beurre, Épices ou aromates (2 g). Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir les légumes de la fiche avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez les autres ingrédients de la fiche et 150 ml de lait; cuisez à feu moyen-doux 15 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Béchamel\"]},{\"id\":\"r-9d21738040\",\"name\":\"🧄 Pesto maison basilic\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"Basilic frais (5 g)\",\"100 g de parmesan\",\"1 c. à soupe de huile d’olive\",\"1 gousse d’ail\",\"100 g de noix ou pignons\",\"\\\"Pesto\\\"\",\"🍝 pâtes\",\"🍅 bruschettas\",\"🥪 sandwichs\",\"1. Préparez pour 4 personnes : Basilic frais (5 g), 100 g de parmesan, 1 c. à soupe de huile d’olive, 1 gousse d’ail, 100 g de noix ou pignons. Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir 1 gousse d’ail avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez les autres ingrédients de la fiche et 1 c. à soupe de huile d’olive; cuisez à feu moyen-doux 25 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"Pesto\"]},{\"id\":\"r-7e83748f10\",\"name\":\"🥘 Ratatouille maison\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"1 courgette\",\"2 tomates\",\"2 poivrons\",\"1 aubergines (facultatif pour toi )\",\"2 oignons\",\"Épices ou aromates (2 g)\",\"thym (10 g pour 4 personnes)\",\"Basilic frais (5 g)\",\"1 gousse d’ail\",\"paprika\",\"thym\",\"basilic\",\"ail\",\"\\\"Ratatouille\\\"\",\"✅ avec poisson\",\"✅ avec œufs au plat\",\"✅ avec poulet\",\"✅ en accompagnement\",\"1. Préparez pour 4 personnes : 1 courgette, 2 tomates, 2 poivrons, 1 aubergines (facultatif pour toi ), 2 oignons, Épices ou aromates (2 g), thym (10 g pour 4 personnes), Basilic frais (5 g), 1 gousse d’ail. Lavez et coupez les légumes. (15 min)\",\"2. Faites revenir 1 courgette, 2 tomates, 2 poivrons, 1 aubergines (facultatif pour toi ), 2 oignons, 1 gousse d’ail avec la matière grasse prévue 5 à 8 min à feu moyen.\",\"3. Ajoutez les autres ingrédients de la fiche et les condiments indiqués; cuisez à feu moyen-doux 15 min en remuant et en vérifiant la cuisson à cœur.\",\"4. Goûtez, rectifiez l’assaisonnement avec les éléments prévus et répartissez en 4 portions égales.\",\"avec poisson\",\"avec œufs au plat\",\"avec poulet\",\"en accompagnement\",\"Ratatouille\"]},{\"id\":\"r-f7eaf272ce\",\"name\":\"🍅 Œufs à la tomate façon shakshuka\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"200 g de œufs\",\"300 g de tomates\",\"2 poivrons\",\"1 oignon\",\"1 c. à café de paprika\",\"1 c. à café de cumin\",\"1 gousse d’ail\",\"4 tranches de une tranche de pain complet pour saucer\",\"paprika\",\"cumin\",\"ail\",\"✅ une tranche de pain complet pour saucer 😍\",\"\\\"Shakshuka\\\"\",\"1. Préparez pour 4 personnes : 200 g de œufs, 300 g de tomates, 2 poivrons, 1 oignon, 1 c. à café de paprika, 1 c. à café de cumin, 1 gousse d’ail, 4 tranches de une tranche de pain complet pour saucer. Battez les œufs avec le sel, le poivre et les herbes indiqués. (15 min)\",\"2. Faites revenir 300 g de tomates, 2 poivrons, 1 oignon, 1 gousse d’ail dans une poêle antiadhésive 5 à 7 min.\",\"3. Ajoutez les œufs battus et 200 g de œufs; cuisez à feu moyen-doux 15 min, jusqu’à ce que le centre soit pris.\",\"4. Vérifiez que les œufs sont entièrement cuits, partagez en 4 portions et servez.\",\"Shakshuka\"]},{\"id\":\"r-0ead00f1d6\",\"name\":\"🥬 Fondue de poireaux maison\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"4 gros blancs de poireaux (environ 800g à 1kg)\",\"30g de beurre (ou 2 c. à soupe d'huile d'olive)\",\"4 c. à soupe de crème fraîche légère (15% MG)\",\"1 c. à café de jus de citron\",\"1 pincée de sel, poivre et noix de muscade\",\"1. La découpe : Épluchez les poireaux, retirez la partie vert foncé. Coupez les blancs en deux, lavez-les soigneusement et émincez-les en fines rondelles.\",\"2. Le départ en cuisson : Dans une sauteuse, faites fondre le beurre à feu moyen et ajoutez les poireaux émincés.\",\"3. La tombée : Remuez bien pour les enrober de beurre. Laissez-les suer à découvert pendant 5 minutes.\",\"4. L'étouffée : Salez, poivrez, baissez le feu au minimum, couvrez et laissez mijoter doucement pendant 15 à 20 minutes (les poireaux doivent être très tendres).\",\"5. La liaison : Retirez le couvercle, ajoutez la crème fraîche, le jus de citron et la muscade. Mélangez 2 minutes sur le feu pour lier le tout.\"]},{\"id\":\"r-35f1833eb2\",\"name\":\"🥚 œufs cocotte\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"200 g de poireaux\",\"150 ml de crème légère\",\"1 c. à café de moutarde douce\",\"poivre\",\"muscade\",\"\\\"Fondue de poireaux\\\"\",\"1. Laver et couper les légumes en petits morceaux; râper ou émietter le fromage.\",\"2. Faire revenir les légumes dans une poêle avec l’huile pendant 5 à 8 minutes, jusqu’à ce qu’ils soient tendres.\",\"3. Battre les œufs avec le sel et le poivre, puis verser sur les légumes.\",\"4. Cuire à feu moyen-doux 4 à 6 minutes, ajouter le fromage et couvrir jusqu’à ce que les œufs soient pris.\",\"Fondue de poireaux\"]},{\"id\":\"r-5a33ccfcfe\",\"name\":\"🥕 Légumes vapeur sauce fromage blanc\",\"lines\":[\"⏱️ Préparation : 20 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"4 belles carottes\",\"1 tête de brocoli moyenne (environ 400g)\",\"4 pommes de terre moyennes (type chair ferme)\",\"300g de fromage blanc (0% ou 3% MG)\",\"2 c. à soupe de jus de citron\",\"1/2 bouquet de ciboulette et persil frais\",\"1/2 c. à café d'ail en poudre, sel, poivre\",\"1. La préparation des légumes : Épluchez les carottes (coupez-les en rondelles) et les pommes de terre (en dés). Séparez le brocoli en petits bouquets et lavez le tout.\",\"2. La cuisson vapeur : Placez pommes de terre et carottes dans le panier vapeur pour 10 minutes. Ajoutez ensuite le brocoli et prolongez de 8 à 10 minutes.\",\"3. La confection de la sauce : Pendant ce temps, mélangez énergiquement le fromage blanc avec le jus de citron, l'ail en poudre, le sel et le poivre.\",\"4. La touche finale : Incorporez les herbes fraîchement ciselées dans la sauce et réservez au frais.\",\"5. Le dressage : Répartissez les légumes vapeur bien chauds dans les assiettes et servez avec la sauce fraîche.\"]},{\"id\":\"r-63725d1501\",\"name\":\"🧅 Oignons confits maison\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 40 min\",\"👥 Pour 4 personnes\",\"6 gros oignons jaunes ou rouges (environ 800g)\",\"2 c. à soupe d'huile d'olive\",\"1 c. à soupe de sucre roux (ou cassonade)\",\"3 c. à soupe de vinaigre balsamique\",\"1 pincée de sel et poivre\",\"1. L'éminçage : Épluchez les oignons, coupez-les en deux, puis émincez-les finement en lamelles régulières.\",\"2. La suée : Faites chauffer l'huile d'olive dans une sauteuse à feu moyen. Ajoutez les oignons et le sel. Faites revenir 5 à 7 minutes jusqu'à ce qu'ils soient translucides.\",\"3. La caramélisation : Saupoudrez le sucre roux, baissez le feu et laissez cuire doucement pendant 15 minutes en remuant régulièrement.\",\"4. Le déglaçage : Versez le vinaigre balsamique pour décoller tous les sucs au fond de la poêle.\",\"5. Le confisage : Couvrez et laissez confire à feu très doux pendant 15 à 20 minutes jusqu'à obtenir une consistance fondante et sirupeuse.\"]},{\"id\":\"r-e585033a15\",\"name\":\"🍄 Champignons à la crème légère\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 15 min\",\"👥 Pour 4 personnes\",\"800g de champignons de Paris frais\",\"2 belles échalotes\",\"2 gousses d'ail\",\"1 c. à soupe d'huile d'olive (ou 15g de beurre)\",\"150ml de crème fraîche légère (15% MG)\",\"1/2 bouquet de persil frais, sel, poivre\",\"1. La découpe : Nettoyez les champignons avec un torchon humide et émincez-les. Émincez les échalotes et hachez l'ail.\",\"2. La cuisson : Dans une poêle à feu vif avec l'huile, jetez les champignons et laissez cuire 5 à 7 minutes jusqu'à évaporation de l'eau.\",\"3. L'aromate : Baissez le feu, ajoutez échalotes et ail, et faites revenir 3 minutes.\",\"4. La crème : Salez, poivrez et versez la crème légère. Laissez mijoter doucement 2 à 3 minutes.\",\"5. La finition : Hors du feu, parsemez de persil frais ciselé avant de servir.\"]},{\"id\":\"r-e0673ba2c7\",\"name\":\"🥗 Sauce salade maison\",\"lines\":[\"⏱️ Préparation : 5 min\",\"🔥 Cuisson : 0 min\",\"👥 Pour 4 personnes\",\"1 c. à soupe bombée de moutarde de Dijon\",\"3 c. à soupe de vinaigre (cidre ou vin rouge)\",\"3 c. à soupe d'huile de colza ou de noix\",\"3 c. à soupe d'huile d'olive\",\"2 c. à soupe d'eau tiède (l'astuce secrète pour lier)\",\"1 pincée de sel et poivre\",\"1. Dans un bocal, déposez la moutarde, le sel et le poivre.\",\"2. Versez le vinaigre et mélangez bien pour dissoudre le sel.\",\"3. Ajoutez les huiles petit à petit en fouettant vigoureusement pour créer l'émulsion.\",\"4. Ajoutez l'eau tiède tout en continuant de mélanger pour lier la vinaigrette à long terme.\",\"5. Fermez le bocal, secouez avant chaque utilisation et conservez au frais.\"]},{\"id\":\"r-520e2105e0\",\"name\":\"🧄 Ail et persil mixés maison\",\"lines\":[\"⏱️ Préparation : 10 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"1 tête d'ail entière (8 à 10 gousses)\",\"1 gros bouquet de persil plat frais (environ 50g)\",\"3 c. à soupe d'huile d'olive (conservateur naturel)\",\"1/2 c. à café de sel fin\",\"1. L'ail : Épluchez les gousses d'ail et retirez le germe vert central pour une meilleure digestion.\",\"2. Le persil : Lavez le persil et séchez-le très soigneusement (l'humidité nuit à la conservation). Effeuillez-le.\",\"3. Le hachage : Déposez l'ail, le persil et le sel dans un petit mixeur.\",\"4. L'impulsion : Mixez par petites impulsions pour obtenir un hachage régulier sans faire une purée liquide.\",\"5. La mise en pot : Transférez dans un bocal et recouvrez avec l'huile d'olive. Conservez au réfrigérateur jusqu'à 2 semaines.\"]},{\"id\":\"r-8fba3255e5\",\"name\":\"🍆 Légumes grillés façon provençale\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"2 courgettes moyennes\",\"1 belle aubergine\",\"2 poivrons (rouge et jaune)\",\"200g de tomates cerises\",\"3 c. à soupe d'huile d'olive\",\"1 c. à soupe bombée d'herbes de Provence\",\"2 gousses d'ail hachées, sel, poivre\",\"1. Préchauffez votre four à 200°C. Lavez tous les légumes.\",\"2. Coupez courgettes, aubergine en gros dés de 2cm, et poivrons en lanières. Laissez les tomates cerises entières.\",\"3. Dans un saladier, mélangez tous les légumes (sauf les tomates cerises) avec l'huile, les herbes de Provence, l'ail, le sel et le poivre.\",\"4. Étalez les légumes en une seule couche sur une plaque avec papier cuisson. Enfournez pour 20 minutes.\",\"5. Ajoutez les tomates cerises sur la plaque, mélangez délicatement et remettez au four 10 minutes.\"]},{\"id\":\"r-127e5d9b9c\",\"name\":\"🥚 Flan salé aux légumes\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 35 min\",\"👥 Pour 4 personnes\",\"5 gros œufs frais\",\"200ml de lait (demi-écrémé ou végétal)\",\"2 c. à soupe bombées de crème fraîche légère (15% MG)\",\"400g de légumes déjà cuits (restes de fondues ou légumes vapeur)\",\"1 c. à soupe rase de fécule de maïs (Maïzena)\",\"60g de fromage râpé léger (Emmental ou Mozzarella)\",\"1 pincée de sel, poivre et noix de muscade\",\"1. Préchauffez le four à 180°C. Dans un saladier, fouettez les œufs avec la fécule de maïs.\",\"2. Ajoutez le lait, la crème légère, le sel, le poivre et la muscade. Mélangez bien.\",\"3. Incorporez vos légumes cuits et la moitié du fromage râpé à la spatule.\",\"4. Versez la préparation dans un moule (en silicone de préférence) et parsemez le reste du fromage sur le dessus.\",\"5. Enfournez pour 35 minutes jusqu'à ce que le centre soit ferme et le dessus doré. Laissez refroidir avant de découper.\"]},{\"id\":\"r-615c01edc2\",\"name\":\"🐟 saumon poireaux\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 25 min\",\"👥 Pour 4 personnes\",\"\\\"Flan de légumes\\\"\",\"400 g de saumon\",\"300 g de légumes de saison\",\"200 g de féculent adapté\",\"1 c. à soupe d’huile d’olive\",\"Sel et poivre\",\"1. Préparer les ingrédients : laver, éplucher et couper les légumes si nécessaire, puis peser les quantités.\",\"2. Faire cuire les ingrédients principaux dans une poêle ou une casserole chaude jusqu’à ce qu’ils soient bien cuits.\",\"3. Goûter, rectifier l’assaisonnement si nécessaire, puis servir chaud ou froid selon la recette.\",\"Flan de légumes\"]},{\"id\":\"r-bb6f9bfee0\",\"name\":\"🍲 Velouté complet courgettes, poireaux \u0026 poulet\",\"lines\":[\"curry doux : 1 c. à café\",\"Poivre moulu (0,5 g)\",\"1 c. à soupe d’persil\",\"1 tranche complète possible\",\"poivre\",\"persil\",\"Étape 1 — Hacher\",\"➡️ oignon + légumes\",\"Étape 2 — Cuire\",\"➡️ cuisson avec bouillon\",\"Étape 3 — Mixer\",\"➡️ texture velours\",\"Étape 4 — Ajouter\",\"➡️ fromage blanc après mixage\",\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 30 min\",\"👥 Pour 4 personnes\",\"✅ 1 tranche complète possible\",\"❌ Non\",\"1. Laver et couper les légumes en morceaux de taille similaire; éplucher l’oignon et la pomme de terre s’ils figurent dans la fiche.\",\"2. Faire revenir l’oignon dans l’huile 3 minutes dans une casserole.\",\"3. Ajouter les légumes et le bouillon, porter à frémissement puis cuire 20 à 25 minutes, jusqu’à ce que les morceaux soient tendres.\",\"4. Mixer soigneusement jusqu’à obtenir une texture lisse. Ajouter la crème facultative, saler, poivrer et servir chaud.\",\"➡️ environ 35 minutes\"]},{\"id\":\"r-c2ef299d17\",\"name\":\"🍚 Risotto crémeux poulet, champignons \u0026 parmesan\",\"lines\":[\"300 g de riz arborio : 240 g\",\"400 g de poulet : 500 g\",\"2 champignons : 500 g\",\"200 g de échalotes\",\"500 ml de bouillon\",\"100 g de parmesan\",\"1 c. à soupe d’thym\",\"1 c. à soupe d’persil\",\"1 gousse d’\",\"poivre\",\"thym\",\"persil\",\"ail\",\"Hacher\",\"➡️ échalotes\",\"Faire revenir\",\"➡️ poulet + champignons\",\"Cuisson automatique\",\"➡️ riz + bouillon\",\"Finir\",\"➡️ fromage blanc + parmesan pour le côté crémeux\",\"⏱️ Préparation : 12 min\",\"🔥 Cuisson : 20 min\",\"👥 Pour 4 personnes\",\"➡️ 60 g riz cru/personne\",\"❌ Non\",\"➡️ parmesan compté dans la recette\",\"1. Lavez et séchez 2 champignons : 500 g. Épluchez ceux qui le nécessitent et coupez-les en morceaux réguliers d’environ 1 à 2 cm.\",\"2. Porter une grande casserole d’eau à ébullition et cuire les pâtes selon le temps indiqué sur le paquet; pour un risotto, faire revenir le riz puis ajouter le bouillon progressivement.\",\"3. Dans une poêle, cuire les légumes et la protéine de la recette jusqu’à ce qu’ils soient tendres  puis servir chaud ou froid selon la recette.\",\"➡️ environ 45 minutes\",\"Cuire pommes de terre\",\"Cuire poisson vapeur\",\"Écraser/mélanger la préparation\"]},{\"id\":\"r-99dab97b56\",\"name\":\"🍲 Chili doux de poulet \u0026 légumes\",\"lines\":[\"⏱️ Préparation : 15 min\",\"🔥 Cuisson : 45 min\",\"👥 Pour 4 personnes\",\"paprika fumé : 1 c. à café\",\"cumin : 1 c. à café\",\"paprika doux : 1 c. à café\",\"piment doux : 1 pincée\",\"poivre\",\"curry doux : 1/2 c. à café\",\"1 gousse d’ail : 1/2 c. à café\",\"tomates\",\"ail\",\"oignon\",\"citron vert\",\"✅ Hacher les légumes\",\"✅ Préparer la sauce\",\"✅ Cuisson mijotée\",\"➡️ riz basmati : 60 g cru/personne\",\"❌ Non\",\"✅ Possible :\",\"➡️ un peu de cheddar râpé 20 g/personne\",\"1. Lavez et séchez les produits frais de la fiche. Épluchez ceux qui le nécessitent et coupez-les en morceaux réguliers d’environ 1 à 2 cm.\",\"2. Faire chauffer l’huile dans une cocotte. Saisir la viande en plusieurs fois 3 à 5 minutes pour la colorer, puis réserver si nécessaire.\",\"3. Faire revenir l’oignon 3 minutes, ajouter les légumes et les épices de la recette, puis mélanger 1 minute.\",\"4. Remettre la viande, ajouter le liquide ou la sauce prévus et couvrir. Mijoter 20 à 35 minutes selon la pièce et la taille des morceaux; vérifier la cuisson à cœur.\",\"5. Goûter, rectifier l’assaisonnement et servir chaud avec l’accompagnement prévu.\",\"➡️ environ 45 minutes\",\"Hacher les légumes\",\"Préparer la sauce\",\"Cuisson mijotée\",\"Hacher oignon et légumes\",\"Faire revenir les ingrédients\",\"Cuisson mijotée lente\",\"Mélange régulier sans surveiller\"]},{\"id\":\"r-5a15ab45ea\",\"name\":\"🥣 Velouté lentilles corail, carottes \u0026 curry\",\"lines\":[\"1 gousse d’lentilles corail : 250 g\",\"5 carottes\",\"1 courgette\",\"2 oignon\",\"150 ml de bouillon\",\"150 ml de fromage blanc : 100 g\",\"curry doux : 2 c. à café\",\"1 curcuma : 1/2 c. à café\",\"cumin : 1/2 c. à café\",\"Poivre moulu (0,5 g)\",\"1 tranche complète possibl
