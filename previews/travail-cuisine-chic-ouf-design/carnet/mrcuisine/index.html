lettes\",\"🥘 plats mijotés\",\"portions de 250 à 500 g\",\"🍳 œufs à la tomate\",\"Sauce tomate\"]},{\"id\":\"r-190641843a\",\"name\":\"🥕 Purée maison carottes \u0026 pommes de terre\",\"lines\":[\"pommes de terre\",\"carottes\",\"lait\",\"beurre (petite quantité)\",\"muscade\",\"poivre\",\"\\\"Purée de pommes de terre\\\"\",\"patate douce\",\"courgette\",\"céleri\",\"Purée de pommes de terre\"]},{\"id\":\"r-627302c625\",\"name\":\"🥚 Œufs cocotte au saumon fumé\",\"lines\":[\"200 g de œufs\",\"600 g de saumon fumé\",\"150 ml de crème légère\",\"1 c. à soupe d’ciboulette\",\"1 c. à soupe d’aneth\",\"poivre\",\"200 g de citron\",\"aneth\",\"citron\",\"\\\"Œufs cocotte\\\"\",\"🥖 pain complet grillé\",\"1. Laver et couper les légumes en petits morceaux; râper ou émietter le fromage.\",\"2. Faire revenir les légumes dans une poêle avec l’huile pendant 5 à 8 minutes, jusqu’à ce qu’ils soient tendres.\",\"3. Battre les œufs avec le sel et le poivre, puis verser sur les légumes.\",\"4. Cuire à feu moyen-doux 4 à 6 minutes, ajouter le fromage et couvrir jusqu’à ce que les œufs soient pris.\",\"Œufs cocotte\"]},{\"id\":\"r-505f3338a3\",\"name\":\"Risotto aux champignons et parmesan\",\"lines\":[\"320 g de riz arborio\",\"400 g de champignons de Paris\",\"1 oignon\",\"1,1 l de bouillon chaud\",\"100 ml de vin blanc (facultatif)\",\"60 g de parmesan râpé\",\"1 c. à soupe d’huile d’olive\",\"20 g de beurre\",\"Poivre et persil frais\",\"1. Nettoyer les champignons et les couper en lamelles. Émincer l’oignon et garder le bouillon chaud.\",\"2. Dans une sauteuse, faire revenir l’oignon dans l’huile et le beurre 2 minutes. Ajouter les champignons et cuire 5 minutes.\",\"3. Ajouter le riz et remuer 1 à 2 minutes jusqu’à ce que les grains deviennent nacrés. Verser le vin blanc si utilisé et laisser évaporer.\",\"4. Ajouter le bouillon chaud progressivement, une louche à la fois, en remuant souvent. Cuire environ 18 à 20 minutes, jusqu’à ce que le riz soit crémeux et tendre.\",\"5. Hors du feu, incorporer le parmesan et le persil. Poivrer, goûter et servir immédiatement.\",\"Monsieur Cuisine : hacher l’oignon 5 s / vitesse 6, racler. Ajouter huile et faire revenir 3 min / 120 °C / vitesse 1. Ajouter riz, faire nacrer 2 min / 100 °C / vitesse 1 inversée si disponible. Ajouter les champignons et le bouillon chaud, cuire environ 18 à 20 min / 100 °C / vitesse 1 inversée; contrôler la cuisson et ajouter un peu de bouillon si nécessaire. Incorporer parmesan et persil en fin de cuisson.\",\"🐟 saumon\",\"🍗 poulet\",\"🥒 courgettes\",\"Étapes complétées lors de l’audit test des semaines 1 et 2 : adapter les cuissons aux ingrédients exacts et vérifier la cuisson à cœur des viandes et poissons.\"]},{\"id\":\"r-9b996df25a\",\"name\":\"🥣 Soupe à l’oignon façon bistrot\",\"lines\":[\"1 oignons\",\"500 ml de bouillon\",\"4 tranches de pain complet grillé\",\"100 g de fromage râpé\",\"100 g de un peu de comté ou emmental dessus 😍\",\"Un peu de comté ou emmental dessus 😍\",\"\\\"Soupe à l'oignon\\\"\",\"1. Laver et couper les légumes en morceaux de taille similaire; éplucher l’oignon et la pomme de terre s’ils figurent dans la fiche.\",\"2. Faire revenir l’oignon dans l’huile 3 minutes dans une casserole.\",\"3. Ajouter les légumes et le bouillon, porter à frémissement puis cuire 20 à 25 minutes, jusqu’à ce que les morceaux soient tendres.\",\"4. Mixer soigneusement jusqu’à obtenir une texture lisse. Ajouter la crème facultative, saler, poivrer et servir chaud.\",\"Soupe à l'oignon\"]},{\"id\":\"r-4ce28d774d\",\"name\":\"🍫 Crème dessert chocolat maison\",\"lines\":[\"chocolat noir\",\"lait\",\"œufs\",\"cacao\",\"Faire des petites verrines.\",\"\\\"Crème dessert chocolat\\\"\",\"Crème dessert chocolat\"]},{\"id\":\"r-8c62c53b61\",\"name\":\"🍏 Compote maison sans sucre ajouté\",\"lines\":[\"pommes\",\"cannelle\",\"vanille\",\"\\\"Compote\\\"\",\"🍐 pomme-poire\",\"🍎 pomme-cannelle\",\"Compote\"]},{\"id\":\"r-4d5e2c63aa\",\"name\":\"🥞 Pâte à crêpes légère\",\"lines\" c. à café d’origan\",\"1 c. à soupe d’quelques feuilles de basilic\",\"Sel et poivre\",\"1. Émincer l’oignon, hacher l’ail et couper la courgette en petits dés.\",\"2. Faire chauffer l’huile dans une sauteuse. Faire revenir l’oignon et la courgette 5 minutes, en remuant.\",\"3. Ajouter l’ail, les tomates concassées, l’origan, le sel et le poivre. Laisser mijoter à couvert 10 minutes.\",\"4. Déposer le cabillaud dans la sauce. Couvrir et cuire doucement 8 à 10 minutes selon l’épaisseur, jusqu’à ce que le poisson se détache facilement et soit opaque à cœur.\",\"5. Ajouter les olives et le basilic ciselé. Servir immédiatement, idéalement avec du riz ou des pommes de terre vapeur.\",\"La sauce peut être préparée au Monsieur Cuisine : hacher l’oignon et l’ail 5 s / vitesse 6, racler, ajouter huile et courgette 5 min / 120 °C / vitesse 1, puis tomates et aromates 10 min / 100 °C / vitesse 1. Cuire le cabillaud séparément à la vapeur ou à la poêle et vérifier sa cuisson.\",\"Étapes complétées lors de l’audit test des semaines 1 et 2 : adapter les cuissons aux ingrédients exacts et vérifier la cuisson à cœur des viandes et poissons.\"]},{\"id\":\"r-cac89622a2\",\"name\":\"🍝 Sauce bolognaise grande quantité\",\"lines\":[\"viande hachée\",\"tomates\",\"carottes\",\"oignons\",\"céleri (facultatif)\",\"basilic\",\"origan\",\"\\\"Bolognaise\\\"\",\"➡️ 2 repas + congélation.\",\"Bolognaise\"]},{\"id\":\"r-ff99d9e090\",\"name\":\"🥣 Dahl de lentilles corail\",\"lines\":[\"200 g de lentilles corail rincées\",\"400 g de tomates concassées\",\"200 ml de lait de coco\",\"2 carottes (environ 200 g)\",\"1 oignon\",\"1 c. à soupe d’huile d’olive\",\"1 c. à café de curry doux\",\"1/2 c. à café de cumin\",\"400 ml d’eau\",\"Sel et poivre\",\"curry\",\"curcuma\",\"cumin\",\"\\\"Dahl de lentilles\\\"\",\"1. Rincer les lentilles corail à l’eau froide jusqu’à ce que l’eau soit claire.\",\"2. Éplucher et émincer l’oignon; éplucher les carottes et les couper en petits dés.\",\"3. Faire chauffer l
