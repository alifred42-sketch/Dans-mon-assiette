name: Apply recipe data corrections

on:
  push:
    branches:
      - travail-cuisine-chic-ouf-design
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-recipes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: travail-cuisine-chic-ouf-design
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run recipe corrections
        run: python scripts/correct-audited-recipes.py
      - name: Validate recipe database
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/carnet.json").read_text(encoding="utf-8"))
          recipes = data.get("recipes", [])
          assert recipes, "No recipes found"
          ids = [r.get("id") for r in recipes]
          assert len(ids) == len(set(ids)), "Duplicate recipe IDs detected"
          print(f"Validated JSON: {len(recipes)} recipe cards; IDs unique.")
          PY
      - name: Commit corrected database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/carnet.json
          if git diff --cached --quiet; then
            echo "No recipe data changes to commit."
          else
            git commit -m "Corriger la base de recettes et ses étapes"
            git push origin travail-cuisine-chic-ouf-design
          fi
