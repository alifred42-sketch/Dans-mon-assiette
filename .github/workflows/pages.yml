name: Pages

# Preview visuel de travail : cette branche republie le lien de contrôle permanent existant.

on:
  push:
    branches: [main, travail-cuisine-chic-ouf-design, refonte-accueil-visuelle]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ github.ref == 'refs/heads/main' && '/Dans-mon-assiette' || '/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design' }}
      - uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/travail-cuisine-chic-ouf-design' || github.ref == 'refs/heads/refonte-accueil-visuelle'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          destination_dir: ${{ github.ref == 'refs/heads/main' && '' || 'previews/travail-cuisine-chic-ouf-design' }}
          keep_files: true
          force_orphan: false
