name: Pages

on:
  push:
    branches: [main, travail-cuisine-chic-ouf-design]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe du correcteur de recettes
        run: python -m py_compile scripts/correct-audited-recipes.py
      - name: Corriger les fiches recette et synchroniser les sections
        run: python scripts/correct-audited-recipes.py
      - name: Synchroniser les déjeuners avec les dîners précédents
        run: python scripts/align-weekly-leftovers.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Migrer les données Airfryer sans modifier les champs existants
        if: github.ref == 'refs/heads/travail-cuisine-chic-ouf-design'
        run: node scripts/migrate-airfryer.mjs --write
      - name: Enregistrer les migrations Airfryer dans la branche de test uniquement
        if: github.ref == 'refs/heads/travail-cuisine-chic-ouf-design'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data; then
            git add data/*.json
            git commit -m "Ajouter les données de conversion Airfryer"
            git push
          fi
      - name: Enregistrer les corrections de recettes dans la branche de test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/carnet.json; then
            git add data/carnet.json
            git commit -m "Synchroniser les recettes et le planning hebdomadaire"
            git push
          fi
      - run: npm ci
      - name: Auditer les 52 semaines avant publication (lecture seule)
        run: npm run audit:weekly-plan
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ github.ref == 'refs/heads/main' && '/Dans-mon-assiette' || '/Dans-mon-assiette/previews/travail-cuisine-chic-ouf-design' }}
      - uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/travail-cuisine-chic-ouf-design'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          destination_dir: ${{ github.ref == 'refs/heads/main' && '' || 'previews/travail-cuisine-chic-ouf-design' }}
          keep_files: true
          force_orphan: false
