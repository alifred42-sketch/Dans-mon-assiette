                      f"--{boundary}\r\n".encode("utf-8"),
                      f'Content-Disposition: form-data; name="{field_name}"\r\n\r\n'.encode("utf-8"),
                      field_value.encode("utf-8"),
                      b"\r\n"
                  ])
              chunks.append(f"--{boundary}--\r\n".encode("utf-8"))
              body = b"".join(chunks)
