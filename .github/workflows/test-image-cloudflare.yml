                      "Create a generous, appetizing classic French salade de chèvre chaud. The four slices of wholegrain bread must be clearly visible as distinct rustic golden toast slices, arranged naturally over the salad. Each toast carries one thick round slice of goat cheese directly on top. The goat cheese is hot, softened and creamy in the middle, with beautifully golden toasted spots and lightly caramelized edges. Make the cheese-on-toast unmistakable at first glance: do not serve cheese separately, do not use cold white cubes, feta, or plain unbrowned cheese.",
                      "Reproduce ONLY the recipe ingredients and make every one easy to identify: fresh green lettuce leaves forming the salad base; ripe red tomato wedges; fresh cucumber slices; several generous, clearly recognizable walnut halves scattered over the salad; and the four slices of wholegrain toast topped with warm goat cheese. No other vegetables, fruit, seeds, dressing decorations or invented ingredients.",
                      "Composition should feel abundant, natural and slightly rustic, like a beautiful countryside French cookbook: a handmade warm stoneware plate on a softly textured natural linen cloth or pale weathered wood, with subtle rustic details but not dark or cluttered. The salad remains colorful and fresh, while the golden goat-cheese toasts are the hero.",
                      "Camera pulled back enough to show the entire plate and complete rim with generous tabletop breathing room. Gentle three-quarter overhead angle, not a close-up. Warm soft natural daylight, rich appetizing colors, crisp details and gentle shadows. No text, hands, packaging, logos or watermark."
