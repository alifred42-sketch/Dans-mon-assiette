name: Test image Cloudflare AI

on:
  workflow_dispatch:
    inputs:
      recipe_id:
        description: "Identifiant exact de la recette à illustrer"
        required: true
        default: "r-b6bee72546"
  push:
    branches:
      - travail-cuisine-chic-ouf-design
    paths:
      - .github/workflows/test-image-cloudflare.yml

permissions:
  contents: read

jobs:
  generate-one-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      RECIPE_ID: ${{ github.event.inputs.recipe_id || 'r-b6bee72546' }}
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Préparer la description fidèle de la recette
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync("data/carnet.json", "utf8"));
          const recipe = (data.recipes || []).find((item) => item.id === process.env.RECIPE_ID);
          if (!recipe) {
            throw new Error("Recette introuvable dans data/carnet.json : " + process.env.RECIPE_ID);
          }
          const name = String(recipe.name || "").trim();
          const ingredients = Array.isArray(recipe.ingredients) ? recipe.ingredients.map(x => String(x).trim()).filter(Boolean) : [];
          if (!name || ingredients.length === 0) {
            throw new Error("La recette ne contient pas assez d'informations pour créer une image fidèle.");
          }
          const sauceOnly = /^(sauce|vinaigrette|marinade|pesto|coulis|dip|tartinade)\\b/i.test(name.trim());
          const wrapDish = /\\bwraps?\\b/i.test(name);
          const prompt = [
            "Photorealistic premium editorial food photography for a French recipe app, appetizing and natural.",
            "The exact recipe is: " + name + ".",
            "The recipe ingredients are: " + ingredients.join(", ") + ".",
            "The named recipe itself must remain the unmistakable main subject and occupy most of the image. Preserve its true dish type and all recognizable main ingredients; never substitute a different protein, starch, vegetable, or dish.",
            "Only use listed ingredients for the actual recipe. Small coherent fresh garnish is allowed only when compatible with the recipe; keep it restrained and secondary. A modest accompaniment may appear only if it is clearly compatible and never competes with the main dish.",
            sauceOnly
              ? "This is a sauce or preparation: show ONLY the sauce itself in one small elegant ceramic ramekin or bowl. Do not turn it into a finished meal."
              : wrapDish
                ? "Show the actual wrap or wraps fully rolled and closed, not open flat. Arrange one wrap whole and another cut diagonally so the real filling is clearly visible inside the tortilla. The filling must match the listed ingredients exactly. A light, appetizing drizzle of a listed compatible sauce may be placed over the wrap; do not invent a sauce if none is in the recipe. Keep the wrap dominant, with only a few restrained matching garnish accents."
                : "Show the finished dish exactly as named, with its main ingredients clearly recognizable and presented as the hero. If a sauce is part of the recipe, a delicate drizzle over the dish is welcome when natural; do not invent sauce or conceal the food.",
            "Wide, slightly zoomed-out overhead or gentle three-quarter flat-lay composition; show the whole dish and plate/bowl, centered, with breathing room around it. Never crop the main dish.",
            "Bright soft natural daylight, clean elegant magazine-style styling, white marble, pale wood, or light grey stone background. Fresh, balanced, uncluttered composition.",
            "Square composition. No close-up, no cropped main dish, no hands, no people, no packaging, no labels, no lettering, no watermark, no logos, no collage."
          ].join(" ");
          fs.writeFileSync("request.json", JSON.stringify({ prompt, steps: 4 }));
          fs.writeFileSync("recipe-info.txt", [
            "Recette : " + name,
            "Identifiant : " + recipe.id,
            "Ingrédients :",
            ...ingredients.map(x => "- " + x),
            "Mode : " + (sauceOnly ? "sauce seule en ramequin" : wrapDish ? "wrap roulé et fermé, garniture fidèle visible" : "plat terminé, plat principal prioritaire")
          ].join("\n"));
          console.log("Recette sélectionnée :", name);
          console.log("Nombre d'ingrédients :", ingredients.length);
          console.log("Présentation :", sauceOnly ? "sauce seule en ramequin" : wrapDish ? "wrap roulé et fermé avec garniture fidèle visible" : "plat terminé, sujet principal prioritaire");
          NODE

      - name: Générer une seule image avec Cloudflare Workers AI
        shell: bash
        run: |
          test -n "$CF_ACCOUNT_ID" || { echo "Secret CF_ACCOUNT_ID absent"; exit 1; }
          test -n "$CF_API_TOKEN" || { echo "Secret CF_API_TOKEN absent"; exit 1; }
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @request.json \
            --output cloudflare-response.json

      - name: Convertir en WebP carré 400 x 400
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python <<'PY'
          import base64, json, os, sys
          from io import BytesIO
          from PIL import Image, ImageOps

          with open("cloudflare-response.json", "r", encoding="utf-8") as f:
              payload = json.load(f)
          if not payload.get("success") or not isinstance(payload.get("result"), dict) or not payload["result"].get("image"):
              print("Réponse Cloudflare inattendue :", json.dumps(payload)[:1800])
              sys.exit(1)
          raw = base64.b64decode(payload["result"]["image"])
          image = Image.open(BytesIO(raw)).convert("RGB")
          print(f"Image originale reçue : {image.width} x {image.height}")
          image = ImageOps.fit(image, (400, 400), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
          os.makedirs("generated-test", exist_ok=True)
          output = "generated-test/recette-test.webp"
          max_bytes = 100 * 1024
          chosen_quality = None
          for quality in (82, 78, 74, 70, 66):
              image.save(output, "WEBP", quality=quality, method=6, optimize=True)
              size = os.path.getsize(output)
              print(f"Compression WebP qualité {quality} : {size / 1024:.1f} Ko")
              if size <= max_bytes:
                  chosen_quality = quality
                  break
          if chosen_quality is None:
              raise RuntimeError("Image encore trop lourde après compression : limite 100 Ko dépassée.")
          print(f"Image prête : 400 x 400 WebP, {os.path.getsize(output) / 1024:.1f} Ko (qualité {chosen_quality})")
          PY

      - name: Mettre l'image test à disposition sans modifier le catalogue
        uses: actions/upload-artifact@v4
        with:
          name: image-test-cuisine-chic-ouf
          path: |
            generated-test/recette-test.webp
            recipe-info.txt
          retention-days: 3
