name: Générer un lot de photos recettes

on:
  push:
    branches:
      - travail-cuisine-chic-ouf-design
    paths:
      - trigger.txt

concurrency:
  group: cuisine-chic-ouf-photo-batch
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  generate-recipe-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      TRIGGER_FILE: trigger.txt
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer les outils image
        run: python -m pip install --quiet Pillow

      - name: Générer le lot de recettes en respectant le quota
        shell: bash
        run: |
          test -n "$CF_ACCOUNT_ID" || { echo "Secret CF_ACCOUNT_ID absent"; exit 1; }
          test -n "$CF_API_TOKEN" || { echo "Secret CF_API_TOKEN absent"; exit 1; }
          python <<'PY'
          import base64, json, os, re, sys, time, urllib.error, urllib.request
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw

          account = os.environ["CF_ACCOUNT_ID"]
          token = os.environ["CF_API_TOKEN"]
          trigger_path = Path(os.environ.get("TRIGGER_FILE", "trigger.txt"))
          if not trigger_path.is_file():
              raise SystemExit("Fichier trigger.txt absent : aucun lot autorisé.")
          trigger_text = trigger_path.read_text(encoding="utf-8").strip()
          match = re.fullmatch(r"([1-9][0-9]*)\s*-\s*([1-9][0-9]*)", trigger_text)
          if not match:
              raise SystemExit("Format refusé dans trigger.txt. Format attendu : premier-dernier, ex. 86-90.")
          first, last = map(int, match.groups())
          if last < first:
              raise SystemExit("Lot refusé : le dernier numéro est inférieur au premier.")
          count = last - first + 1
          if count > 5:
              raise SystemExit("Lot refusé : plafond strict de 5 recettes par lancement.")
          start = first - 1
          data = json.loads(Path("data/carnet.json").read_text(encoding="utf-8"))
          recipes = data.get("recipes", [])
          selected = recipes[start:start + count]
          if len(selected) != count:
              raise SystemExit(f"Lot incomplet : {count} recettes demandées, {len(selected)} disponibles.")
          print(f"Demande validée : positions {first} à {last}, soit {count} recette(s) maximum.")
          out = Path("generated-batch")
          out.mkdir(exist_ok=True)
          manifest = []
          for offset, recipe in enumerate(selected):
              rid = str(recipe.get("id", "")).strip()
              name = str(recipe.get("name", "")).strip()
              ingredients = recipe.get("ingredients") or []
              ingredients = [str(x).strip() for x in ingredients if str(x).strip()]
              if not rid or not name or not ingredients:
                  print(f"IGNORÉ (fiche incomplète) : {rid or 'sans identifiant'} — {name}")
                  continue

              season_text = (name + " " + " ".join(ingredients)).lower()
              seasonal = ""
              if any(w in season_text for w in ["noël", "noel", "réveillon", "reveillon", "bûche", "buche", "chapon"]):
                  seasonal = "Add a very subtle Christmas touch in the surroundings only: a tiny sprig of rosemary or fir and restrained festive red accents; never obscure the dish."
              elif any(w in season_text for w in ["automne", "potimarron", "courge", "citrouille", "châtaigne", "chataigne", "champignon"]):
                  seasonal = "If natural for this recipe, add very subtle autumn-toned accents such as a few leaves, nuts or muted warm orange details around the dish; keep the background light."
              elif any(w in season_text for w in ["printemps", "asperge", "petits pois", "fraise"]):
                  seasonal = "If natural for this recipe, add restrained fresh spring accents such as herbs or a few delicate edible flowers; keep the background light."
              elif any(w in season_text for w in ["été", "ete", "melon", "tomate", "courgette", "pêche", "peche"]):
                  seasonal = "If natural for this recipe, add restrained summery accents such as fresh herbs, lemon or a few seasonal vegetables; keep the background light."

              sauce_only = bool(re.match(r"^(sauce|vinaigrette|marinade|pesto|coulis|dip|tartinade)\b", name, re.I))
              wrap_dish = bool(re.search(r"\bwraps?\b", name, re.I))
              chocolate_bowl = ("bowl" in name.lower() and "chocolat noir" in name.lower())
              blanquette_chicken = ("blanquette" in name.lower() and "poulet" in name.lower())
              pizza_wrap = ("wrap" in name.lower() and "pizza" in name.lower())
              buddha_bowl = "buddha" in name.lower()
              prompt = [
                "Photorealistic premium editorial food photography for a French recipe app.",
                f"The exact recipe is: {name}.",
                "Its listed ingredients are: " + ", ".join(ingredients) + ".",
                "The named recipe must be the unmistakable hero and occupy most of the frame. Preserve the real dish type and recognizable listed main ingredients. Never substitute a different protein, starch, vegetable or dish.",
                "Use the listed ingredients for the actual recipe. Small coherent garnish and a modest compatible accompaniment are welcome but strictly secondary and must never hide or overpower the dish.",
                ("Show ONLY the sauce/preparation itself in one small elegant ramekin or bowl; do not turn it into a meal." if sauce_only else
                 "Show real fully rolled and closed wraps, with one cut diagonally to reveal the exact listed filling. Never show an open flat tortilla, taco or loose filling on a flat tortilla." if wrap_dish else
                 "Show the finished dish exactly as named, clearly recognizable, beautifully served, with the whole plate/bowl visible."),
                ("IMPORTANT DESSERT DETAIL: make the dark chocolate unmistakable and abundant enough to identify at first glance: visibly grated dark chocolate shavings and a few small dark chocolate curls scattered generously over the white skyr surface, clearly contrasting with the white skyr and bright red berries. Also show the chopped almonds distinctly. Do NOT replace chocolate with honey, caramel, syrup, cocoa dust, or a brown drizzle. The dessert must remain a creamy white skyr bowl topped with red berries, dark chocolate shavings and chopped almonds." if chocolate_bowl else ""),
                ("For this dessert, use bright soft window daylight, a very pale white marble or light stone surface, gentle shadows only, fresh clean airy styling, and a wide overhead view showing the entire bowl with space around it." if chocolate_bowl else ""),
                "A delicate drizzle of sauce is welcome only if that sauce is actually listed and appropriate to the recipe; never invent one.",
                "Wide, slightly zoomed-out overhead or gentle three-quarter composition, centered with breathing room. Never crop the main dish.",
                "Bright soft natural daylight, clean elegant magazine food styling, white marble, pale wood or light grey stone background. Keep a coherent light visual identity across the whole app.",
                seasonal,
                "Square composition. No close-up, no cropped main dish, no hands, no people, no packaging, no text, no watermark, no logo, no collage."
              ]
              if blanquette_chicken:
                  prompt = [
                      "Photorealistic bright premium French food photography, square wide overhead view, entire plate visible with generous breathing room.",
                      "Exact dish: creamy chicken blanquette with mushrooms and carrots, served with a modest separate portion of brown rice. Show tender visible chicken pieces, sliced mushrooms, orange carrot pieces and a smooth pale creamy sauce; include the listed leeks subtly in the blanquette.",
                      "Serve in a beautiful shallow white ceramic bowl or deep-rimmed plate. The sauce must look silky and light, not brown. Keep the chicken and vegetables clearly distinguishable; rice is secondary.",
                      "Very bright soft natural window daylight, high-key pale white marble or light grey stone background, airy clean elegant styling, gentle minimal shadows. No dark background, no rustic dark wood, no dramatic contrast, no close-up, no cropped plate, no hands, no text, no logo, no watermark, no collage."
                  ]
              if buddha_bowl:
                  prompt = [
                      "Photorealistic bright premium editorial food photography, square wide overhead composition, entire serving vessel completely visible and centered with generous breathing room.",
                      f"Exact recipe: {name}. Its listed ingredients are: " + ", ".join(ingredients) + ".",
                      "IMPORTANT PRESENTATION: this is a Buddha bowl. Serve it in one large, generous, clearly deep round bowl with a visible rim, or a wide deep bowl-shaped ceramic plate. It must unmistakably read as a bowl, never a flat dinner plate, platter, tray or scattered ingredients on a tabletop.",
                      "Arrange the actual listed ingredients in distinct, attractive sections inside the bowl so each component is easy to recognize. Keep the bowl full but orderly, colorful and appetizing; do not invent or substitute ingredients. Any sauce belongs inside the bowl and must match the listed recipe.",
                      "Use a wide overhead view showing the entire bowl and its full rim, with generous pale background around it. The tabletop MUST be bright white marble or very pale ivory stone in every corner, evenly lit by abundant soft daylight. Absolutely no wood surface of any color, no brown, no dark areas, no rustic styling. Show cold-smoked salmon only: thin silky rose-pink slices folded into ribbons, clearly uncooked; never a cooked or seared salmon fillet. Arrange separate sections of brown rice, avocado, cucumber, grated carrot, tomato and green lettuce inside the large deep bowl. Bright, colorful, fresh and appetizing.",
                      "No flat plate, no platter, no close-up, no cropped bowl, no dark or rustic background, no hands, no text, no logo, no watermark, no collage."
                  ]
              if pizza_wrap:
                  prompt = [
                      "Photorealistic vibrant premium editorial food photography, square wide overhead composition, full serving plate completely visible and centered with comfortable space around it.",
                      "Exact recipe: Wrap façon pizza jambon et mozzarella. Show three appetizing fully rolled and closed mini pizza wraps arranged generously on a pale round ceramic plate, one cut diagonally to reveal a generous, clearly visible filling of pink ham, juicy bright red tomato and stretchy melted mozzarella. Tortillas lightly golden and lightly toasted, not pale, dry or burnt. They must unmistakably be closed wraps, never open tortillas, tacos or a pizza.",
                      "Make the food look warm, fresh, colorful and irresistible: vivid tomato red, creamy melted mozzarella, visible ham, a little golden toasted color. Add a small but noticeable fresh green touch around the plate: a few delicate basil leaves and a modest handful of young rocket leaves, naturally scattered as a light garnish, with two or three tiny green leaves near the wraps. The greenery should frame and enliven the plate without hiding the wraps or becoming a salad. Keep ingredients realistic and faithful; no excessive garnish.",
                      "Use a bright white marble or very pale warm stone tabletop, soft abundant natural daylight, cheerful fresh clean styling, gentle shadows only. The entire plate and every wrap must be visible. Background must be light in every corner, absolutely no black or dark area, no dark wood, no rustic board, no grey gloomy lighting, no washed-out colors, no close-up, no cropped plate, no hands, no text, no logo, no watermark, no collage."
                  ]
              if chocolate_bowl:
                  prompt = [
                      "Photorealistic bright editorial food photo, square overhead view, wide framing with the entire bowl visible and space around it.",
                      "Exact recipe: Bowl dessert au skyr, fruits rouges et chocolat noir. Show a generous creamy white skyr bowl topped with clearly visible fresh red berries, abundant grated dark chocolate shavings and a few small dark chocolate curls, plus distinct chopped almonds.",
                      "The dark chocolate must be unmistakable at first glance and strongly contrast with the white skyr and red berries. Never replace it with honey, caramel, syrup, cocoa powder or a brown drizzle.",
                      "Faithful appetizing food styling, pale white marble or light stone background, bright soft window daylight, gentle shadows, airy clean composition. No close-up, no cropped bowl, no hands, no text, no logo, no watermark, no collage."
                  ]
              manifest.append({"id": rid, "name": name, "ingredients": ingredients, "prompt": " ".join(x for x in prompt if x)})
          Path("batch-manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          if not manifest:
              raise SystemExit("Aucune recette exploitable dans ce lot.")
          print(f"Lot préparé : {len(manifest)} recettes (positions {start + 1} à {start + len(selected)}).")

          made = []
          stopped_for_quota = False
          for index, item in enumerate(manifest, 1):
              rid = item["id"]
              print(f"[{index}/{len(manifest)}] Génération : {item['name']} ({rid})")
              body = json.dumps({"prompt": item["prompt"], "steps": 4}).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/accounts/{account}/ai/run/@cf/black-forest-labs/flux-1-schnell",
                  data=body,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      payload = json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  details = exc.read().decode("utf-8", "replace")[:1200]
                  print(f"ARRÊT PROPRE : Cloudflare a répondu HTTP {exc.code}. {details}")
                  if exc.code in (402, 403, 429):
                      stopped_for_quota = True
                      break
                  raise
              if not payload.get("success") or not payload.get("result", {}).get("image"):
                  errors = json.dumps(payload.get("errors", payload), ensure_ascii=False)[:1200]
                  print("ARRÊT : réponse Cloudflare sans image :", errors)
                  stopped_for_quota = True
                  break
              raw = base64.b64decode(payload["result"]["image"])
              image = Image.open(BytesIO(raw)).convert("RGB")
              image = ImageOps.fit(image, (400, 400), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
              path = out / f"{rid}.webp"
              selected_quality = None
              for quality in (82, 78, 74, 70, 66):
                  image.save(path, "WEBP", quality=quality, method=6, optimize=True)
                  if path.stat().st_size <= 100 * 1024:
                      selected_quality = quality
                      break
              if selected_quality is None:
                  path.unlink(missing_ok=True)
                  print(f"REJET : impossible de passer sous 100 Ko pour {rid}.")
                  continue
              info = out / f"{rid}.txt"
              info.write_text(
                  f"Recette : {item['name']}\nIdentifiant : {rid}\nIngrédients :\n" +
                  "\n".join("- " + x for x in item["ingredients"]) +
                  f"\nFichier : {path.name}\nTaille : {path.stat().st_size / 1024:.1f} Ko\n",
                  encoding="utf-8"
              )
              made.append({"id": rid, "name": item["name"], "file": str(path), "kb": round(path.stat().st_size / 1024, 1)})
              print(f"OK : {path} — {path.stat().st_size / 1024:.1f} Ko")
              time.sleep(2)

          Path("batch-result.json").write_text(json.dumps({
              "requested": len(manifest), "generated": made,
              "stopped_for_quota_or_api": stopped_for_quota,
              "start_index": start, "next_start_index": start + len(selected)
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"RÉSULTAT : {len(made)} photo(s) générée(s) sur {len(manifest)} demandée(s).")
          if stopped_for_quota:
              print("Le lot s'est arrêté sans nouvelle tentative pour éviter de marteler l'API.")
          if made:
              thumbs = []
              for entry in made:
                  im = Image.open(entry["file"]).convert("RGB")
                  im.thumbnail((220, 220))
                  thumbs.append((entry, im.copy()))
              cols = 3
              rows = (len(thumbs) + cols - 1) // cols
              sheet = Image.new("RGB", (cols * 260, rows * 270), "white")
              draw = ImageDraw.Draw(sheet)
              for i, (entry, im) in enumerate(thumbs):
                  x, y = (i % cols) * 260, (i // cols) * 270
                  sheet.paste(im, (x + 20, y + 5))
                  draw.text((x + 8, y + 232), entry["name"][:34], fill="black")
                  draw.text((x + 8, y + 248), f"{entry['kb']} Ko", fill="black")
              sheet.save("contact-sheet.jpg", quality=88)
          PY

      - name: Publier le lot pour contrôle visuel (sans modifier le catalogue)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot-photos-cuisine-chic-ouf
          path: |
            generated-batch/
            batch-manifest.json
            batch-result.json
            contact-sheet.jpg
          if-no-files-found: warn
          retention-days: 3
