                      "Clearly show generous fresh dark-green spinach leaves folded through the risoni, plus distinct pink pieces or flakes of salmon. The three key elements—tiny rice-shaped risoni pasta, green spinach and salmon—must all be immediately recognizable and well distributed. Creamy, glossy, appetizing texture, not soupy.",
                      "Serve in a beautiful warm ceramic shallow bowl, entire bowl and rim visible with space around it. Slightly elevated three-quarter overhead angle. Same approved warm chic cookbook atmosphere: warm neutral textured tabletop, soft directional natural daylight, gentle defined shadows, rich natural colors and appetizing contrast. No spaghetti, no long pasta, no text, hands, logos or watermark."
                  ]
              if "chèvre chaud" in name.lower() or "chevre chaud" in name.lower():
                  prompt = [
