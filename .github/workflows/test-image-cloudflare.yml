name: Générer un lot de photos recettes

on:
  push:
    branches:
      - travail-cuisine-chic-ouf-design
    paths:
      - trigger.txt

concurrency:
  group: cuisine-chic-ouf-photo-batch
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  generate-recipe-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      TRIGGER_FILE: trigger.txt
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer les outils image
        run: python -m pip install --quiet Pillow

      - name: Générer le lot de recettes en respectant le quota
        shell: bash
        run: |
          test -n "$CF_ACCOUNT_ID" || { echo "Secret CF_ACCOUNT_ID absent"; exit 1; }
          test -n "$CF_API_TOKEN" || { echo "Secret CF_API_TOKEN absent"; exit 1; }
          python <<'PY'
          import base64, json, os, re, sys, time, urllib.error, urllib.request
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw

          account = os.environ["CF_ACCOUNT_ID"]
          token = os.environ["CF_API_TOKEN"]
          trigger_path = Path(os.environ.get("TRIGGER_FILE", "trigger.txt"))
          if not trigger_path.is_file():
              raise SystemExit("Fichier trigger.txt absent : aucun lot autorisé.")
          trigger_text = trigger_path.read_text(encoding="utf-8").strip()
          match = re.fullmatch(r"([1-9][0-9]*)\s*-\s*([1-9][0-9]*)", trigger_text)
          if not match:
              raise SystemExit("Format refusé dans trigger.txt. Format attendu : premier-dernier, ex. 86-90.")
          first, last = map(int, match.groups())
          if last < first:
              raise SystemExit("Lot refusé : le dernier numéro est inférieur au premier.")
          count = last - first + 1
          if count > 5:
              raise SystemExit("Lot refusé : plafond strict de 5 recettes par lancement.")
          start = first - 1
          data = json.loads(Path("data/carnet.json").read_text(encoding="utf-8"))
          recipes = data.get("recipes", [])
          selected = recipes[start:start + count]
          if len(selected) != count:
              raise SystemExit(f"Lot incomplet : {count} recettes demandées, {len(selected)} disponibles.")
          print(f"Demande validée : positions {first} à {last}, soit {count} recette(s) maximum.")
          out = Path("generated-batch")
          out.mkdir(exist_ok=True)
          manifest = []
          for offset, recipe in enumerate(selected):
              rid = str(recipe.get("id", "")).strip()
              name = str(recipe.get("name", "")).strip()
              ingredients = recipe.get("ingredients") or []
              ingredients = [str(x).strip() for x in ingredients if str(x).strip()]
              if not rid or not name or not ingredients:
                  print(f"IGNORÉ (fiche incomplète) : {rid or 'sans identifiant'} — {name}")
                  continue

              season_text = (name + " " + " ".join(ingredients)).lower()
              seasonal = ""
              if any(w in season_text for w in ["noël", "noel", "réveillon", "reveillon", "bûche", "buche", "chapon"]):
                  seasonal = "Add a very subtle Christmas touch in the surroundings only: a tiny sprig of rosemary or fir and restrained festive red accents; never obscure the dish."
              elif any(w in season_text for w in ["automne", "potimarron", "courge", "citrouille", "châtaigne", "chataigne", "champignon"]):
                  seasonal = "If natural for this recipe, add very subtle autumn-toned accents such as a few leaves, nuts or muted warm orange details around the dish; keep the background light."
              elif any(w in season_text for w in ["printemps", "asperge", "petits pois", "fraise"]):
                  seasonal = "If natural for this recipe, add restrained fresh spring accents such as herbs or a few delicate edible flowers; keep the background light."
              elif any(w in season_text for w in ["été", "ete", "melon", "tomate", "courgette", "pêche", "peche"]):
                  seasonal = "If natural for this recipe, add restrained summery accents such as fresh herbs, lemon or a few seasonal vegetables; keep the background light."

              sauce_only = bool(re.match(r"^(sauce|vinaigrette|marinade|pesto|coulis|dip|tartinade)\b", name, re.I))
              wrap_dish = bool(re.search(r"\bwraps?\b", name, re.I))
              chocolate_bowl = ("bowl" in name.lower() and "chocolat noir" in name.lower())
              blanquette_chicken = ("blanquette" in name.lower() and "poulet" in name.lower())
              pizza_wrap = ("wrap" in name.lower() and "pizza" in name.lower())
              buddha_bowl = "buddha" in name.lower()
              grandmother_chicken = ("poulet" in name.lower() and "grand-mère" in name.lower() and "carotte" in name.lower())
              chocolate_fondant = ("fondant" in name.lower() and "chocolat" in name.lower())
              prompt = [
                "Photorealistic premium editorial food photography for a French recipe app.",
                f"The exact recipe is: {name}.",
                "Its listed ingredients are: " + ", ".join(ingredients) + ".",
                "The named recipe must be the unmistakable hero and occupy most of the frame. Preserve the real dish type and recognizable listed main ingredients. Never substitute a different protein, starch, vegetable or dish.",
                "Use the listed ingredients for the actual recipe. Small coherent garnish and a modest compatible accompaniment are welcome but strictly secondary and must never hide or overpower the dish.",
                ("Show ONLY the sauce/preparation itself in one small elegant ramekin or bowl; do not turn it into a meal." if sauce_only else
                 "Show real fully rolled and closed wraps, with one cut diagonally to reveal the exact listed filling. Never show an open flat tortilla, taco or loose filling on a flat tortilla." if wrap_dish else
                 "Show the finished dish exactly as named, clearly recognizable, beautifully served, with the whole plate/bowl visible."),
                ("IMPORTANT DESSERT DETAIL: make the dark chocolate unmistakable and abundant enough to identify at first glance: visibly grated dark chocolate shavings and a few small dark chocolate curls scattered generously over the white skyr surface, clearly contrasting with the white skyr and bright red berries. Also show the chopped almonds distinctly. Do NOT replace chocolate with honey, caramel, syrup, cocoa dust, or a brown drizzle. The dessert must remain a creamy white skyr bowl topped with red berries, dark chocolate shavings and chopped almonds." if chocolate_bowl else ""),
                ("For this dessert, use bright soft window daylight, a very pale white marble or light stone surface, gentle shadows only, fresh clean airy styling, and a wide overhead view showing the entire bowl with space around it." if chocolate_bowl else ""),
                "A delicate drizzle of sauce is welcome only if that sauce is actually listed and appropriate to the recipe; never invent one.",
                "Wide, slightly zoomed-out overhead or gentle three-quarter composition, centered with breathing room. Never crop the main dish.",
                "Bright soft natural daylight and warm chic cookbook styling. Vary the setting naturally from one recipe to the next: a softly textured natural linen tablecloth, pale warm wood, warm greige limestone, light taupe stone or white marble. Do not use marble for every image. Keep backgrounds light-to-medium, welcoming and elegant, with gentle shadows and appetizing true-to-life food colors; never cold, washed out or dark rustic.",
                seasonal,
                "Square composition. No close-up, no cropped main dish, no hands, no people, no packaging, no text, no watermark, no logo, no collage."
              ]
              if blanquette_chicken:
                  prompt = [
                      "Photorealistic bright premium French food photography, square wide overhead view, entire plate visible with generous breathing room.",
                      "Exact dish: creamy chicken blanquette with mushrooms and carrots, served with a modest separate portion of brown rice. Show tender visible chicken pieces, sliced mushrooms, orange carrot pieces and a smooth pale creamy sauce; include the listed leeks subtly in the blanquette.",
                      "Serve in a beautiful shallow white ceramic bowl or deep-rimmed plate. The sauce must look silky and light, not brown. Keep the chicken and vegetables clearly distinguishable; rice is secondary.",
                      "Very bright soft natural window daylight, high-key pale white marble or light grey stone background, airy clean elegant styling, gentle minimal shadows. No dark background, no rustic dark wood, no dramatic contrast, no close-up, no cropped plate, no hands, no text, no logo, no watermark, no collage."
                  ]
              if grandmother_chicken:
                  prompt = [
                      "Photorealistic premium French cookbook food photography, square wide overhead or gentle three-quarter view, entire serving dish visible with breathing room.",
                      f"Exact recipe: {name}. Ingredients: " + ", ".join(ingredients) + ".",
                      "Show a generous, beautifully cooked traditional chicken-and-carrot dish, with golden tender chicken pieces and clearly visible naturally orange carrots, gently coated in a glossy, appetizing light golden cooking sauce. Keep the dish faithful to the listed ingredients; no invented vegetables or side dish.",
                      "Serve in an elegant warm ivory or muted sage ceramic shallow casserole dish, with a few delicate fresh thyme or parsley leaves. Add only restrained cookbook table details nearby, such as a folded natural linen napkin and a small piece of fresh carrot or herb sprig.",
                      "Create a warm chic editorial cookbook atmosphere: softly sunlit warm greige limestone or light taupe stone tabletop, subtle natural texture, a hint of warm wood only as a small accent, rich appetizing food colors, gentle directional window light and soft shadows. The image must feel welcoming, refined and colorful, never stark white, washed out, cold, gloomy or dark rustic. Whole dish visible, no close-up, no cropped dish, no hands, no text, no logo, no watermark, no collage."
                  ]
              if buddha_bowl:
                  prompt = [
                      "Bright photorealistic cookbook food photo, square overhead view, entire large deep round bowl and rim visible, centered on pale white marble.",
                      f"Recipe: {name}. Ingredients: " + ", ".join(ingredients) + ".",
                      "Serve unmistakably in a large deep bowl, never a flat plate. Arrange the real ingredients in neat colorful sections.",
                      "Show ONLY cold-smoked salmon: thin silky rose-pink slices, uncooked, gently folded into ribbons. Absolutely no cooked salmon, steak, fillet or grill marks.",
                      "Add a few elegant cookbook props around the bowl on the marble: two lemon wedges, a small dill sprig, a few sesame seeds and delicate green leaves. Airy, balanced, fresh styling; props must stay subtle and not hide the bowl. Bright soft daylight, no dark areas, no wood, no clutter."
                  ]
              if pizza_wrap:
                  prompt = [
                      "Photorealistic vibrant premium editorial food photography, square wide overhead composition, full serving plate completely visible and centered with comfortable space around it.",
                      "Exact recipe: Wrap façon pizza jambon et mozzarella. Show three appetizing fully rolled and closed mini pizza wraps arranged generously on a pale round ceramic plate, one cut diagonally to reveal a generous, clearly visible filling of pink ham, juicy bright red tomato and stretchy melted mozzarella. Tortillas lightly golden and lightly toasted, not pale, dry or burnt. They must unmistakably be closed wraps, never open tortillas, tacos or a pizza.",
                      "Make the food look warm, fresh, colorful and irresistible: vivid tomato red, creamy melted mozzarella, visible ham, a little golden toasted color. Add a small but noticeable fresh green touch around the plate: a few delicate basil leaves and a modest handful of young rocket leaves, naturally scattered as a light garnish, with two or three tiny green leaves near the wraps. The greenery should frame and enliven the plate without hiding the wraps or becoming a salad. Keep ingredients realistic and faithful; no excessive garnish.",
                      "Use a bright white marble or very pale warm stone tabletop, soft abundant natural daylight, cheerful fresh clean styling, gentle shadows only. The entire plate and every wrap must be visible. Background must be light in every corner, absolutely no black or dark area, no dark wood, no rustic board, no grey gloomy lighting, no washed-out colors, no close-up, no cropped plate, no hands, no text, no logo, no watermark, no collage."
                  ]
              if chocolate_bowl:
                  prompt = [
                      "Photorealistic bright editorial food photo, square overhead view, wide framing with the entire bowl visible and space around it.",
                      "Exact recipe: Bowl dessert au skyr, fruits rouges et chocolat noir. Show a generous creamy white skyr bowl topped with clearly visible fresh red berries, abundant grated dark chocolate shavings and a few small dark chocolate curls, plus distinct chopped almonds.",
                      "The dark chocolate must be unmistakable at first glance and strongly contrast with the white skyr and red berries. Never replace it with honey, caramel, syrup, cocoa powder or a brown drizzle.",
                      "Faithful appetizing food styling, pale white marble or light stone background, bright soft window daylight, gentle shadows, airy clean composition. No close-up, no cropped bowl, no hands, no text, no logo, no watermark, no collage."
                  ]
              if chocolate_fondant:
                  prompt = [
                      "Photorealistic premium French dessert cookbook photography, square overhead or gentle three-quarter view, wide framing with the whole dessert visible.",
                      f"Exact recipe: {name}. Ingredients: " + ", ".join(ingredients) + ".",
                      "Show one individual rich dark chocolate fondant cake on a pale elegant dessert plate. The cake is slightly cut open, revealing a generous, glossy, unmistakably molten dark chocolate center flowing slowly from the middle onto the plate. The liquid chocolate must be clearly visible and be the visual hero; not a dry brownie, not a plain intact cake, not chocolate sauce poured over the outside.",
                      "Soft bright natural window light, appetizing moist cake texture, refined simple cookbook styling, pale white marble or light stone background, a few restrained chocolate shavings nearby. Entire plate visible, airy composition, no clutter, no hands, no text, no logo, no watermark, no collage."
                  ]
              if ("cabillaud" in name.lower() and "citron" in name.lower() and "tomates cerises" in name.lower()):
                  prompt = [
                      "Photorealistic premium French cookbook food photography, square wide overhead or gentle three-quarter view, whole plate visible with breathing room.",
                      "Exact dish: a single beautiful thick boneless cod loin or cod fillet (dos de cabillaud), opaque pearly white and delicately flaky, gently baked or pan-roasted. It must unmistakably be a cut portion of cod, NOT a whole fish: absolutely no head, no tail, no fins, no whole-body fish silhouette.",
                      "Clearly show tender sautéed courgette rounds and half-moons, bright red cherry tomatoes, fresh lemon slices or wedges, and fresh basil leaves arranged around and beside the cod. All four ingredients must be recognizable and visible. A light olive-oil gloss only, no heavy sauce.",
                      "Serve on an elegant warm ivory ceramic plate over warm greige limestone or light taupe stone. Add only a few restrained cookbook details nearby, such as a folded natural linen napkin, a small basil sprig and one lemon wedge.",
                      "Warm soft natural window daylight, appetizing fresh colors, chic welcoming cookbook styling, gentle shadows. Not stark white, not washed out, not cold, not dark rustic.",
                      "No whole fish, no head, no tail, no fins, no skin-on whole fish, no missing courgette, no text, no hands, no packaging, no logo, no watermark, no collage."
                  ]
              if ("wrap" in name.lower() and ("chèvre" in name.lower() or "chevre" in name.lower()) and "miel" in name.lower()):
                  prompt = [
                      "Vibrant appetizing French cookbook food photo, overhead view. Original composition: three long cylindrical tortilla wraps on a round sage-green plate over warm walnut wood. One whole wrap diagonal left, two cut diagonally with round filling faces up. Plump rolled cylinders, never folded triangles or cones.",
                      "Tortillas rich golden toasted brown with attractive pan-seared spots, never white or pale. Freshly warmed, soft and supple inside, lightly glossy, never dry or cardboard-like.",
                      "Cut ends show abundant thick creamy white goat-cheese rounds, gently warmed and slightly melting, vivid green lettuce, juicy glossy deep-red cherry tomato slices and visible walnut pieces. Goat cheese obvious and abundant, not hidden.",
                      "Fine shiny amber-gold honey drizzle directly over goat cheese inside wraps. Beside plate, small piece of goat-cheese log with one slice cut, a few walnut halves and fresh herbs.",
                      "Irresistible lively colors: rich tomato reds, vivid greens, golden tortilla highlights, creamy textures, warm directional light, defined soft shadows and depth. Warm wood, chic generous cookbook styling, strong appetizing contrast. Never pale, flat, grey or washed out.",
                      "No pale wraps, folded parcels, cones, hidden cheese, feta, mozzarella, clutter, text, hands, logo or watermark."
                  ]
              if "saumon fumé" in name.lower() or "saumon fume" in name.lower():
                  prompt = [
                      "Photorealistic premium French cookbook food photography. Exact recipe: " + name + ". Ingredients: " + ", ".join(ingredients) + ".",
                      "Show a generous elegant potato salad with clearly visible bite-size cooked potato pieces, fresh cucumber, thin radish slices and green salad. The smoked salmon must be unmistakably COLD-SMOKED: thin silky translucent rose-pink slices, delicately folded into loose ribbons and draped over the salad. It must look uncooked, never like a cooked salmon fillet, steak, grilled fish or thick opaque chunk.",
                      "The smoked salmon ribbons are the clear visual hero, with potatoes and vegetables immediately recognizable beneath and around them. Refined natural plating, appetizing freshness, delicate chives.",
                      "Keep exactly the same warm chic cookbook atmosphere as the approved recent batch: beautiful light-to-medium warm neutral textured tabletop, softly directional natural daylight, gentle defined shadows, warm elegant tones and appetizing contrast. Whole plate visible with breathing room; no cold sterile white, no dark rustic background, no text, hands, logo or watermark."
                  ]
              if "pommes au four" in name.lower():
                  prompt = [
                      "Photorealistic premium French cookbook dessert photography, richly appetizing and warmly styled. Exact recipe: " + name + ". Ingredients: " + ", ".join(ingredients) + ".",
                      "Show TWO beautiful WHOLE apples baked intact, round and plump, not cut, not sliced and not turned into wedges. Choose naturally attractive red-and-golden apples with skins softly blistered and caramelized from baking, glossy and tender, with a few warm golden roasted patches. They must look juicy, soft and fragrant, not dry, shrivelled or dull.",
                      "Give each whole apple a generous appetizing finish: a delicate cinnamon-scented glossy sheen from its baking juices, with toasted flaked almonds clearly visible on top and a few golden almond flakes scattered around. The almonds should look lightly toasted, crisp and golden. Do not add ingredients that are not listed.",
                      "Serve the two apples close together on a beautiful warm ivory or muted sage ceramic dessert plate, with one apple slightly forward and the second behind for depth. Slightly elevated three-quarter overhead angle so the rounded whole shape and glossy baked skins catch the light. A small elegant cinnamon stick and a few almond flakes may sit nearby only if they do not clutter the plate.",
                      "Make the dessert look irresistible, warm, generous and homemade: rich red-gold apple tones, toasted golden almonds, soft cinnamon warmth, appetizing shine and visible texture. Soft directional window light, gentle defined shadows, dimensional depth and lively natural contrast. Keep exactly the same warm chic cookbook atmosphere as the approved recent batch, with a beautiful light-to-medium warm neutral textured tabletop. Whole plate visible with breathing room; never pale, flat, grey, washed out, dry or gloomy. No cold sterile white, no dark rustic background, no text, hands, logo or watermark."
                  ]
              if "poulet au citron" in name.lower() and "romarin" in name.lower():
                  prompt = [
                      "Photorealistic premium French cookbook food photography. Exact recipe: " + name + ". Ingredients: " + ", ".join(ingredients) + ".",
                      "Make it instantly and unmistakably recognizable as a delicious CHICKEN dish. Show generous golden-brown seared chicken breast pieces, thick juicy slices with the white chicken interior clearly visible and lightly browned edges; not anonymous pale chunks, not fish, not pork. The chicken is the hero and occupies most of the plate.",
                      "Clearly include glossy lemon-garlic pan juices, fresh rosemary sprigs, visible lemon slices, golden courgette and carrot pieces, all cooked appetizingly and arranged around the chicken. Rich golden sear, moist tender texture, fresh herbs, vivid natural colors.",
                      "Serve in a beautiful warm ivory or muted sage ceramic shallow plate. Keep exactly the same warm chic cookbook atmosphere as the approved recent batch: light-to-medium warm neutral textured tabletop, softly directional natural daylight, gentle defined shadows, warm elegant tones and appetizing contrast. Whole plate visible with breathing room; no pale washed-out chicken, no cold sterile white, no dark rustic background, no text, hands, logo or watermark."
                  ]
              if "croûte d'herbes" in name.lower() or "croute d'herbes" in name.lower():
                  prompt = [
                      "Photorealistic premium French cookbook food photography. Exact recipe: " + name + ". Ingredients: " + ", ".join(ingredients) + ".",
                      "Show one beautiful thick salmon pavé, whole and clearly identifiable, topped with a THICK, CONTINUOUS, vivid fresh green herb crust made from finely chopped parsley, chives and golden wholemeal breadcrumbs. The crust must cover most of the top surface, visibly textured, richly green with golden toasted breadcrumb flecks, crisp and appetizing. It must be immediately obvious at first glance that this is a salmon pavé with an herb crust, not a plain salmon fillet with a few leaves sprinkled on top.",
                      "Use a gentle three-quarter overhead angle so the thick herb crust is clearly visible on top and the salmon's pink sides are recognizable. Add only a modest lemon wedge and a few delicate herb leaves nearby; do not bury the pavé under parsley garnish.",
                      "Keep exactly the same warm chic cookbook atmosphere as the approved recent batch: beautiful light-to-medium warm neutral textured tabletop, softly directional natural daylight, gentle defined shadows, warm elegant tones and appetizing contrast. Whole plate visible with breathing room; no cold sterile white, no dark rustic background, no text, hands, logo or watermark."
                  ]
              manifest.append({"id": rid, "name": name, "ingredients": ingredients, "prompt": " ".join(x for x in prompt if x)})
          Path("batch-manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          if not manifest:
              raise SystemExit("Aucune recette exploitable dans ce lot.")
          print(f"Lot préparé : {len(manifest)} recettes (positions {start + 1} à {start + len(selected)}).")

          made = []
          stopped_for_quota = False
          for index, item in enumerate(manifest, 1):
              rid = item["id"]
              print(f"[{index}/{len(manifest)}] Génération : {item['name']} ({rid})")
              body = json.dumps({"prompt": item["prompt"], "steps": 4}).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/accounts/{account}/ai/run/@cf/black-forest-labs/flux-1-schnell",
                  data=body,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      payload = json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  details = exc.read().decode("utf-8", "replace")[:1200]
                  print(f"ARRÊT PROPRE : Cloudflare a répondu HTTP {exc.code}. {details}")
                  if exc.code in (402, 403, 429):
                      stopped_for_quota = True
                      break
                  raise
              if not payload.get("success") or not payload.get("result", {}).get("image"):
                  errors = json.dumps(payload.get("errors", payload), ensure_ascii=False)[:1200]
                  print("ARRÊT : réponse Cloudflare sans image :", errors)
                  stopped_for_quota = True
                  break
              raw = base64.b64decode(payload["result"]["image"])
              image = Image.open(BytesIO(raw)).convert("RGB")
              image = ImageOps.fit(image, (400, 400), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
              path = out / f"{rid}.webp"
              selected_quality = None
              for quality in (82, 78, 74, 70, 66):
                  image.save(path, "WEBP", quality=quality, method=6, optimize=True)
                  if path.stat().st_size <= 100 * 1024:
                      selected_quality = quality
                      break
              if selected_quality is None:
                  path.unlink(missing_ok=True)
                  print(f"REJET : impossible de passer sous 100 Ko pour {rid}.")
                  continue
              info = out / f"{rid}.txt"
              info.write_text(
                  f"Recette : {item['name']}\nIdentifiant : {rid}\nIngrédients :\n" +
                  "\n".join("- " + x for x in item["ingredients"]) +
                  f"\nFichier : {path.name}\nTaille : {path.stat().st_size / 1024:.1f} Ko\n",
                  encoding="utf-8"
              )
              made.append({"id": rid, "name": item["name"], "file": str(path), "kb": round(path.stat().st_size / 1024, 1)})
              print(f"OK : {path} — {path.stat().st_size / 1024:.1f} Ko")
              time.sleep(2)

          Path("batch-result.json").write_text(json.dumps({
              "requested": len(manifest), "generated": made,
              "stopped_for_quota_or_api": stopped_for_quota,
              "start_index": start, "next_start_index": start + len(selected)
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"RÉSULTAT : {len(made)} photo(s) générée(s) sur {len(manifest)} demandée(s).")
          if stopped_for_quota:
              print("Le lot s'est arrêté sans nouvelle tentative pour éviter de marteler l'API.")
          if made:
              thumbs = []
              for entry in made:
                  im = Image.open(entry["file"]).convert("RGB")
                  im.thumbnail((220, 220))
                  thumbs.append((entry, im.copy()))
              cols = 3
              rows = (len(thumbs) + cols - 1) // cols
              sheet = Image.new("RGB", (cols * 260, rows * 270), "white")
              draw = ImageDraw.Draw(sheet)
              for i, (entry, im) in enumerate(thumbs):
                  x, y = (i % cols) * 260, (i // cols) * 270
                  sheet.paste(im, (x + 20, y + 5))
                  draw.text((x + 8, y + 232), entry["name"][:34], fill="black")
                  draw.text((x + 8, y + 248), f"{entry['kb']} Ko", fill="black")
              sheet.save("contact-sheet.jpg", quality=88)
          PY

      - name: Publier le lot pour contrôle visuel (sans modifier le catalogue)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot-photos-cuisine-chic-ouf
          path: |
            generated-batch/
            batch-manifest.json
            batch-result.json
            contact-sheet.jpg
          if-no-files-found: warn
          retention-days: 3
