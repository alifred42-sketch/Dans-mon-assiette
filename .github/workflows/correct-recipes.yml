name: Corriger la base de recettes
on:
  push:
    branches:
      - travail-cuisine-chic-ouf-design
    paths:
      - 'scripts/correct-audited-recipes.py'
      - '.github/workflows/correct-recipes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: travail-cuisine-chic-ouf-design
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Appliquer les corrections auditées
        run: python scripts/correct-audited-recipes.py
      - name: Vérifier le JSON et enregistrer les corrections
        run: |
          python -m json.tool data/carnet.json > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/carnet.json
          if git diff --cached --quiet; then
            echo "Aucune modification de recette à enregistrer."
          else
            git commit -m "Corrige et synchronise la base de recettes"
            git push origin travail-cuisine-chic-ouf-design
          fi
