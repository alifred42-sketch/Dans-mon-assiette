name: Normalize recipe quantities
on:
  push:
    branches:
      - travail-cuisine-chic-ouf-design
    paths:
      - ".github/workflows/normalize-recipe-quantities.yml"
      - "scripts/normalize-recipe-quantities.py"
permissions:
  contents: write
jobs:
  normalize:
    if: "!startsWith(github.event.head_commit.message, 'bot: normalize recipe quantities')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: travail-cuisine-chic-ouf-design
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/normalize-recipe-quantities.py
      - name: Commit normalized recipes and audit report
        run: |
          if git diff --quiet; then
            echo "No additional corrections"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/carnet.json docs/audit-recettes-restant-a-corriger.md
          git commit -m "bot: normalize recipe quantities"
          git push origin travail-cuisine-chic-ouf-design
